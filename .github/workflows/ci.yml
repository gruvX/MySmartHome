name: CI

# No secrets are used or required by this workflow. Every step runs on a bare
# checkout with no tokens; unit tests never touch the real HA / Elering / Tuya.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: compile + lint + secret-scan + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need at least the previous commit so `git diff --check HEAD` works.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test deps
        # pytest only. No project/runtime deps (paramiko etc.) are needed:
        # py_compile checks syntax without importing, and unit tests stub the
        # heavy third-party imports themselves.
        run: python -m pip install --upgrade pip pytest

      - name: Python compile (key modules + tools + tests)
        run: |
          set -e
          targets=(
            project_secrets.py
            ha_ssh.py
            ev_common.py
            ev_best2h.py
            ev_day2h.py
            ev_night2h.py
            ev_query.py
            custom_components/miniapp_auth/__init__.py
          )
          # All tools/*.py (secret_scan + energy_cost package), if present.
          while IFS= read -r f; do targets+=("$f"); done \
            < <(find tools -name '*.py' -not -path '*/__pycache__/*' 2>/dev/null)
          for f in "${targets[@]}"; do
            if [ -f "$f" ]; then echo "compiling $f"; python -m py_compile "$f"; fi
          done
          # Compile all test modules too.
          if [ -d tests ]; then python -m py_compile tests/*.py; fi

      - name: Secret scan (staged files, blocking)
        # Guards the pre-commit path. On a fresh CI checkout nothing is staged,
        # so this is a no-op there; the full-tree scan below is the CI signal.
        run: python tools/secret_scan.py

      - name: Secret scan (full tree, report-only)
        # Scans the entire working tree incl. git-ignored runtime files (agent
        # logs, backups, caches) where real creds accumulate. Report-only:
        # gitignored files legitimately hold credentials, so findings are
        # surfaced but never fail the build.
        continue-on-error: true
        run: python tools/secret_scan.py --all

      - name: git diff --check (whitespace / conflict markers)
        run: git diff --check HEAD

      - name: Line-ending policy (.gitattributes, LF)
        # Enforce the `* text=auto eol=lf` policy for committed content WITHOUT
        # renormalizing this cycle: we inspect the index side only. Working-tree
        # CRLF (e.g. an editor on Windows) is fine; committing CRLF is not.
        run: |
          bad="$(git ls-files --eol | grep -E 'i/(crlf|mixed)' || true)"
          if [ -n "$bad" ]; then
            echo "Committed (index) files violate the LF line-ending policy:"
            echo "$bad"
            exit 1
          fi
          echo "OK: all committed text files are LF."

      - name: Inline JS syntax check
        # smarthouse_v8.html: extract inline (non-src) <script> blocks and
        # compile-check with node's vm.Script. tablet-panel.js: plain JS, checked
        # directly. Nothing executes; syntax errors fail the step. Missing files
        # (tablet.html is gitignored; some artifacts may be absent) are skipped.
        run: |
          node -e '
          const fs=require("fs"),vm=require("vm");
          let failed=false;
          for(const f of process.argv.slice(1)){
            if(!fs.existsSync(f)){console.log("SKIP (missing) "+f);continue;}
            const src=fs.readFileSync(f,"utf8");
            let body;
            if(/\.m?js$/i.test(f)){
              body=src;                       // plain JS file: check as-is
            } else {                          // HTML: pull inline <script> blocks
              const re=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m; body="";
              while((m=re.exec(src))){ if(/\bsrc\s*=/i.test(m[1]))continue; body+=m[2]+"\n;\n"; }
              if(!body.trim()){console.log("SKIP (no inline JS) "+f);continue;}
            }
            try{ new vm.Script(body,{filename:f}); console.log("OK "+f); }
            catch(e){ console.log("FAIL "+f+" :: "+e.message); failed=true; }
          }
          process.exit(failed?1:0);
          ' miniapp/smarthouse_v8.html tablet/tablet-panel.js tablet/tablet.html

      - name: pytest (unit; live tests deselected by default)
        # `live`-marked tests are auto-skipped via tests/conftest.py.
        run: python -m pytest -q
