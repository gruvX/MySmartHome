<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Умный дом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Умный дом — Telegram Mini App
   Дизайн-система: «приборная панель»
   ============================================================ */

.app {
  --accent:   #5fe0a6;
  --accent-2: #56b8f5;
  --ev:    #5fe0a6;
  --price: #56b8f5;
  --boil:  #ffb259;
  --sec:   #ff5d57;
  --water: #45d3d8;
  --floor: #c98cf0;
  --plug:  #ffd84d;
  --light: #ffd27a;
  --ok:   #54d58a;
  --warn: #ffb259;
  --err:  #ff5d57;
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 11px;
  --ease: cubic-bezier(.4, 0, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  font-family: 'Manrope', -apple-system, system-ui, sans-serif;
  height: 100%;
  -webkit-font-smoothing: antialiased;
}
.app[data-theme="dark"] {
  --bg:       #0c0d10;
  --bg-grad:  radial-gradient(120% 80% at 50% -10%, #15171d 0%, #0c0d10 60%);
  --surface:  #15171d;
  --surface-2:#1c1f27;
  --surface-3:#23262f;
  --line:     rgba(255,255,255,.07);
  --line-2:   rgba(255,255,255,.12);
  --text:     #eceef3;
  --text-2:   #9aa3b2;
  --text-3:   #5a6473;
  --tint:     14%;
  --shadow:   0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
  --glow:     .55;
}
.app[data-theme="light"] {
  --bg:       #e9ebef;
  --bg-grad:  radial-gradient(120% 80% at 50% -10%, #f6f7f9 0%, #e6e8ed 70%);
  --surface:  #ffffff;
  --surface-2:#f3f5f8;
  --surface-3:#e9ecf1;
  --line:     rgba(15,22,35,.08);
  --line-2:   rgba(15,22,35,.13);
  --text:     #161a22;
  --text-2:   #5d6675;
  --text-3:   #99a2b0;
  --tint:     12%;
  --shadow:   0 1px 2px rgba(15,22,35,.04), 0 10px 24px rgba(15,22,35,.07);
  --glow:     .32;
}
.app * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
.app {
  background: var(--bg-grad), var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.4;
  display: flex;
  flex-direction: column;
  min-height: 100%;
  position: relative;
  letter-spacing: .1px;
}
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: "tnum" 1; }
.eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-3); }
.t-sub   { font-size: 11px; color: var(--text-2); }
.t-name  { font-size: 14.5px; font-weight: 700; letter-spacing: .2px; }

.hdr { display: flex; align-items: center; justify-content: space-between; padding: 6px 18px 12px; }
.hdr-l { display: flex; flex-direction: column; gap: 1px; }
.hdr-clock { font-size: 25px; font-weight: 800; letter-spacing: -.5px; line-height: 1; }
.hdr-date  { font-size: 11.5px; color: var(--text-2); font-weight: 600; text-transform: capitalize; }
.hdr-r { display: flex; align-items: center; gap: 8px; }
.chip-out { display: flex; align-items: center; gap: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 6px 11px 6px 9px; font-weight: 700; font-size: 13px; }
.chip-out svg { color: var(--accent-2); }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--text-2); cursor: pointer; transition: transform .12s var(--ease), background .15s, color .15s; }
.icon-btn:active { transform: scale(.9); }
.icon-btn.spin svg { animation: spin .7s var(--ease); }
@keyframes spin { to { transform: rotate(360deg); } }

.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 14px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.screen { padding-bottom: 96px; animation: screen-in .32s var(--ease); }
@keyframes screen-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.stagger > * { animation: rise .4s var(--ease) both; }
.stagger > *:nth-child(1){animation-delay:.02s}
.stagger > *:nth-child(2){animation-delay:.06s}
.stagger > *:nth-child(3){animation-delay:.10s}
.stagger > *:nth-child(4){animation-delay:.14s}
.stagger > *:nth-child(5){animation-delay:.18s}
.stagger > *:nth-child(6){animation-delay:.22s}
.stagger > *:nth-child(7){animation-delay:.26s}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 15px; box-shadow: var(--shadow); }
.card-row { display: flex; align-items: center; justify-content: space-between; }
.tint { background: color-mix(in oklab, var(--c) var(--tint), var(--surface)); border-color: color-mix(in oklab, var(--c) 28%, var(--line)); }
.card-hd { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
.card-hd .ic { width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center; background: color-mix(in oklab, var(--c) 22%, transparent); color: var(--c); }
.card-hd .tt { font-weight: 700; font-size: 14px; }
.card-hd .ss { font-size: 11px; color: var(--text-2); font-weight: 600; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 800; letter-spacing: .3px; }
.badge.cheap { background: color-mix(in oklab, var(--ev) 22%, transparent); color: var(--ev); }
.badge.mid   { background: color-mix(in oklab, var(--plug) 22%, transparent); color: var(--plug); }
.badge.high  { background: color-mix(in oklab, var(--sec) 22%, transparent); color: var(--sec); }
.badge.dim   { background: var(--surface-3); color: var(--text-2); }

.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); box-shadow: 0 0 7px var(--warn); animation: blink 1.1s infinite; }
.dot.err  { background: var(--err); box-shadow: 0 0 8px var(--err); animation: blink .8s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

.readout { display: flex; align-items: flex-end; gap: 7px; }
.readout .num { font-size: 46px; font-weight: 800; letter-spacing: -2px; line-height: .85; }
.readout .unit { font-size: 13px; color: var(--text-2); font-weight: 600; padding-bottom: 5px; }

.spark { display: flex; align-items: flex-end; gap: 2px; height: 46px; }
.spark .b { flex: 1; border-radius: 2px 2px 0 0; min-height: 3px; transition: height .5s var(--ease), opacity .3s; opacity: .5; }
.spark .b.now { opacity: 1; outline: 1.5px solid var(--text); outline-offset: -.5px; }
.spark-axis { display: flex; justify-content: space-between; margin-top: 5px; font-size: 9px; color: var(--text-3); }

.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.span2 { grid-column: span 2; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 13px; box-shadow: var(--shadow); cursor: pointer; position: relative; overflow: hidden; transition: transform .14s var(--ease); min-height: 96px; display: flex; flex-direction: column; }
.tile:active { transform: scale(.975); }
.tile.tint { background: color-mix(in oklab, var(--c) var(--tint), var(--surface)); }
.tile-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: auto; }
.tile-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in oklab, var(--c) 22%, transparent); color: var(--c); }
.tile-tag { font-size: 9.5px; font-weight: 800; letter-spacing: .6px; color: var(--text-3); text-transform: uppercase; }
.tile-val { font-size: 20px; font-weight: 800; letter-spacing: -.5px; margin-top: 12px; line-height: 1; }
.tile-sub { font-size: 11px; color: var(--text-2); font-weight: 600; margin-top: 4px; }

.sw { width: 46px; height: 28px; border-radius: 99px; flex-shrink: 0; background: var(--surface-3); border: 1px solid var(--line); position: relative; cursor: pointer; transition: background .22s var(--ease); }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.3); transition: transform .26s var(--spring); }
.sw.on { background: var(--c, var(--accent)); border-color: transparent; }
.sw.on::after { transform: translateX(18px); }

.pill { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 11px 12px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); cursor: pointer; font-weight: 700; font-size: 12.5px; font-family: inherit; transition: transform .12s var(--ease), background .18s, color .18s, border-color .18s, box-shadow .18s; user-select: none; }
.pill:active { transform: scale(.96); }
.pill .pi { width: 20px; height: 20px; flex-shrink: 0; display: grid; place-items: center; }
.pill-lbl { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.2; }
.pill-led { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--text-3); transition: background .2s, box-shadow .2s; }
.pill.on .pill-led { background: var(--c); box-shadow: 0 0 9px color-mix(in oklab, var(--c) 70%, transparent); }
.pill.on { color: var(--text); background: color-mix(in oklab, var(--c) 20%, var(--surface)); border-color: color-mix(in oklab, var(--c) 48%, transparent); box-shadow: 0 0 0 1px color-mix(in oklab, var(--c) 30%, transparent), 0 0 18px color-mix(in oklab, var(--c) calc(var(--glow) * 40%), transparent); }
.pill.on .pi { color: var(--c); }

.seg { display: flex; gap: 3px; padding: 3px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { flex: 1; border: none; background: transparent; cursor: pointer; padding: 8px 6px; border-radius: 10px; font-weight: 700; font-size: 12px; color: var(--text-2); font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; transition: color .18s; }
.seg button.on { color: var(--text); background: var(--surface); box-shadow: var(--shadow); }
.seg.accent button.on { color: #07140e; background: var(--c, var(--accent)); }

.stepper { display: flex; align-items: center; gap: 10px; }
.step-btn { width: 40px; height: 40px; border-radius: 12px; cursor: pointer; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); display: grid; place-items: center; transition: transform .1s, background .15s; }
.step-btn:active { transform: scale(.9); background: var(--surface-3); }
.step-val { flex: 1; text-align: center; font-size: 26px; font-weight: 800; letter-spacing: -1px; }

.presets { display: flex; gap: 6px; }
.preset { flex: 1; padding: 8px 4px; border-radius: 10px; cursor: pointer; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); font-weight: 700; font-size: 12.5px; font-family: inherit; transition: all .14s; }
.preset:active { transform: scale(.94); }
.preset.cur { background: color-mix(in oklab, var(--c) 22%, var(--surface)); border-color: color-mix(in oklab, var(--c) 45%, transparent); color: var(--text); }

.leds { display: flex; gap: 7px; flex-wrap: wrap; }
.led { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-2); font-weight: 600; background: var(--surface-2); border-radius: 8px; padding: 5px 9px; }
.led i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
.led.on i { background: var(--ok); box-shadow: 0 0 7px var(--ok); }

.cells { display: grid; gap: 7px; }
.cells.c3 { grid-template-columns: repeat(3, 1fr); }
.cells.c2 { grid-template-columns: repeat(2, 1fr); }
.cell { background: var(--surface-2); border-radius: 11px; padding: 9px 6px; text-align: center; }
.cell .v { font-size: 17px; font-weight: 800; letter-spacing: -.5px; }
.cell .l { font-size: 9.5px; color: var(--text-2); font-weight: 600; margin-top: 2px; }

.sep { height: 1px; background: var(--line); margin: 13px 0; }
.sec-lbl { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--text-3); margin: 14px 4px 8px; }

.scenes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.scene { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 13px 6px; border-radius: var(--r-md); cursor: pointer; background: var(--surface); border: 1px solid var(--line); color: var(--text); font-weight: 700; font-size: 11.5px; transition: transform .12s var(--ease), border-color .15s; font-family: inherit; }
.scene:active { transform: scale(.95); }
.scene .si { width: 22px; height: 22px; color: var(--accent); }

.nav { position: absolute; bottom: 0; left: 0; right: 0; z-index: 40; display: grid; grid-template-columns: repeat(4, 1fr); padding: 9px 10px calc(8px + env(safe-area-inset-bottom, 16px)); background: color-mix(in oklab, var(--bg) 72%, transparent); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border-top: 1px solid var(--line); }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; font-family: inherit; color: var(--text-3); font-size: 10px; font-weight: 700; transition: color .18s; }
.nav-btn .ni { width: 24px; height: 24px; position: relative; transition: transform .2s var(--spring); }
.nav-btn.on { color: var(--accent); }
.nav-btn.on .ni { transform: translateY(-1px); }

.alert { border-radius: var(--r-md); padding: 13px 14px; margin-bottom: 12px; background: color-mix(in oklab, var(--sec) 16%, var(--surface)); border: 1px solid color-mix(in oklab, var(--sec) 45%, transparent); animation: rise .3s var(--ease) both; }
.alert-hd { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--sec); margin-bottom: 8px; }
.alert ul { list-style: none; margin-bottom: 11px; }
.alert li { font-size: 12.5px; color: var(--text); padding: 2px 0; font-weight: 600; }
.alert-btns { display: flex; gap: 7px; }
.abtn { flex: 1; padding: 9px; border-radius: 10px; border: none; font-weight: 700; font-size: 12px; cursor: pointer; font-family: inherit; }
.abtn.solid { background: var(--sec); color: #fff; }
.abtn.out { background: transparent; border: 1px solid color-mix(in oklab, var(--sec) 50%, transparent); color: var(--sec); }

.ring-wrap { position: relative; display: grid; place-items: center; }
.ring-center { position: absolute; text-align: center; }

.toast { position: absolute; z-index: 90; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(14px); background: var(--surface-3); color: var(--text); border: 1px solid var(--line-2); padding: 10px 16px; border-radius: 13px; font-weight: 700; font-size: 12.5px; white-space: nowrap; max-width: 88%; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 10px 30px rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s var(--spring); display: flex; align-items: center; gap: 8px; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast .tdot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

.bar { height: 6px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; transition: width .5s var(--ease); }

.crow { display: grid; grid-template-columns: 22px 1fr auto auto; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.crow:last-child { border-bottom: none; }
.crow .cname { font-size: 13px; font-weight: 600; }
.crow .ckwh { font-size: 12px; color: var(--text-2); font-weight: 600; text-align: right; }
.crow .ccost { font-size: 13.5px; font-weight: 800; text-align: right; min-width: 52px; }
.crow .cic { color: var(--c); }

.tg-bar { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 2px; }
.tg-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.tg-logo { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #06140e; }
.tg-actions { display: flex; gap: 16px; color: var(--text-2); }

/* ── Production overrides ───────────────────────────────── */
html, body { height: 100%; margin: 0; overflow: hidden; background: #0c0d10; }
#root { height: 100%; }
.app { height: 100dvh !important; min-height: auto; overflow: hidden; }
</style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0c0d10;flex-direction:column;gap:14px;font-family:Manrope,sans-serif">
    <div style="width:30px;height:30px;border:3px solid rgba(95,224,166,.15);border-top-color:#5fe0a6;border-radius:50%;animation:_spin .8s linear infinite"></div>
    <span style="color:#5a6473;font-size:13px;font-weight:600">Загрузка…</span>
  </div>
</div>
<style>@keyframes _spin{to{transform:rotate(360deg)}}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js" integrity="sha384-ezQ6HS3FLspd9te19o2McUV6FAK091+GG7KO54f/R8DKgCDi7fULhapNrd5LY+vG" crossorigin="anonymous"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Tweaks panel -->
<script type="text/babel">
(function () {
  const { useState, useEffect, useCallback } = React;

  function useTweaks(defaults) {
    const stored = (() => { try { const s=JSON.parse(localStorage.getItem('sh7_tweaks')||'{}'); delete s.dark; return s; } catch { return {}; } })();
    const [t, setT] = useState({ ...defaults, ...stored });
    const setTweak = useCallback((k, v) => {
      setT(prev => {
        const next = { ...prev, [k]: v };
        try { localStorage.setItem('sh7_tweaks', JSON.stringify(next)); } catch {}
        return next;
      });
    }, []);
    return [t, setTweak];
  }

  function TweaksPanel({ title, children }) {
    const [open, setOpen] = useState(false);
    useEffect(() => {
      const h = e => { if ((e.origin===window.location.origin||e.origin==='null') && e.data==='__activate_edit_mode') setOpen(true); };
      window.addEventListener('message', h);
      return () => window.removeEventListener('message', h);
    }, []);
    if (!open) return null;
    return (
      <div style={{ position:'fixed',top:0,right:0,bottom:0,zIndex:999,width:260,background:'var(--surface)',borderLeft:'1px solid var(--line)',padding:16,overflowY:'auto',boxShadow:'-10px 0 30px rgba(0,0,0,.4)' }}>
        <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16 }}>
          <b style={{ fontSize:15 }}>{title}</b>
          <button onClick={() => setOpen(false)} style={{ background:'none',border:'none',cursor:'pointer',color:'var(--text)',fontSize:20,lineHeight:1 }}>✕</button>
        </div>
        {children}
      </div>
    );
  }

  function TweakSection({ label }) {
    return <div style={{ fontSize:10,fontWeight:800,letterSpacing:1.2,textTransform:'uppercase',color:'var(--text-3)',margin:'14px 0 8px' }}>{label}</div>;
  }
  function TweakToggle({ label, value, onChange }) {
    return (
      <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0' }}>
        <span style={{ fontSize:13,fontWeight:600 }}>{label}</span>
        <div className={'sw'+(value?' on':'')} style={{'--c':'var(--accent)'}} onClick={() => onChange(!value)} />
      </div>
    );
  }
  function TweakColor({ label, value, options, onChange }) {
    return (
      <div style={{ padding:'8px 0' }}>
        <div style={{ fontSize:13,fontWeight:600,marginBottom:8 }}>{label}</div>
        <div style={{ display:'flex',gap:8 }}>
          {options.map(c => <div key={c} onClick={() => onChange(c)} style={{ width:28,height:28,borderRadius:8,background:c,cursor:'pointer',outline:value===c?'2.5px solid var(--text)':'none',outlineOffset:2 }} />)}
        </div>
      </div>
    );
  }
  function TweakRadio({ label, value, options, onChange }) {
    return (
      <div style={{ padding:'8px 0' }}>
        <div style={{ fontSize:13,fontWeight:600,marginBottom:8 }}>{label}</div>
        <div style={{ display:'flex',gap:6 }}>
          {options.map(o => (
            <button key={o.value} onClick={() => onChange(o.value)} style={{ padding:'6px 12px',borderRadius:8,border:'1px solid var(--line)',background:value===o.value?'var(--accent)':'var(--surface-2)',color:value===o.value?'#07140e':'var(--text)',fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit' }}>{o.label}</button>
          ))}
        </div>
      </div>
    );
  }

<script type="text/babel">
(function () {
  const { useState } = React;

  function tierOf(c) {
    if (c < 8) return { key: 'cheap', label: 'ДЁШЕВО', v: 'var(--ev)' };
    if (c < 16) return { key: 'mid', label: 'СРЕДНЕ', v: 'var(--plug)' };
    return { key: 'high', label: 'ДОРОГО', v: 'var(--sec)' };
  }
  const tierColor = (c) => c < 8 ? '#5fe0a6' : c < 16 ? '#ffd84d' : '#ff5d57';

  function Ring({ size = 92, value = 0, color = 'var(--accent)', thickness = 8, track, children, cap = true }) {
    const r = (size - thickness) / 2;
    const circ = 2 * Math.PI * r;
    const off = circ * (1 - Math.max(0, Math.min(1, value)));
    return (
      <div className="ring-wrap" style={{ width: size, height: size }}>
        <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={track || 'var(--surface-3)'} strokeWidth={thickness} />
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={thickness} strokeDasharray={circ} strokeDashoffset={off} strokeLinecap={cap ? 'round' : 'butt'} style={{ transition:'stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)' }} />
        </svg>
        {children && <div className="ring-center">{children}</div>}
      </div>
    );
  }

  function Spark({ data, nowHour, height = 46, onClick }) {
    const max = Math.max(...data, 1);
    return (
      <div onClick={onClick} style={{ cursor: onClick ? 'pointer' : 'default' }}>
        <div className="spark" style={{ height }}>
          {data.map((c, h) => <div key={h} className={'b'+(h===nowHour?' now':'')} style={{ height:`${Math.max(8,c/max*100)}%`, background:tierColor(c) }} />)}
        </div>
        <div className="spark-axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>
      </div>
    );
  }

  function PriceClock({ data, nowHour, size = 230 }) {
    const cx = size/2, cy = size/2;
    const rOut = size/2-6, rIn = size/2-26;
    const max = Math.max(...data, 1);
    const seg = [];
    for (let h = 0; h < 24; h++) {
      const a0 = h/24*2*Math.PI - Math.PI/2 + 0.012;
      const a1 = (h+1)/24*2*Math.PI - Math.PI/2 - 0.012;
      const lvl = 0.45 + 0.55*(data[h]/max);
      const ri = rIn, ro = rIn + (rOut-rIn)*lvl;
      const p = (a,r) => [cx+Math.cos(a)*r, cy+Math.sin(a)*r];
      const [x0,y0]=p(a0,ri),[x1,y1]=p(a1,ri),[x2,y2]=p(a1,ro),[x3,y3]=p(a0,ro);
      seg.push(<path key={h} d={`M${x0} ${y0} A${ri} ${ri} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${ro} ${ro} 0 0 0 ${x3} ${y3} Z`} fill={tierColor(data[h])} opacity={h===nowHour?1:0.42} style={{ transition:'opacity .4s' }} />);
    }
    const ha = nowHour/24*2*Math.PI - Math.PI/2;
    const hx = cx+Math.cos(ha)*(rOut-1), hy = cy+Math.sin(ha)*(rOut-1);
    return (
      <svg width={size} height={size}>
        {seg}
        <line x1={cx} y1={cy} x2={hx} y2={hy} stroke="var(--text)" strokeWidth="2.5" strokeLinecap="round" />
        <circle cx={cx} cy={cy} r="4" fill="var(--text)" />
      </svg>
    );
  }

  function Switch({ on, onChange, color = 'var(--accent)' }) {
    return <div className={'sw'+(on?' on':'')} style={{'--c':color}} onClick={e => { e.stopPropagation(); onChange(!on); }} />;
  }

  function Pill({ on, onClick, color, icon, children, knob }) {
    const { Icon } = window;
    return (
      <button className={'pill'+(on?' on':'')} style={{'--c':color}} onClick={onClick}>
        {icon && <span className="pi"><Icon name={icon} size={18} /></span>}
        <span className="pill-lbl">{children}</span>
        {knob ? <Switch on={on} onChange={() => onClick()} color={color} /> : <span className={'pill-led'+(on?' on':'')} />}
      </button>
    );
  }

  function Seg({ value, options, onChange, accent, color = 'var(--accent)' }) {
    return (
      <div className={'seg'+(accent?' accent':'')} style={{'--c':color}}>
        {options.map(o => <button key={o.v} className={value===o.v?'on':''} onClick={() => onChange(o.v)}>{o.icon&&window.Icon&&<window.Icon name={o.icon} size={15} />}{o.t}</button>)}
      </div>
    );
  }

  function Stepper({ value, unit = '°', step = 1, min = 0, max = 99, onChange, color = 'var(--accent)' }) {
    const { Icon } = window;
    return (
      <div className="stepper">
        <button className="step-btn" onClick={() => onChange(Math.max(min,value-step))}><Icon name="minus" size={20} /></button>
        <div className="step-val mono" style={{ color }}>{value}<span style={{ fontSize:15,color:'var(--text-2)' }}>{unit}</span></div>
        <button className="step-btn" onClick={() => onChange(Math.min(max,value+step))}><Icon name="plus" size={20} /></button>
      </div>
    );
  }

  function Card({ system, icon, title, sub, right, children, onClick, style }) {
    const { Icon } = window;
    const sysVar = system ? `var(--${system})` : undefined;
    return (
      <div className={'card'+(system?' tint':'')} style={{'--c':sysVar,marginBottom:12,...style}} onClick={onClick}>
        {(title||icon) && (
          <div className="card-hd">
            {icon && <div className="ic"><Icon name={icon} size={18} /></div>}
            <div style={{ flex:1 }}><div className="tt">{title}</div>{sub&&<div className="ss">{sub}</div>}</div>
            {right}
          </div>
        )}
        {children}
      </div>
    );
  }

  function Tile({ system, icon, tag, value, sub, onClick, children, span2, valueColor }) {
    const { Icon } = window;
    const sysVar = system ? `var(--${system})` : undefined;
    return (
      <div className={'tile tint'+(span2?' span2':'')} style={{'--c':sysVar}} onClick={onClick}>
        <div className="tile-hd">
          <div className="tile-ic"><Icon name={icon} size={18} /></div>
          {tag && <span className="tile-tag">{tag}</span>}
        </div>
        {children || <>
          <div className="tile-val mono" style={{ color:valueColor }}>{value}</div>
          {sub && <div className="tile-sub">{sub}</div>}
        </>}
      </div>
    );
  }

  Object.assign(window, { tierOf, tierColor, Ring, Spark, PriceClock, Switch, Pill, Seg, Stepper, Card, Tile });
})();
</script>

(function () {

    ? 'https://YOUR_HA_EXTERNAL_URL' : '';

  function cheapWindow(arr, from) {
    for (let i = 0; i < 24; i++) {
      const h = (from+i)%24;
      if (arr[h] < 4) {
        let end = h;
        while (arr[(end+1)%24] < 6 && ((end+1)%24) !== from) end = (end+1)%24;
        return `${String(h).padStart(2,'0')}:00–${String((end+1)%24).padStart(2,'0')}:00`;

      plugs: [

      water: { open:true },
      security: { armed:false },
      sensors: { door:false,smoke:false,bath:false,shower:false,garage:false,kitchen:false },
      batteries: [
        { name:'Дверь',pct:84 },{ name:'Дым',pct:92 },
        { name:'Ванная',pct:61 },{ name:'Гараж',pct:28 },
        { name:'Кухня',pct:73 },{ name:'Датчик 4',pct:12 },
      ],
    };
  }

  const EV_STATUS_MAP = { charger_charging:'Заряжается',charger_insert:'Подключён',charger_pause:'Пауза',charger_free:'Свободен',charger_end:'Завершено',cloud_error:'Ошибка' };
  function mapEvStatus(s) { return EV_STATUS_MAP[s] || s || '—'; }
  function mapBoilerMode(s) {
    if (!s) return 'off';
    const l = String(s).toLowerCase();
    if (l.includes('work')||l.includes('работ')) return 'work';
    if (l.includes('watch')||l.includes('надзор')||l.includes('dogoran')||l.includes('догор')) return 'watch';
    if (l.includes('alarm')||l.includes('авар')) return 'alarm';
    if (l==='off'||l==='выключен'||l==='выкл') return 'off';
    return 'watch';
  }

  function stV(S, eid) { const e = S.find(x=>x.entity_id===eid); return e?e.state:''; }
  function stF(S, eid) { return parseFloat(stV(S,eid))||0; }
  function stA(S, eid, key) { const e = S.find(x=>x.entity_id===eid); return e?.attributes?.[key]; }

    const avgP = arr.reduce((a,b)=>a+b,0)/2400;
    const schedRaw = stV(S,'input_datetime.ev_charge_start');
    const sched = schedRaw ? schedRaw.replace('T',' ').split(' ').pop().slice(0,5) : '—';
    const costItems = [

      tick(); const id = setInterval(tick,10000); return () => clearInterval(id);

    const dateStr = (() => {

      const mon=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

    function haptic(t='light') { try { tg?.HapticFeedback?.impactOccurred(t); } catch {} }

    const fetchData = useCallback(async (tok) => {

          if (hr.ok) {
            const pts = (await hr.json())[0] || [];
            const slots = new Array(24).fill(null);
            for (const p of pts) { const h=new Date(p.last_changed||p.last_updated).getHours(),v=parseFloat(p.state); if(!isNaN(v)) slots[h]=v; }
            let last=null; for(let i=0;i<24;i++){if(slots[i]!==null)last=slots[i];else if(last!==null)slots[i]=last;}
            if (slots.filter(v=>v!==null).length>=6) priceArr=slots.map(v=>v||0);
          }

    const dataF = { ...data, price:{...data.price}, security };

    return (
      <div className="app" data-theme={isDark?'dark':'light'} style={{'--accent':tw.accent,height:'100dvh',position:'relative',overflow:'hidden'}}>

        <div className="tg-bar" style={{ paddingTop:`calc(8px + env(safe-area-inset-top, 0px))` }}>
          <div className="tg-title">
            <span className="tg-logo"><Icon name="home" size={15} /></span>Умный дом
            {IS_PREVIEW && <span style={{ fontSize:9,background:'rgba(255,184,73,.18)',color:'#ffb259',padding:'2px 6px',borderRadius:5,fontWeight:800,letterSpacing:.5 }}>PREVIEW</span>}
          </div>
          <div className="tg-actions">
            <button className="icon-btn" style={{ width:34,height:34 }} onClick={() => setTweak('dark',!isDark)}>
              <Icon name={isDark?'sun':'moon'} size={17} />
            </button>
          </div>
        </div>

        <div className="hdr">
          <div className="hdr-l">
            <div className="hdr-clock mono">{clock}</div>
            <div className="hdr-date">{dateStr}</div>
          </div>
          <div className="hdr-r">
            <div className="chip-out"><Icon name="temp" size={15} /><span className="mono">{data.outside.toFixed(1)}°</span></div>
            <button className={'icon-btn'+(spin?' spin':'')} onClick={refresh}><Icon name="refresh" size={18} /></button>
          </div>
        </div>

        <div className="scroll">
          {alerts.length>0 && !dismissed && (
            <div className="alert" style={{ marginTop:6 }}>
              <div className="alert-hd"><Icon name="bell" size={18} />Тревога</div>
              <ul>{alerts.map((a,i)=><li key={i}>{a}</li>)}</ul>
              <div className="alert-btns">
                <button className="abtn solid" onClick={actions.openValve}>Открыть кран</button>
                <button className="abtn out" onClick={()=>{ haptic(); toast('Сирена выключена'); }}>Выкл. сирену</button>
                <button className="abtn out" onClick={()=>setDismissed(true)}>Ложная</button>
              </div>
            </div>
          )}
          {tab===0 && <window.HomeScreen data={dataF} actions={actions} go={setTab} layout={home} setLayout={setHome} />}
          {tab===1 && <window.ControlScreen data={dataF} actions={actions} />}
          {tab===2 && <window.EnergyScreen data={dataF} />}
          {tab===3 && <window.StatusScreen data={dataF} actions={actions} />}
        </div>

        <div className={'toast'+(toastMsg?' show':'')}>
          {toastMsg && <><span className="tdot" style={{ background:toastMsg.color||'var(--accent)' }} />{toastMsg.msg}</>}
        </div>

        <nav className="nav">
          {NAV.map((n,i)=>(
            <button key={i} className={'nav-btn'+(tab===i?' on':'')} onClick={()=>{ haptic(); setTab(i); }}>
              <span className="ni"><Icon name={n.icon} size={23} stroke={tab===i?2:1.7} /></span>{n.t}
            </button>
          ))}
        </nav>

        <TweaksPanel title="Tweaks">
          <TweakSection label="Тема" />
          <TweakToggle label="Тёмная тема" value={isDark} onChange={v=>setTweak('dark',v)} />
          <TweakColor label="Акцент" value={tw.accent} options={['#5fe0a6','#56b8f5','#b98cff','#ffb259']} onChange={v=>setTweak('accent',v)} />
          <TweakSection label="Главный экран" />
          <TweakRadio label="Раскладка" value={tw.home} options={[{value:'A',label:'Лента'},{value:'B',label:'Панель'},{value:'C',label:'Фокус'}]} onChange={v=>setTweak('home',v)} />
          <TweakSection label="Демо" />
          <TweakToggle label="Тревога: протечка" value={tw.demoLeak} onChange={v=>setTweak('demoLeak',v)} />
        </TweaksPanel>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>
</body>
</html>
