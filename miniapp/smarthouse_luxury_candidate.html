.app:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;mix-blend-mode:screen;background:radial-gradient(460px 300px at 78% 4%,color-mix(in oklab,var(--accent-gold) 24%,transparent),transparent 60%),radial-gradient(430px 320px at 8% 94%,color-mix(in oklab,var(--accent-blue) 20%,transparent),transparent 62%);animation:ambient 15s ease-in-out infinite}
[data-theme=light] .app:after{mix-blend-mode:multiply;opacity:.6}
/* glass sheen on key surfaces */
.sheen{position:relative}
.sheen>*{position:relative;z-index:3}
.sheen:after{content:"";position:absolute;top:0;bottom:0;left:0;width:38%;pointer-events:none;z-index:2;background:linear-gradient(100deg,transparent,rgba(255,255,255,.13) 50%,transparent);animation:sheenMove 8s ease-in-out infinite}
[data-theme=light] .sheen:after{background:linear-gradient(100deg,transparent,rgba(255,255,255,.55) 50%,transparent)}

.icon-btn:active,.nav button:active,.seg button:active{box-shadow:var(--shadow-glow-gold)}
.action:active,.tile:active{transform:translateY(-2px) scale(.99);box-shadow:var(--shadow-card),var(--shadow-glow-gold)}

.dot.ok{animation:pulseOk 2.6s ease-in-out infinite}

.fab-scrim{position:absolute;inset:0;z-index:30;background:rgba(2,6,12,.30);opacity:0;pointer-events:none;transition:opacity var(--transition-normal)}

.fab{position:absolute;right:0;bottom:0;width:60px;height:60px;border-radius:50%;border:1px solid rgba(255,190,86,.5);background:linear-gradient(150deg,#ffd37c,var(--accent-gold) 52%,#a5691f);color:#1a1206;display:grid;place-items:center;cursor:pointer;z-index:3;box-shadow:0 12px 30px rgba(0,0,0,.42),var(--shadow-glow-gold);transition:transform var(--transition-normal),box-shadow var(--transition-normal)}

.fab-wrap.on .fab{transform:rotate(135deg)}

.fab-item i{color:var(--accent-gold);display:grid}

.fab-wrap.on .fab-item{opacity:1;pointer-events:auto;transform:translate(var(--dx),var(--dy)) scale(1);transition-delay:calc(var(--i)*26ms)}

      ${renderPriceChart(p.arr,now().getHours(),170)}
      <div class="best-window"><b>Ночная EV 2ч</b><div class="sub">${safeText(p.nightWindow||"нет данных")} · самые дешёвые 2 часа ночи</div></div></div>
      <div class="panel"><div class="head"><div class="title"><i>${I("plug")}</i>Стоимость Nord Pool</div><span class="badge mono">${pk?"≈ "+d.cost.total.toFixed(2)+" €":"—"}</span></div><div class="sub" style="margin:-2px 0 8px">Сегодня · предварительно (кВт·ч × средняя цена Nord Pool)</div>${d.cost.items.map(i=>`<div class="row"><i style="color:var(--${i.system})">${I(i.icon,19)}</i><div class="grow"><b>${i.name}</b><small>${i.avail?`<span style="display:inline-block;width:${Math.max(4,i.cost/maxCost*100)}%;height:4px;border-radius:8px;background:var(--${i.system})"></span>`:"нет данных с датчика"}</small></div><div class="right mono">${i.avail?`${i.kwh.toFixed(1)}<small>${pk?"≈ "+i.cost.toFixed(2)+" € · предв.":"цена ?"}</small>`:`<span style="color:var(--muted)">—</span>`}</div></div>`).join("")}<div class="row" style="border-top:1px solid var(--line);margin-top:10px;padding-top:12px"><i style="color:var(--amber)">${I("bolt",19)}</i><div class="grow"><b>Итого за месяц</b><small>накоплено с 1-го числа</small></div><div class="right mono" style="color:var(--amber)"><span data-countup="${d.cost.month||0}" data-dec="2">${(d.cost.month||0).toFixed(2)}</span> €</div></div></div><div class="panel"><div class="head"><div class="title" style="--accent:var(--green)"><i>${I("car")}</i>EV зарядка</div><span class="badge ${d.ev.manual?"warn":"ok"}">${d.ev.manual?"ручной":"авто"}</span></div><div class="grid2">${tile("ev","car","Статус",d.ev.status,`${d.ev.kwh.toFixed(1)} кВт·ч · старт ${d.ev.sched}`,"var(--green)","v8act('evManual')")}${tile("price","bolt","Цена",p.avail?p.now.toFixed(3):"—","сейчас","var(--blue)","")}</div><div class="actions"><button class="action primary" onclick="v8act('evStart')">${I("play")}Зарядить</button><button class="action" onclick="v8act('evScheduleNight')">${I("moon")}Ночь 2ч</button><button class="action" onclick="v8act('evStop')">${I("stop")}Стоп</button><button class="action" onclick="v8act('evManual')">${I("sliders")}Ручной</button></div></div></section>`;
  }
  function renderSecurity(){
    const d=app.data,a=alerts(), sensors=[["door","Входная дверь",!d.sensors.door,d.sensors.door?"Открыта":"Закрыта"],["smoke","Дым",!d.sensors.smoke,d.sensors.smoke?"ДЫМ":"Норма"],["water","Ванная",!d.sensors.bath,d.sensors.bath?"ТЕЧЬ":"Сухо"],["water","Душевая 1эт",!d.sensors.shower,d.sensors.shower?"ТЕЧЬ":"Сухо"],["water","Гараж",!d.sensors.garage,d.sensors.garage?"ТЕЧЬ":"Сухо"],["water","Кухня",!d.sensors.kitchen,d.sensors.kitchen?"ТЕЧЬ":"Сухо"],["motion","Движение (гостиная)",!d.sensors.motion,d.sensors.motion?"Есть!":"Нет"]];
    return `<section class="view on"><div class="panel"><div class="head"><div class="title" style="--accent:${a.length?"var(--red)":"var(--green)"}"><i>${I("shield")}</i>${a.length?"Есть внимание":"Всё в норме"}</div><span class="badge ${a.length?"bad":"ok"}">${a.length?a.length:"OK"}</span></div><div class="grid2"><button class="action ${d.security.armed?"danger":"primary"}" onclick="v8act('arm')">${I(d.security.armed?"unlock":"lock")}${d.security.armed?"Снять":"Охрана"}</button><button class="action ${d.water.open?"":"danger"}" onclick="${d.water.open?"v8act('closeWater')":"v8act('openWater')"}">${I("valve")}${d.water.open?"Закрыть воду":"Открыть воду"}</button></div></div>
      <div class="panel"><div class="head"><div class="title"><i>${I("wifi")}</i>Датчики</div><span class="sub">Протечки · дверь · дым</span></div>${sensors.map(s=>`<div class="row"><span class="dot ${s[2]?"ok":"bad"}"></span><i style="color:var(--muted)">${I(s[0],18)}</i><div class="grow"><b>${s[1]}</b></div><div class="right ${s[2]?"":"sensor-danger"}" style="color:${s[2]?"var(--muted)":"var(--red)"}">${s[3]}</div></div>`).join("")}</div>
      <div class="panel"><div class="head"><div class="title"><i>${I("battery")}</i>Батареи</div></div><div class="grid2">${d.batteries.map(b=>`<div class="tile" style="min-height:74px"><div class="k">${b.name}</div><div class="v mono" style="font-size:21px;color:${b.pct<=15?"var(--red)":b.pct<=30?"var(--amber)":"var(--green)"}">${b.pct}%</div></div>`).join("")}</div></div></section>`;
  }
  function renderEvents(){
    const d=app.data,a=alerts();
    return `<section class="view on"><header class="page-head"><h1>События</h1><p>Только важное и требующее внимания</p></header><div class="panel"><div class="head"><div class="title" style="--accent:${a.length?'var(--red)':'var(--green)'}"><i>${I('shield')}</i>${a.length?'Требуется внимание':'В доме всё спокойно'}</div><span class="badge ${a.length?'bad':'ok'}">${a.length||'OK'}</span></div>${a.length?a.map(x=>`<div class="row"><span class="dot bad"></span><div class="grow"><b>${safeText(x)}</b></div></div>`).join(''):'<div class="sub">Критические датчики доступны, активных тревог нет.</div>'}</div><div class="panel"><div class="head"><div class="title" style="--accent:var(--accent-gold)"><i>${I('calendar')}</i>Последние события</div></div><div class="row"><span class="dot ok"></span><div class="grow"><b>Данные дома обновлены</b><small>состояния получены через защищённый Mini App backend</small></div><div class="right">сейчас</div></div><div class="row"><span class="dot ok"></span><div class="grow"><b>Электричество</b><small>текущая цена ${d.price.avail?d.price.now.toFixed(3):"—"} EUR/кВт·ч</small></div><div class="right">${fmtTime(now())}</div></div>${app.events.slice(0,4).map(e=>`<div class="row"><span class="dot"></span><div class="grow"><b>${safeText(e.summary||'Событие')}</b><small>${safeText(String(e.start?.dateTime||e.start?.date||'').slice(0,16).replace('T',' '))}</small></div></div>`).join('')}</div><div class="section-label"><h2>Системы</h2></div><div class="quick-grid"><button class="action" onclick="v8nav('security')">${I('shield')}Безопасность<small>вода, дым, охрана</small></button><button class="action" onclick="v8nav('heat')">${I('flame')}Тепло и вода<small>котёл, полы, кран</small></button><button class="action" onclick="v8nav('graph')">${I('graph')}Граф связей<small>диагностика дома</small></button><button class="action" onclick="v8nav('settings')">${I('gear')}Настройки<small>тема и обновление</small></button></div></section>`;
  }
  function renderSettings(){
    const s=app.settings;
    return `<section class="view on"><div class="panel"><div class="head"><div class="title" style="--accent:var(--cyan)"><i>${I("gear")}</i>Настройки</div><button class="badge" onclick="v8nav('home')">← Назад</button></div>
      ${settingRow("Тема","Авто/тёмная/светлая",`<div class="seg" style="width:190px;--n:2;--c:var(--blue)"><button class="${s.theme==="dark"?"on":""}" onclick="v8set('theme','dark')">Тёмная</button><button class="${s.theme==="light"?"on":""}" onclick="v8set('theme','light')">Светлая</button></div>`)}
      ${settingRow("Виброотклик","Лёгкий haptic при нажатиях",sw("haptic",s.haptic))}
      ${settingRow("Крупные кнопки","Для управления на ходу",sw("big",s.big))}
      ${settingRow("Компактно","Больше данных на экране",sw("compact",s.compact))}
      ${settingRow("Безопасный режим","Блокирует опасные команды",sw("safe",s.safe))}
      ${settingRow("Обновление","Интервал опроса HA",`<select onchange="v8set('refresh',Number(this.value))" style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:9px"><option ${s.refresh===10?"selected":""} value="10">10 сек</option><option ${s.refresh===30?"selected":""} value="30">30 сек</option><option ${s.refresh===60?"selected":""} value="60">60 сек</option></select>`)}
      <div class="actions"><button class="action primary" onclick="v8act('refresh')">${I("refresh")}Обновить</button><button class="action" onclick="localStorage.removeItem('${LS}');location.reload()">${I("x")}Сброс</button></div></div></section>`;
  }
  function settingRow(title,sub,control){return `<div class="row"><div class="grow"><b>${title}</b><small>${sub}</small></div>${control}</div>`}
  function sw(k,v){return `<div class="switch ${v?"on":""}" style="--c:var(--cyan)" onclick="v8set('${k}',${!v})"></div>`}
  renderShell(); auth();
})();
</script>
</body>
</html>
