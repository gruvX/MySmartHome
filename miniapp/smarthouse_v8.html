.chart{height:128px;display:flex;align-items:flex-end;gap:2px;padding-top:8px;position:relative}.chart:after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(to top,rgba(255,184,73,.12),transparent);pointer-events:none}.bar{flex:1;min-width:2px;border-radius:4px 4px 1px 1px;background:var(--green);opacity:.72;position:relative;box-shadow:0 0 12px color-mix(in oklab,currentColor 35%,transparent)}.bar.now{opacity:1;outline:2px solid #f7ead2;outline-offset:1px;box-shadow:0 0 18px rgba(255,220,158,.44)}.bar.tomorrow{opacity:.62}.bar.night:after{content:"";position:absolute;left:1px;right:1px;bottom:-5px;height:2px;border-radius:3px;background:var(--blue)}.axis{display:flex;justify-content:space-between;color:var(--faint);font-size:13px;font-weight:800;margin-top:8px}.day-axis{display:grid;grid-template-columns:1fr 1fr;gap:8px;color:var(--faint);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}.day-axis span{border-top:1px solid var(--line);padding-top:5px}

    if(app.settings.safe && ["turn_off","turn_on"].includes(service) && domain!=="light"){return Promise.reject(new Error("Безопасный режим"))}
    if(DESKTOP_PREVIEW || !app.initData) return Promise.resolve();
    return fetchWithTimeout(`${HA_URL}/api/miniapp-action`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:app.initData,domain,service,entity_id,extra})}).then(r=>{if(!r.ok)throw new Error("HA "+r.status)});
  }
  // Run command(s): show pending → wait for the real backend response → re-read HA state to
  // confirm → only then show success (or an error). No UI state is flipped before the response.
  function cmd(okMsg,...calls){
    if(DESKTOP_PREVIEW){toast("Демо-режим: команды отключены");return Promise.resolve()}
    toast("Отправляю…");
    return Promise.all(calls).then(()=>fetchData()).then(()=>{if(okMsg)toast(okMsg)}).catch(e=>{toast("Ошибка: "+((e&&e.message)||e))});
  }
  // The Mini App only receives an allow-listed subset of HA states, so the entity a command
  // verifies against can legitimately be absent from the payload. That is NOT a failure.
  function inPayload(eid){return !!eid && (app.states||[]).some(x=>x.entity_id===eid)}
  async function cmdVerified(okMsg,calls,check,verifyEntity){
    if(DESKTOP_PREVIEW){toast("Демо-режим: команды отключены");return}
    toast("Отправляю…");
    try{
      await Promise.all(calls);
      for(let i=0;i<5;i++){
        await fetchData();
        if(check()){toast(okMsg+" · подтверждено");return}
        // Unverifiable (entity not in the payload) — report honestly, never as an error.
        if(verifyEntity&&!inPayload(verifyEntity)){toast(okMsg+" · отправлено, проверить нельзя");return}
        await new Promise(resolve=>setTimeout(resolve,700));
      }
      if(verifyEntity&&!inPayload(verifyEntity)){toast(okMsg+" · отправлено, проверить нельзя");return}
      toast("Команда отправлена, состояние не подтверждено");
    }catch(e){toast("Ошибка: "+((e&&e.message)||e))}
  }
  // Resolve a UI light id to its underlying service call(s), returning a single promise.
  function lightSvc(id,on){
    if(LIGHT_IDS[id]){const p=[svc("light",on?"turn_on":"turn_off",LIGHT_IDS[id])];if(id==="sauna")p.push(svc("light",on?"turn_on":"turn_off","light.dream_color_rgb_2"));return Promise.all(p)}
    if(SWITCH_LIGHT_IDS[id])return svc("switch",on?"turn_on":"turn_off",SWITCH_LIGHT_IDS[id]);
    if(SCENE_IDS[id])return svc("switch","turn_on",on?SCENE_IDS[id].on:SCENE_IDS[id].off);
    return Promise.resolve();
  }
  function act(name,arg){
    haptic("medium");
    const d=app.data;
    if(name==="refresh"){fetchData();toast("Данные обновляются");return}
    if(name==="theme"){app.settings.theme=app.settings.theme==="dark"?"light":"dark";saveLS();renderShell();return}
    if(name==="night"){cmd("Ночной режим включён",...d.lights.map(l=>lightSvc(l.id,false)));return}



    // Ручная выдержка тёплого пола. Скрипты пишут только хелперы (те же действия,
    // что у кнопок /floor_hold_off и /floor_hold_plus в Telegram), устройствам не командуют.
    if(name==="floorHoldOff"){cmd("Выдержка снята",svc("script","turn_on","script.floor_hold_off"));return}
    if(name==="floorHoldPlus"){cmd("Выдержка продлена на 3 ч",svc("script","turn_on","script.floor_hold_plus"));return}
    if(name==="sceneSw"){const k=arg&&arg[0],on=!!(arg&&arg[1]);const p=SCENE_IDS[k];if(!p)return;
      cmd((on?"Включаю: ":"Выключаю: ")+((SCENE_SW.find(x=>x[0]===k)||[,k])[1]),svc("switch","turn_on",on?p.on:p.off));return}
    if(name==="vacStart"){cmd("Пылесос: пуск",svc("vacuum","start","vacuum.kiborg"));return}
    if(name==="vacPause"){cmd("Пылесос: пауза",svc("vacuum","pause","vacuum.kiborg"));return}
    if(name==="vacHome"){cmd("Пылесос: на базу",svc("vacuum","return_to_base","vacuum.kiborg"));return}
    if(name==="nightSaver"){const v=!d.nightSaver;cmd(v?"Ночная экономия ВКЛ (до 05:00)":"Ночная экономия ВЫКЛ",svc("input_boolean",v?"turn_on":"turn_off","input_boolean.night_saver"));return}
    if(name==="zhara"){const v=!d.zhara;cmd(v?"Жара: нагрев выключен":"Жара выключена — нагрев вернулся",svc("script","turn_on",v?"script.rezhim_zhara_on":"script.rezhim_zhara_off"));return}
    if(name==="sceneAway"){cmd("Режим «Ушёл»",svc("script","turn_on","script.scene_away"));return}
    if(name==="sceneCinema"){cmd("Режим «Кино»",svc("script","turn_on","script.scene_cinema"));return}
    if(name==="sceneGuests"){cmd("Режим «Гости»",svc("script","turn_on","script.scene_guests"));return}
    if(name==="evStart"){
      // Уже заряжает — не шлём команду вслепую (как у полов: «уже включён»).
      // Судим по статусу зарядки, а НЕ по switch.ev_charger_switch: он читается
      // off во время зарядки.
      if(!DESKTOP_PREVIEW&&d.ev.raw==="charger_charging"){toast("EV уже заряжается");return}
      app.modal="confirmEvStart";renderShell();return}
    if(name==="doEvStart"){app.modal=null;renderShell();cmdVerified("EV зарядка запущена",[svc("switch","turn_on","switch.ev_charger_switch"),svc("input_boolean","turn_on","input_boolean.ev_manual_mode")],()=>state(app.states,"switch.ev_charger_switch")==="on","switch.ev_charger_switch");return}
    if(name==="evStop"){cmdVerified("EV остановлена",[svc("switch","turn_off","switch.ev_charger_switch"),svc("input_boolean","turn_off","input_boolean.ev_manual_mode")],()=>state(app.states,"switch.ev_charger_switch")==="off","switch.ev_charger_switch");return}
    // Три разовые заявки. Каждая живёт ОДИН раз и сильнее автоматического
    // расписания (липкая заявка input_boolean.ev_night_requested + стабильная
    // ссылка на окно). Подробное подтверждение с конкретным окном и ценой
    // присылает сам скрипт в Telegram — тут только короткий тост.
    if(name==="evScheduleNight"){cmd("EV: ищу лучшие 2 часа ночью (23:00-07:00)",svc("shell_command","ev_night2h",null));return}
    if(name==="evScheduleDay"){cmd("EV: ищу лучшие 2 часа днём (08:00-22:00)",svc("shell_command","ev_day2h",null));return}
    if(name==="evCancelNext"){cmd("EV: следующая зарядка отменена один раз",svc("script","turn_on","script.ev_cancel_next"));return}
    if(name==="evManual"){const v=!d.ev.manual;cmd(v?"EV: ручной режим":"EV: авто режим",svc("input_boolean",v?"turn_on":"turn_off","input_boolean.ev_manual_mode"));return}
    if(name==="boiler"){if(!DESKTOP_PREVIEW&&!isAvail("switch.smart_plug_2_socket_1")){toast("Котёл: нет данных, обновите");return}const on=!d.boiler.power;cmd("Котёл "+(on?"включён":"выключен"),svc("switch",on?"turn_on":"turn_off","switch.smart_plug_2_socket_1"));return}
    if(name==="cwu"){cmd("ГВС "+arg+"°",svc("rest_command","set_boiler_cwu_temp",null,{temp:arg}));return}
    if(name==="co"){cmd("CO "+arg+"°",svc("rest_command","set_boiler_co_temp",null,{temp:arg}));return}
    // --- Тёплые полы (электрические). Every control refuses to act on an entity we
    // --- cannot read, and the setpoint is hard-clamped 5–45 °C on BOTH the step and
    // --- the send (see the Tuya max_temp=300 scaling-bug note by FLOOR_ZONES).
    if(name==="floorSp"){                       // stage only, nothing is sent
      const [i,delta]=arg, f=(app.data.floor||[])[i]; if(!f)return;
      if(!f.avail){toast("Тёплый пол: нет данных");return}
      const base=floorPendingSp(f.eid) ?? (Number.isFinite(f.sp)?f.sp:null);
      if(base===null){toast("Тёплый пол: уставка неизвестна");return}
      const next=floorClampSp(base+delta);
      if(next===base)toast(delta>0?("Максимум "+FLOOR_SP_MAX.toFixed(1)+" °C"):("Минимум "+FLOOR_SP_MIN.toFixed(1)+" °C"));
      app.floorPending[f.eid]={val:next,t:Date.now()};haptic();renderShell();return;
    }
    if(name==="floorSpCancel"){const f=(app.data.floor||[])[arg];if(!f)return;delete app.floorPending[f.eid];renderShell();return}
    if(name==="floorSpApply"){
      const f=(app.data.floor||[])[arg]; if(!f)return;
      const want=floorPendingSp(f.eid);
      if(want===null){toast("Уставка не изменена");return}
      if(!f.avail){toast("Тёплый пол: нет данных");return}
      const send=floorClampSp(want);            // clamp AGAIN on the way out
      if(send===null){toast("Уставка вне диапазона");return}
      delete app.floorPending[f.eid];
      cmdVerified("Уставка "+send.toFixed(1)+"°",[svc("climate","set_temperature",f.eid,{temperature:send})],
        ()=>Math.abs(parseFloat(attr(app.states,f.eid,"temperature"))-send)<0.05,f.eid);
      return;
    }
    if(name==="floorPower"){
      const [i,mode]=arg, f=(app.data.floor||[])[i]; if(!f)return;
      if(!f.avail){toast("Тёплый пол: нет данных");return}
      if(f.hvac===mode){toast(mode==="off"?"Пол уже выключен":"Пол уже включён");return}
      cmdVerified(mode==="off"?"Пол выключен":"Пол включён",[svc("climate","set_hvac_mode",f.eid,{hvac_mode:mode})],
        ()=>state(app.states,f.eid)===mode,f.eid);
      return;
    }
    if(name==="floorMode"){                     // pure preset change, keeps the setpoint
      const [i,preset]=arg, f=(app.data.floor||[])[i]; if(!f)return;
      if(!f.avail){toast("Тёплый пол: нет данных");return}
      if(f.mode===preset){toast(preset==="auto"?"Уже авто":"Уже ручной");return}
      cmdVerified(preset==="auto"?"Пол: авто":"Пол: ручной",[svc("climate","set_preset_mode",f.eid,{preset_mode:preset})],
        ()=>attr(app.states,f.eid,"preset_mode")===preset,f.eid);
      return;
    }
    if(name==="floorSwitch"){
      const [i,which]=arg, f=(app.data.floor||[])[i]; if(!f)return;
      const eid=which==="lock"?f.lockId:f.frostId, cur=which==="lock"?f.lock:f.frost;
      const label=which==="lock"?"Блокировка от детей":"Защита от замерзания";
      if(cur===null){toast(label+": нет данных");return}
      cmdVerified(label+(cur?": выкл":": вкл"),[svc("switch",cur?"turn_off":"turn_on",eid)],
        ()=>state(app.states,eid)===(cur?"off":"on"),eid);
      return;
    }
    if(name==="openWater"){app.modal="confirmOpenWater";renderShell();return}
    if(name==="doOpenWater"){app.modal=null;renderShell();if(!DESKTOP_PREVIEW&&!isAvail("switch.voda_kran_switch_1")){toast("Кран: нет данных, обновите");return}cmdVerified("Вода открыта",[svc("switch","turn_on","switch.voda_kran_switch_1")],()=>state(app.states,"switch.voda_kran_switch_1")==="on","switch.voda_kran_switch_1");return}
    if(name==="closeWater"){app.modal="confirmWater";renderShell();return}
    if(name==="doCloseWater"){app.modal=null;renderShell();if(!DESKTOP_PREVIEW&&!isAvail("switch.voda_kran_switch_1")){toast("Кран: нет данных, обновите");return}cmdVerified("Вода перекрыта",[svc("switch","turn_off","switch.voda_kran_switch_1")],()=>state(app.states,"switch.voda_kran_switch_1")==="off","switch.voda_kran_switch_1");return}
    if(name==="arm"){app.modal="confirmSecurity";renderShell();return}
    if(name==="doArm"){app.modal=null;renderShell();if(!DESKTOP_PREVIEW&&!isAvail("input_boolean.security_armed")){toast("Охрана: нет данных, обновите");return}const v=!d.security.armed;cmdVerified(v?"Охрана включена":"Охрана снята",[svc("input_boolean",v?"turn_on":"turn_off","input_boolean.security_armed")],()=>state(app.states,"input_boolean.security_armed")===(v?"on":"off"),"input_boolean.security_armed");return}
    if(name==="allLightsOff"){cmd("Свет выключен",...d.lights.map(l=>lightSvc(l.id,false)));return}
    if(name==="settings"){app.tab="settings";renderShell();return}
  }

  // ── ТЁПЛЫЕ ПОЛЫ (ЭЛЕКТРИЧЕСКИЕ) ────────────────────────────────────────────

    else effect="дорого ("+price.toFixed(4)+" €/кВт·ч > "+FLOOR_CHEAP_EUR.toFixed(2)+") → автоматика переводит пол в авто";

  function renderEnergy(){
    const d=app.data,p=d.price,pAvail=p.avail!==false;
    // «Сегодня / Завтра»: one day at a time. Tomorrow stays tappable even with no data —
    // it must EXPLAIN, not bounce back to today.
    const showTom=app.priceDay==="tomorrow";
    const tomSlice=priceDaySlice(p.arr,true), tomReady=p.real!==false&&priceDayReady(tomSlice);
    // TODAY is gated exactly like «Завтра»: a chart is drawn only from prices that came
    // out of the real file. With the file unreadable there is no curve to fall back on,
    // so the tab says so instead of drawing the demo one.
    const todaySlice=priceDaySlice(p.arr,false), todayReady=p.real!==false&&priceDayReady(todaySlice);
    const daySlice=showTom?tomSlice:todaySlice, dayReady=showTom?tomReady:todayReady;
    const dayWord=showTom?"завтра":"сегодня";
    const finite=daySlice.filter(Number.isFinite), max=finite.length?Math.max(...finite,1):1;
    const pub=p.tomorrowPub;
    const tomWhy=p.real===false
      ? "Файл цен Nord Pool недоступен, поэтому данных за завтра нет."
      : pub==="on"
      ? "Биржа уже опубликовала цены на завтра — график появится после ближайшего обновления файла цен."
      : pub==="off"
        ? "Цены на завтра публикуются около 14:00. Сейчас их ещё нет, поэтому график не строится."
        : "Не удалось прочитать признак публикации цен на завтра, и данных за завтра нет.";
    const todayWhy=p.real===false
      ? "Файл цен Nord Pool недоступен — нет данных о ценах за сегодня. Показывать демо-график вместо них нельзя."
      : "Цены за сегодня прочитать не удалось: в файле цен нет полных суток.";
    const dayWhy=showTom?tomWhy:todayWhy;
    const daySeg=`<div class="seg" style="--n:2;--c:var(--blue);margin-top:12px"><button type="button" class="${showTom?"":"on"}" aria-pressed="${!showTom}" onclick="v8priceDay('today')">Сегодня${todayReady?"":" · нет данных"}</button><button type="button" class="${showTom?"on":""}" aria-pressed="${showTom}" onclick="v8priceDay('tomorrow')">Завтра${tomReady?"":" · нет данных"}</button></div>`;
    const chartFrame=(!dayReady)
      ? `<div class="empty" style="margin-top:12px;padding:18px 14px;line-height:1.45">${safeText(dayWhy)}</div>`
      : `<div class="price-chart-frame" style="margin-top:12px"><div class="price-y-axis"><span>${(max/100).toFixed(3)}</span><span>${(max/200).toFixed(3)}</span><span>0.000</span></div><div>${renderPriceChart(daySlice,showTom?-1:now().getHours(),128,dayWord)}<div class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div><div class="price-y-unit">Ось Y — EUR/кВт·ч · ось X — часы суток · ${safeText(dayWord)}</div></div>`;
    const t=pAvail?priceTier(p.now):["","нет данных","var(--muted)"];
    const priceStr=pAvail?(p.now/100).toFixed(3):"нет данных";
    const nextStr=Number.isFinite(p.next)&&p.next>0?(p.next/100).toFixed(3):"нет данных";
    // € comes from the price file's daily average. No real prices => no € at all,
    // rather than a 0.00 € (or, before 2026-08-16, a demo-priced) figure. kWh is read
    // straight off the meters and stays.
    const costReal=d.cost.priceReal!==false;
    const maxCost=Math.max(...d.cost.items.map(i=>i.avail?(costReal?i.cost:i.kwh):0),.01);
    const totalStr=d.cost.anyAvail?(costReal?d.cost.total.toFixed(2)+" €":"нет данных о ценах"):"нет данных";
    const monthStr=d.cost.monthAvail?(d.cost.month||0).toFixed(2)+" €":"нет данных";
    return `<section class="view on"><div class="panel"><div class="head"><div class="title" style="--accent:var(--blue)"><i>${I("bolt")}</i>Nord Pool сейчас</div><span class="badge ${t[0]}">${t[1]}</span></div>
      <div class="v mono" style="font-size:${pAvail?44:24}px;font-weight:800;color:${t[2]}">${priceStr}</div><div class="sub">EUR/кВт·ч · следующий час ${nextStr}</div>
      ${daySeg}${chartFrame}
      <div class="best-window"><b>Ночная EV 2ч</b><div class="sub">${safeText(p.nightWindow||"нет данных")} · самые дешёвые 2 часа ночи</div></div></div>
      <div class="panel"><div class="head"><div class="title"><i>${I("plug")}</i>Расход сегодня</div><span class="badge mono">${totalStr}</span></div><div class="sub" style="margin:-4px 0 10px">Стоимость Nord Pool · предварительно</div>${d.cost.items.map(i=>{const av=i.avail!==false;return `<div class="row"><i style="color:var(--${i.system})">${I(i.icon,19)}</i><div class="grow"><b>${i.name}</b><small><span style="display:inline-block;width:${av?Math.max(4,(costReal?i.cost:i.kwh)/maxCost*100):0}%;height:4px;border-radius:8px;background:var(--${i.system})"></span></small></div><div class="right mono">${av?i.kwh.toFixed(1):"нет данных"}<small>${av?(costReal?i.cost.toFixed(2)+" €":"нет цены"):""}</small></div></div>`}).join("")}<div class="row" style="border-top:1px solid var(--line);margin-top:10px;padding-top:12px"><i style="color:var(--amber)">${I("bolt",19)}</i><div class="grow"><b>Итого за месяц</b><small>накоплено с 1-го числа</small></div><div class="right mono" style="color:var(--amber)">${monthStr}</div></div></div>
      <div class="panel"><div class="head"><div class="title" style="--accent:var(--amber)"><i>${I("bolt")}</i>Расходы за месяц</div><span class="badge mono">${monthStr}</span></div><div class="sub" style="margin:-4px 0 10px">По устройствам, накопительно с 1-го числа. Начисляется раз в сутки в 23:58, поэтому сегодняшний день здесь ещё не учтён.</div>${d.cost.items.map(i=>`<div class="row"><i style="color:var(--${i.system})">${I(i.icon,19)}</i><div class="grow"><b>${i.name}</b></div><div class="right mono">${i.mAvail===false?"нет данных":i.mcost.toFixed(2)+" €"}</div></div>`).join("")}</div><div class="panel"><div class="head"><div class="title" style="--accent:var(--green)"><i>${I("car")}</i>EV зарядка</div><span class="badge ${d.ev.manual?"warn":"ok"}">${d.ev.manual?"ручной":"авто"}</span></div><div class="grid2">${tile("ev","car","Статус",d.ev.status,`${d.ev.kwh.toFixed(1)} кВт·ч · старт ${d.ev.sched}`,"var(--green)","")}${tile("price","bolt","Цена",priceStr,"EUR/кВт·ч сейчас","var(--blue)","")}</div><div class="actions" style="grid-template-columns:repeat(3,1fr)"><button type="button" class="action primary" onclick="v8act('evStart')">${I("play")}Зарядить</button><button type="button" class="action" onclick="v8act('evStop')">${I("stop")}Стоп</button><button type="button" class="action" onclick="v8act('evManual')">${I("sliders")}Ручной</button></div><div class="sub" style="margin:10px 0 6px">Разовые заявки — сильнее автоматического расписания, действуют один раз</div><div class="actions" style="grid-template-columns:repeat(3,1fr)"><button type="button" class="action" onclick="v8act('evScheduleNight')">${I("moon")}Ночь 2ч</button><button type="button" class="action" onclick="v8act('evScheduleDay')">${I("sun")}День 2ч</button><button type="button" class="action" onclick="v8act('evCancelNext')">${I("x")}Отменить</button></div></div></section>`;
  }

        ${app.dataError?`<div class="row"><div class="grow"><b>Последняя ошибка</b><small>${safeText(app.dataError)}</small></div></div>`:""}
        <div class="row"><div class="grow"><b>Интервал опроса</b><small>частота обновления HA</small></div><div class="right sub">${Math.max(10,Number(app.settings.refresh)||30)} сек</div></div>
        <div class="row" data-upd-row><div class="grow"><b>Версия приложения</b><small>сборка ${safeText(MINIAPP_BUILD)}${upd.remote&&upd.remote!==MINIAPP_BUILD?" → "+safeText(upd.remote):""}</small></div><div class="right sub" data-upd-line>${safeText(updLine())}</div></div></div>
      <div class="panel"><div class="head"><div class="title" style="--accent:var(--amber)"><i>${I("sliders")}</i>Настройки</div></div>
        <button type="button" class="action" style="width:100%" onclick="v8nav('settings')">${I("gear")}Открыть настройки</button></div>
    </section>`;
  }
  function renderSettings(){
    const s=app.settings;
    return `<section class="view on"><div class="panel"><div class="head"><div class="title" style="--accent:var(--cyan)"><i>${I("gear")}</i>Настройки</div><button type="button" class="badge" onclick="v8nav('more')">← Ещё</button></div>
      ${settingRow("Тема","Авто/тёмная/светлая",`<div class="seg" style="width:190px;--n:2;--c:var(--blue)"><button class="${s.theme==="dark"?"on":""}" onclick="v8set('theme','dark')">Тёмная</button><button class="${s.theme==="light"?"on":""}" onclick="v8set('theme','light')">Светлая</button></div>`)}
      ${settingRow("Виброотклик","Лёгкий haptic при нажатиях",sw("haptic",s.haptic))}
      ${settingRow("Крупные кнопки","Для управления на ходу",sw("big",s.big))}
      ${settingRow("Компактно","Больше данных на экране",sw("compact",s.compact))}
      ${settingRow("Безопасный режим","Блокирует опасные команды",sw("safe",s.safe))}
      ${settingRow("Обновление","Интервал опроса HA",`<select onchange="v8set('refresh',Number(this.value))" style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:9px 14px"><option ${s.refresh===10?"selected":""} value="10">10 сек</option><option ${s.refresh===30?"selected":""} value="30">30 сек</option><option ${s.refresh===60?"selected":""} value="60">60 сек</option></select>`)}
      <div class="actions"><button class="action primary" onclick="v8act('refresh')">${I("refresh")}Обновить</button><button class="action" onclick="localStorage.removeItem('${LS}');location.reload()">${I("x")}Сброс</button></div></div></section>`;
  }
  function settingRow(title,sub,control){return `<div class="row"><div class="grow"><b>${title}</b><small>${sub}</small></div>${control}</div>`}
  const SW_LABEL={haptic:"Виброотклик",big:"Крупные кнопки",compact:"Компактный режим",safe:"Безопасный режим"};
  function sw(k,v){return `<button type="button" class="switch ${v?"on":""}" role="switch" aria-checked="${v}" aria-label="${safeText(SW_LABEL[k]||k)}" style="--c:var(--cyan)" onclick="v8set('${k}',${!v})"></button>`}
  // ===================================================================
  // SELF-UPDATE (2026-07-28). HA serves /local/* with
  // `Cache-Control: public, max-age=2678400` (31 days) and Telegram's webview honours
  // it, so a deployed smarthouse.html could stay invisible to the owner for a MONTH.
  // Fix (mirrors PANEL_BUILD in tablet-panel.js): this build stamps its own identity
  // in MINIAPP_BUILD and polls the tiny sidecar /local/miniapp-version.json. When the
  // sidecar advertises a DIFFERENT build we navigate ONCE to this same page with a
  // cache-busting ?v=<build>, which forces the webview to fetch the new HTML.
  //
  // A plain location.reload() would NOT be enough — the webview would re-serve the
  // cached copy for the same URL. And the URL we build MUST keep location.hash BYTE
  // FOR BYTE: Telegram passes tgWebAppData (the initData that the whole /api/miniapp-*
  // auth depends on) in the URL FRAGMENT. Dropping the hash would break authorization
  // and show «Ошибка авторизации». Pre-existing query params are carried over too.
  //
  // MINIAPP_BUILD and the sidecar's "build" MUST be bumped together — a mismatch
  // either disables auto-update or invites a navigation loop.
  // tests/test_miniapp_build_marker.py fails the suite if they ever diverge.
  //
  // This app closes the water valve and arms security, so a navigation storm would be
  // far worse than a stale build. Every navigation is guarded:
  //   * at most ONE navigation per distinct advertised build value (so bumping the
  //     JSON without shipping new HTML cannot loop),
  //   * at most UPD_MAX_NAV navigations per session, no matter what,
  //   * never before the first successful auth + state load (never interrupt startup),
  //   * never while a modal/sheet is open, while the document is hidden, within
  //     UPD_INTERACT_MS of a real touch/keypress (a phone user scrolling must not be
  //     yanked), while the leak truth entity reads `leak`, or while smoke is in alarm.
  // A blocked navigation stays PENDING and is retried on every poll and on
  // visibilitychange → visible — it is never lost. Suppression shows up as ONE quiet
  // line in «Ещё» → Диагностика: never an alert(), never a modal, never console spam.
  // Everything here fails SILENT: the sidecar is optional, so 404 / HTML error page /
  // invalid JSON / empty body / missing `build` / offline all mean "no information".
  // ===================================================================
  const MINIAPP_BUILD = "20260826-1";
  const UPD_URL = "/local/miniapp-version.json";
  const UPD_POLL_MS = 60000;      // poll cadence
  const UPD_FIRST_MS = 3000;      // one early check so a stale open heals fast
  const UPD_INTERACT_MS = 10000;  // quiet period after a user interaction
  const UPD_MAX_NAV = 3;          // hard cap per session
  const UPD_MAX_JSON = 4096;      // sanity cap: the sidecar is a few dozen bytes
  const UPD_SMOKE_ID = "binary_sensor.wifi_th_smoke_sensor_smoke";
  const upd = {timer:null,first:null,pending:null,remote:null,hint:"",line:"",lastInteract:0,listeners:false};
  // Where the navigation bookkeeping lives. sessionStorage is the right scope ("per
  // webview session") and survives the navigation we trigger; localStorage is only a
  // fallback so the guards still hold if sessionStorage is unavailable. If NEITHER can
  // be written we refuse to navigate at all — an unguarded navigation could loop.
  function updStore(){
    const probe="__miniapp_upd_probe";
    for(const get of [()=>window.sessionStorage,()=>window.localStorage]){
      try{const s=get();if(!s)continue;s.setItem(probe,"1");s.removeItem(probe);return s}catch(e){}
    }
    return null;
  }
  function updGet(k){try{const s=updStore();return s?s.getItem(k):null}catch(e){return null}}
  function updSet(k,v){try{const s=updStore();if(s)s.setItem(k,String(v))}catch(e){}}
  // Distinct build values we have ALREADY navigated for (cap: one navigation each).
  function updNavigatedBuilds(){
    try{const a=JSON.parse(updGet("miniapp_upd_builds")||"[]");return Array.isArray(a)?a.filter(x=>typeof x==="string"&&x):[]}catch(e){return []}
  }
  function updNavCount(){const n=parseInt(updGet("miniapp_upd_count")||"0",10);return (Number.isFinite(n)&&n>0)?n:0}
  function updTouch(){upd.lastInteract=Date.now()}
  // Cache-busting target for build `b`. location.hash is appended VERBATIM (tgWebAppData
  // lives there); any other existing query params are rebuilt, only `v` is replaced.
  function updTargetUrl(b){
    let query="v="+encodeURIComponent(b);
    try{
      const p=new URLSearchParams(location.search);
      p.delete("v");
      const rest=p.toString();
      if(rest)query=rest+"&"+query;
    }catch(e){}
    return location.pathname+"?"+query+location.hash;
  }
  // Navigation indirection: a named, window-exposed hook so the headless regression
  // suite can observe a navigation without actually navigating in a loop.
  function miniappNavigate(url){try{location.replace(url)}catch(e){}}
  window.v8navigate=miniappNavigate;
  // "" = safe to navigate now; otherwise a short human reason for the quiet hint.
  function updBlockReason(){
    if(app.auth!=="ok"||!app.updatedAt)return "идёт загрузка данных";
    try{if(typeof document!=="undefined"&&document.visibilityState==="hidden")return "приложение не активно"}catch(e){}
    if(app.modal)return "открыт диалог";
    // Safety incidents: reuse exactly what the app already knows (one source of truth).
    try{const L=leakInfo();if(L.status==="leak"||(Array.isArray(L.leakNames)&&L.leakNames.length))return "протечка воды"}catch(e){}
    try{if(((app.data||{}).sensors||{}).smoke===true)return "задымление"}catch(e){}
    try{if(state(app.states,UPD_SMOKE_ID)==="on")return "задымление"}catch(e){}
    if(upd.lastInteract&&(Date.now()-upd.lastInteract)<UPD_INTERACT_MS)return "работа в приложении";
    return "";
  }
  // Read the sidecar. Returns a non-empty build string or null. Never throws.
  async function updFetchBuild(){
    try{
      const r=await fetchWithTimeout(UPD_URL+"?t="+Date.now(),{cache:"no-store"},6000);
      if(!r||!r.ok)return null;
      const txt=await r.text();
      if(typeof txt!=="string")return null;
      const body=txt.trim();
      if(!body||body.length>UPD_MAX_JSON)return null;
      const j=JSON.parse(body);                        // HTML error page / garbage -> throws -> null
      if(!j||typeof j!=="object"||Array.isArray(j))return null;
      const b=j.build;
      return (typeof b==="string"&&b.trim())?b.trim():null;
    }catch(e){return null}
  }
  async function updCheck(){
    const remote=await updFetchBuild();
    if(!remote){
      // Сайдкар недоступен: строка не должна вечно висеть на «проверка…».
      upd.fails=(upd.fails||0)+1;
      if(upd.fails>=2&&!upd.remote)upd.hint="не удалось проверить обновление";
    }
    if(remote){
      upd.fails=0;
      upd.remote=remote;
      if(remote!==MINIAPP_BUILD)upd.pending=remote;    // owe a navigation (guards decide when)
      else{upd.pending=null;upd.hint=""}               // same build: nothing to do
    }
    updMaybeNavigate();                                // also retries a deferred navigation
    updSyncHint();
  }
  // The ONLY place that navigates. Applies, in order: loop protection (per-build +
  // session cap) and the startup/incident/interaction/visibility deferral.
  function updMaybeNavigate(){
    const b=upd.pending;
    if(!b||b===MINIAPP_BUILD)return;
    if(!updStore()){upd.hint=b+" — браузер не хранит счётчик, обнови вручную";return}
    if(updNavigatedBuilds().indexOf(b)>=0){
      // We already navigated for this exact build and the served HTML is STILL the old
      // one -> the file did not actually change. Never navigate again.
      upd.hint=b+" — файл не изменился, очисти кэш Telegram";return;
    }
    if(updNavCount()>=UPD_MAX_NAV){upd.hint="лимит обновлений "+UPD_MAX_NAV+" — обнови вручную";return}
    const why=updBlockReason();
    if(why){upd.hint=b+" ждёт: "+why;return}           // pending flag stays set, retried later
    const builds=updNavigatedBuilds();builds.push(b);
    updSet("miniapp_upd_builds",JSON.stringify(builds.slice(-10)));
    updSet("miniapp_upd_for",b);
    updSet("miniapp_upd_count",updNavCount()+1);
    upd.pending=null;
    upd.hint="обновление до "+b+"…";
    const url=updTargetUrl(b);
    try{(window.v8navigate||miniappNavigate)(url)}catch(e){}
  }
  // One quiet read-only line, shown in «Ещё» → Диагностика. No toast, no modal.
  function updLine(){
    if(upd.hint)return upd.hint;
    if(!upd.remote)return "проверка…";
    return upd.remote===MINIAPP_BUILD?"актуальная сборка":"обновление найдено";
  }
  function updSyncHint(){
    const line=updLine();
    if(line===upd.line)return;
    upd.line=line;
    if(app.tab==="more")renderShell();                 // only the tab that displays it
  }
  function updStart(intervalMs){
    updStop();
    const ms=Math.max(200,Number(intervalMs)||UPD_POLL_MS);
    if(!upd.listeners){
      upd.listeners=true;
      ["pointerdown","touchstart","touchmove","keydown","wheel"].forEach(ev=>{
        try{document.addEventListener(ev,updTouch,{capture:true,passive:true})}catch(e){document.addEventListener(ev,updTouch,true)}
      });
      // Never navigate a backgrounded webview; apply the pending navigation as soon as
      // the Mini App is visible again.
      document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")updMaybeNavigate()});
    }
    upd.timer=setInterval(updCheck,ms);
    upd.first=setTimeout(updCheck,Math.min(UPD_FIRST_MS,ms)); // heal a stale open fast
  }
  function updStop(){clearInterval(upd.timer);upd.timer=null;clearTimeout(upd.first);upd.first=null}
  // Diagnostics/test hook: read-only state plus the same guarded entry points the poller
  // uses. Contains no secrets and cannot command anything.
  window.v8upd={build:MINIAPP_BUILD,check:updCheck,maybe:updMaybeNavigate,start:updStart,stop:updStop,
    reason:updBlockReason,target:updTargetUrl,line:updLine,fetchBuild:updFetchBuild,
    snapshot:()=>({pending:upd.pending,remote:upd.remote,hint:upd.hint,line:upd.line,lastInteract:upd.lastInteract})};

  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&app.modal){app.modal=null;renderShell()}});
  renderShell(); auth(); updStart();
})();
</script>
</body>
