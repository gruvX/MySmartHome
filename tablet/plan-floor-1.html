<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>План первого этажа</title><style>
:root{--bg:#071016;--panel:#0d1a20;--ink:#f3f7f8;--muted:#9babb2;--cyan:#50d5ff;--line:#30434b}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}.note{font-size:11px;color:var(--muted)}.spacer{flex:1}button{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#14252c;color:var(--ink);cursor:pointer}
.stage{position:relative;min-height:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 42%,#10242c,#071016 72%)}svg{width:100%;height:100%;display:block}#world{transform-origin:0 0}.room{stroke:#3b535d;stroke-width:2}.wall{stroke:#d6e1e4;stroke-linecap:square}.room-label{pointer-events:none}.room-name{fill:var(--ink);font-size:19px;font-weight:700}.room-area{fill:var(--cyan);font-size:15px;font-weight:700}
.legend{position:absolute;left:14px;bottom:14px;max-width:360px;padding:9px 11px;border-radius:9px;background:rgba(7,16,22,.88);color:var(--muted);font-size:11px;border:1px solid var(--line)}
@media(max-width:700px){header{padding:9px 10px}.note{display:none}h1{font-size:15px}}
</style></head><body><div class="app"><header><h1>План первого этажа</h1><span class="note">точная геометрия из Plan 3 · без электрических данных</span><span class="spacer"></span><button id="reset">Вписать</button></header>
<main class="stage" id="stage"><svg id="plan" viewBox="337.33 -163.14 1453.66 1356.14" aria-label="Архитектурный план первого этажа"><g id="world"><polygon class="room" points="415.33,660.33 510.75,660.33 510.75,478.32 415.33,478.32" fill="#172b34"/><polygon class="room" points="1202.96,308.48 1437.30,308.48 1437.30,638.28 1203.13,638.28" fill="#1b3038"/><polygon class="room" points="1473.30,774.73 1712.99,774.73 1712.99,92.61 1473.30,92.61" fill="#20343b"/><polygon class="room" points="415.33,468.08 675.75,468.08 675.75,119.39 415.33,119.39" fill="#193039"/><polygon class="room" points="415.33,840.45 615.00,840.45 615.01,670.33 415.33,670.32" fill="#24363b"/><polygon class="room" points="415.33,1115.00 614.99,1115.00 615.00,850.45 415.33,850.45" fill="#1d3239"/><polygon class="room" points="1167.37,1115.00 1166.84,119.39 685.75,119.39 685.75,468.08 989.25,468.08 989.25,479.08 979.25,479.08 979.25,478.08 520.75,478.08 520.75,660.32 625.01,660.33 624.99,1115.00" fill="#22383d"/><line class="wall" x1="397.33" y1="101.39" x2="397.33" y2="1133.00" stroke-width="36.00"/><line class="wall" x1="397.33" y1="1133.00" x2="1185.38" y2="1133.00" stroke-width="36.00"/><line class="wall" x1="1185.38" y1="1133.00" x2="1184.83" y2="101.39" stroke-width="36.00"/><line class="wall" x1="1184.83" y1="101.39" x2="397.33" y2="101.39" stroke-width="36.00"/><line class="wall" x1="415.33" y1="473.08" x2="979.25" y2="473.08" stroke-width="10.00"/><line class="wall" x1="619.99" y1="1115.00" x2="620.01" y2="665.33" stroke-width="10.00"/><line class="wall" x1="620.01" y1="665.33" x2="415.33" y2="665.32" stroke-width="10.00"/><line class="wall" x1="515.75" y1="478.08" x2="515.75" y2="660.32" stroke-width="10.00"/><line class="wall" x1="680.75" y1="468.08" x2="680.75" y2="119.39" stroke-width="10.00"/><line class="wall" x1="615.00" y1="845.45" x2="415.33" y2="845.45" stroke-width="10.00"/><line class="wall" x1="1202.93" y1="290.48" x2="1455.30" y2="290.48" stroke-width="36.00"/><line class="wall" x1="1203.13" y1="656.28" x2="1455.30" y2="656.28" stroke-width="36.00"/><line class="wall" x1="1455.30" y1="290.48" x2="1455.30" y2="656.28" stroke-width="36.00"/><line class="wall" x1="1455.30" y1="272.48" x2="1455.30" y2="74.61" stroke-width="36.00"/><line class="wall" x1="1455.30" y1="674.28" x2="1455.30" y2="792.73" stroke-width="36.00"/><line class="wall" x1="1455.30" y1="792.73" x2="1730.99" y2="792.73" stroke-width="36.00"/><line class="wall" x1="1730.99" y1="792.73" x2="1730.99" y2="74.61" stroke-width="36.00"/><line class="wall" x1="1455.30" y1="74.61" x2="1730.99" y2="74.61" stroke-width="36.00"/><g class="room-label" transform="translate(463.04 569.32)"><text class="room-name" text-anchor="middle">Помещение 1</text><text class="room-area" y="22" text-anchor="middle">1.74 м²</text></g><g class="room-label" transform="translate(1320.17 473.38)"><text class="room-name" text-anchor="middle">Помещение 2</text><text class="room-area" y="22" text-anchor="middle">7.73 м²</text></g><g class="room-label" transform="translate(1593.14 433.67)"><text class="room-name" text-anchor="middle">Помещение 3</text><text class="room-area" y="22" text-anchor="middle">16.35 м²</text></g><g class="room-label" transform="translate(545.54 293.73)"><text class="room-name" text-anchor="middle">Помещение 4</text><text class="room-area" y="22" text-anchor="middle">9.08 м²</text></g><g class="room-label" transform="translate(515.17 755.39)"><text class="room-name" text-anchor="middle">Помещение 5</text><text class="room-area" y="22" text-anchor="middle">3.4 м²</text></g><g class="room-label" transform="translate(515.16 982.72)"><text class="room-name" text-anchor="middle">Помещение 6</text><text class="room-area" y="22" text-anchor="middle">4.52 м²</text></g><g class="room-label" transform="translate(827.85 553.33)"><text class="room-name" text-anchor="middle">Помещение 7</text><text class="room-area" y="22" text-anchor="middle">53.37 м²</text></g></g></svg><div class="legend">Колесо — масштаб · перетаскивание — перемещение. Названия помещений пока нейтральные: назначение комнат нужно сверить с владельцем.</div></main></div>
<script>
const svg=document.querySelector('#plan'),world=document.querySelector('#world'),stage=document.querySelector('#stage');let scale=1,tx=0,ty=0,drag=false,px=0,py=0;
function paint(){world.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`)}function reset(){scale=1;tx=0;ty=0;paint()}
stage.addEventListener('wheel',e=>{e.preventDefault();const k=e.deltaY<0?1.12:.89;scale=Math.max(.55,Math.min(4,scale*k));paint()},{passive:false});
stage.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;tx+=(e.clientX-px)/scale;ty+=(e.clientY-py)/scale;px=e.clientX;py=e.clientY;paint()});stage.addEventListener('pointerup',()=>drag=false);document.querySelector('#reset').onclick=reset;
</script></body></html>
