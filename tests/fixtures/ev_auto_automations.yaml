    перенести зарядку на следующее самое дешёвое окно, вместо того чтобы молча пропустить
    сутки.

    СТРОГО ПО СВЕЖЕМУ СТАТУСУ. Пробная квота Tuya IoT Core исчерпана (code 28841004),
    поэтому sensor.ev_charger_status отдаётся из кэша (src=cache, stale_age ~18000 c)
    и заморожен на charger_insert. Утверждать «машина не подключена» по устаревшему
    значению нельзя, поэтому ветка требует src=cloud И stale_age < 900. Любой НЕсвежий
    статус — это случай сторожа 1790100001001, который прямо говорит «нет свежих данных,
    причину назвать нельзя».

    ЛИМИТ: не больше 2 переносов за местные сутки (input_number.ev_replan_count,
    обнуляется когда input_datetime.ev_replan_day не сегодняшний). Лимит считает сам
    /config/ev_replan_next.py; исчерпан — одно сообщение и всё, никаких повторов.

    ЗАДЕРЖКА 12 мин: после автозарядки 1778800001002 (её проверка 6 мин) и сторожа
    1790100001001 (10 мин), чтобы порядок сообщений был «почему» -> «что делаю».

    Разовая заявка «Зарядить ночью/днём» НЕ переносится: это осознанный выбор владельца
    на конкретное окно. Отменённое окно тоже не переносится.

    НИКОГДА не подаёт команд устройствам: только shell_command, который пишет helpers
    и отправляет Telegram.'
  triggers:
  - trigger: time
    at: input_datetime.ev_charge_start
    id: planned_start
  conditions:
  - condition: template
    value_template: '{{ not is_state(''input_boolean.ev_manual_mode'', ''on'') }}'
  actions:
  - alias: Дать автозарядке (6 мин) и сторожу (10 мин) высказаться первыми
    delay: 00:12:00
  - condition: template
    alias: Разовая заявка владельца не переносится
    value_template: '{{ not is_state(''input_boolean.ev_night_requested'', ''on'') }}'
  - condition: template
    alias: Это окно не отменял сам владелец
    value_template: >-
      {% set cs = state_attr('input_datetime.ev_charge_start', 'timestamp') | float(0) %}
      {% set cc = state_attr('input_datetime.ev_cancel_consumed', 'timestamp') | float(0)
      %} {{ cs <= 0 or ((cc - cs) | abs) > 60 }}
  - condition: template
    alias: ТОЛЬКО свежий charger_free. Кэш/квота/unavailable -> ничего не утверждаем и
      не переносим
    value_template: >-
      {% set s = states('sensor.ev_charger_status') %} {% set src =
      state_attr('sensor.ev_charger_status', 'src') %} {% set age =
      state_attr('sensor.ev_charger_status', 'stale_age') | float(-1) %} {{ s ==
      'charger_free' and src in ['local', 'cloud'] and age >= 0 and age < 900 }}
  - alias: Перенос и сообщение делает /config/ev_replan_next.py (лимит внутри скрипта)
    action: shell_command.ev_replan_next
  mode: single
