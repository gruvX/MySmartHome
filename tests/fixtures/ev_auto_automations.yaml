# Verbatim copy of every automation the 2026-08-19 EV auto-charge package
# changed or added, taken from /config/automations.yaml (md5 of the whole file:
# 8f2bd14e75ec42b37052e234ecd079db).
- id: '1778700001004'
  alias: "\U0001F4F2 Telegram меню с кнопками"
  description: Отправляет inline-клавиатуру при сообщении 'меню'
  triggers:
  - platform: event
    event_type: telegram_text
    event_data:
      chat_id: 100000000
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.text | lower | trim in [''меню'', ''menu'']
      }}'
  actions:
  - action: telegram_bot.send_message
    data:
      message: "\U0001F3E0 Управление домом:"
      inline_keyboard:
      - - - "\U0001F4CA Статус"
          - /status
        - - "\U0001F9E0 Диагностика"
          - /diag
      - - - "\U0001F525 Бойлер ВКЛ"
          - /boiler_on
        - - "\U0001F9CA Бойлер ВЫКЛ"
          - /boiler_off
      - - - "\U0001F525 Полотенцесушитель ВКЛ"
          - /kalar_on
        - - "\U0001F9CA Полотенцесушитель ВЫКЛ"
          - /kalar_off
      - - - "\U0001F697 EV зарядить"
          - /ev_on
        - - "\U0001F697 EV стоп"
          - /ev_off
      - - - "\U0001F4C5 EV расписание"
          - /ev_schedule
        - - "\U0001F4A7 Кран ОТКРЫТЬ"
          - /water_on
      - - - "\U0001F319 Зарядить ночью"
          - /ev_night
        - - ☀️ Зарядить днём
          - /ev_day
      - - - ⛔ Отменить зарядку
          - /ev_cancel
      - - - "\U0001F319 Ночной режим"
          - /night
      - - - "\U0001F319 Эконом ВКЛ"
          - /night_saver_on
        - - ☀️ Эконом ВЫКЛ
          - /night_saver_off
      - - - "\U0001F525 Жара ВКЛ"
          - /zhara_on
        - - ❄️ Жара ВЫКЛ
          - /zhara_off
      - - - "\U0001F6AA Ушёл"
          - /scene_away
        - - "\U0001F3AC Кино"
          - /scene_cinema
      - - - "\U0001F389 Гости"
          - /scene_guests
      - - - "\U0001F310 Открыть приложение"
          - https://t.me/your_home_bot/smarthome
      chat_id: 100000000
  mode: single
- id: '1778700001005'
  alias: 📲 Telegram обработчик кнопок
  description: Все inline-кнопки включая подменю света
  triggers:
  - platform: event
    event_type: telegram_callback
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.chat_id | string == ''100000000'' }}'
  actions:
  - variables:
      callback_data: '{{ trigger.event.data.data }}'
      callback_id: '{{ trigger.event.data.id }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/security_arm'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: 🛡 Охрана включена
        continue_on_error: true
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.security_armed
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: '🛡 Охрана включена


            Датчики: дверь + движение

            Для снятия: /security_disarm или кнопка в панелях'
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/security_disarm'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: 🔓 Охрана снята
        continue_on_error: true
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.security_armed
      - action: siren.turn_off
        target:
          entity_id: siren.alarm
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: 🔓 Охрана снята. Сирена выключена.
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/siren_off'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: 🔕 Сирена выключена
        continue_on_error: true
      - action: siren.turn_off
        target:
          entity_id: siren.alarm
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/leak_confirm'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: 🚰 Закрываю кран…
        continue_on_error: true
      - action: switch.turn_off
        target:
          entity_id: switch.voda_kran_switch_1
      - action: switch.turn_off
        target:
          entity_id: switch.zigbee_plug_2_socket_1
      - action: select.select_option
        target:
          entity_id: select.alarm_volume
        data:
          option: high
      - action: number.set_value
        target:
          entity_id: number.alarm_time
        data:
          value: 120
      - action: siren.turn_on
        target:
          entity_id: siren.alarm
      - alias: Подтверждение закрытия крана — вне очереди обработчика
        action: script.turn_on
        target:
          entity_id: script.leak_valve_verify
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/moisture_false_alarm'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: 🚫 Ложная тревога — кран не закрываю
        continue_on_error: true
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.tuya_reconnect_grace
      - action: script.turn_on
        target:
          entity_id: script.tuya_grace_release
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: '🚫 Ложная тревога подтверждена.

            Кран и гидрофор не трогаю.

            Датчик влаги — проверь вручную.'
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/ev_stop'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: ⛔ EV зарядка остановлена
        continue_on_error: true
      - action: switch.turn_off
        target:
          entity_id: switch.ev_charger_switch
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ev_manual_mode
      - alias: Проверка результата по sensor.ev_charger_status — вне очереди обработчика
        action: script.turn_on
        target:
          entity_id: script.ev_verify_stop
        data:
          variables:
            ok_msg: ⛔ EV зарядка остановлена вручную.
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/ev_start'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: 🚗⚡ EV зарядка запущена
        continue_on_error: true
      - action: switch.turn_on
        target:
          entity_id: switch.ev_charger_switch
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ev_manual_mode
      - alias: Проверка результата по sensor.ev_charger_status — вне очереди обработчика
        action: script.turn_on
        target:
          entity_id: script.ev_verify_start
        data:
          variables:
            ok_msg: 🚗⚡ EV зарядка запущена вручную.
    - alias: Разовая заявка «Зарядить ночью» — окно 23:00-07:00
      conditions:
      - condition: template
        value_template: '{{ callback_data == ''/ev_night'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: 🌙 Ищу самые дешёвые 2 часа ночью…
        continue_on_error: true
      - alias: Скрипт сам выберет окно, снимет разовую отмену и пришлёт подтверждение
          с конкретным окном и ценой. НИКАКИХ команд устройствам
        action: shell_command.ev_night2h
    - alias: Разовая заявка «Зарядить днём» — окно 08:00-22:00
      conditions:
      - condition: template
        value_template: '{{ callback_data == ''/ev_day'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: ☀️ Ищу самые дешёвые 2 часа днём…
        continue_on_error: true
      - action: shell_command.ev_day2h
    - alias: Отменить ОДНУ следующую зарядку
      conditions:
      - condition: template
        value_template: '{{ callback_data == ''/ev_cancel'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: ⛔ Следующая зарядка отменена
        continue_on_error: true
      - alias: Скрипт снимает разовую заявку, ставит отмену и присылает подтверждение.
          Запуск fire-and-forget, чтобы его сбой не оборвал обработчик
        action: script.turn_on
        target:
          entity_id: script.ev_cancel_next
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/siren_alarm'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: 🚨 Режим тревоги! Сирена 5 мин.
        continue_on_error: true
      - action: select.select_option
        target:
          entity_id: select.alarm_volume
        data:
          option: high
      - action: number.set_value
        target:
          entity_id: number.alarm_time
        data:
          value: 300
      - action: siren.turn_on
        target:
          entity_id: siren.alarm
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: '🚨 ТРЕВОГА АКТИВИРОВАНА!

            Сирена включена на 5 минут.

            Вызови 112 если необходимо.'
          inline_keyboard:
          - - - 🔕 Выключить сирену
              - /siren_off
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/patrol_off_yes'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
