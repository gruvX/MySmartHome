            {%- set ch = states('sensor.nord_pool_lv_lowest_price') | float(0) -%}
            {%- set req = is_state('input_boolean.ev_night_requested', 'on') -%}
            {%- set cancelled = is_state('input_boolean.ev_charge_cancelled', 'on') -%}
            🚗 EV расписание:
              📅 {{ dt.strftime('%d.%m.%Y') }} {{ dt.strftime('%H:%M') }}–{{ (dt + timedelta(hours=2)).strftime('%H:%M') }}
              ⚡ {{ '%.4f'|format(ch) }} EUR/кВт·ч
            {% if is_state('input_boolean.ev_manual_mode','on') %}⚠️ Ручной режим активен.{% elif is_state('sensor.ev_charger_status','charger_charging') %}✅ Зарядка идёт.{% else %}⏳ Ожидание.{% endif %}
            {% if req %}🌙 Стоит разовая заявка — она сильнее автоматического расписания.{% endif %}
            {% if cancelled %}⛔ Следующая зарядка отменена один раз. Нажми «Зарядить ночью/днём», чтобы вернуть.{% endif %}
            {% if not req and not cancelled %}🤖 Автоматически: самое дешёвое 2ч окно на ближайшие 24 ч.{% endif %}
