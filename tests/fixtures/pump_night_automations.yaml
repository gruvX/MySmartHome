  conditions:
  - condition: state
    entity_id: input_boolean.ha_startup_grace
    state: 'off'
  actions:
  - action: telegram_bot.send_message
    data:
      chat_id: 100000000
      parse_mode: html
      message: |-
        ⚠️ <b>Устройство недоступно</b>

        <code>{{ (trigger.to_state.attributes.friendly_name | default(trigger.entity_id)) | e }}</code>
        <code>{{ trigger.entity_id | e }}</code>

        Недоступно уже 5+ минут. Проверь устройство или интеграцию Tuya.

        <code>/api/services/homeassistant/reload_config_entry</code>
  mode: parallel
  max: 10
- id: '1779000001001'
  alias: "⚡\U0001F525 EV + Бойлер: интерлок"
  description: Когда EV заряжается — выключает бойлер. Когда EV остановился — включает
    бойлер если цена дешёвая.
  triggers:
  - platform: state
    entity_id: switch.ev_charger_switch
    to: 'on'
    not_from:
    - unavailable
    - unknown
    id: ev_switch_on
  - platform: state
    entity_id: sensor.ev_charger_status
    to: charger_charging
    not_from:
    - unavailable
    - unknown
    id: ev_status_charging
  - platform: state
    entity_id: switch.ev_charger_switch
    to: 'off'
    not_from:
    - unavailable
    - unknown
    id: ev_switch_off
  - platform: state
    entity_id: sensor.ev_charger_status
    to:
    - charger_free
    - charger_end
    - charger_pause
    not_from:
    - unavailable
    - unknown
    id: ev_status_stopped
  conditions:
  - condition: template
    alias: Реальный переход, а не переподключение Tuya (unavailable -> off/on)
    value_template: >-
      {{ trigger is defined and trigger.from_state is defined
         and trigger.from_state is not none
         and trigger.from_state.state not in ['unavailable', 'unknown'] }}
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - ev_switch_on
        - ev_status_charging
      - condition: state
        entity_id: switch.smart_plug_2_socket_1
        state: 'on'
      sequence:
      - target:
          entity_id: switch.smart_plug_2_socket_1
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id:
        - ev_switch_off
        - ev_status_stopped
      - condition: numeric_state
        entity_id: sensor.nord_pool_lv_current_price
        below: 0.10
      - condition: not
        conditions:
        - condition: state
          entity_id: switch.ev_charger_switch
          state: 'on'
        alias: EV switch должен быть выключен
      sequence:
      - target:
          entity_id: switch.smart_plug_2_socket_1
        action: switch.turn_on
  mode: restart
- id: '1782000001001'
