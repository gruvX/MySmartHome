  conditions: []
  actions:
  - action: telegram_bot.send_message
    data:
      chat_id: 100000000
      parse_mode: html
      message: |-
        🚨 <code>input_boolean.ha_startup_grace</code> застрял в ON &gt; 20 мин.
        Защита от утечки воды сейчас ПОДАВЛЕНА (<code>leak_check</code> требует grace = off).
        Проверь менеджер grace (авт. <code>1789200001001</code>) и при необходимости выключи helper вручную.
- id: '1789300001001'
  alias: "\U0001F6A8 Сторож сирены — недоступна (только уведомление)"
  description: >-
    NOTIFICATION-ONLY watchdog. Следит за siren.alarm (актуатор звукового
    оповещения пожар/взлом). 2026-07-16 09:55 siren.alarm + select.alarm_volume
    + number.alarm_time ушли в unavailable — тихая сирена не сработала бы. Эта
    автоматизация ТОЛЬКО шлёт Telegram-сообщение, НЕ управляет никакими
    устройствами (нет siren/switch/lock/climate/script/input_boolean вызовов).
    2026-08-16: parse_mode html + entity_id в <code> — под дефолтным markdown бота
    подчёркивания entity_id ломали разбор и Telegram мог отклонить всё сообщение.
  mode: single
  triggers:
  - trigger: state
    entity_id: siren.alarm
    to: unavailable
    for: 00:15:00
    id: down
  - trigger: state
    entity_id: siren.alarm
    to: unknown
    for: 00:15:00
    id: down
  - trigger: state
    entity_id: siren.alarm
    from: unavailable
    for: 00:02:00
    id: up
  - trigger: state
    entity_id: siren.alarm
    from: unknown
    for: 00:02:00
    id: up
  conditions: []
  actions:
  - variables:
      # ЕДИНОЕ ПРАВИЛО ОТБОЯ ✅ (P1, 2026-08-19). Одно переподключение Tuya давало
      # каскад: «Tuya: сессия оборвалась — перезагрузил» + «кран снова управляется»
      # + «сирена снова доступна» + «тёплый пол: связь восстановлена» x2. ~20
      # сообщений в сутки на 3-4 реальных инцидента.
      # ✅ уходит, только если ОБА условия верны:
      #   paired   — простой длился не меньше СВОЕГО порога тревоги (900 с), то есть
      #              парное ⚠️ действительно было отправлено. Провал на 13-100 с при
      #              перезагрузке интеграции до порога не доживает, ⚠️ по нему НЕ
      #              отправлялось — значит и ✅ по нему это чистый шум.
      #   umbrella — инцидент НЕ описан «зонтичным» сообщением само-лечения Tuya:
      #              grace-флаг включён сейчас, либо переключался < 15 мин назад,
      #              либо automation 1790200001001 срабатывала < 15 мин назад.
      #              Зонтичное сообщение уже печатает состояние крана и статус защиты.
      # КАК ОТЛИЧАЕТСЯ НАСТОЯЩИЙ ОДИНОЧНЫЙ ОТКАЗ: он восстанавливается БЕЗ
      # переподключения Tuya (grace не трогался, само-лечение не запускалось) и длится
      # дольше порога — оба условия истинны, ✅ приходит как раньше. Проверено на
      # реальном простое 18.08 15:06-16:48 (102 мин, без перезагрузки): ✅ сохраняется.
      # ⚠️-сообщения об отказе НЕ подавляются никогда — правило касается только ✅.
      # ДЕГРАДАЦИЯ: если хелпера/автоматизации нет или метка нечитаема — umbrella=false,
      # то есть сообщение УХОДИТ (никогда не терять факт восстановления).
      notify_ok: >-
        {% set down_sec = 900 %}
        {% set t = trigger if trigger is defined else none %}
        {% set fs = t.from_state if (t is not none and t.from_state is defined) else none %}
        {% set to = t.to_state if (t is not none and t.to_state is defined) else none %}
        {% set outage = (as_timestamp(to.last_changed, 0) - as_timestamp(fs.last_changed, 0))
             if (fs is not none and to is not none) else -1 %}
        {% set paired = (outage | float(-1)) >= down_sec %}
        {% set g = states['input_boolean.tuya_reconnect_grace'] %}
        {% set gl = (as_timestamp(g.last_changed, 0) | float(0)) if g is not none else 0 %}
        {% set g_age = (as_timestamp(now()) - gl) if gl > 0 else 999999 %}
        {% set sh = state_attr('automation.tuya_avto_lechenie_obryva_sessii_sign_invalid', 'last_triggered') %}
        {% set sh_age = (as_timestamp(now()) - as_timestamp(sh, 0)) if sh is not none else 999999 %}
        {% set umbrella = (g is not none and g.state == 'on')
             or (g_age | float(999999)) < 900
             or (sh_age | float(999999)) < 900 %}
        {{ paired and not umbrella }}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''down'' }}'
      - condition: state
        entity_id: input_boolean.ha_startup_grace
        state: 'off'
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: |-
            ⚠️ Сирена недоступна более 15 мин ({{ states('siren.alarm') | e }}).
            Звуковое оповещение при пожаре/взломе может НЕ сработать — проверьте устройство (питание/переподключение/WiFi).
            Затронуты: <code>siren.alarm</code>, <code>select.alarm_volume</code>, <code>number.alarm_time</code>.
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''up'' and states(''siren.alarm'') not in
          [''unavailable'', ''unknown''] }}'
      - condition: template
        alias: Отбой ✅ при уже описанном переподключении Tuya (P1 2026-08-19)
        value_template: "{{ notify_ok | default(false, true) | string | lower == 'true' }}"
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: |-
            ✅ Сирена снова доступна ({{ states('siren.alarm') | e }}). Звуковое оповещение восстановлено.
- id: '1789400001001'
  alias: "\U0001F525 Сторож котла — режим АВАРИЯ (только уведомление)"
  description: >-
    NOTIFICATION-ONLY сторож неисправности котла. Алерт ТОЛЬКО когда
    sensor.boiler_mode == 'Авария' (ecoNET mode 9) — единственный
    настоящий признак аварии. Специально НЕ следит за
    binary_sensor.boiler_alarm (curr.alarmOutput): тот срабатывает штатно
    летом в режиме Догорание, когда ГВС греет электро-ТЭН
    (ложные тревоги). Работает круглосуточно; дедуп через
    this.attributes.last_triggered (не чаще 1/час при флапах ecoNET WiFi);
    одно сообщение о восстановлении при выходе из Аварии. Потеря
    телеметрии (unknown/unavailable) НЕ вызывает алерт аварии.
    НИКАКИХ команд устройствам — только telegram_bot.send_message.
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.boiler_mode
    to: Авария
    for: 00:05:00
    id: alarm
  - trigger: state
    entity_id: sensor.boiler_mode
    from: Авария
    for: 00:02:00
    id: recover
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'alarm' }}"
      - condition: state
        entity_id: sensor.boiler_mode
        state: Авария
      - condition: state
        entity_id: input_boolean.ha_startup_grace
        state: 'off'
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none
             or (now() - this.attributes.last_triggered).total_seconds() > 3600 }}
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: >-
            🔥 Котёл: режим АВАРИЯ (ecoNET mode 9). Проверьте
            котёл. (ГВС {{ states('sensor.boiler_cwu_temperature') }}°, CO {{
            states('sensor.boiler_co_temperature') }}°)
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'recover' }}"
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['unavailable', 'unknown', 'Авария'] }}"
      - condition: template
        value_template: "{{ this.attributes.last_triggered is not none }}"
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: >-
            ✅ Котёл: режим АВАРИЯ снят (теперь {{
            states('sensor.boiler_mode') }}).
