  conditions: []
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.ha_startup_grace
  - delay: 00:15:00
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.ha_startup_grace
- id: '1789200001002'
