  conditions:
  - condition: template
    value_template: '{{ states(''sensor.nord_pool_lv_current_price'') not in [''unknown'',''unavailable'',''none'',''None'','''']
      }}'
  actions:
  - variables:
      threshold: 0.04
      price_now: '{{ states(''sensor.nord_pool_lv_current_price'') | float(999) }}'
      price_txt: '{{ states(''sensor.nord_pool_lv_current_price'') | float(999) |
        round(4) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ price_now <= threshold and is_state(''switch.kalarifer_socket_1'',''off'')  and
          is_state(''input_boolean.night_saver'',''off'')  and is_state(''input_boolean.rezhim_zhara'',''off'') }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.kalarifer_socket_1
      - delay: 00:00:10
      - wait_template: '{{ is_state(''switch.kalarifer_socket_1'', ''on'') }}'
        timeout: 00:00:20
        continue_on_timeout: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ not is_state(''switch.kalarifer_socket_1'', ''on'') }}'
          - condition: template
            value_template: '{{ (now().timestamp() - (state_attr(''input_datetime.tuya_cmd_fail_towel'',
              ''timestamp'') | float(0))) > 21600 }}'
          sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.tuya_cmd_fail_towel
            data:
              timestamp: '{{ now().timestamp() }}'
          - action: telegram_bot.send_message
            data:
              chat_id: 100000000
              parse_mode: html
              message: |-
                ⚠️ Полотенцесушитель: команда не подействовала
                Реле <code>switch.kalarifer_socket_1</code> не перешло в состояние "on" за 30 с.
                Сейчас в HA: {{ states('switch.kalarifer_socket_1') }}
                Связь с Tuya могла устареть — состояние в HA может не соответствовать реальному.
                Повтор этого сообщения — не чаще раза в 6 ч.
    - conditions:
      - condition: template
        value_template: '{{ price_now > threshold and is_state(''switch.kalarifer_socket_1'',''on'')
          }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.kalarifer_socket_1
      - delay: 00:00:10
      - wait_template: '{{ is_state(''switch.kalarifer_socket_1'', ''off'') }}'
        timeout: 00:00:20
        continue_on_timeout: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ not is_state(''switch.kalarifer_socket_1'', ''off'') }}'
          - condition: template
            value_template: '{{ (now().timestamp() - (state_attr(''input_datetime.tuya_cmd_fail_towel'',
              ''timestamp'') | float(0))) > 21600 }}'
          sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.tuya_cmd_fail_towel
            data:
              timestamp: '{{ now().timestamp() }}'
          - action: telegram_bot.send_message
            data:
              chat_id: 100000000
              parse_mode: html
              message: |-
                ⚠️ Полотенцесушитель: команда не подействовала
                Реле <code>switch.kalarifer_socket_1</code> не перешло в состояние "off" за 30 с.
                Сейчас в HA: {{ states('switch.kalarifer_socket_1') }}
                Связь с Tuya могла устареть — состояние в HA может не соответствовать реальному.
                Повтор этого сообщения — не чаще раза в 6 ч.
  mode: single
- id: '1784000001001'
  alias: "\U0001F319 Ночная экономия: расписание (22:00 ВКЛ, 05:00 ВЫКЛ)"
  description: Включает ночную экономию в 22:00 и выключает в 05:00.
  triggers:
  - trigger: time
    at: '22:00:00'
    id: 'on'
  - trigger: time
    at: 05:00:00
    id: 'off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.night_saver
    default:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.night_saver
  mode: single
- id: '1784000001002'
  alias: "\U0001F319 Ночная экономия: применить"
  description: Реагирует на input_boolean.night_saver. ВКЛ → выключает полотенцесушитель,
    тёплые полы (эко), аквариум, рециркуляцию (бойлер и EV не трогает). ВЫКЛ → восстанавливает
    по цене.
  triggers:
  - trigger: state
    entity_id: input_boolean.night_saver
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.night_saver
        state: 'on'
      sequence:
      - action: scene.create
        data:
          scene_id: before_night_saver
          snapshot_entities:
          - switch.akvarium_svet_socket_1
      - action: switch.turn_off
        target:
          entity_id:
          - switch.kalarifer_socket_1
          - switch.akvarium_svet_socket_1
      - action: climate.set_preset_mode
        target:
          entity_id:
          - climate.floor_heating
          - climate.floor_heating_2
        data:
          preset_mode: auto
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: "\U0001F319 Ночная экономия ВКЛ (до 05:00)\nВыключено: полотенцесушитель,
            тёплые полы (эко), аквариум, рециркуляция.\nРаботают по цене: бойлер и
            EV."
    - conditions:
      - condition: state
        entity_id: input_boolean.night_saver
        state: 'off'
      sequence:
      # scene.create делает СЕССИОННУЮ сцену: она живёт только в памяти и НЕ
      # попадает в scenes.yaml. Если HA перезапустится между 22:00 и 05:00,
      # scene.before_night_saver перестаёт существовать. Раньше здесь безусловно
      # вызывался scene.turn_on: при отсутствующей сцене это в лучшем случае
      # молча ничего не делало, а применение сцены к Tuya-розетке аквариума могло
      # поднять ApiRequestException (`sign invalid`) — не HomeAssistantError, и
      # continue_on_error его НЕ ловит, — что обрывало весь остаток скрипта, то
      # есть восстановление полотенцесушителя и тёплых полов по цене вообще не
      # выполнялось. Теперь наличие снимка проверяется явно, применение идёт
      # fire-and-forget (оборваться не может), а потеря снимка сообщается.
      - variables:
          snapshot_ok: '{{ states.scene.before_night_saver is not none }}'
      - if:
        - condition: template
          value_template: '{{ snapshot_ok }}'
        then:
        - action: script.turn_on
          target:
            entity_id: script.night_saver_restore_snapshot
      - variables:
          price_now: '{{ states(''sensor.nord_pool_lv_current_price'') | float(999)
            }}'
      - if:
        - condition: state
          entity_id: input_boolean.rezhim_zhara
          state: 'off'
        then:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ price_now <= 0.04 }}'
            sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.kalarifer_socket_1
            - action: climate.set_hvac_mode
              target:
                entity_id:
                - climate.floor_heating
                - climate.floor_heating_2
              data:
                hvac_mode: heat_cool
            - action: climate.set_preset_mode
              target:
                entity_id:
                - climate.floor_heating
                - climate.floor_heating_2
              data:
                preset_mode: manual
            - action: climate.set_temperature
              target:
                entity_id:
                - climate.floor_heating
                - climate.floor_heating_2
              data:
                temperature: 30
          default:
          - action: climate.set_preset_mode
            target:
              entity_id:
              - climate.floor_heating
              - climate.floor_heating_2
            data:
              preset_mode: auto
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: ☀️ Ночная экономия ВЫКЛ — устройства вернулись в обычный режим
            (по цене Nord Pool).
      - if:
        - condition: template
          value_template: '{{ not snapshot_ok }}'
        then:
        - action: telegram_bot.send_message
          data:
            chat_id: 100000000
            parse_mode: html
            message: |-
              🌙 Снимок «до ночной экономии» ПОТЕРЯН — HA перезапускался после 22:00.
              <code>scene.before_night_saver</code> не существует, поэтому <code>switch.akvarium_svet_socket_1</code> НЕ восстановлен автоматически — сейчас <code>{{ states('switch.akvarium_svet_socket_1') }}</code>.
              Полотенцесушитель и тёплые полы восстановлены по цене Nord Pool как обычно. Проверь аквариум вручную.
  mode: single
- id: '1785000001001'
  alias: "\U0001F4B6 Учёт стоимости (за день → месяц)"
  description: '23:58 ежедневно: прибавляет стоимость дня к месячному счётчику (kWh
    дня × средняя цена).'
  triggers:
  - trigger: time
    at: '23:58:00'
  conditions: []
  actions:
  - variables:
      avg: '{{ (states(''sensor.nord_pool_lv_lowest_price'')|float(0)+states(''sensor.nord_pool_lv_highest_price'')|float(0))/2
        }}'
      d_boiler: '{{ [states(''sensor.boiler_total_energy'')|float(0)-states(''input_number.midnight_boiler_energy'')|float(0),0]|max
        }}'
      d_kalarifer: '{{ [states(''sensor.terarium_total_energy'')|float(0)-states(''input_number.midnight_kalarifer_energy'')|float(0),0]|max
        }}'
      d_akv: '{{ [states(''sensor.akvarium_svet_total_energy'')|float(0)-states(''input_number.midnight_akv_energy'')|float(0),0]|max
        }}'
      d_chep: '{{ [states(''sensor.cherepakha_total_energy'')|float(0)-states(''input_number.midnight_chep_energy'')|float(0),0]|max
        }}'
      d_gidro: '{{ [states(''sensor.zigbee_plug_2_total_energy'')|float(0)-states(''input_number.midnight_gidro_energy'')|float(0),0]|max
        }}'
      d_ev: '{{ [states(''sensor.ev_charger_energy'')|float(0)-states(''input_number.midnight_ev_energy'')|float(0),0]|max
        }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_boiler
    data:
      value: '{{ (states(''input_number.cost_month_boiler'')|float(0) + (d_boiler|float(0))*(avg|float(0)))|round(2)
        }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_kalarifer
    data:
      value: '{{ (states(''input_number.cost_month_kalarifer'')|float(0) + (d_kalarifer|float(0))*(avg|float(0)))|round(2)
        }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_akv
    data:
      value: '{{ (states(''input_number.cost_month_akv'')|float(0) + (d_akv|float(0))*(avg|float(0)))|round(2)
        }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_chep
    data:
      value: '{{ (states(''input_number.cost_month_chep'')|float(0) + (d_chep|float(0))*(avg|float(0)))|round(2)
        }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_gidro
    data:
      value: '{{ (states(''input_number.cost_month_gidro'')|float(0) + (d_gidro|float(0))*(avg|float(0)))|round(2)
        }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_ev
    data:
      value: '{{ (states(''input_number.cost_month_ev'')|float(0) + (d_ev|float(0))*(avg|float(0)))|round(2)
        }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_total
    data:
      value: '{{ (states(''input_number.cost_month_total'')|float(0) + (d_boiler|float(0)+d_kalarifer|float(0)+d_akv|float(0)+d_chep|float(0)+d_gidro|float(0)+d_ev|float(0))*(avg|float(0)))|round(2)
        }}'
  mode: single
- id: '1785000001002'
  alias: "\U0001F4B6 Месячный отчёт расходов"
  description: '1-го числа 00:05: отправляет расходы за прошлый месяц в Telegram и
    обнуляет счётчики.'
  triggers:
  - trigger: time
    at: 00:05:00
  conditions:
  - condition: template
    value_template: '{{ now().day == 1 }}'
  actions:
  - action: telegram_bot.send_message
    data:
      chat_id: 100000000
      parse_mode: html
      message: |-
        💶 <b>Расходы за прошлый месяц</b>
        • Бойлер: {{ states('input_number.cost_month_boiler')|float(0)|round(2) | e }} €
        • Полотенцесушитель: {{ states('input_number.cost_month_kalarifer')|float(0)|round(2) | e }} €
        • Аквариум: {{ states('input_number.cost_month_akv')|float(0)|round(2) | e }} €
        • Черепаха: {{ states('input_number.cost_month_chep')|float(0)|round(2) | e }} €
        • Гидрофор: {{ states('input_number.cost_month_gidro')|float(0)|round(2) | e }} €
        • EV: {{ states('input_number.cost_month_ev')|float(0)|round(2) | e }} €
        ━━━━━━━
        💰 Итого: {{ states('input_number.cost_month_total')|float(0)|round(2) | e }} €
        {% if now().year == 2026 and now().month == 9 %}
        ⚠️ <b>ВНИМАНИЕ: данные за август 2026 неполные — итог занижен.</b>
        Счётчики энергии Tuya замерли 01.08 около 18:00 и не двигались до 16.08 08:17
        (около 14.6 суток). Они не показывали «недоступен», а держали правдоподобные
        константы, поэтому ежедневный расчёт 23:58 все эти дни прибавлял 0.00 €.
        Реально начислено только за 01.08 и за 16.08 и далее.
        16.08 счётчик гидрофора одним шагом добавил 14.70 кВт·ч, накопленных за время
        заморозки. Эта величина НЕ была разнесена по дням и НЕ включена в итог:
        разделить её на «сегодня» и «прошлые 15 дней» достоверно невозможно,
        поэтому выбрано занижение, а не выдуманное потребление.
        Итог выше — это НИЖНЯЯ ГРАНИЦА, а не полная стоимость августа.
        {% endif %}
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_boiler
    data:
      value: 0
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_kalarifer
    data:
      value: 0
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_akv
    data:
      value: 0
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_chep
    data:
      value: 0
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_gidro
    data:
      value: 0
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_ev
    data:
      value: 0
  - action: input_number.set_value
    target:
      entity_id: input_number.cost_month_total
    data:
      value: 0
  mode: single
- id: '1786000001001'
  alias: "\U0001F504 Гард сброса счётчика энергии"
  description: Если total_energy сенсор сбросился (стал меньше полночного снимка) —
    пере-базирует снимок на текущее значение, чтобы учёт за день не занижался.
  triggers:
  - trigger: state
    entity_id:
    - sensor.boiler_total_energy
    - sensor.terarium_total_energy
    - sensor.akvarium_svet_total_energy
    - sensor.cherepakha_total_energy
    - sensor.zigbee_plug_2_total_energy
    - sensor.ev_charger_energy
  conditions:
  - condition: template
    value_template: >-
      {% set m = {'sensor.boiler_total_energy':'input_number.midnight_boiler_energy',
      'sensor.terarium_total_energy':'input_number.midnight_kalarifer_energy',
      'sensor.akvarium_svet_total_energy':'input_number.midnight_akv_energy',
      'sensor.cherepakha_total_energy':'input_number.midnight_chep_energy',
      'sensor.zigbee_plug_2_total_energy':'input_number.midnight_gidro_energy',
      'sensor.ev_charger_energy':'input_number.midnight_ev_energy'} %}
      {% set cur = trigger.to_state.state | float(-1) %}
      {{ cur >= 0 and cur < states(m[trigger.entity_id]) | float(0) }}
  actions:
  - variables:
      m: >-
        {{ {'sensor.boiler_total_energy':'input_number.midnight_boiler_energy',
        'sensor.terarium_total_energy':'input_number.midnight_kalarifer_energy',
        'sensor.akvarium_svet_total_energy':'input_number.midnight_akv_energy',
        'sensor.cherepakha_total_energy':'input_number.midnight_chep_energy',
        'sensor.zigbee_plug_2_total_energy':'input_number.midnight_gidro_energy',
        'sensor.ev_charger_energy':'input_number.midnight_ev_energy'} }}
      snap: '{{ m[trigger.entity_id] }}'
      cur: '{{ trigger.to_state.state | float(0) }}'
  - action: input_number.set_value
    target:
      entity_id: '{{ snap }}'
    data:
      value: '{{ cur }}'
  - action: notify.send_message
    target:
      entity_id: notify.telegram_owner
    data:
      message: >-
        🔄 Счётчик энергии сброшен: {{ trigger.to_state.attributes.friendly_name }}
        ({{ cur }} kWh) — полночный снимок пере-базирован, учёт продолжится корректно.
  mode: queued
  max: 10
- id: '1786000001002'
  alias: "\U0001F321 Микроклимат: алерты (жара/влажность/воздух)"
  description: Разовые уведомления при пересечении порогов — жарко в комнате (>28°),
    высокая влажность (>70%), плохой воздух (PM2.5 >35). Только 08:00–23:00.
  triggers:
  - trigger: numeric_state
    id: temp_hot
    entity_id:
    - sensor.kukhnia_temperature
    - sensor.miaomiaoc_cn_blt_3_living_t1_temperature_p_2_1
    - sensor.lumi_cn_lumi_bedroom_th_v1_temperature_p_2_1
    above: 28
    for:
      minutes: 15
  - trigger: numeric_state
    id: hum_high
    entity_id:
    - sensor.kukhnia_humidity
    - sensor.miaomiaoc_cn_blt_3_living_t1_relative_humidity_p_2_2
    - sensor.lumi_cn_lumi_bedroom_th_v1_relative_humidity_p_2_2
    above: 70
    for:
      minutes: 15
  - trigger: numeric_state
    id: pm_high
    entity_id: sensor.zhimi_cn_purifier_mb3_pm2_5_density_p_3_6
    above: 35
    for:
      minutes: 10
  conditions:
  - condition: time
    after: '08:00:00'
    before: '23:00:00'
  actions:
  - variables:
      names: >-
        {{ {'sensor.kukhnia_temperature':'Кухня',
        'sensor.miaomiaoc_cn_blt_3_living_t1_temperature_p_2_1':'Гостиная',
        'sensor.lumi_cn_lumi_bedroom_th_v1_temperature_p_2_1':'Спальня',
        'sensor.kukhnia_humidity':'Кухня',
        'sensor.miaomiaoc_cn_blt_3_living_t1_relative_humidity_p_2_2':'Гостиная',
        'sensor.lumi_cn_lumi_bedroom_th_v1_relative_humidity_p_2_2':'Спальня'} }}
      room: '{{ names.get(trigger.entity_id, ''комната'') }}'
      val: '{{ trigger.to_state.state }}'
  - choose:
    - conditions:
      - condition: trigger
        id: temp_hot
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: '🌡 Жарко: {{ room }} {{ val }}° — стоит проветрить.'
    - conditions:
      - condition: trigger
        id: hum_high
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: '💧 Высокая влажность: {{ room }} {{ val }}% — проветри, риск конденсата/плесени.'
    - conditions:
      - condition: trigger
        id: pm_high
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: '😷 Воздух: PM2.5 {{ val }} µg/m³ — включи очиститель или проветри.'
  mode: queued
  max: 10
- id: '1789000001001'
  alias: "♨️ Рециркуляция ГВС по расписанию + присутствие"
  description: >-
    Насос рециркуляции работает только в окна пользования горячей водой
    (06:30-09:00 и 17:30-23:00) и только когда кто-то дома. В остальное время
    выключен: экономия ~15-20 кВт·ч/мес + бак ГВС меньше остывает (бойлер реже
    догревает). Ночную экономию не трогает — рециркуляция убрана из 1784000001002.
  initial_state: false
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: time_pattern
    minutes: /10
  - trigger: state
    entity_id: binary_sensor.prisutstvie_owner
  - trigger: state
    entity_id: input_boolean.night_saver
  conditions: []
  actions:
  - variables:
      h: '{{ now().hour + now().minute / 60 }}'
      want_on: >-
        {{ ((h >= 6.5 and h < 9) or (h >= 17.5 and h < 23))
           and is_state('binary_sensor.prisutstvie_owner','on')
           and is_state('input_boolean.night_saver','off') }}
  - choose:
