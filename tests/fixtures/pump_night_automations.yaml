- id: '1778700001005'
  alias: 📲 Telegram обработчик кнопок
  description: Все inline-кнопки включая подменю света
  triggers:
  - platform: event
    event_type: telegram_callback
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.chat_id | string == ''100000000'' }}'
  actions:
  - variables:
      callback_data: '{{ trigger.event.data.data }}'
      callback_id: '{{ trigger.event.data.id }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/security_arm'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: 🛡 Охрана включена
        continue_on_error: true
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.security_armed
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: '🛡 Охрана включена


            Датчики: дверь + движение

            Для снятия: /security_disarm или кнопка в панелях'
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/security_disarm'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: 🔓 Охрана снята
        continue_on_error: true
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.security_armed
      - action: siren.turn_off
        target:
          entity_id: siren.alarm
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: 🔓 Охрана снята. Сирена выключена.
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/siren_off'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: 🔕 Сирена выключена
        continue_on_error: true
      - action: siren.turn_off
        target:
          entity_id: siren.alarm
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/leak_confirm'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: 🚰 Закрываю кран…
        continue_on_error: true
      - action: switch.turn_off
        target:
          entity_id: switch.voda_kran_switch_1
      - action: switch.turn_off
        target:
          entity_id: switch.zigbee_plug_2_socket_1
      - action: select.select_option
        target:
          entity_id: select.alarm_volume
        data:
          option: high
      - action: number.set_value
        target:
          entity_id: number.alarm_time
        data:
          value: 120
      - action: siren.turn_on
        target:
          entity_id: siren.alarm
      - alias: Подтверждение закрытия крана — вне очереди обработчика
        action: script.turn_on
        target:
          entity_id: script.leak_valve_verify
    - conditions:
      - condition: template
        value_template: '{{ callback_data == ''/moisture_false_alarm'' }}'
      sequence:
      - action: telegram_bot.answer_callback_query
        data:
          callback_query_id: '{{ callback_id }}'
          message: 🚫 Ложная тревога — кран не закрываю
        continue_on_error: true
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.tuya_reconnect_grace
      - action: script.turn_on
        target:
          entity_id: script.tuya_grace_release
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: '🚫 Ложная тревога подтверждена.

