      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: >-
            🔥 Ручная выдержка продлена до {{ plus_ts | timestamp_custom('%H:%M', true) }}
            — автоматика не тронет тёплые полы до этого времени.
    default:
    - action: telegram_bot.send_message
      data:
        chat_id: 100000000
        message: '❓ Неизвестная команда: {{ callback_data }}'
  - alias: Погасить спиннер (косметика; протухший query id не должен обрывать обработчик)
    action: telegram_bot.answer_callback_query
    continue_on_error: true
    data:
      callback_query_id: '{{ callback_id }}'
      message: OK
      show_alert: false
  mode: queued
  max: 10
- id: '1778700001006'
  alias: "\U0001F9EA Telegram: /noop_test (тест, без действий)"
  description: >-
    Безопасная тестовая кнопка. Только подтверждает callback (гасит «часики» в
    Telegram) и опционально шлёт одно сообщение. НИКАКИХ действий с
    устройствами (вода/сирена/охрана/хелперы не трогаются). Троттлинг через
    last_triggered, чтобы частые нажатия не спамили чат.
  triggers:
  - platform: event
    event_type: telegram_callback
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.chat_id | string == ''100000000'' }}'
  - condition: template
    value_template: '{{ trigger.event.data.data == ''/noop_test'' }}'
  actions:
  - variables:
      callback_id: '{{ trigger.event.data.id }}'
      cooldown_s: 10
      send_ok: >-
        {{ this.attributes.last_triggered is none
           or (now() - this.attributes.last_triggered).total_seconds()
              >= cooldown_s }}
  # Always clear the Telegram spinner first — even when throttled — so a
  # rapidly-tapped button never hangs. No device services are ever called.
  - action: telegram_bot.answer_callback_query
    data:
      callback_query_id: '{{ callback_id }}'
      message: "✅ Тест OK"
      show_alert: false
  # Throttled confirmation: only one message per cooldown_s window.
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ send_ok }}'
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: "✅ Тестовая кнопка работает. Действия с домом не выполнялись."
  mode: single
- id: '1778700001001'
  alias: ☀️ Утренний брифинг
  description: >-
    Ежедневный утренний брифинг в 07:00 через Telegram. С 2026-08 включает
    секцию «За ночь»: дайджест «Изменения в доме» (1790300001003) молчит с
    23:00 до 07:00, и всё, что переключилось в тихие часы, перечисляется здесь
    по last_changed каждой сущности. Аварийные уведомления в тихие часы не
    подавляются и сюда не дублируются.
  triggers:
  - platform: time
    at: 07:00:00
  conditions: []
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.telegram_owner
    data:
      message: |-
        {% set current_price = states('sensor.nord_pool_lv_current_price') | float(0) %}
        {% set lowest_price  = states('sensor.nord_pool_lv_lowest_price')  | float(0) %}
        {% set highest_price = states('sensor.nord_pool_lv_highest_price') | float(0) %}
        {% set lowest_start  = state_attr('sensor.nord_pool_lv_lowest_price',  'start') %}
        {% set highest_start = state_attr('sensor.nord_pool_lv_highest_price', 'start') %}
        {% set lowest_hour   = (as_datetime(lowest_start)  | as_local).strftime('%H') if lowest_start  else '??' %}
        {% set highest_hour  = (as_datetime(highest_start) | as_local).strftime('%H') if highest_start else '??' %}
        {% set outdoor_temp  = states('sensor.smart_weather_station_temperature') | float(none) %}
        {% set weather_temp  = state_attr('weather.forecast_home', 'temperature') %}
        {% set weather_state = states('weather.forecast_home') %}
        {% set boiler        = states('switch.smart_plug_2_socket_1') %}
        {% set ev            = states('switch.ev_charger_switch') %}
        {% set floor1_preset = state_attr('climate.floor_heating',   'preset_mode') %}
        {% set floor2_preset = state_attr('climate.floor_heating_2', 'preset_mode') %}
        {% if current_price <= 0.04 %}{% set price_emoji = '🟢' %}
        {% elif current_price <= 0.10 %}{% set price_emoji = '🟡' %}
        {% elif current_price <= 0.20 %}{% set price_emoji = '🟠' %}
        {% else %}{% set price_emoji = '🔴' %}{% endif %}
        {% set weather_map = {
          'clear-night': 'ясно (ночь)', 'cloudy': 'облачно', 'fog': 'туман',
          'hail': 'град', 'lightning': 'гроза', 'lightning-rainy': 'гроза с дождём',
          'partlycloudy': 'переменная облачность', 'pouring': 'ливень',
          'rainy': 'дождь', 'snowy': 'снег', 'snowy-rainy': 'мокрый снег',
          'sunny': 'солнечно', 'windy': 'ветрено', 'windy-variant': 'ветрено с облаками'
        } %}
        {% set weather_ru = weather_map.get(weather_state, weather_state) %}
        {% set now_hour         = now().hour %}
        {% set lowest_hour_int  = lowest_hour  | int(99) %}
        {% set highest_hour_int = highest_hour | int(0)  %}
        ☀️ Доброе утро! {{ now().strftime('%d.%m.%Y') }}

        ⚡ Электричество сегодня:
          Сейчас: {{ '%.4f' | format(current_price) }} EUR/kWh {{ price_emoji }}
          Дешевле всего: {{ lowest_hour }}:00 = {{ '%.4f' | format(lowest_price) }} EUR/kWh
          Дороже всего:  {{ highest_hour }}:00 = {{ '%.4f' | format(highest_price) }} EUR/kWh

        {% if outdoor_temp is not none %}🌤 Погода: {{ '%+.0f' | format(outdoor_temp) }}°C, {{ weather_ru }}
        {% elif weather_temp is not none %}🌤 Погода: {{ '%+.0f' | format(weather_temp) }}°C, {{ weather_ru }}
        {% else %}🌤 Погода: {{ weather_ru }}{% endif %}

        🏠 Устройства:
          Бойлер: {{ 'вкл' if boiler == 'on' else 'выкл' }}
          Тёплый пол ванная: {{ floor1_preset or states('climate.floor_heating') }}
          Тёплый пол душевая: {{ floor2_preset or states('climate.floor_heating_2') }}
        {% if ev == 'on' %}  EV: вкл{% endif %}

        💡 Совет:
        {% if lowest_hour_int > now_hour %}  Дешевле всего сегодня в {{ lowest_hour }}:00 — планируй нагрузки тогда
        {% elif current_price <= 0.04 and boiler == 'off' %}  Цена низкая — стоит включить бойлер
        {% elif 17 <= highest_hour_int <= 22 %}  Вечером дорого в {{ highest_hour }}:00 — не запускай тяжёлые нагрузки
        {% else %}  Средняя цена дня: {{ '%.4f' | format((lowest_price + highest_price) / 2) }} EUR/kWh
        {% endif %}
        {% set nw = [
          ('switch.smart_plug_2_socket_1', 'Бойлер'),
          ('switch.kalarifer_socket_1', 'Полотенцесушитель'),
          ('switch.akvarium_svet_socket_1', 'Аквариум'),
          ('switch.retserkuliatsiia_goriachai_vody_socket_1', 'Рециркуляция ГВС'),
          ('switch.zigbee_plug_2_socket_1', 'Гидрофор'),
          ('climate.floor_heating', 'Тёплый пол ванная'),
          ('climate.floor_heating_2', 'Тёплый пол душевая')] -%}
        {%- set n_end = today_at('07:00') -%}
        {%- set n_start = n_end - timedelta(hours=8) -%}
        {%- set nn = namespace(v=[], blind=[]) -%}
        {%- for eid, nm in nw -%}
          {%- set st = states[eid] -%}
          {%- if st is none or st.state in ['unavailable', 'unknown'] -%}
            {%- set nn.blind = nn.blind + [nm] -%}
          {%- else -%}
            {%- set lc = st.last_changed -%}
            {%- if lc >= n_start and lc <= n_end -%}
              {%- if eid[:8] == 'climate.' -%}
                {%- set val = st.attributes.preset_mode | default(st.state) -%}
              {%- else -%}
                {%- set val = 'ВКЛ' if st.state == 'on' else 'ВЫКЛ' -%}
              {%- endif -%}
              {%- set nn.v = nn.v + ['  ' ~ nm ~ ': ' ~ val ~ ' в ' ~ (lc | as_local).strftime('%H:%M')] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        🌙 За ночь (23:00–07:00):
        {% if nn.v -%}
        {{ nn.v | join('\n') }}
          (время по last_changed — перезапуск HA его сбрасывает)
        {%- else -%}
          ничего из отслеживаемого не переключалось
        {%- endif %}
        {%- if nn.blind %}
          нет данных: {{ nn.blind | join(', ') }}
        {%- endif %}
  mode: single
- id: '1778700001002'
  alias: "\U0001F55B Снимок энергии (полночь)"
  description: Сохраняет текущие показания счётчиков в полночь
  triggers:
  - platform: time
    at: 00:01:00
  conditions: []
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.midnight_boiler_energy
    data:
      value: '{{ states(''sensor.boiler_total_energy'') | float(states(''input_number.midnight_boiler_energy'') | float(0)) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.midnight_kalarifer_energy
    data:
      value: '{{ states(''sensor.terarium_total_energy'') | float(states(''input_number.midnight_kalarifer_energy'') | float(0)) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.midnight_akv_energy
    data:
      value: '{{ states(''sensor.akvarium_svet_total_energy'') | float(states(''input_number.midnight_akv_energy'') | float(0)) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.midnight_chep_energy
    data:
      value: '{{ states(''sensor.cherepakha_total_energy'') | float(states(''input_number.midnight_chep_energy'') | float(0)) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.midnight_gidro_energy
    data:
      value: '{{ states(''sensor.zigbee_plug_2_total_energy'') | float(states(''input_number.midnight_gidro_energy'') | float(0)) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.midnight_ev_energy
    data:
      value: '{{ states(''sensor.ev_charger_energy'') | float(states(''input_number.midnight_ev_energy'') | float(0)) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.midnight_tv_energy
    data:
      value: '{{ states(''sensor.75_qled_energy'') | float(states(''input_number.midnight_tv_energy'') | float(0)) }}'
  mode: single
- id: '1778700001003'
  alias: "\U0001F4CA Ежедневный отчёт потребления"
  description: '2026-08-27: строка гидрофора показывает не только kWh, но и минуты
    работы насоса, и сравнивает их со средним за неделю. Если возраст базы отсчёта
    (атрибут baseline_age_h у sensor.pump_minutes_today) больше 26 ч, значит полуночный
    снимок не прошёл — розетка была офлайн — и число покрывает больше суток: тогда оно
    НЕ называется суточным и НЕ сравнивается со средним, потому что сравнивать интервалы
    разной длины значит вводить в заблуждение. Отправляет ежедневный отчёт потребления электроэнергии в 23:00.
    2026-08-16: ветка «нет данных» больше не врёт про причину — различает
    «снимок не сделан» / «счётчики зависли» / «расхода действительно не было».
    ТВ 75" (sensor.75_qled_energy мёртв с 2026-08-10) не подмешивает фальшивый 0
    в сумму: учитывается, только если показание числовое и > 0.'
  triggers:
  - platform: time
    at: '23:00:00'
  conditions: []
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.telegram_owner
    data:
      message: |-
        {%- set date_str = now().strftime('%d.%m.%Y') -%}
        {%- set boiler_kwh = [states('sensor.boiler_total_energy') | float(0) - states('input_number.midnight_boiler_energy') | float(0), 0] | max -%}
        {%- set towel_kwh  = [states('sensor.terarium_total_energy') | float(0) - states('input_number.midnight_kalarifer_energy') | float(0), 0] | max -%}
        {%- set akv_kwh    = [states('sensor.akvarium_svet_total_energy') | float(0) - states('input_number.midnight_akv_energy') | float(0), 0] | max -%}
        {%- set chep_kwh   = [states('sensor.cherepakha_total_energy') | float(0) - states('input_number.midnight_chep_energy') | float(0), 0] | max -%}
        {%- set gidro_kwh  = [states('sensor.zigbee_plug_2_total_energy') | float(0) - states('input_number.midnight_gidro_energy') | float(0), 0] | max -%}
        {%- set ev_kwh     = [states('sensor.ev_charger_energy') | float(0) - states('input_number.midnight_ev_energy') | float(0), 0] | max -%}
        {#- ТВ 75": счётчик sensor.75_qled_energy мёртв с 2026-08-10. Ноль от мёртвого
            счётчика в сумму не идёт — берём его, только если показание числовое И > 0. -#}
        {%- set tv_cur  = states('sensor.75_qled_energy') | float(none) -%}
        {%- set tv_live = tv_cur is not none and tv_cur > 0 -%}
        {%- set tv_kwh  = ([tv_cur - states('input_number.midnight_tv_energy') | float(0), 0] | max) if tv_live else 0 -%}
        {%- set total_kwh = boiler_kwh + towel_kwh + akv_kwh + chep_kwh + gidro_kwh + ev_kwh + tv_kwh -%}
        {%- set avg_price = (states('sensor.nord_pool_lv_lowest_price') | float(0) + states('sensor.nord_pool_lv_highest_price') | float(0)) / 2 -%}
        {%- set total_eur = total_kwh * avg_price -%}
        {#- Диагностика пустых суток: снимок не сделан / счётчики зависли / расхода не было. -#}
        {%- set snap_lt = state_attr('automation.snimok_energii_polnoch', 'last_triggered') -%}
        {%- set snap_ok = snap_lt is not none and (now() - snap_lt).total_seconds() < 86400 -%}
        {#- 2026-08-19: добавлен ЧЕТВЁРТЫЙ случай. Счётчик в unavailable даёт
            float(0) -> дельта 0 -> итог 0, и отчёт печатал «потребления не было»,
            хотя это было «нечем считать». Теперь недоступные счётчики считаются
            отдельно (c.bad) и НИКОГДА не превращаются в утверждение о нулевом
            расходе. c.fresh сохраняет прежний смысл: читается И моложе 6 ч. -#}
        {%- set c = namespace(fresh=0, bad=[]) -%}
        {%- for e, nm in [('sensor.boiler_total_energy', 'Бойлер'),
                          ('sensor.terarium_total_energy', 'Полотенцесушитель'),
                          ('sensor.akvarium_svet_total_energy', 'Аквариум'),
                          ('sensor.cherepakha_total_energy', 'Черепаха'),
                          ('sensor.zigbee_plug_2_total_energy', 'Гидрофор'),
                          ('sensor.ev_charger_energy', 'EV зарядка')] -%}
          {%- set s = states[e] -%}
          {%- if s is none or s.state in ['unknown', 'unavailable'] -%}
            {%- set c.bad = c.bad + [nm] -%}
          {%- elif (now() - s.last_updated).total_seconds() < 21600 -%}
            {%- set c.fresh = c.fresh + 1 -%}
          {%- endif -%}
        {%- endfor -%}
        📊 Потребление за {{ date_str }}
        {%- if total_kwh < 0.1 %}
        {%- if not snap_ok %}

        Нет данных: снимок не был сделан — автоматизация «Снимок энергии (полночь)» не срабатывала более 24 часов.
        {%- elif c.bad | count == 6 %}

        Счётчики недоступны — расход за сутки посчитать нельзя. Ни один из 6 счётчиков энергии сейчас не читается (unavailable/unknown), связь с Tuya потеряна. Это НЕ значит, что потребления не было.
        {%- elif c.fresh == 0 %}

        Счётчики не обновляются — связь с Tuya потеряна. Полуночный снимок прошёл, но ни один счётчик энергии не менялся более 6 часов, поэтому расход за сутки посчитать нельзя.
        {%- elif c.bad %}

        Счётчики недоступны — расход за сутки посчитать нельзя. Сейчас не читаются {{ c.bad | count }} из 6: {{ c.bad | join(', ') }}. Остальные за сутки не изменились, поэтому нулевой итог недостоверен.
        {%- else %}

        За сутки потребления не было.
        {%- endif %}
        {%- else %}
        {%- if boiler_kwh > 0.1 %}
        • Бойлер: {{ boiler_kwh | round(1) }} kWh — ~{{ (boiler_kwh * avg_price) | round(2) }} EUR{%- endif %}
        {%- if towel_kwh > 0.1 %}
        • Полотенцесушитель: {{ towel_kwh | round(1) }} kWh — ~{{ (towel_kwh * avg_price) | round(2) }} EUR{%- endif %}
        {%- if akv_kwh > 0.1 %}
        • Аквариум: {{ akv_kwh | round(1) }} kWh — ~{{ (akv_kwh * avg_price) | round(2) }} EUR{%- endif %}
        {%- if chep_kwh > 0.1 %}
        • Черепаха: {{ chep_kwh | round(1) }} kWh — ~{{ (chep_kwh * avg_price) | round(2) }} EUR{%- endif %}
        {%- if gidro_kwh > 0.1 %}
        • Гидрофор: {{ gidro_kwh | round(1) }} kWh (насос ~{{ (gidro_kwh / 0.992 * 60) | round(0) }} мин{% set b_age = state_attr('sensor.pump_minutes_today', 'baseline_age_h') | float(-1) %}{% if b_age > 26 %} за {{ b_age | round(0) }} ч — полуночный снимок не прошёл, розетка была офлайн{% else %}{% set a7 = states('input_number.gidro_minutes_avg7') | float(-1) %}{% if a7 >= 0 %}, обычно ~{{ a7 | round(0) }} мин{% endif %}{% endif %}) — ~{{ (gidro_kwh * avg_price) | round(2) }} EUR{%- endif %}
        {%- set nm = states('sensor.pump_minutes_night') | float(-1) %}
        {%- if nm >= 0 %}
        • Насос прошлой ночью (01:00–04:00): {{ nm | round(1) }} мин — норма меньше 1 мин{%- endif %}
        {%- if ev_kwh > 0.1 %}
        • EV зарядка: {{ ev_kwh | round(1) }} kWh — ~{{ (ev_kwh * avg_price) | round(2) }} EUR{%- endif %}
        {%- if tv_live and tv_kwh > 0.1 %}
        • ТВ 75": {{ tv_kwh | round(1) }} kWh — ~{{ (tv_kwh * avg_price) | round(2) }} EUR{%- endif %}
        {%- if not tv_live %}
        • ТВ 75": счётчик недоступен — в сумму не вошёл{%- endif %}
        {%- if c.bad %}
        • Счётчики недоступны ({{ c.bad | join(', ') }}) — в сумму не вошли, итог занижен{%- endif %}
        {%- if c.fresh == 0 %}
        • Счётчики не обновляются более 6 часов — сумма ниже может быть занижена{%- endif %}

        ⚡ Итого: ~{{ total_kwh | round(1) }} kWh | ~{{ total_eur | round(2) }} EUR
        📈 Ср. цена Nord Pool: {{ avg_price | round(4) }} EUR/kWh
        💶 За месяц (с учётом сегодня): ~{{ (states('input_number.cost_month_total') | float(0) + total_eur) | round(2) }} EUR
        {%- endif %}
  mode: single
- id: '1778800001001'
  alias: "\U0001F697 EV зарядка — планировщик"
  description: 'Автоматическое расписание зарядки: раз за разом выбирает САМОЕ ДЕШЁВОЕ
    2ч окно на ближайшие 24 ч (ночь или день — что реально дешевле) и пишет его в
    input_datetime.ev_charge_start. Владельцу планировать ничего не нужно.

    Запускает shell_command.ev_auto2h (/config/ev_auto2h.py). ПОЧЕМУ НЕ ev_best2h.py:
    тот файл закреплён тестом tests/test_ev_notify_surgical.py на изменения только
    в уведомлениях, а искать он умеет по ВСЕМУ загруженному горизонту (сегодня +
    завтра, до ~34 ч вперёд) — плановое время могло уехать за завтра и оставить
    разрыв до ~37 ч вообще без зарядки. Ограничение «окно начинается не позже
    now+24ч» живёт в новом файле, ev_best2h.py не изменён и остаётся доступен
    вручную через shell_command.ev_find_best2h.

    Триггеры: обновление цен Nord Pool (08-22), старт HA, 14:05, публикация цен на
    завтра, и часовая страховка, которая срабатывает ТОЛЬКО если план прокис
    (время в прошлом или дальше 24 ч) — без неё сутки простоя HA оставляли дом без
    зарядки до следующего обновления цен.'
  triggers:
  - trigger: state
    entity_id: sensor.nord_pool_lv_lowest_price
    id: price_update
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: time
    at: '14:05:00'
    id: daily_14h
  - alias: Публикация цен на завтра (~13-14:00) — пересчитать план сразу, а не ждать
      следующего обновления Nord Pool
    trigger: state
    entity_id: binary_sensor.nord_pool_lv_tomorrow_price_available
    to: 'on'
    id: tomorrow_published
  - alias: Часовая страховка от прокисшего плана (см. условие ниже). Гарантия «зарядка
      планируется каждый день» держится на ней
    trigger: time_pattern
    minutes: '7'
    id: periodic
  conditions:
  - condition: template
    alias: НЕ перебивать явно запрошенную ночную зарядку (для ВСЕХ триггеров, включая
      ha_start и 14:05)
    value_template: >-
      {% set req = states('input_boolean.ev_night_requested') %} {% set ws =
      state_attr('input_datetime.ev_night_window_start', 'timestamp') | float(0) %} {{
      not (req == 'on' and ws > 0 and now().timestamp() < (ws + 10800)) }}
  - condition: template
    value_template: '{{ trigger.id != ''price_update'' or (8 <= now().hour < 22) }}'
    alias: price_update только с 08 до 22 (не перебивать ночное расписание)
  - condition: template
    alias: Часовая страховка работает ТОЛЬКО по прокисшему плану — иначе она перебивала
      бы свежий план каждый час, в том числе через 7 минут после начала зарядки (тогда
      цепочка проверок +6/+10/+12 мин читала бы уже другое окно)
    value_template: >-
      {% set cs = state_attr('input_datetime.ev_charge_start', 'timestamp') | float(0)
      %} {{ trigger.id != 'periodic' or cs <= 0 or cs < (now().timestamp() - 1800) or cs
      > (now().timestamp() + 86400) }}
  actions:
  - if:
    - condition: trigger
      id: ha_start
    then:
    - delay: 00:01:00
  - action: shell_command.ev_auto2h
  mode: single
- id: '1778800001002'
  alias: 🚗 EV зарядка — автозарядка 2ч
  description: 'По расписанию: включает EV на 2ч. Выключает бойлер на время зарядки. После зарядки:
    включает бойлер если цена ≤ 0.10 EUR/kWh.'
  triggers:
  - trigger: time
    at: input_datetime.ev_charge_start
  conditions:
  - condition: template
    value_template: '{{ not is_state(''input_boolean.ev_manual_mode'', ''on'') }}'
  - condition: template
    value_template: '{{ states(''switch.ev_charger_switch'') not in [''unavailable'', ''unknown'']
      }}'
  actions:
  - alias: Разовая отмена — пропустить ИМЕННО это окно и погасить отмену. Стоит первым
      шагом намеренно — так отмена гасится ровно один раз, без гонки с отдельной
      автоматизацией, и ни одна команда устройству не выдаётся
    if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ev_charge_cancelled'', ''on'') }}'
    then:
    - alias: Запомнить, КАКОЕ окно было пропущено — сторож 1790100001001 по этой метке
        молчит про это окно
      action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.ev_cancel_consumed
      data:
        timestamp: '{{ state_attr(''input_datetime.ev_charge_start'', ''timestamp'') | float(now().timestamp())
          }}'
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_charge_cancelled
    - action: telegram_bot.send_message
      data:
        chat_id: 100000000
        parse_mode: html
        message: '⛔ EV: эта зарядка пропущена — ты нажал «Отменить зарядку».


          Окно {{ states(''input_datetime.ev_charge_start'') | e }} (2 ч) пропущено, зарядка
          не включалась.


          Разовая отмена снята: следующая зарядка пройдёт по автоматическому расписанию
          как обычно. Нужна зарядка раньше — «Зарядить ночью» / «Зарядить днём».


          Плановое время <code>input_datetime.ev_charge_start</code>: {{ states(''input_datetime.ev_charge_start'')
          | e }}'
    - stop: Зарядка пропущена по разовой отмене владельца
  - variables:
      price_now: '{{ states(''sensor.nord_pool_lv_current_price'') | float(0) }}'
      ev_energy_before: '{{ states(''sensor.ev_charger_energy'') | float(-1) }}'
  - action: switch.turn_on
    target:
      entity_id: switch.ev_charger_switch
  - action: switch.turn_off
    target:
      entity_id: switch.smart_plug_2_socket_1
    alias: Бойлер OFF на время зарядки EV
  - alias: Проверка 2 — зарядка реально началась (облако Tuya, лаг до 5 мин)
    wait_template: '{{ is_state(''sensor.ev_charger_status'', ''charger_charging'') }}'
    timeout: 00:06:00
    continue_on_timeout: true
  - variables:
      ev_charging_ok: '{{ is_state(''sensor.ev_charger_status'', ''charger_charging'') }}'
  - choose:
    - alias: Зарядка подтверждена — обычное уведомление
      conditions:
      - condition: template
        value_template: '{{ ev_charging_ok }}'
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: '🚗⚡ EV зарядка началась!

            ⚡ Цена: {{ ''%.4f'' | format(price_now) }} EUR/kWh

            ⏱ Стоп в {{ (now() + timedelta(hours=2)).strftime(''%H:%M'') }}

            📅 Зарядка до {{ (now() + timedelta(hours=2)).strftime(''%d.%m %H:%M'') }}'
          inline_keyboard:
          - - - ⛔ EV СТОП
              - /ev_stop
          parse_mode: html
    - alias: Зарядка не началась — настоящая причина из sensor.ev_charger_status
      conditions:
      - condition: template
        value_template: '{{ not ev_charging_ok }}'
      - condition: template
        value_template: '{{ (now().timestamp() - (state_attr(''input_datetime.tuya_cmd_fail_ev'',
          ''timestamp'') | float(0))) > 21600 }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.tuya_cmd_fail_ev
        data:
          timestamp: '{{ now().timestamp() }}'
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: '{%- set s = states(''sensor.ev_charger_status'') -%}{%- set causes = {''charger_free'':
            ''машина не подключена'', ''charger_insert'': ''машина подключена, но зарядка не началась'',
            ''charger_pause'': ''зарядка на паузе'', ''charger_end'': ''зарядка уже завершена''}
            -%}{%- set cause = causes.get(s, ''нет связи с зарядкой (Tuya)'' if s in [''unavailable'',
            ''unknown'', ''none'', ''None'', '''', ''cloud_error''] else ''статус '' ~ (s | e)) -%}⚠️
            EV: зарядка не началась — {{ cause }}


            Статус <code>sensor.ev_charger_status</code>: {{ s | e }} (ожидался <code>charger_charging</code>),
            проверка 6 мин.


            Реле <code>switch.ev_charger_switch</code> на этой зарядке читается <code>off</code>
            даже во время зарядки, поэтому по нему успех не определяется.


            Повтор этого сообщения — не чаще раза в 6 ч.'
  - delay: 02:00:00
  - variables:
      price_after: '{{ states(''sensor.nord_pool_lv_current_price'') | float(0) }}'
  - alias: Стоп по окончании окна — реле не показатель, выключаем безусловно (идемпотентно)
    action: switch.turn_off
    target:
      entity_id: switch.ev_charger_switch
  - alias: Проверка — зарядка реально прекратилась (облако Tuya, лаг до 5 мин)
    wait_template: '{{ not is_state(''sensor.ev_charger_status'', ''charger_charging'') }}'
    timeout: 00:06:00
    continue_on_timeout: true
  - alias: Восстановить бойлер если цена дешёвая
    choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.nord_pool_lv_current_price
        below: 0.1
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.smart_plug_2_socket_1
        alias: Бойлер ON — цена дешёвая
  - variables:
      ev_charged: '{{ ev_charging_ok or ((ev_energy_before | float(-1)) >= 0 and (states(''sensor.ev_charger_energy'')
        | float(-1)) > (ev_energy_before | float(-1))) or ((state_attr(''sensor.ev_charger_energy'',
        ''session_kwh'') | float(0)) > 0) }}'
  - choose:
    - alias: Зарядка была и остановлена — обычное уведомление
      conditions:
      - condition: template
        value_template: '{{ ev_charged and not is_state(''sensor.ev_charger_status'', ''charger_charging'')
          }}'
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: '🚗 EV зарядка завершена (2ч) ✅

            💰 Цена: {{ ''%.4f'' | format(price_after) }} EUR/kWh

            📅 Следующий сеанс: {{ (as_datetime(states(''input_datetime.ev_charge_start'')) | as_local).strftime(''%d.%m
            %H:%M'') }}'
    - alias: СТОП не подействовал
      conditions:
      - condition: template
        value_template: '{{ is_state(''sensor.ev_charger_status'', ''charger_charging'') }}'
      - condition: template
        value_template: '{{ (now().timestamp() - (state_attr(''input_datetime.tuya_cmd_fail_ev'',
          ''timestamp'') | float(0))) > 21600 }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.tuya_cmd_fail_ev
        data:
          timestamp: '{{ now().timestamp() }}'
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: '⚠️ EV: зарядка не остановлена


            После команды СТОП статус <code>sensor.ev_charger_status</code> = {{ states(''sensor.ev_charger_status'')
            | e }} (ожидался любой, кроме <code>charger_charging</code>; проверка 6 мин).


            Зарядка продолжается. Реле <code>switch.ev_charger_switch</code> здесь не показатель
            — оно читается <code>off</code> и во время зарядки.


            Повтор этого сообщения — не чаще раза в 6 ч.'
    - alias: Окно закончилось, зарядки так и не было
      conditions:
      - condition: template
        value_template: '{{ not ev_charged }}'
      - condition: template
        value_template: '{{ (now().timestamp() - (state_attr(''input_datetime.tuya_cmd_fail_ev'',
          ''timestamp'') | float(0))) > 21600 }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.tuya_cmd_fail_ev
        data:
          timestamp: '{{ now().timestamp() }}'
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: '{%- set s = states(''sensor.ev_charger_status'') -%}{%- set causes = {''charger_free'':
            ''машина не подключена'', ''charger_insert'': ''машина подключена, но зарядка не началась'',
            ''charger_pause'': ''зарядка на паузе'', ''charger_end'': ''зарядка уже завершена''}
            -%}{%- set cause = causes.get(s, ''нет связи с зарядкой (Tuya)'' if s in [''unavailable'',
            ''unknown'', ''none'', ''None'', '''', ''cloud_error''] else ''статус '' ~ (s | e)) -%}⚠️
            EV: 2-часовое окно закончилось, зарядка так и не началась — {{ cause }}


            Статус <code>sensor.ev_charger_status</code>: {{ s | e }}


            Счётчик <code>sensor.ev_charger_energy</code>: {{ states(''sensor.ev_charger_energy'')
            | e }} кВт·ч (в начале окна было {{ ev_energy_before | e }})


            Уведомление о завершении не отправлено — завершать было нечего.


            Повтор этого сообщения — не чаще раза в 6 ч.'
  mode: single
- id: '1778900001001'
  alias: Котёл — откл. ГВС при работе бойлера
  description: Когда электробойлер включён — снизить уставку ГВС котла до 40°C; при
    отключении — вернуть 55°C. Уведомление не чаще 1 раза в 4ч на каждое направление.
  triggers:
  - platform: state
    entity_id: switch.smart_plug_2_socket_1
    to: 'on'
    id: plug_on
  - platform: state
    entity_id: switch.smart_plug_2_socket_1
    to: 'off'
    id: plug_off
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.boiler_mode'') not in [''Выключен'', ''unavailable'',
      ''unknown''] }}'
  - condition: time
    after: 07:00:00
    before: '22:00:00'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: plug_on
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.turbo_hot_water
          state: 'off'
        then:
        - action: rest_command.disable_boiler_cwu
          data: {}
        - if:
          - condition: template
            value_template: '{{ (now() - as_local(as_datetime(states(''input_datetime.gvs_last_notify_on'')
              if states(''input_datetime.gvs_last_notify_on'') not in [''unknown'',''unavailable'']
              else ''1970-01-01 00:00:00''))).total_seconds() > 14400 }}'
          then:
          - action: notify.send_message
            target:
              entity_id: notify.telegram_owner
            data:
              message: "\U0001F525 Электробойлер включён — котёл приостановил нагрев
                ГВС (уставка ↘ 40°C)"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.gvs_last_notify_on
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    - conditions:
      - condition: trigger
        id: plug_off
      sequence:
      - action: rest_command.enable_boiler_cwu
        data: {}
      - if:
        - condition: template
          value_template: '{{ (now() - as_local(as_datetime(states(''input_datetime.gvs_last_notify_off'')
            if states(''input_datetime.gvs_last_notify_off'') not in [''unknown'',''unavailable'']
            else ''1970-01-01 00:00:00''))).total_seconds() > 14400 }}'
        then:
        - action: notify.send_message
          target:
            entity_id: notify.telegram_owner
          data:
            message: "\U0001F4A7 Электробойлер выключен — котёл возобновит нагрев
              ГВС (уставка ↗ 55°C)"
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.gvs_last_notify_off
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  mode: single
- id: '1779000001002'
  alias: "\U0001F525 Котёл: уведомления о режиме и уставках"
  description: Telegram-уведомления при смене режима котла, уставок ГВС и CO
  triggers:
  - trigger: state
    entity_id: sensor.boiler_mode
    for: 00:00:05
  - trigger: state
    entity_id: sensor.boiler_cwu_setpoint
    for: 00:00:10
  - trigger: state
    entity_id: sensor.boiler_co_setpoint
    for: 00:00:10
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not
      none and trigger.from_state.state != trigger.to_state.state and trigger.to_state.state
      not in [''unavailable'', ''unknown''] and trigger.from_state.state not in [''unavailable'',
      ''unknown''] }}'
  - condition: time
    after: 07:00:00
    before: '22:00:00'
  actions:
  - variables:
      eid: '{{ trigger.entity_id }}'
      from_val: '{{ trigger.from_state.state if trigger.from_state else ''?'' }}'
      to_val: '{{ trigger.to_state.state }}'
      ts: '{{ now().strftime(''%d.%m.%Y %H:%M:%S'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ eid == ''sensor.boiler_mode'' and (''Выключен'' in [from_val,
          to_val] or to_val == ''Авария'') }}'
      sequence:
      - variables:
          mode_emoji: "{% if to_val == 'Выключен' %}❄️{% elif to_val == 'Авария' %}\U0001F6A8{%
            elif to_val in ['Работа', 'Нагрев ГВС', 'Нагрев ЦО'] %}\U0001F525{% elif
            to_val in ['Розжиг', 'Надзор', 'Надзор расш.'] %}⏳{% elif to_val == 'Догорание'
            %}\U0001F4A8{% else %}\U0001F504{% endif %}"
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: '{{ mode_emoji }} Котёл: {{ to_val }}

            (было: {{ from_val }})

            Время: {{ ts }}'
    - conditions:
      - condition: template
        value_template: '{{ eid == ''sensor.boiler_cwu_setpoint'' and not (from_val
          in [''40'', ''55''] and to_val in [''40'', ''55'']) }}'
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: "\U0001F4A7 Котёл ГВС уставка: {{ to_val }}°C (было: {{ from_val
            }}°C)\nВремя: {{ ts }}"
    - conditions:
      - condition: template
        value_template: '{{ eid == ''sensor.boiler_co_setpoint'' }}'
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: "\U0001F525 Котёл CO уставка: {{ to_val }}°C (было: {{ from_val
            }}°C)\nВремя: {{ ts }}"
  mode: queued
  max: 5
- id: '1779200001001'
  alias: '⚠️ Tailscale: ключ истекает'
  description: Напоминание за 10 дней до истечения ключа 2026-11-11
  triggers:
  - trigger: time
    at: 09:00:00
  conditions:
