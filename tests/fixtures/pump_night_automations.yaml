  actions:
  - variables:
      upd_lines: '{% set ns = namespace(lines=[]) %}{% if is_state(''update.home_assistant_core_update'',''on'')
        %}{% set ns.lines = ns.lines + [''• HA Core: '' + (state_attr(''update.home_assistant_core_update'',''installed_version'')
        or ''?'') + '' → '' + (state_attr(''update.home_assistant_core_update'',''latest_version'')
        or ''?'') + '' ⚠️ установи вручную''] %}{% endif %}{% if is_state(''update.home_assistant_operating_system_update'',''on'')
        %}{% set ns.lines = ns.lines + [''• HA OS: '' + (state_attr(''update.home_assistant_operating_system_update'',''installed_version'')
        or ''?'') + '' → '' + (state_attr(''update.home_assistant_operating_system_update'',''latest_version'')
        or ''?'') + '' ⚠️ установи вручную''] %}{% endif %}{% if is_state(''update.home_assistant_supervisor_update'',''on'')
        %}{% set ns.lines = ns.lines + [''• Supervisor: '' + (state_attr(''update.home_assistant_supervisor_update'',''installed_version'')
        or ''?'') + '' → '' + (state_attr(''update.home_assistant_supervisor_update'',''latest_version'')
        or ''?'') + '' ✅ авто''] %}{% endif %}{% if is_state(''update.advanced_ssh_web_terminal_update'',''on'')
        %}{% set ns.lines = ns.lines + [''• SSH Terminal: '' + (state_attr(''update.advanced_ssh_web_terminal_update'',''installed_version'')
        or ''?'') + '' → '' + (state_attr(''update.advanced_ssh_web_terminal_update'',''latest_version'')
        or ''?'') + '' ✅ авто''] %}{% endif %}{% if is_state(''update.deconz_update'',''on'')
        %}{% set ns.lines = ns.lines + [''• deCONZ: '' + (state_attr(''update.deconz_update'',''installed_version'')
        or ''?'') + '' → '' + (state_attr(''update.deconz_update'',''latest_version'')
        or ''?'') + '' ✅ авто''] %}{% endif %}{% if is_state(''update.matter_server_update'',''on'')
        %}{% set ns.lines = ns.lines + [''• Matter Server: '' + (state_attr(''update.matter_server_update'',''installed_version'')
        or ''?'') + '' → '' + (state_attr(''update.matter_server_update'',''latest_version'')
        or ''?'') + '' ⚠️ крупное — установи вручную''] %}{% endif %}{% if is_state(''update.local_tuya_update'',''on'')
        %}{% set ns.lines = ns.lines + [''• LocalTuya: '' + (state_attr(''update.local_tuya_update'',''installed_version'')
        or ''?'') + '' → '' + (state_attr(''update.local_tuya_update'',''latest_version'')
        or ''?'') + '' ⚠️ установи вручную''] %}{% endif %}{{ ns.lines | join(''

        '') }}'
  - action: notify.send_message
    target:
      entity_id: notify.telegram_owner
    data:
      message: "\U0001F504 Доступны обновления HA:\n{{ upd_lines }}\n\n✅ авто = установится
        в 03:00\n⚠️ = установи вручную в Settings → Updates"
