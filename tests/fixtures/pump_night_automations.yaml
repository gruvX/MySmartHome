    минут, значит менеджер grace не выключил его (как было при коллизии id) и защита
    от утечки СЕЙЧАС подавлена — leak_check требует grace == off. Шлёт предупреждение
    в Telegram, ничего не переключает.
    2026-08-16: parse_mode html + entity_id в <code> — под дефолтным markdown бота
