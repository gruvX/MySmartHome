- id: '1790000001002'
  alias: '🧊 Сторож Tuya — состояния устройств зависли (только уведомление)'
  description: 'NOTIFICATION-ONLY. Ловит отказ, который скрывался две недели (01.08–16.08.2026): интеграция Tuya перестала обновлять сущности, состояния «замерли» с валидными значениями, unavailable не появлялся, поэтому ни один сторож не сработал. Тревога, если НИ ОДНА из ключевых сущностей Tuya не обновлялась дольше 18 ч. Порог взят по фактической истории 01.05–31.07.2026: максимальная пауза, когда не обновилась ни одна из этих сущностей, была 11 ч (p99 = 9 ч, p95 = 8 ч). Одно сообщение на эпизод + сообщение о восстановлении. Действия — только telegram_bot.send_message и переключение input_boolean.tuya_stale_alert.'
  triggers:
  - trigger: time_pattern
    minutes: /30
    id: check
  conditions: []
  actions:
  - variables:
      stale_limit: 64800
      watched:
      - switch.smart_plug_2_socket_1
      - switch.kalarifer_socket_1
      - switch.voda_kran_switch_1
      - switch.akvarium_svet_socket_1
      - switch.retserkuliatsiia_goriachai_vody_socket_1
      - sensor.boiler_total_energy
      - sensor.terarium_total_energy
      - sensor.akvarium_svet_total_energy
      - sensor.cherepakha_total_energy
      - sensor.zigbee_plug_2_total_energy
  - variables:
      freshest_s: >-
        {% set ns = namespace(m = 9999999) %}
        {% for e in watched %}
          {% if states[e] is not none %}
            {% set a = (now() - states[e].last_updated).total_seconds() %}
            {% if a < ns.m %}{% set ns.m = a %}{% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.m | round(0) }}
      stale_list: >-
        {% set ns = namespace(l = []) %}
        {% for e in watched %}
          {% if states[e] is none %}
            {% set ns.l = ns.l + [e ~ ' — нет такой сущности'] %}
          {% elif (now() - states[e].last_updated).total_seconds() > (stale_limit | float(64800)) %}
            {% set ns.l = ns.l + [e ~ ' — ' ~ (((now() - states[e].last_updated).total_seconds() / 3600) | round(1)) ~ ' ч'] %}
          {% endif %}
        {% endfor %}
        {{ ns.l | join('\n') }}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (freshest_s | float(0)) > (stale_limit | float(64800))
          }}'
      - condition: state
        entity_id: input_boolean.tuya_stale_alert
        state: 'off'
      - condition: state
        entity_id: input_boolean.ha_startup_grace
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.tuya_stale_alert
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: "⚠️ <b>Tuya: состояния устройств зависли</b>\n\nНи одна из ключевых\
            \ сущностей Tuya не обновлялась {{ ((freshest_s | float(0)) / 3600) | round(1)\
            \ }} ч (порог 18 ч). Home Assistant при этом работает.\n\nЭто значит, что\
            \ показанные состояния розеток и счётчиков могут не соответствовать реальным,\
            \ а команды уходят «в пустоту».\n\nЗависли:\n<code>{{ stale_list }}</code>\n\n\
            Лечится перезагрузкой config entry интеграции Tuya."
    - conditions:
      - condition: template
        value_template: '{{ (freshest_s | float(0)) <= (stale_limit | float(64800))
          }}'
      - condition: state
        entity_id: input_boolean.tuya_stale_alert
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.tuya_stale_alert
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: "✅ <b>Tuya: состояния устройств снова обновляются</b>\n\nСвежесть\
            \ данных: {{ ((freshest_s | float(0)) / 3600) | round(2) }} ч назад."
  mode: single
- id: '1790100001001'
  alias: 🚗 Сторож EV — плановая зарядка (только уведомление)
  description: Независимая проверка EV-зарядки. Через 10 мин после планового старта
    проверяет, идёт ли зарядка; отдельно ловит зарядку дольше планового окна. НИКОГДА
    не подаёт команд устройствам. Нужна потому, что ошибка Tuya (ApiRequestException)
    обрывает основную автоматизацию на шаге команды, до всех проверок и уведомлений.
  triggers:
  - trigger: time
    at: input_datetime.ev_charge_start
    id: planned_start
  - alias: Стабильная ссылка на ЗАПРОШЕННОЕ ночное окно. Отдельный helper, который
      планировщик не трогает, поэтому этот триггер нельзя молча перевести на другое
      время, изменив input_datetime.ev_charge_start.
    trigger: time
    at: input_datetime.ev_night_window_start
    id: night_planned_start
  - trigger: state
    entity_id: sensor.ev_charger_status
    to: charger_charging
    for: 02:30:00
    id: overrun
  conditions:
  - condition: template
    value_template: '{{ not is_state(''input_boolean.ev_manual_mode'', ''on'') }}'
  actions:
  - alias: Дать основной автоматизации 10 мин на старт зарядки
    if:
    - condition: trigger
      id:
      - planned_start
      - night_planned_start
    then:
    - delay: 00:10:00
  - choose:
    - alias: Плановый старт был, а зарядки нет
      conditions:
      - condition: trigger
        id: planned_start
      - condition: template
        alias: Ночной заявкой занимается отдельная ветка ниже (иначе два сообщения
          об одном и том же). Helper отсутствует -> условие истинно -> ветка работает
          как раньше.
        value_template: '{{ not is_state(''input_boolean.ev_night_requested'', ''on'')
          }}'
      - condition: template
        value_template: '{{ not is_state(''sensor.ev_charger_status'', ''charger_charging'')
          }}'
      - condition: template
        alias: Это окно не отменял сам владелец (метка ev_cancel_consumed). Помощник
          отсутствует -> 0 -> условие истинно -> ветка работает как раньше
        value_template: >-
          {% set cs = state_attr('input_datetime.ev_charge_start', 'timestamp') | float(0)
          %} {% set cc = state_attr('input_datetime.ev_cancel_consumed', 'timestamp') |
          float(0) %} {{ cs <= 0 or ((cc - cs) | abs) > 60 }}
      - condition: template
        alias: СВЕЖИЙ charger_free — это случай «машина не подключена», им занимается
          1791000001001 (перенос зарядки + одно сообщение). Иначе владелец получил бы
          два сообщения об одном событии
        value_template: >-
          {% set s = states('sensor.ev_charger_status') %} {% set src =
          state_attr('sensor.ev_charger_status', 'src') %} {% set age =
          state_attr('sensor.ev_charger_status', 'stale_age') | float(-1) %} {{ not (s ==
          'charger_free' and src in ['local', 'cloud'] and age >= 0 and age < 900) }}
      - condition: template
        value_template: '{{ (now().timestamp() - (state_attr(''input_datetime.tuya_cmd_fail_ev'',
          ''timestamp'') | float(0))) > 21600 }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.tuya_cmd_fail_ev
        data:
          timestamp: '{{ now().timestamp() }}'
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: |-
            {%- set s = states('sensor.ev_charger_status') -%}
            {%- set src = state_attr('sensor.ev_charger_status', 'src') -%}
            {%- set age = state_attr('sensor.ev_charger_status', 'stale_age') | float(-1) -%}
            {%- set fresh = (src in ['local', 'cloud']) and age >= 0 and age < 900 -%}
            {%- set dead = s in ['unavailable', 'unknown', 'none', 'None', ''] -%}
            {%- set causes = {'charger_free': 'машина не подключена', 'charger_insert': 'машина подключена, но зарядка не началась', 'charger_pause': 'зарядка на паузе', 'charger_end': 'зарядка уже завершена', 'charger_charging': 'зарядка идёт (статус свежий)'} -%}
            {%- if dead -%}{%- set cause = 'нет связи с зарядкой (статус недоступен)' -%}
            {%- elif s == 'cloud_error' -%}{%- set cause = 'нет свежих данных от зарядки (кэш/квота Tuya) — причину назвать нельзя' -%}
            {%- elif not fresh -%}{%- set cause = 'нет свежих данных от зарядки (кэш/квота Tuya) — причину назвать нельзя, последний известный статус устарел' -%}
            {%- else -%}{%- set cause = causes.get(s, 'статус ' ~ (s | e)) -%}
            {%- endif -%}
            {%- if fresh -%}{%- set stale_note = '' -%}
            {%- elif age >= 0 -%}{%- set stale_note = ' — данные НЕ свежие (источник ' ~ ((src if src is string else 'неизвестен') | e) ~ ', возраст ' ~ ((age / 60) | round(0) | int | string) ~ ' мин)' -%}
            {%- else -%}{%- set stale_note = ' — данные НЕ свежие (возраст неизвестен)' -%}
            {%- endif -%}
            ⚠️ EV: плановая зарядка не началась

            Через 10 мин после планового старта зарядка не идёт.

            Причина: {{ cause }}

            Статус <code>sensor.ev_charger_status</code>: {{ s | e }} (ожидался <code>charger_charging</code>){{ stale_note }}
            Плановое время <code>input_datetime.ev_charge_start</code>: {{ states('input_datetime.ev_charge_start') | e }}
            Счётчик <code>sensor.ev_charger_energy</code>: {{ states('sensor.ev_charger_energy') | e }} кВт·ч

            Реле <code>switch.ev_charger_switch</code> на этой зарядке читается <code>off</code> даже во время зарядки — по нему успех не определяется.

            Это независимая проверка: она срабатывает даже если сама автоматизация оборвалась ошибкой Tuya.
            Повтор этого сообщения — не чаще раза в 6 ч.
    - alias: Ночная заявка — плановый старт был, а зарядки нет
      conditions:
      - condition: trigger
        id: night_planned_start
      - condition: template
        alias: Заявка ещё активна (она же — токен «вердикт не отправлен»)
        value_template: '{{ is_state(''input_boolean.ev_night_requested'', ''on'') }}'
      - condition: template
        alias: Зарядка не идёт
        value_template: '{{ not is_state(''sensor.ev_charger_status'', ''charger_charging'')
          }}'
      - condition: template
        alias: Это окно не отменял сам владелец (нажал «Отменить зарядку» после заявки)
        value_template: >-
          {% set cs = state_attr('input_datetime.ev_charge_start', 'timestamp') | float(0)
          %} {% set cc = state_attr('input_datetime.ev_cancel_consumed', 'timestamp') |
          float(0) %} {{ cs <= 0 or ((cc - cs) | abs) > 60 }}
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: |-
            {%- set s = states('sensor.ev_charger_status') -%}
            {%- set src = state_attr('sensor.ev_charger_status', 'src') -%}
            {%- set age = state_attr('sensor.ev_charger_status', 'stale_age') | float(-1) -%}
            {%- set fresh = (src in ['local', 'cloud']) and age >= 0 and age < 900 -%}
            {%- set dead = s in ['unavailable', 'unknown', 'none', 'None', ''] -%}
            {%- set causes = {'charger_free': 'машина не подключена', 'charger_insert': 'машина подключена, но зарядка не началась', 'charger_pause': 'зарядка на паузе', 'charger_end': 'зарядка уже завершена', 'charger_charging': 'зарядка идёт (статус свежий)'} -%}
            {%- if dead -%}{%- set cause = 'нет связи с зарядкой (статус недоступен)' -%}
            {%- elif s == 'cloud_error' -%}{%- set cause = 'нет свежих данных от зарядки (кэш/квота Tuya) — причину назвать нельзя' -%}
            {%- elif not fresh -%}{%- set cause = 'нет свежих данных от зарядки (кэш/квота Tuya) — причину назвать нельзя, последний известный статус устарел' -%}
            {%- else -%}{%- set cause = causes.get(s, 'статус ' ~ (s | e)) -%}
            {%- endif -%}
            {%- if fresh -%}{%- set stale_note = '' -%}
            {%- elif age >= 0 -%}{%- set stale_note = ' — данные НЕ свежие (источник ' ~ ((src if src is string else 'неизвестен') | e) ~ ', возраст ' ~ ((age / 60) | round(0) | int | string) ~ ' мин)' -%}
            {%- else -%}{%- set stale_note = ' — данные НЕ свежие (возраст неизвестен)' -%}
            {%- endif -%}
            {%- set wt = states('input_datetime.ev_night_window_start') -%}
            {%- set wts = state_attr('input_datetime.ev_night_window_start', 'timestamp') | float(0) -%}
            {%- set wh = (wts | timestamp_custom('%H', true) | int(-1)) if wts > 0 else -1 -%}
            {%- set kind = 'ночная' if (wh >= 23 or (wh >= 0 and wh < 7)) else 'дневная' -%}
            ⚠️ EV: {{ kind | e }} зарядка по заявке НЕ состоялась

            Заявка была на {{ wt | e }} (окно 2 ч, запрошено кнопкой «Зарядить ночью» / «Зарядить днём»).
            Через 10 мин после планового старта зарядка не идёт.

            Причина: {{ cause }}

            Статус <code>sensor.ev_charger_status</code>: {{ s | e }} (ожидался <code>charger_charging</code>){{ stale_note }}
            Плановое время <code>input_datetime.ev_charge_start</code>: {{ states('input_datetime.ev_charge_start') | e }}
            Заявка <code>input_datetime.ev_night_window_start</code>: {{ wt | e }}
            Счётчик <code>sensor.ev_charger_energy</code>: {{ states('sensor.ev_charger_energy') | e }} кВт·ч

            Реле <code>switch.ev_charger_switch</code> на этой зарядке читается <code>off</code> даже во время зарядки — по нему успех не определяется.

            Это сообщение отправляется РОВНО ОДИН РАЗ на заявку.
      - alias: Вердикт доставлен — гасим заявку, чтобы сообщение было РОВНО одно
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_night_requested
    - alias: Ночная заявка — зарядка идёт, вердикт не нужен
      conditions:
      - condition: trigger
        id: night_planned_start
      - condition: template
        value_template: '{{ is_state(''sensor.ev_charger_status'', ''charger_charging'')
          }}'
      sequence:
      - alias: Отметить, что зарядка в запрошенном окне наблюдалась
        action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ev_night_charge_seen
        data:
          timestamp: '{{ now().timestamp() }}'
    - alias: Зарядка идёт дольше планового окна
      conditions:
      - condition: trigger
        id: overrun
      - condition: template
        value_template: '{{ (now().timestamp() - (state_attr(''input_datetime.ev_overrun_notify'',
          ''timestamp'') | float(0))) > 21600 }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ev_overrun_notify
        data:
          timestamp: '{{ now().timestamp() }}'
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: '⚠️ EV: зарядка идёт дольше планового окна

            <code>sensor.ev_charger_status</code> = charger_charging уже 2 ч 30 мин,
            а плановое окно — 2 ч.

            Реле <code>switch.ev_charger_switch</code>: {{ states(''switch.ev_charger_switch'')
            }}

            Счётчик <code>sensor.ev_charger_energy</code>: {{ states(''sensor.ev_charger_energy'')
            }} кВт·ч

            Команда СТОП могла не пройти (Tuya) — проверь и при необходимости останови
            вручную.

            Повтор этого сообщения — не чаще раза в 6 ч.'
  mode: queued
  max: 5
- id: '1790200001001'
  alias: "☁️ Tuya: авто-лечение обрыва сессии (sign invalid)"
  description: >-
    Ловит корневую причину повторяющегося отказа: сессия Tuya Cloud начинает отвечать
    "network error:(-9999999) sign invalid", tuya_sharing поднимает ApiRequestException,
    а так как это НЕ HomeAssistantError, HA пробрасывает её дальше и вся вызывающая
    automation обрывается на полуслове (даже с continue_on_error). Та же сломанная
    сессия перестаёт присылать push, поэтому состояния «замирают» и unavailable не
    появляется — сторож 1748000001005 такой отказ не видит.
    Лечение: перезагрузка config entry Tuya (01HAENTRYIDPLACEHOLDER0000).
    ПРАВИЛО СОВПАДЕНИЯ (исправлено 2026-08-16): по СОДЕРЖИМОМУ события, а не по
    имени логгера. Ровно: level ∈ {WARNING, ERROR, CRITICAL} И в склейке
    message + exception (в нижнем регистре) встречается 'sign invalid' ИЛИ
    'apirequestexception' ИЛИ 'tuya_sharing'. Старое условие требовало 'tuya' в
    d.name и поэтому отвергало 589 из 590 реальных событий: исключение всплывает
    из вызова Tuya и логируется ВЫЗЫВАЮЩЕЙ automation, т.е. под логгером
    homeassistant.components.automation.*, а не tuya. last_triggered был None.
    message может быть list/str/dict/None/отсутствовать, exception — отсутствовать
    или быть пустым, event.data может отсутствовать: ни одна форма не должна падать.
    ТРЕБУЕТ system_log.fire_event = true в configuration.yaml (иначе событие
    system_log_event не публикуется и эта automation никогда не сработает).
    Действия ограничены: input_datetime.set_datetime, input_boolean on/off для
    tuya_reconnect_grace, homeassistant.reload_config_entry, telegram_bot.send_message.
    НИ ОДНОГО switch/climate/siren/valve/light/script.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: event
      event_type: system_log_event
      id: log
  conditions:
    # Совпадение по СОДЕРЖИМОМУ события, а не по имени логгера: исключение
    # tuya_sharing всплывает из вызова Tuya и логируется вызывающей automation,
    # поэтому d.name почти всегда homeassistant.components.automation.*, не tuya.
    # message бывает list / str / dict / None / отсутствует; exception бывает
    # пустым или отсутствует; event.data может отсутствовать целиком.
    - condition: template
      value_template: >-
        {% set ev = trigger.event if (trigger is defined and trigger.event is defined) else none %}
        {% set d = ev.data if (ev is not none and ev.data is defined and ev.data is mapping) else {} %}
        {% set lvl = d.get('level') | string | upper %}
        {% set m = d.get('message') %}
        {% set x = d.get('exception') %}
        {% set mt = (m | join(' ')) if (m is sequence and m is not string and m is not mapping) else (m | string) %}
        {% set xt = (x | join(' ')) if (x is sequence and x is not string and x is not mapping) else (x | string) %}
        {% set blob = (mt ~ ' ' ~ xt) | lower %}
        {{ lvl in ['WARNING', 'ERROR', 'CRITICAL']
           and ('sign invalid' in blob
                or 'apirequestexception' in blob
                or 'tuya_sharing' in blob) }}
  actions:
    # ---------- 0. разбор события (никакое поле не обязано существовать) ----------
    - variables:
        entry_id: 01HAENTRYIDPLACEHOLDER0000
        peer_automation: automation.tuya_avto_perezagruzka_pri_obryve_datchika_vlagi
        ev_name: >-
          {% set ev = trigger.event if (trigger is defined and trigger.event is defined) else none %}
          {% set d = ev.data if (ev is not none and ev.data is defined and ev.data is mapping) else {} %}
          {{ (d.get('name') | string) | truncate(120, true, '…') }}
        ev_text: >-
          {% set ev = trigger.event if (trigger is defined and trigger.event is defined) else none %}
          {% set d = ev.data if (ev is not none and ev.data is defined and ev.data is mapping) else {} %}
          {{ ((d.get('message') | string) ~ ' ' ~ (d.get('exception') | string)) | truncate(280, true, '…') }}
    # ---------- 1. состояние rate-limit хелперов (кольцо из 6 меток) ----------
    - variables:
        slots_present: >-
          {% set ns = namespace(c = 0) %}
          {% for i in range(1, 7) %}
            {% if state_attr('input_datetime.tuya_selfheal_r' ~ i, 'timestamp') is number %}
              {% set ns.c = ns.c + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.c }}
        newest_age: >-
          {% set ns = namespace(m = 999999999) %}
          {% for i in range(1, 7) %}
            {% set t = state_attr('input_datetime.tuya_selfheal_r' ~ i, 'timestamp') %}
            {% if t is number %}
              {% set a = as_timestamp(now()) - t %}
              {% if a < ns.m %}{% set ns.m = a %}{% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.m | round(0) | int(999999999) }}
        used_24h: >-
          {% set ns = namespace(c = 0) %}
          {% for i in range(1, 7) %}
            {% set t = state_attr('input_datetime.tuya_selfheal_r' ~ i, 'timestamp') %}
            {% if t is number and (as_timestamp(now()) - t) < 86400 %}
              {% set ns.c = ns.c + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.c }}
        slot_next: >-
          {% set ns = namespace(best = '', bt = none) %}
          {% for i in range(1, 7) %}
            {% set e = 'input_datetime.tuya_selfheal_r' ~ i %}
            {% set t = state_attr(e, 'timestamp') %}
            {% set t = t if t is number else -2000000000 %}
            {% if ns.bt is none or t < ns.bt %}
              {% set ns.bt = t %}{% set ns.best = e %}
            {% endif %}
          {% endfor %}
          {{ ns.best }}
        age_msg: >-
          {% set t = state_attr('input_datetime.tuya_selfheal_msg', 'timestamp') %}
          {{ ((as_timestamp(now()) - t) | round(0) | int(999999999)) if t is number else 999999999 }}
        age_giveup: >-
          {% set t = state_attr('input_datetime.tuya_selfheal_giveup_msg', 'timestamp') %}
          {{ ((as_timestamp(now()) - t) | round(0) | int(999999999)) if t is number else 999999999 }}
    # ---------- 2. решения ----------
    # helpers_ok = все 8 хелперов читаются. Если нет — rate limit FAIL OPEN (сообщение
    # всё равно уходит), а safety gate ниже всё равно FAIL CLOSED.
    - variables:
        helpers_ok: >-
          {{ (slots_present | int(0)) == 6
             and state_attr('input_datetime.tuya_selfheal_msg', 'timestamp') is number
             and state_attr('input_datetime.tuya_selfheal_giveup_msg', 'timestamp') is number }}
        spacing_ok: "{{ (newest_age | int(999999999)) >= 900 }}"
        cap_ok: "{{ (used_24h | int(0)) < 6 }}"
        msg_ok: "{{ (age_msg | int(999999999)) >= 900 }}"
        giveup_ok: "{{ (age_giveup | int(999999999)) >= 21600 }}"
        # SAFETY GATE — FAIL CLOSED: разрешено только явно безопасное состояние.
        # states() для несуществующей сущности возвращает 'unknown' -> gate закрыт.
        gate_ok: >-
          {{ states('sensor.leak_protection_status') in ['ok', 'blind']
             and states('binary_sensor.vannaia_moisture') != 'on'
             and states('binary_sensor.garazh_moisture') != 'on'
             and states('binary_sensor.kukhnia_moisture') != 'on'
             and states('binary_sensor.water_sensor_4_moisture') != 'on'
             and states('binary_sensor.wifi_th_smoke_sensor_smoke') != 'on' }}
        peer_busy: "{{ (state_attr(peer_automation, 'current') | int(0)) > 0 }}"
        # Анти-петля на случай, когда кольцо rate-limit нечитаемо (helpers_ok=false):
        # last_changed grace-флага помечает прошлую перезагрузку. FAIL CLOSED —
        # если сущности нет или метка нечитаема, возраст 0 => перезагрузка запрещена.
        grace_age: >-
          {% set s = states['input_boolean.tuya_reconnect_grace'] %}
          {% set lc = as_timestamp(s.last_changed, 0) if s is not none else 0 %}
          {{ ((as_timestamp(now()) - lc) | round(0) | int(0)) if (lc | float(0)) > 0 else 0 }}
    # ---------- 3. SAFETY GATE (первым делом) ----------
    - if:
        - condition: template
          value_template: "{{ not (gate_ok | default(false, true)) }}"
      then:
        - if:
            - condition: template
              value_template: "{{ msg_ok | default(false, true) }}"
          then:
            - action: input_datetime.set_datetime
              continue_on_error: true
              target:
                entity_id: input_datetime.tuya_selfheal_msg
              data:
                timestamp: "{{ as_timestamp(now()) | int(0) }}"
            - action: telegram_bot.send_message
              continue_on_error: true
              data:
                chat_id: 100000000
                parse_mode: html
                message: >-
                  ⚠️ <b>Tuya: сессия оборвалась, но авто-лечение ЗАБЛОКИРОВАНО</b>


                  Логгер: <code>{{ ev_name | e }}</code>

                  Сообщение: <code>{{ ev_text | e }}</code>


                  Перезагрузка интеграции временно ослепляет датчики влаги, кран и сирену,
                  поэтому она запрещена, пока идёт водный/дымовой инцидент или пока
                  состояние защиты не читается.


                  <code>sensor.leak_protection_status</code> = <code>{{ states('sensor.leak_protection_status') }}</code>

                  <code>binary_sensor.vannaia_moisture</code> = <code>{{ states('binary_sensor.vannaia_moisture') }}</code>

                  <code>binary_sensor.garazh_moisture</code> = <code>{{ states('binary_sensor.garazh_moisture') }}</code>

                  <code>binary_sensor.kukhnia_moisture</code> = <code>{{ states('binary_sensor.kukhnia_moisture') }}</code>

                  <code>binary_sensor.water_sensor_4_moisture</code> = <code>{{ states('binary_sensor.water_sensor_4_moisture') }}</code>

                  <code>binary_sensor.wifi_th_smoke_sensor_smoke</code> = <code>{{ states('binary_sensor.wifi_th_smoke_sensor_smoke') }}</code>


                  Разберись с инцидентом, затем перезагрузи Tuya вручную
                  (<code>homeassistant.reload_config_entry</code>, entry <code>{{ entry_id }}</code>).

                  Повтор этого сообщения — не чаще раза в 15 мин.
        - stop: "Safety gate closed: leak/smoke active or leak status unreadable"
    # ---------- 4. rate limit: не чаще 1 перезагрузки в 15 мин ----------
    - if:
        - condition: template
          value_template: "{{ not (spacing_ok | default(false, true)) }}"
      then:
        - stop: "Rate-limited: last auto-reload was less than 15 min ago"
    # ---------- 4b. анти-петля, если кольцо rate-limit нечитаемо ----------
    # Новое правило совпадения может сработать и от ошибки, порождённой самой
    # перезагрузкой. Обычный путь ограничен кольцом (15 мин + 6/24ч). Если кольцо
    # недоступно, spacing_ok вырождается в true — тогда интервал держит grace-флаг.
    - if:
        - condition: template
          value_template: >-
            {{ not (helpers_ok | default(false, true))
               and (grace_age | int(0)) < 900 }}
      then:
        - stop: "Anti-loop backstop: rate-limit helpers unreadable and tuya_reconnect_grace changed less than 15 min ago"
    # ---------- 5. hard cap: не более 6 перезагрузок за скользящие 24 ч ----------
    - if:
        - condition: template
          value_template: "{{ not (cap_ok | default(false, true)) }}"
      then:
        - if:
            - condition: template
              value_template: "{{ giveup_ok | default(false, true) }}"
          then:
            - action: input_datetime.set_datetime
              continue_on_error: true
              target:
                entity_id: input_datetime.tuya_selfheal_giveup_msg
              data:
                timestamp: "{{ as_timestamp(now()) | int(0) }}"
            - action: telegram_bot.send_message
              continue_on_error: true
              data:
                chat_id: 100000000
                parse_mode: html
                message: >-
                  🛑 <b>Tuya: авто-лечение СДАЛОСЬ</b>


                  За последние 24 ч уже сделано {{ used_24h }} автоперезагрузок
                  интеграции Tuya (лимит 6), а сессия снова отвечает
                  "sign invalid". Дальнейшие автоматические попытки остановлены.


                  Логгер: <code>{{ ev_name | e }}</code>

                  Сообщение: <code>{{ ev_text | e }}</code>


                  Нужен ручной разбор: облако Tuya, срок жизни токена интеграции,
                  время на хосте (подпись запроса зависит от часов), сеть.

                  Ручное лечение: <code>homeassistant.reload_config_entry</code>,
                  entry <code>{{ entry_id }}</code>.


                  Повтор этого сообщения — не чаще раза в 6 ч.
        - stop: "Daily cap of 6 auto-reloads in 24h reached"
    # ---------- 6. анти-пинг-понг с 1748000001005 ----------
    - if:
        - condition: template
          value_template: "{{ peer_busy | default(false, true) }}"
      then:
        - stop: "Peer automation 1748000001005 is already reloading the Tuya entry"
    # ---------- 7. лечение ----------
    - if:
        - condition: template
          value_template: "{{ helpers_ok | default(false, true) }}"
      then:
        - action: input_datetime.set_datetime
          continue_on_error: true
          target:
            entity_id: "{{ slot_next }}"
          data:
            timestamp: "{{ as_timestamp(now()) | int(0) }}"
    - variables:
        t0: "{{ as_timestamp(now()) | int(0) }}"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.tuya_reconnect_grace
    - action: homeassistant.reload_config_entry
      data:
        entry_id: 01HAENTRYIDPLACEHOLDER0000
    - wait_template: >-
        {% set s = states['switch.voda_kran_switch_1'] %}
        {{ s is not none and s.state not in ['unavailable', 'unknown']
           and as_timestamp(s.last_updated, 0) >= (t0 | int(0)) }}
      timeout: "00:02:00"
      continue_on_timeout: true
    - variables:
        recovered: "{{ wait.completed | default(false, true) }}"
        used_now: >-
          {% set ns = namespace(c = 0) %}
          {% for i in range(1, 7) %}
            {% set t = state_attr('input_datetime.tuya_selfheal_r' ~ i, 'timestamp') %}
            {% if t is number and (as_timestamp(now()) - t) < 86400 %}
              {% set ns.c = ns.c + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.c }}
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.tuya_reconnect_grace
    - action: telegram_bot.send_message
      continue_on_error: true
      data:
        chat_id: 100000000
        parse_mode: html
        message: >-
          {{ '✅' if recovered else '⚠️' }} <b>Tuya: сессия оборвалась —
          {{ 'перезагрузил, связь восстановлена' if recovered else 'перезагрузил, восстановление НЕ подтверждено' }}</b>


          Логгер: <code>{{ ev_name | e }}</code>

          Сообщение: <code>{{ ev_text | e }}</code>


          Это тот самый отказ, из-за которого вызывающая automation обрывается
          на полуслове (ApiRequestException не является HomeAssistantError).


          Сделано: grace ON → <code>homeassistant.reload_config_entry</code>
          (entry <code>{{ entry_id }}</code>) → ожидание
          <code>switch.voda_kran_switch_1</code> → grace OFF.


          <code>switch.voda_kran_switch_1</code> = <code>{{ states('switch.voda_kran_switch_1') }}</code>

          <code>sensor.leak_protection_status</code> = <code>{{ states('sensor.leak_protection_status') }}</code>

          Автоперезагрузок за 24 ч: {{ used_now | int(0) }} из 6.

          {{ '' if helpers_ok else 'ВНИМАНИЕ: хелперы rate-limit не читаются, счётчик мог не записаться.' }}

          {{ '' if recovered else 'Кран не подтвердил обновление за 2 мин — проверь вручную.' }}
- id: '1790400001001'
  alias: '🚨 Утечка: форсированный опрос облака, пока датчики влаги слепы'
  description: >-
    ТОЛЬКО ЧТЕНИЕ. Ни одного switch/valve/siren/climate/script — единственное
    действие homeassistant.update_entity на sensor.tuya_leak_cloud.
    ЗАЧЕМ: 19.08.2026 выяснилось, что опрос облака Tuya каждые 30 с (2880
    обращений в сутки) исчерпывал квоту — в логе
    "network error:(-9999999) API_QPS_LIMIT_OR_DEGRADE", сессия деградировала,
    сущности массово уходили в unavailable, и это порождало шторм уведомлений.
    Базовый интервал снижен до 180 с (480/сутки), а полная чувствительность
    возвращается РОВНО тогда, когда она нужна: пока хотя бы один из 4
    binary_sensor.*_moisture в unavailable/unknown, основной путь обнаружения
    (датчик + 3-секундное подтверждение в утечке v4) слеп, и резервный облачный
    путь опрашивается принудительно каждые 30 с.
    ГРАНИЦЫ (чтобы сам форсаж не стал проблемой квоты):
      * не больше 5 итераций (<= 2.5 мин) за эпизод (было 20 / 10 мин,
        снижено 19.08.2026 — арифметика ниже);
      * mode: single — параллельные эпизоды невозможны, 4 датчика гаснут вместе;
      * кулдаун 30 мин по своему last_triggered => не более 48 эпизодов в сутки.
      АРИФМЕТИКА ПОД БЕСПЛАТНЫЙ ТАРИФ (26 000 вызовов/мес). С 19.08.2026 квоту
      IoT Core тратит ТОЛЬКО этот путь: sensor.ev_charger_status и
      sensor.ev_charger_energy переведены на данные ЖИВОЙ интеграции tuya внутри
      HA (локальный diagnostics-дамп) и не делают ни одного облачного вызова.
      База 180 с = 480 вызовов/сутки + ~13 обновлений токена. Форсаж в худшем
      случае 48*5 = 240. Итого 733/сутки => 22 723/мес за 31 день = 87 % тарифа.
      При старом лимите 20 итераций было бы 48*20 = 960, итого 1453/сутки =>
      45 043/мес = 173 % — тариф не выдержал бы. Реально эпизодов 3-5 в сутки:
      480 + 25 + 13 = 518/сутки => 16 058/мес (62 %). Короткий флап и так выходит
      из цикла раньше по условию while, поэтому лимит итераций режет только
      ДОЛГУЮ слепоту, которой занимаются сторожа ниже.
      * при недоступном облаке скрипт tuya_leak_query.py держит backoff
        (FAIL_BACKOFF 120 с / QUOTA_BACKOFF 300 с) и отдаёт кэш БЕЗ обращения к
        облаку, поэтому форсаж на отказавшем облаке почти бесплатен.
    После 2.5 мин форсаж прекращается: если датчики слепы дольше, это уже не
    переподключение, а отказ, которым занимаются сторожа 1748000001005 /
    1790200001001 / 1778900002001, а базовые 180 с продолжают давать
    3-минутное разрешение.
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.vannaia_moisture
    - binary_sensor.garazh_moisture
    - binary_sensor.kukhnia_moisture
    - binary_sensor.water_sensor_4_moisture
    to:
    - unavailable
    - unknown
    id: blind
  conditions:
  - condition: template
    alias: Датчик действительно слеп прямо сейчас
    value_template: >-
      {{ states('binary_sensor.vannaia_moisture') in ['unavailable', 'unknown']
         or states('binary_sensor.garazh_moisture') in ['unavailable', 'unknown']
         or states('binary_sensor.kukhnia_moisture') in ['unavailable', 'unknown']
         or states('binary_sensor.water_sensor_4_moisture') in ['unavailable', 'unknown'] }}
  - condition: template
    alias: Кулдаун 30 мин — жёсткая граница расхода квоты Tuya
    value_template: >-
      {{ this.attributes.last_triggered is none
         or (now() - this.attributes.last_triggered).total_seconds() > 1800 }}
  actions:
  - repeat:
      sequence:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.tuya_leak_cloud
      - delay: 00:00:30
      while:
      - condition: template
        value_template: >-
          {{ (repeat.index | int(0)) <= 5
             and (states('binary_sensor.vannaia_moisture') in ['unavailable', 'unknown']
                  or states('binary_sensor.garazh_moisture') in ['unavailable', 'unknown']
                  or states('binary_sensor.kukhnia_moisture') in ['unavailable', 'unknown']
                  or states('binary_sensor.water_sensor_4_moisture') in ['unavailable', 'unknown']) }}
- id: '1790500001001'
  alias: '🚗 EV: ночная заявка — учёт, перехват и поздний вердикт'
  description: 'Жизненный цикл ЗАЯВКИ на ночную зарядку (input_boolean.ev_night_requested).

    ЗАЧЕМ: 18.08 в 18:23 владелец запросил ночную зарядку на 19.08 03:45; в 19:49
    планировщик (ev_best2h.py через shell_command.ev_find_best2h) перезаписал input_datetime.ev_charge_start
    на 14:15, поэтому в 03:45 автозарядка 1778800001002 не сработала. Сторож 1790100001001
    ждал ТОТ ЖЕ helper, поэтому тоже промолчал — владелец не получил вообще ничего.

    ЧТО ДЕЛАЕТ: (1) отмечает, что зарядка в окне реально наблюдалась; (2) ловит перезапись
    планового времени поверх активной заявки и сообщает об этом; (3) поздний вердикт,
    если окно прошло без зарядки (работает даже после рестарта HA); (4) детерминированно
    гасит заявку — по завершении зарядки и по ограниченному сроку истечения.

    СРОК ИСТЕЧЕНИЯ: заявка гасится не позже начала окна + 3 ч (= конец окна + 1 ч).
    Плюс условие планировщика 1778800001001 перестаёт учитывать заявку в тот же момент
    НЕЗАВИСИМО от состояния флага, поэтому зависший флаг не может заблокировать планировщик
    навсегда.

    НИКОГДА не подаёт команд устройствам: только input_boolean/input_datetime и Telegram.'
  triggers:
  - alias: Зарядка реально пошла
    trigger: state
    entity_id: sensor.ev_charger_status
    to: charger_charging
    id: charging
  - alias: Зарядка завершена / машина отключена — как в 1748000001006
    trigger: state
    entity_id: sensor.ev_charger_status
    to:
    - charger_end
    - charger_free
    id: completed
  - alias: Кто-то перезаписал плановое время поверх активной заявки
    trigger: state
    entity_id: input_datetime.ev_charge_start
    id: overwritten
  - alias: Поздний вердикт и срок истечения заявки
    trigger: time_pattern
    minutes: /10
    id: sweep
  conditions: []
  actions:
  - variables:
      ws: '{{ state_attr(''input_datetime.ev_night_window_start'', ''timestamp'') | float(0)
        }}'
      seen: '{{ state_attr(''input_datetime.ev_night_charge_seen'', ''timestamp'') | float(0)
        }}'
      cs: '{{ state_attr(''input_datetime.ev_charge_start'', ''timestamp'') | float(0) }}'
      req: '{{ is_state(''input_boolean.ev_night_requested'', ''on'') }}'
  - choose:
    - alias: Зарядка пошла — отметить наблюдение (сообщений нет)
      conditions:
      - condition: trigger
        id: charging
      - condition: template
        value_template: '{{ req }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ev_night_charge_seen
        data:
          timestamp: '{{ now().timestamp() }}'
    - alias: Зарядка завершена внутри/после окна — детерминированно гасим заявку
      conditions:
      - condition: trigger
        id: completed
      - condition: template
        value_template: '{{ req }}'
      - condition: template
        alias: Только если окно УЖЕ началось. Иначе charger_free до окна (машина ещё
          не подключена в момент заявки) погасил бы заявку сразу и баг вернулся бы.
        value_template: '{{ (ws | float(0)) > 0 and now().timestamp() >= (ws | float(0))
          }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_night_requested
    - alias: Плановое время перезаписано поверх активной заявки — РОВНО одно сообщение
      conditions:
      - condition: trigger
        id: overwritten
      - condition: template
        value_template: '{{ req }}'
      - condition: template
        alias: Расхождение с запрошенным окном больше минуты (attribute-only изменения
          и запись того же значения не считаются)
        value_template: '{{ (ws | float(0)) > 0 and ((cs | float(0)) - (ws | float(0)))
          | abs > 60 }}'
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: |-
            {%- set s = states('sensor.ev_charger_status') -%}
            {%- set src = state_attr('sensor.ev_charger_status', 'src') -%}
            {%- set age = state_attr('sensor.ev_charger_status', 'stale_age') | float(-1) -%}
            {%- set fresh = (src in ['local', 'cloud']) and age >= 0 and age < 900 -%}
            {%- set dead = s in ['unavailable', 'unknown', 'none', 'None', ''] -%}
            {%- set causes = {'charger_free': 'машина не подключена', 'charger_insert': 'машина подключена, но зарядка не началась', 'charger_pause': 'зарядка на паузе', 'charger_end': 'зарядка уже завершена', 'charger_charging': 'зарядка идёт (статус свежий)'} -%}
            {%- if dead -%}{%- set cause = 'нет связи с зарядкой (статус недоступен)' -%}
            {%- elif s == 'cloud_error' -%}{%- set cause = 'нет свежих данных от зарядки (кэш/квота Tuya) — причину назвать нельзя' -%}
            {%- elif not fresh -%}{%- set cause = 'нет свежих данных от зарядки (кэш/квота Tuya) — причину назвать нельзя, последний известный статус устарел' -%}
            {%- else -%}{%- set cause = causes.get(s, 'статус ' ~ (s | e)) -%}
            {%- endif -%}
            {%- if fresh -%}{%- set stale_note = '' -%}
            {%- elif age >= 0 -%}{%- set stale_note = ' — данные НЕ свежие (источник ' ~ ((src if src is string else 'неизвестен') | e) ~ ', возраст ' ~ ((age / 60) | round(0) | int | string) ~ ' мин)' -%}
            {%- else -%}{%- set stale_note = ' — данные НЕ свежие (возраст неизвестен)' -%}
            {%- endif -%}
            {%- set wt = states('input_datetime.ev_night_window_start') -%}
            {%- set nv = states('input_datetime.ev_charge_start') -%}
            {%- set ctx = trigger.to_state.context if trigger is defined and trigger.to_state is defined and trigger.to_state is not none else none -%}
            {%- set pid = ctx.parent_id if ctx is not none else none -%}
            {%- set uid = ctx.user_id if ctx is not none else none -%}
            {%- if pid -%}{%- set who = 'автоматизация или скрипт HA' -%}
            {%- elif uid -%}{%- set who = 'внешняя запись под токеном (скрипт ev_day2h.py / ev_best2h.py через API, либо ручная правка helper)' -%}
            {%- else -%}{%- set who = 'источник записи не определён' -%}
            {%- endif -%}
            ⚠️ EV: ночная заявка перебита — зарядки в запрошенном окне НЕ будет

            Заявка была на {{ wt | e }} (окно 2 ч).
            Плановое время <code>input_datetime.ev_charge_start</code> теперь = {{ nv | e }}.

            Кто перебил: {{ who }}

            Заявка снята. Если ночная зарядка всё ещё нужна — нажми «Ночь 2ч» ещё раз.

            Это сообщение отправляется РОВНО ОДИН РАЗ на заявку.
      - alias: Вердикт доставлен — гасим заявку
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_night_requested
    - alias: Окно прошло — поздний вердикт и срок истечения заявки
      conditions:
      - condition: trigger
        id: sweep
      - condition: template
        value_template: '{{ req }}'
      - condition: template
        alias: Начало окна + 3 ч (= конец окна + 1 ч)
        value_template: '{{ (ws | float(0)) > 0 and now().timestamp() > ((ws | float(0))
          + 10800) }}'
      sequence:
      - alias: Сообщать только если зарядка в этом окне ни разу не наблюдалась
        if:
        - condition: template
          value_template: '{{ (seen | float(0)) < (ws | float(0)) }}'
        then:
        - action: telegram_bot.send_message
          data:
            chat_id: 100000000
            parse_mode: html
            message: |-
              {%- set s = states('sensor.ev_charger_status') -%}
              {%- set src = state_attr('sensor.ev_charger_status', 'src') -%}
              {%- set age = state_attr('sensor.ev_charger_status', 'stale_age') | float(-1) -%}
              {%- set fresh = (src in ['local', 'cloud']) and age >= 0 and age < 900 -%}
              {%- set dead = s in ['unavailable', 'unknown', 'none', 'None', ''] -%}
              {%- set causes = {'charger_free': 'машина не подключена', 'charger_insert': 'машина подключена, но зарядка не началась', 'charger_pause': 'зарядка на паузе', 'charger_end': 'зарядка уже завершена', 'charger_charging': 'зарядка идёт (статус свежий)'} -%}
              {%- if dead -%}{%- set cause = 'нет связи с зарядкой (статус недоступен)' -%}
              {%- elif s == 'cloud_error' -%}{%- set cause = 'нет свежих данных от зарядки (кэш/квота Tuya) — причину назвать нельзя' -%}
              {%- elif not fresh -%}{%- set cause = 'нет свежих данных от зарядки (кэш/квота Tuya) — причину назвать нельзя, последний известный статус устарел' -%}
              {%- else -%}{%- set cause = causes.get(s, 'статус ' ~ (s | e)) -%}
              {%- endif -%}
              {%- if fresh -%}{%- set stale_note = '' -%}
              {%- elif age >= 0 -%}{%- set stale_note = ' — данные НЕ свежие (источник ' ~ ((src if src is string else 'неизвестен') | e) ~ ', возраст ' ~ ((age / 60) | round(0) | int | string) ~ ' мин)' -%}
              {%- else -%}{%- set stale_note = ' — данные НЕ свежие (возраст неизвестен)' -%}
              {%- endif -%}
              {%- set wt = states('input_datetime.ev_night_window_start') -%}
              ⚠️ EV: ночное окно прошло, зарядки так и не было

              Заявка была на {{ wt | e }} (окно 2 ч) — окно закончилось, зарядка ни разу не переходила
              в <code>charger_charging</code>.

              Причина: {{ cause }}

              Статус <code>sensor.ev_charger_status</code>: {{ s | e }}{{ stale_note }}
              Счётчик <code>sensor.ev_charger_energy</code>: {{ states('sensor.ev_charger_energy') | e }} кВт·ч

              Это поздняя проверка (окно + 1 ч): она срабатывает даже если HA был выключен
              в момент планового старта. Отправляется РОВНО ОДИН РАЗ на заявку.
      - alias: Срок истечения — заявка гасится в любом случае, чтобы флаг не завис
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_night_requested
    - alias: Заявка неактивна, но флаг завис без записанного окна — снять
      conditions:
      - condition: trigger
        id: sweep
      - condition: template
        value_template: '{{ req and (ws | float(0)) <= 0 }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_night_requested
    - alias: Срок истечения РАЗОВОЙ ОТМЕНЫ — 24 ч. Стоит последней ветвью намеренно
        (choose берёт первое совпадение), чтобы никогда не перебить вердикт по заявке
      conditions:
      - condition: trigger
        id: sweep
      - condition: template
        value_template: '{{ is_state(''input_boolean.ev_charge_cancelled'', ''on'') }}'
      - condition: template
        alias: Метка постановки + 24 ч. Помощник отсутствует -> 0 -> условие истинно ->
          отмена снимается сразу, а не висит вечно
        value_template: '{{ now().timestamp() > ((state_attr(''input_datetime.ev_cancel_armed_at'',
          ''timestamp'') | float(0)) + 86400) }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_charge_cancelled
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: 'ℹ️ EV: разовая отмена зарядки истекла (24 ч) и снята автоматически.


            Ни одна плановая зарядка за это время так и не начиналась, поэтому отменять
            было нечего. Автоматическое расписание работает как обычно.


            Флаг <code>input_boolean.ev_charge_cancelled</code> выключен.'
  mode: queued
  max: 10
- id: '1791000001001'
  alias: '🚗 EV: машина не подключена — перенос зарядки (без команд устройствам)'
  description: 'Плановое окно наступило, а машина НЕ подключена: один раз сообщить и
    перенести зарядку на следующее самое дешёвое окно, вместо того чтобы молча пропустить
    сутки.

    СТРОГО ПО СВЕЖЕМУ СТАТУСУ. Пробная квота Tuya IoT Core исчерпана (code 28841004),
    поэтому sensor.ev_charger_status отдаётся из кэша (src=cache, stale_age ~18000 c)
    и заморожен на charger_insert. Утверждать «машина не подключена» по устаревшему
    значению нельзя, поэтому ветка требует src=cloud И stale_age < 900. Любой НЕсвежий
    статус — это случай сторожа 1790100001001, который прямо говорит «нет свежих данных,
    причину назвать нельзя».

    ЛИМИТ: не больше 2 переносов за местные сутки (input_number.ev_replan_count,
    обнуляется когда input_datetime.ev_replan_day не сегодняшний). Лимит считает сам
    /config/ev_replan_next.py; исчерпан — одно сообщение и всё, никаких повторов.

    ЗАДЕРЖКА 12 мин: после автозарядки 1778800001002 (её проверка 6 мин) и сторожа
    1790100001001 (10 мин), чтобы порядок сообщений был «почему» -> «что делаю».

    Разовая заявка «Зарядить ночью/днём» НЕ переносится: это осознанный выбор владельца
    на конкретное окно. Отменённое окно тоже не переносится.

    НИКОГДА не подаёт команд устройствам: только shell_command, который пишет helpers
    и отправляет Telegram.'
  triggers:
  - trigger: time
    at: input_datetime.ev_charge_start
    id: planned_start
  conditions:
  - condition: template
    value_template: '{{ not is_state(''input_boolean.ev_manual_mode'', ''on'') }}'
  actions:
  - alias: Дать автозарядке (6 мин) и сторожу (10 мин) высказаться первыми
    delay: 00:12:00
  - condition: template
    alias: Разовая заявка владельца не переносится
    value_template: '{{ not is_state(''input_boolean.ev_night_requested'', ''on'') }}'
  - condition: template
    alias: Это окно не отменял сам владелец
    value_template: >-
      {% set cs = state_attr('input_datetime.ev_charge_start', 'timestamp') | float(0) %}
      {% set cc = state_attr('input_datetime.ev_cancel_consumed', 'timestamp') | float(0)
      %} {{ cs <= 0 or ((cc - cs) | abs) > 60 }}
  - condition: template
    alias: ТОЛЬКО свежий charger_free. Кэш/квота/unavailable -> ничего не утверждаем и
      не переносим
    value_template: >-
      {% set s = states('sensor.ev_charger_status') %} {% set src =
      state_attr('sensor.ev_charger_status', 'src') %} {% set age =
      state_attr('sensor.ev_charger_status', 'stale_age') | float(-1) %} {{ s ==
      'charger_free' and src in ['local', 'cloud'] and age >= 0 and age < 900 }}
  - alias: Перенос и сообщение делает /config/ev_replan_next.py (лимит внутри скрипта)
    action: shell_command.ev_replan_next
  mode: single
- id: '1791100001001'
  alias: "\U0001F525 Тёплый пол: ручная выдержка — принять установку человека"
  description: >-
    Человек поставил температуру на тёплом полу -> запоминаем градусы, переводим пол в
    manual (иначе градусы не действуют: в preset auto термостат живёт по своей недельной
    программе) и не даём автоматике трогать этот пол input_number.floor_hold_hours часов.
    Человек отличается от автоматики по context.user_id: HA заполняет его, когда действие
    пришло от пользователя (UI, панель, приложение, REST-токен), и оставляет пустым для
    автоматизаций и скриптов — проверено на живом state_changed.
    Отдать пол расписанию — ОТДЕЛЬНЫЙ жест: явно выставить preset auto. Ветвление идёт по
    ТРИГГЕРУ, а не по текущему preset: первая версия смотрела на preset и снимала выдержку
    при установке температуры, потому что пол в тот момент как раз жил по расписанию.
  triggers:
  - trigger: state
    entity_id: climate.floor_heating
    attribute: temperature
    id: vannaia_temp
  - trigger: state
    entity_id: climate.floor_heating
    attribute: preset_mode
    id: vannaia_preset
  - trigger: state
    entity_id: climate.floor_heating_2
    attribute: temperature
    id: dushevaia_temp
  - trigger: state
    entity_id: climate.floor_heating_2
    attribute: preset_mode
    id: dushevaia_preset
  conditions:
  - alias: Это сделал человек, а не автоматика
    condition: template
    value_template: >-
      {{ trigger.to_state is not none and trigger.to_state.context is not none
         and trigger.to_state.context.user_id is not none }}
  actions:
  - delay: 00:00:05
  - variables:
      room_key: '{{ trigger.id.split(''_'')[0] }}'
      what: '{{ trigger.id.split(''_'')[1] }}'
      room: '{{ ''ванная'' if trigger.id.split(''_'')[0] == ''vannaia'' else ''душевая'' }}'
      climate_entity: '{{ ''climate.floor_heating'' if trigger.id.split(''_'')[0] == ''vannaia'' else ''climate.floor_heating_2'' }}'
      hold_dt: '{{ ''input_datetime.floor_hold_'' ~ trigger.id.split(''_'')[0] }}'
      hold_temp: '{{ ''input_number.floor_hold_temp_'' ~ trigger.id.split(''_'')[0] }}'
      cur_preset: '{{ state_attr(climate_entity, ''preset_mode'') | default(''unknown'') }}'
      cur_temp: '{{ state_attr(climate_entity, ''temperature'') | float(0) }}'
      hours: '{{ states(''input_number.floor_hold_hours'') | float(3) }}'
      forever: '{{ is_state(''input_boolean.floor_hold_forever'',''on'') }}'
      until_ts: '{{ (as_timestamp(now()) + hours * 3600) | round(0) | int }}'
  - choose:
    - alias: Человек явно выставил preset auto — отдаёт пол расписанию, выдержка снимается
      conditions:
      - condition: template
        value_template: '{{ what == ''preset'' and cur_preset == ''auto'' }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: '{{ hold_dt }}'
        data:
          timestamp: 0
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: >-
            🔥 Тёплый пол {{ room }}: вернул расписанию (preset <code>auto</code>) — веду по
            цене Nord Pool как обычно.
    default:
    - action: input_number.set_value
      target:
        entity_id: '{{ hold_temp }}'
      data:
        value: '{{ cur_temp }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: '{{ hold_dt }}'
      data:
        timestamp: '{{ until_ts }}'
    # Градусы действуют только в manual: в preset auto термостат ведёт свою недельную
    # программу и установка человека ничего не меняет. Поэтому пол переводится в manual и
    # температура выставляется ещё раз — уже там, где она работает.
    - if:
      - condition: template
        value_template: '{{ cur_preset != ''manual'' }}'
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ climate_entity }}'
        data:
          hvac_mode: heat_cool
      - action: climate.set_preset_mode
        target:
          entity_id: '{{ climate_entity }}'
        data:
          preset_mode: manual
      - action: climate.set_temperature
        target:
          entity_id: '{{ climate_entity }}'
        data:
          temperature: '{{ cur_temp }}'
    - action: telegram_bot.send_message
      data:
        chat_id: 100000000
        parse_mode: html
        message: >-
          🔥 Тёплый пол {{ room }}: держу {{ cur_temp | round(1) }}°C. {% if forever
          %}Автоматика не тронет, пока не отменишь.{% else %}Автоматика не тронет до {{
          until_ts | timestamp_custom('%H:%M', true) }}.{% endif %}
        inline_keyboard: [[["Отменить выдержку","/floor_hold_off"],["+3 часа","/floor_hold_plus"]]]
  mode: restart
  max_exceeded: silent
- id: '1791100001002'
  alias: "\U0001F525 Тёплый пол: выдержка истекла"
  description: >-
    Выдержка кончилась -> сообщить и один раз пересчитать этот пол по текущей цене, вызвав
    его собственную автоматизацию Nord Pool. Автоматизация ищется по id, а не по слагу:
    слаги в этом доме расходятся с id.
  triggers:
  - trigger: state
    entity_id: binary_sensor.floor_hold_vannaia
    from: 'on'
    to: 'off'
    id: vannaia
  - trigger: state
    entity_id: binary_sensor.floor_hold_dushevaia
    from: 'on'
    to: 'off'
    id: dushevaia
  conditions: []
  actions:
  - variables:
      room: '{{ ''ванная'' if trigger.id == ''vannaia'' else ''душевая'' }}'
      wanted_id: '{{ ''1767188164410'' if trigger.id == ''vannaia'' else ''1776085158491'' }}'
      target_automation: >-
        {{ states.automation | selectattr('attributes.id','eq', wanted_id)
           | map(attribute='entity_id') | list | first | default('') }}
  - action: telegram_bot.send_message
    data:
      chat_id: 100000000
      parse_mode: html
      message: >-
        🔥 Тёплый пол {{ room }}: ручная выдержка закончилась — снова веду по цене Nord Pool.
  - if:
    - condition: template
      value_template: '{{ target_automation | length > 0 }}'
    then:
    - action: automation.trigger
      target:
        entity_id: '{{ target_automation }}'
      data:
        skip_condition: false
  mode: queued
  max: 4
- id: '1791100001003'
  alias: "\U0001F525 Тёплый пол: сторож ручной выдержки"
  description: >-
    Пока выдержка активна, ЛЮБАЯ не-человеческая запись в этот пол возвращается назад к
    градусам владельца. Это второй слой: два запрета стоят в автоматизациях Nord Pool, а
    сторож ловит всё остальное — ночную экономию, собственную недельную программу
    термостата и любого писателя, которого мы ещё не нашли. Режим «Жара» — сознательное
    исключение: это явное действие владельца и оно должно побеждать.
  triggers:
  - trigger: state
    entity_id: climate.floor_heating
    attribute: temperature
    id: vannaia_temp
  - trigger: state
    entity_id: climate.floor_heating
    attribute: preset_mode
    id: vannaia_preset
  - trigger: state
    entity_id: climate.floor_heating_2
    attribute: temperature
    id: dushevaia_temp
  - trigger: state
    entity_id: climate.floor_heating_2
    attribute: preset_mode
    id: dushevaia_preset
  conditions:
  - alias: Это НЕ человек — человека обрабатывает 1791100001001
    condition: template
    value_template: >-
      {{ trigger.to_state is not none and trigger.to_state.context is not none
         and trigger.to_state.context.user_id is none }}
  - alias: По этому полу активна ручная выдержка
    condition: template
    value_template: '{{ is_state(''binary_sensor.floor_hold_'' ~ trigger.id.split(''_'')[0], ''on'') }}'
  - alias: Режим «Жара» побеждает выдержку
    condition: state
    entity_id: input_boolean.rezhim_zhara
    state: 'off'
  actions:
  # ВАЖНО: mode ниже — single, а не restart. Запись в пол меняет и preset, и temperature в
  # одну секунду, и при restart второй триггер убивал первый прогон до конца задержки
  # (в трассировке: cancelled/aborted, ни одного вызова сервиса). Одной коррекции достаточно,
  # поэтому лишние триггеры надо игнорировать, а не перезапускаться на них.
  - delay: 00:00:02
  - variables:
      climate_entity: '{{ ''climate.floor_heating'' if trigger.id.split(''_'')[0] == ''vannaia'' else ''climate.floor_heating_2'' }}'
      want_temp: '{{ states(''input_number.floor_hold_temp_'' ~ trigger.id.split(''_'')[0]) | float(0) }}'
      cur_temp: '{{ state_attr(climate_entity, ''temperature'') | float(0) }}'
      cur_preset: '{{ state_attr(climate_entity, ''preset_mode'') | default(''unknown'') }}'
  - alias: Возвращаем только если действительно сбито
    condition: template
    value_template: >-
      {{ want_temp > 0 and (cur_preset != 'manual' or ((cur_temp - want_temp) | abs) > 0.1) }}
  - action: climate.set_hvac_mode
    target:
      entity_id: '{{ climate_entity }}'
    data:
      hvac_mode: heat_cool
  - action: climate.set_preset_mode
    target:
      entity_id: '{{ climate_entity }}'
    data:
      preset_mode: manual
  - action: climate.set_temperature
    target:
      entity_id: '{{ climate_entity }}'
    data:
      temperature: '{{ want_temp }}'
  mode: single
  max_exceeded: silent

# --- ГИДРОФОР: ВРЕМЯ РАБОТЫ И НОЧНАЯ ПРОВЕРКА (2026-08-26, окна расширены 27-го) ---
# Зачем: понять, не пора ли подкачивать грушу расширительного бака (100 л) и нет ли
# утечки. Число ПУСКОВ этой розеткой не измеряется (см. большой комментарий у
# sensor.pump_minutes_today в configuration.yaml), поэтому меряем то, что меряется
# надёжно: ВРЕМЯ работы насоса, и отдельно — работу в глухие ночные часы.
#
# ПОЧЕМУ ОКНА, А НЕ ТОЧНОЕ ВРЕМЯ. Первая же ночь (27.08) вердикта не дала: версия
# с замером ровно в 01:00 и ровно в 04:00 требовала, чтобы розетка была онлайн в две
# конкретные секунды, а она офлайн ~78% времени — то есть вердикт выпадал бы примерно
# раз в двадцать ночей. Теперь снимок берётся ПОСЛЕДНИМ удачным чтением в окне
# 00:05-01:30, а вердикт — ПЕРВЫМ удачным чтением в окне 04:00-05:30. Между ними
# остаётся 2.5-4.5 часа гарантированной тишины, а шанс поймать оба конца высок:
# когда розетка на связи, она отдаёт показания каждые ~36 с.
# Счётчик накопительный внутри устройства, поэтому пропуски внутри окна ничего не
# портят: энергия за офлайн не теряется, только сообщается позже.
- id: '1791200001001'
  alias: '💧 Насос: сброс ночного окна в 00:00'
  description: >-
    Ночная проверка гидрофора, часть 1 из 3. В 00:00 обнуляет прошлую ночь: снимок
    и результат в -1 («замера нет»), длину окна в 0. Без этого сброса ночь, в которую
    розетка не появилась ни разу, унаследовала бы вчерашний снимок, и вердикт посчитал
    бы разницу за сутки, приняв суточный расход за ночной.
  triggers:
    - trigger: time
      at: '00:00:00'
  conditions: []
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.gidro_night_start
      data:
        value: -1
    - action: input_number.set_value
      target:
        entity_id: input_number.gidro_night_kwh
      data:
        value: -1
    - action: input_number.set_value
      target:
        entity_id: input_number.gidro_night_hours
      data:
        value: 0
  mode: single

- id: '1791200001004'
  alias: '💧 Насос: снимок счётчика (окно 00:05-01:30)'
  description: >-
    Часть 2 из 3. Каждые 5 минут в окне 00:05-01:30 переписывает снимок счётчика,
    пока розетка на связи. В итоге остаётся ПОСЛЕДНЕЕ удачное чтение перед началом
    тишины — чем позже, тем чище окно. Если за все 90 минут розетка не появилась,
    снимок остаётся -1 и вердикта ночью не будет: молчание честнее выдуманного числа.
  triggers:
    - trigger: time_pattern
      minutes: /5
  conditions:
    - condition: time
      after: '00:05:00'
      before: '01:30:00'
    - condition: template
      value_template: "{{ states('sensor.zigbee_plug_2_total_energy') | float(-1) >= 0 }}"
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.gidro_night_start
      data:
        value: "{{ states('sensor.zigbee_plug_2_total_energy') | float(0) }}"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.gidro_night_start_at
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  mode: single

- id: '1791200001002'
  alias: '💧 Насос: ночная проверка (окно 04:00-05:30)'
  description: >-
    Часть 3 из 3. Первым удачным чтением после 04:00 считает, сколько насос работал
    за ночь. В это время водоразбора нет, поэтому работа насоса означает либо утечку
    (кран, сливной бачок, обратный клапан), либо потерю воздуха в расширительном баке.
    ЗАМЕРЕННАЯ НОРМА ЭТОГО ДОМА: 0.03 кВт·ч за 36 часов наблюдения (6 ночей), то есть
    ~1 Вт·ч в час, около 0.1 минуты работы в час.
    Порог считается НА ЧАС окна: max(0.06; 0.03 x часы) — для типичного окна 3 ч это
    0.09 кВт·ч, примерно 5 минут работы, тридцатикратная норма. Плоский порог врал бы:
    окно бывает и 2.5, и 4.5 часа.
    Работает один раз за ночь: как только результат записан (kwh >= 0), условие его
    больше не пускает. Если розетка не появилась к 05:30 — вердикта и уведомления нет.
    Мощность насоса 992 Вт замерена по sensor.zigbee_plug_2_power.
  triggers:
    - trigger: time_pattern
      minutes: /5
  conditions:
    - condition: time
      after: '04:00:00'
      before: '05:30:00'
    - condition: template
      value_template: >-
        {{ states('input_number.gidro_night_start') | float(-1) >= 0
           and states('input_number.gidro_night_kwh') | float(-1) < 0
           and states('sensor.zigbee_plug_2_total_energy') | float(-1) >= 0 }}
  actions:
    - variables:
        night_kwh: >-
          {{ [ (states('sensor.zigbee_plug_2_total_energy') | float(0))
               - (states('input_number.gidro_night_start') | float(0)), 0 ] | max | round(3) }}
        hours: >-
          {{ ((as_timestamp(now())
               - as_timestamp(states('input_datetime.gidro_night_start_at'), 0)) / 3600) | round(2) }}
    - choose:
        - alias: Окно нормальной длины — записываем результат
          conditions:
            # 1.5-6 ч: защита от протухшего снимка (например, если сброс в 00:00 не прошёл)
            - condition: template
              value_template: "{{ 1.5 <= (hours | float(0)) <= 6 }}"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.gidro_night_kwh
              data:
                value: "{{ night_kwh | float(0) }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.gidro_night_hours
              data:
                value: "{{ hours | float(0) }}"
            - choose:
                - alias: Ночью насос работал заметно — утечка или севшая груша
                  conditions:
                    - condition: template
                      value_template: >-
                        {{ (night_kwh | float(0)) > [0.06, 0.03 * (hours | float(0))] | max }}
                  sequence:
                    - action: telegram_bot.send_message
                      data:
                        chat_id: 100000000
                        parse_mode: html
                        message: >-
                          💧 Насос работал ночью: {{ (night_kwh | float(0) / 0.992 * 60) | round(1) }} мин
                          за {{ hours }} ч тишины ({{ night_kwh }} кВт·ч).
                          Ночью воду никто не берёт, значит либо утечка (кран, сливной бачок,
                          обратный клапан), либо расширительный бак потерял воздух.
                          Норма для этого дома — меньше минуты за всю ночь.
                          Проверить грушу: обесточить насос, слить воду из системы, замерить
                          давление на золотнике бака — должно быть на 0.2 бар ниже давления
                          включения насоса (обычно 1.4 бар при реле 1.6/3.0).
                          Если из золотника идёт вода — груша порвана, бак под замену.
  mode: single

- id: '1791200001003'
  alias: '💧 Насос: суточный итог и среднее за неделю'
  description: >-
    В 23:59 — НАМЕРЕННО до полуночного снимка в 00:01, иначе разница с ним уже
    обнулена — берёт sensor.pump_minutes_today и подмешивает в плавающее среднее
    за неделю: avg7 += (сегодня - avg7) / 7. Среднее нужно вечернему отчёту, чтобы
    показывать «насос 69 мин, обычно ~65».
    УВЕДОМЛЕНИЯ ТУТ НЕТ НАМЕРЕННО: суточный рост — это чаще всего законный полив
    (замерено: июнь 230 мин/сут против 65 мин/сут в августе), алерт на него был бы
    шумом. Специфичный признак неисправности — ночная проверка (1791200001002).
  triggers:
    - trigger: time
      at: '23:59:00'
  conditions:
    - condition: template
      value_template: "{{ states('sensor.pump_minutes_today') | float(-1) >= 0 }}"
    # База отсчёта должна быть свежей. Полуночный снимок при офлайне розетки штатно
    # СОХРАНЯЕТ прежнее значение (ноль соврал бы), и тогда «за сутки» покрывает больше
    # суток: 27.08 вышло 112 мин при возрасте базы 27.3 ч. Впустить такое число в
    # среднее — значит тихо задрать «обычно ~N» и обесценить сравнение.
    - condition: template
      value_template: >-
        {{ (state_attr('sensor.pump_minutes_today', 'baseline_age_h') | float(999)) <= 26 }}
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.gidro_minutes_avg7
      data:
        value: >-
          {% set t = states('sensor.pump_minutes_today') | float(0) %}
          {% set a = states('input_number.gidro_minutes_avg7') | float(-1) %}
          {{ (t if a < 0 else a + (t - a) / 7) | round(1) }}
  mode: single
