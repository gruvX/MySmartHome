- id: '1789200001001'
  alias: "\U0001F6E1️ HA Startup Grace (restored)"
  description: >-
    FIX B: восстанавливает жизненный цикл input_boolean.ha_startup_grace, потерянный
    из-за коллизии id (leak-v4 занял 1748000001001 — прежний id менеджера grace). НЕ
    меняю id leak-v4, чтобы не осиротить сущность; вместо этого создаю отдельную
    автоматизацию с уникальным id. При старте HA: grace ON → задержка 15 мин → grace
    OFF. ВАЖНО: reload != homeassistant.start, поэтому automation.reload НЕ
    переустанавливает helper в ON. mode: restart — перезапуск HA во время окна grace
    предсказуемо перезапускает таймер (а не оставляет helper зависшим в ON).
  mode: restart
  triggers:
  - trigger: homeassistant
