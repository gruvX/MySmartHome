  mode: single
- id: '1779200001002'
  alias: "\U0001F6B6 Присутствие: Владелец ушёл"
  description: Уход из дома → выключить акцентную подсветку + уведомление
  triggers:
  - trigger: state
    entity_id: binary_sensor.prisutstvie_owner
    from: 'on'
    to: 'off'
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state == ''off'' }}'
  actions:
  - variables:
      lights_on_count: '{% set ns = namespace(n=0) %}{% for e in [''switch.kukhnia_poloski_switch_1'',''switch.kukhnia_poloski_switch_2'',''switch.gostinnaia_zanaveska_zona_switch_1'',''switch.gostinnaia_zanaveska_zona_switch_2'',''switch.svet_tv_zona_switch_1'',''switch.svet_tv_zona_switch_2'',''switch.smart_switch_2ch_switch_1'',''switch.smart_switch_2ch_switch_2'',''light.dream_color_rgb'']
        %}  {% if states(e) == ''on'' %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor
        %}{{ ns.n }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ lights_on_count | int > 0 }}'
      sequence:
      - action: homeassistant.turn_off
        target:
          entity_id:
          - switch.kukhnia_poloski_switch_1
          - switch.kukhnia_poloski_switch_2
          - switch.gostinnaia_zanaveska_zona_switch_1
          - switch.gostinnaia_zanaveska_zona_switch_2
          - switch.svet_tv_zona_switch_1
          - switch.svet_tv_zona_switch_2
          - switch.smart_switch_2ch_switch_1
          - switch.smart_switch_2ch_switch_2
          - light.dream_color_rgb
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: "\U0001F6B6 Владелец ушёл из дома\n\nАвтоматически выключена акцентная
            подсветка ({{ lights_on_count }} светильников)."
    default: []
  mode: single
- id: '1779200001003'
  alias: "\U0001F3E0 Присутствие: Владелец вернулся"
  description: Возвращение домой → приветственное уведомление с состоянием дома
  triggers:
  - trigger: state
    entity_id: binary_sensor.prisutstvie_owner
    from: 'off'
    to: 'on'
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state == ''on'' }}'
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.telegram_owner
    data:
      message: "\U0001F3E0 Добро пожаловать домой!\n\n{% set p = states('sensor.nord_pool_lv_current_price')
        | float(0) %}{% set e = '\U0001F7E2' if p <= 0.04 else ('\U0001F7E1' if p
        <= 0.10 else '\U0001F534') %}{{ e }} Электричество: {{ p }} €/кВт·ч\n\U0001F525
        Котёл: {{ states('sensor.boiler_mode') }}\n\U0001F4A7 ГВС: {{ states('sensor.boiler_cwu_temperature')
        }}°C\n\U0001F321 CO: {{ states('sensor.boiler_co_temperature') }}°C"
  mode: single
- id: '1779200002001'
  alias: "\U0001F525 Задымление — сирена"
  description: Дым подтверждён 10 сек → сирена high 5 мин + Telegram
  triggers:
  - trigger: state
    entity_id: binary_sensor.wifi_th_smoke_sensor_smoke
    to: 'on'
    for: 00:00:10
    id: smoke_on
  - trigger: state
    entity_id: binary_sensor.wifi_th_smoke_sensor_smoke
    to: 'off'
    id: smoke_off
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.from_state is not
      none }}'
  - condition: template
    value_template: '{{ trigger.from_state.state not in [''unavailable'',''unknown'']
      }}'
  actions:
  # P0: the alert goes out BEFORE any device command. Previously the order was
  # select -> number -> siren.turn_on -> telegram, so a Tuya `sign invalid`
  # (ApiRequestException, not a HomeAssistantError, NOT caught by
  # continue_on_error) at the siren step aborted the whole script: no siren AND
  # no smoke message at all. The device chain now runs fire-and-forget via
  # script.turn_on, which cannot abort this automation, and the outcome is read
  # back and reported.
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''smoke_on'' }}'
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: "\U0001F525 ЗАДЫМЛЕНИЕ!\n\n{{ now().strftime('%d.%m.%Y %H:%M')
            }}\nДатчик дыма сработал!\n\U0001F514 Сирена активирована (5 мин)\n\nПроверь
            немедленно! Если пожар — эвакуируйся!"
          inline_keyboard:
          - - - "\U0001F515 Выключить сирену"
              - /siren_off
      - action: script.turn_on
        target:
          entity_id: script.alarm_smoke_siren
      - wait_template: '{{ is_state(''siren.alarm'', ''on'') }}'
        timeout: 00:00:30
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ not is_state(''siren.alarm'', ''on'') }}'
        then:
        - action: telegram_bot.send_message
          data:
            chat_id: 100000000
            parse_mode: html
            message: |-
              🚨 СИРЕНА НЕ ВКЛЮЧИЛАСЬ при задымлении!
              <code>siren.alarm</code> за 30 сек не перешла в <code>on</code> — сейчас <code>{{ states('siren.alarm') }}</code>.
              Звукового оповещения о дыме НЕТ. Проверь дом немедленно и буди людей сам!
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''smoke_off'' }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.alarm_smoke_siren_off
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: '✅ Задымление снято


            {{ now().strftime(''%d.%m.%Y %H:%M'') }}

            Датчик дыма больше не фиксирует дым. Сирена выключена.'
  mode: single
- id: '1779200003001'
  alias: "\U0001F6E1 Охрана — тревога при срабатывании"
  description: 'Когда охрана включена: дверь/движение → сирена + Telegram с кнопкой
    снятия'
  triggers:
  - trigger: state
    entity_id: binary_sensor.door_sensor_door
    to: 'on'
    for: 00:00:05
    id: door
  - trigger: state
    entity_id: binary_sensor.motion_sensor_motion
    to: 'on'
    for: 00:00:05
    id: motion
  conditions:
  - condition: state
    entity_id: input_boolean.security_armed
    state: 'on'
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.from_state.state
      not in [''unavailable'',''unknown''] }}'
  actions:
  # P0: the alert goes out BEFORE any device command. Previously the order was
  # select -> number -> siren.turn_on -> telegram, so a Tuya `sign invalid`
  # (ApiRequestException, not a HomeAssistantError, NOT caught by
  # continue_on_error) at the siren step aborted the whole script: no siren AND
  # no intrusion message at all. The device chain now runs fire-and-forget via
  # script.turn_on, which cannot abort this automation, and the outcome is read
  # back and reported.
  - variables:
      src: "{% if trigger.id == 'door' %}\U0001F6AA Входная дверь открыта{% else %}\U0001F3C3
        Обнаружено движение{% endif %}"
  - action: telegram_bot.send_message
    data:
      chat_id: 100000000
      message: "\U0001F6A8 ТРЕВОГА!\n\n{{ now().strftime('%d.%m.%Y %H:%M:%S') }}\n{{
        src }}\n\U0001F514 Сирена активирована (2 мин)"
      inline_keyboard:
      - - - ✅ Снять охрану
          - /security_disarm
      - - - "\U0001F515 Только сирену"
          - /siren_off
  - action: script.turn_on
    target:
      entity_id: script.alarm_security_siren
  - wait_template: '{{ is_state(''siren.alarm'', ''on'') }}'
    timeout: 00:00:30
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ not is_state(''siren.alarm'', ''on'') }}'
    then:
    - action: telegram_bot.send_message
      data:
        chat_id: 100000000
        parse_mode: html
        message: |-
          🚨 СИРЕНА НЕ ВКЛЮЧИЛАСЬ по тревоге охраны!
          <code>siren.alarm</code> за 30 сек не перешла в <code>on</code> — сейчас <code>{{ states('siren.alarm') }}</code>.
          Тревога зафиксирована, но звука в доме НЕТ.
  mode: single
  max_exceeded: silent
- id: '1748100001001'
  alias: ⚡ Цены дня — Elering
  description: Генерирует /config/www/today_prices.json (сегодня + завтра, когда
    цены опубликованы) для планшета и Mini App. Только данные — ничем не управляет.
  trigger:
  - platform: time
    at: 00:10:00
  - platform: time
    at: '13:10:00'
  - platform: time
    at: '14:20:00'
  - platform: time
    at: '15:20:00'
  - platform: time
    at: '16:20:00'
  - platform: time
    at: '18:20:00'
  - platform: homeassistant
    event: start
  action:
  - service: shell_command.update_today_prices
  mode: single
- id: '1748000001002'
  alias: "\U0001F525 Турбо нагрев — активация"
  description: >-
    Вкл. электробойлер + уставка ГВС 65°C. Авто-выкл. через 1 ч.
    P0 containment: физические команды вынесены в script.turbo_hot_water_start и
    запускаются через script.turn_on (fire-and-forget). Раньше они стояли inline,
    и Tuya `sign invalid` (ApiRequestException, НЕ HomeAssistantError —
    continue_on_error его не ловит) обрывал автоматизацию ДО `delay: 01:00:00`.
    input_boolean.turbo_hot_water оставался ON навсегда, а пока он ON, ветка
    «бойлер ВЫКЛ по цене» автоматизации 1766138420302 заблокирована — бойлер
    больше никогда не выключался по дорогой цене. Внешняя страховка:
    1790300001001 гасит зависший флаг через 1 ч 30 мин.
  triggers:
  - trigger: state
    entity_id: input_boolean.turbo_hot_water
    to: 'on'
  conditions: []
  actions:
  - action: script.turn_on
    target:
      entity_id: script.turbo_hot_water_start
  - action: notify.send_message
    target:
      entity_id: notify.telegram_owner
    data:
      message: "\U0001F525 ТУРБО НАГРЕВ ВКЛ\nЭлектробойлер + котёл ГВС 65°C\nАвто-выкл.
        через 1 ч."
  - delay: 01:00:00
  - condition: state
    entity_id: input_boolean.turbo_hot_water
    state: 'on'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.turbo_hot_water
  mode: restart
- id: '1748000001003'
  alias: "\U0001F525 Турбо нагрев — деактивация"
  description: >-
    Восстанавливает уставку ГВС после турбо режима. P0 containment: оба
    rest_command к котлу ecoNET вынесены в script.turbo_hot_water_restore и
    запускаются fire-and-forget, иначе таймаут котла обрывал автоматизацию и
    владелец не получал подтверждения, что турбо снят.
  triggers:
  - trigger: state
    entity_id: input_boolean.turbo_hot_water
    to: 'off'
  conditions: []
  actions:
  - action: script.turn_on
    target:
      entity_id: script.turbo_hot_water_restore
  - action: notify.send_message
    target:
      entity_id: notify.telegram_owner
    data:
      message: "\U0001F525 Турбо нагрев ВЫКЛ. Уставка ГВС восстановлена."
  mode: single
- id: '1790300001001'
  alias: "\U0001F525 Турбо нагрев — предохранитель (флаг завис)"
  description: >-
    Страховка к 1748000001002. Штатная длительность турбо — 1 ч. Если
    input_boolean.turbo_hot_water висит ON дольше 1 ч 30 мин, цикл не довёл до
    конца: обрыв Tuya, рестарт HA во время `delay`, либо флаг включили руками и
    забыли. Пока флаг ON, ветка «бойлер ВЫКЛ по цене» автоматизации
    1766138420302 заблокирована, т.е. бойлер греет и при дорогом электричестве.
    Гасим флаг и сообщаем ОДИН раз (повторно не сработает, пока флаг снова не
    провисит 1 ч 30 мин). Ничем физически не управляет: гашение флага само
    запускает 1748000001003, которая вернёт уставку ГВС котла.
  triggers:
  - trigger: state
    entity_id: input_boolean.turbo_hot_water
    to: 'on'
    for: 01:30:00
  conditions:
  - condition: state
    entity_id: input_boolean.turbo_hot_water
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.turbo_hot_water
  - action: notify.send_message
    target:
      entity_id: notify.telegram_owner
    data:
      message: >-
        ⚠️ Турбо нагрев висел ВКЛ дольше 1 ч 30 мин — сброшен принудительно.
        Бойлер снова управляется по цене Nord Pool (ВКЛ ≤0.10 EUR/kWh).
  mode: single
  max_exceeded: silent
- id: '1790300001002'
  alias: "\U0001F525 Бойлер: сброс ручного режима"
  description: >-
    Зеркало 1748000001006 (EV). input_boolean.boiler_manual_mode ставится
    кнопками Telegram /boiler_on и /boiler_off и на это время выключает ценовые
    ветки 1766138420302, чтобы решение владельца не отменялось следующим шагом
    Nord Pool (шаг теперь 15 мин). Через 3 ч дом сам возвращается под управление
    ценой — ручное решение не остаётся навсегда.
    ВАЖНО: перезапуск HA обнуляет отсчёт `for:` (last_changed становится
    временем старта), поэтому после рестарта ручной режим может продержаться ещё
    до 3 ч. Сама автоматизация ничего физически не переключает: следующий
    пересчёт цены приведёт бойлер в нужное состояние.
  triggers:
  - trigger: state
    entity_id: input_boolean.boiler_manual_mode
    to: 'on'
    for: 03:00:00
  conditions:
  - condition: state
    entity_id: input_boolean.boiler_manual_mode
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.boiler_manual_mode
  - action: notify.send_message
    target:
      entity_id: notify.telegram_owner
    data:
      message: >-
        🔥 Бойлер: ручной режим снят по тайм-ауту (3 ч). Дальше — по цене
        Nord Pool (ВКЛ ≤0.10 EUR/kWh).
  mode: single
  max_exceeded: silent
- id: '1790300001003'
  alias: 📣 Изменения в доме
  description: 'B1. Один сводный дайджест вместо потока сообщений «розетка X включилась». Первое
    РЕАЛЬНОЕ переключение любого из отслеживаемых устройств открывает окно коалесценции 2 минуты;
    затем уходит ОДНО сообщение со всеми изменениями за это окно, текущей ценой Nord Pool и оценкой,
    надолго ли это (считает shell_command.price_forecast по /config/www/today_prices.json; если посчитать
    нельзя — так и пишет, а не выдумывает). Не может сработать на переподключении Tuya: на триггерах
    розеток стоит not_from [unavailable, unknown], а верхнеуровневое условие дополнительно отбрасывает
    любой переход, у которого from_state или to_state = unavailable / unknown (это же условие ловит
    и климат-триггер по атрибуту). Не может продублироваться без изменения состояния: mode single
    + max_exceeded silent, поэтому переключения ВНУТРИ окна не запускают второй прогон, а без нового
    перехода автоматизация вообще не стартует. Тишина 23:00–07:00 проверяется В МОМЕНТ ТРИГГЕРА (условие,
    а не проверка после delay), поэтому интервал не теряется на стыке: всё, что переключилось в тихие
    часы, попадает в секцию «За ночь» утреннего брифинга 1778700001001. Аварийные автоматизации (протечка,
    дым, охрана, недоступный кран, заморозка Tuya, сбой EV, авария котла) сюда не входят и шлют немедленно
    в любой час.

    2026-08-16: тело (2-минутное окно + shell_command + отправка) перенесено в script.house_change_digest
    и запускается fire-and-forget. Семантика та же (single + max_exceeded silent теперь у скрипта),
    но висящий delay больше не уничтожается перезагрузкой автоматизаций (automation.reload молча
    убивает выполняющиеся прогоны — ни ошибки, ни сообщения).'
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: state
    entity_id:
    - switch.smart_plug_2_socket_1
    - switch.kalarifer_socket_1
    - switch.akvarium_svet_socket_1
    - switch.retserkuliatsiia_goriachai_vody_socket_1
    - switch.zigbee_plug_2_socket_1
    to:
    - 'on'
    - 'off'
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id:
    - climate.floor_heating
    - climate.floor_heating_2
    attribute: preset_mode
    to:
    - auto
    - manual
  conditions:
  - condition: template
    alias: Реальный переход, а не переподключение Tuya
    value_template: "{{ trigger is defined and trigger.from_state is defined\n   and trigger.from_state\
      \ is not none and trigger.to_state is not none\n   and trigger.from_state.state not in ['unavailable',\
      \ 'unknown']\n   and trigger.to_state.state not in ['unavailable', 'unknown'] }}"
  - condition: template
    alias: Тихие часы 23:00-07:00 — молчим, утренний брифинг расскажет
    value_template: '{{ not (now().hour >= 23 or now().hour < 7) }}'
  actions:
  - alias: Окно коалесценции и отправка — в скрипте, чтобы перезагрузка автоматизаций не убивала
      висящий delay без следа
    action: script.turn_on
    target:
      entity_id: script.house_change_digest
    data:
      variables:
        t0: '{{ now().timestamp() }}'
        trig: '{{ trigger.entity_id | default('''') }}'
- id: '1790300001004'
  alias: "\U0001F3E0 Сводка по дому (14:30 и 19:00)"
  description: >-
    B4. Две плановые сводки в день, только уведомление — ничем не управляет.
    14:30 выбрано после публикации day-ahead (~14:00), поэтому завтрашние цены,
    если они уже есть, попадают в сообщение; 19:00 — перед вечерним пиком.
    Каждое значение честное: нечитаемый сенсор печатает «нет данных», а не 0, и
    такие приборы не попадают в сумму kWh. Стоимость — предварительная, по средней
    цене дня (та же формула, что в отчёте 1778700001003), поэтому помечена ≈.
    Прогноз «надолго ли» и экстремумы дня считает shell_command.price_forecast по
    /config/www/today_prices.json; при сбое печатает «нет данных».
    Вместе с утренним брифингом (07:00) и отчётом потребления (23:00) это ровно
    4 плановых сообщения в сутки.
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: time
    at: '14:30:00'
  - trigger: time
    at: '19:00:00'
  conditions: []
  actions:
  - action: shell_command.price_forecast
    response_variable: pf
    continue_on_error: true
  - variables:
      pf_raw: '{{ pf.stdout if (pf is defined and pf.stdout is defined and pf.stdout
        is string) else '''' }}'
  - action: telegram_bot.send_message
    data:
      chat_id: 100000000
      parse_mode: html
      message: |-
        {%- set pf_raw = pf_raw | default('', true) -%}
        {%- set ok = (pf_raw | regex_findall('(?m)^ok=(.*)$') | first | default('0')) | trim == '1' -%}
        {%- macro pf(key) %}{{ (pf_raw | regex_findall('(?m)^' ~ key ~ '=(.*)$') | first | default('')) | trim }}{% endmacro -%}
        {%- set rest_min = pf('rest_min') | trim -%}
        {%- set rest_min_at = pf('rest_min_at') | trim -%}
        {%- set rest_max = pf('rest_max') | trim -%}
        {%- set rest_max_at = pf('rest_max_at') | trim -%}
        {%- set has_tmr = pf('has_tomorrow') | trim == '1' -%}
        {%- set tmr_min = pf('tomorrow_min') | trim -%}
        {%- set tmr_min_at = pf('tomorrow_min_at') | trim -%}
        {%- set tmr_max = pf('tomorrow_max') | trim -%}
        {%- set tmr_max_at = pf('tomorrow_max_at') | trim -%}
        {%- set b_txt = pf('boiler_txt') | trim -%}
        {%- set t_txt = pf('towel_txt') | trim -%}
        {%- set pf_err = pf('error') | trim -%}
        {%- set p = states('sensor.nord_pool_lv_current_price') | float(none) -%}
        {%- macro sw(eid) %}
        {%- set s = states(eid) -%}
        {%- if s == 'on' %}вкл{% elif s == 'off' %}выкл{% else %}нет данных ({{ s }}){% endif %}
        {%- endmacro -%}
        {%- set loads = [
          ('switch.smart_plug_2_socket_1', 'Бойлер (ТЭН)'),
          ('switch.kalarifer_socket_1', 'Полотенцесушитель'),
          ('switch.akvarium_svet_socket_1', 'Аквариум'),
          ('switch.retserkuliatsiia_goriachai_vody_socket_1', 'Рециркуляция ГВС'),
          ('switch.zigbee_plug_2_socket_1', 'Гидрофор'),
          ('switch.ev_charger_switch', 'EV зарядка')] -%}
        {%- set l = namespace(on=[], off=[], bad=[]) -%}
        {%- for eid, nm in loads -%}
          {%- set s = states(eid) -%}
          {%- if s == 'on' %}{% set l.on = l.on + [nm] %}
          {%- elif s == 'off' %}{% set l.off = l.off + [nm] %}
          {%- else %}{% set l.bad = l.bad + [nm] %}{% endif -%}
        {%- endfor -%}
        {#- ТВ 75": счётчик sensor.75_qled_energy мёртв с 2026-08-10. Мёртвый ноль
            в сумму не идёт — устройство попадает в devs, только если показание
            числовое И > 0; иначе оно честно уходит в e.missing («в сумму не вошли»). -#}
        {%- set tv_cur = states('sensor.75_qled_energy') | float(none) -%}
        {%- set tv_live = tv_cur is not none and tv_cur > 0 -%}
        {%- set devs = [
          ('Бойлер', 'sensor.boiler_total_energy', 'input_number.midnight_boiler_energy'),
          ('Полотенцесушитель', 'sensor.terarium_total_energy', 'input_number.midnight_kalarifer_energy'),
          ('Аквариум', 'sensor.akvarium_svet_total_energy', 'input_number.midnight_akv_energy'),
          ('Черепаха', 'sensor.cherepakha_total_energy', 'input_number.midnight_chep_energy'),
          ('Гидрофор', 'sensor.zigbee_plug_2_total_energy', 'input_number.midnight_gidro_energy'),
          ('EV зарядка', 'sensor.ev_charger_energy', 'input_number.midnight_ev_energy')]
          + ([('ТВ 75"', 'sensor.75_qled_energy', 'input_number.midnight_tv_energy')] if tv_live else []) -%}
        {%- set e = namespace(total=0.0, lines=[], missing=([] if tv_live else ['ТВ 75"'])) -%}
        {%- for nm, sid, mid in devs -%}
          {%- set cur = states(sid) | float(none) -%}
          {%- set base = states(mid) | float(none) -%}
          {%- if cur is none or base is none -%}
            {%- set e.missing = e.missing + [nm] -%}
          {%- else -%}
            {%- set kwh = [cur - base, 0] | max -%}
            {%- set e.total = e.total + kwh -%}
            {%- if kwh > 0.1 %}{% set e.lines = e.lines + ['  • ' ~ nm ~ ': ' ~ (kwh | round(1)) ~ ' kWh'] %}{% endif -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set lo = states('sensor.nord_pool_lv_lowest_price') | float(none) -%}
        {%- set hi = states('sensor.nord_pool_lv_highest_price') | float(none) -%}
        {%- set avg = ((lo + hi) / 2) if (lo is not none and hi is not none) else none -%}
        {%- set watch = [
          ('switch.smart_plug_2_socket_1', 'Бойлер'),
          ('switch.kalarifer_socket_1', 'Полотенцесушитель'),
          ('switch.akvarium_svet_socket_1', 'Аквариум'),
          ('switch.retserkuliatsiia_goriachai_vody_socket_1', 'Рециркуляция ГВС'),
          ('switch.zigbee_plug_2_socket_1', 'Гидрофор'),
          ('climate.floor_heating', 'Тёплый пол ванная'),
          ('climate.floor_heating_2', 'Тёплый пол душевая'),
          ('switch.ev_charger_switch', 'EV реле'),
          ('sensor.ev_charger_status', 'EV статус'),
          ('switch.voda_kran_switch_1', 'Кран воды'),
          ('siren.alarm', 'Сирена'),
          ('binary_sensor.door_sensor_door', 'Входная дверь'),
          ('binary_sensor.wifi_th_smoke_sensor_smoke', 'Датчик дыма'),
          ('binary_sensor.vannaia_moisture', 'Влага ванная'),
          ('binary_sensor.garazh_moisture', 'Влага гараж'),
          ('binary_sensor.kukhnia_moisture', 'Влага кухня'),
          ('binary_sensor.water_sensor_4_moisture', 'Влага душевая 1эт'),
          ('sensor.nord_pool_lv_current_price', 'Цена Nord Pool'),
          ('sensor.leak_protection_status', 'Защита от протечки'),
          ('sensor.boiler_mode', 'Котёл: режим'),
          ('sensor.boiler_cwu_temperature', 'Котёл: ГВС')] -%}
        {%- set u = namespace(bad=[]) -%}
        {%- for eid, nm in watch -%}
          {%- if states(eid) in ['unavailable', 'unknown', 'none', 'None', ''] -%}
            {%- set u.bad = u.bad + [nm ~ ' (<code>' ~ eid ~ '</code>)'] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set b_mode_raw = states('sensor.boiler_mode') -%}
        {%- set b_mode = b_mode_raw if b_mode_raw not in ['unknown', 'unavailable', 'none', 'None', ''] else 'нет данных' -%}
        {%- set cwu = states('sensor.boiler_cwu_temperature') | float(none) -%}
        {%- set cwu_txt = (('%.1f' | format(cwu)) ~ '°') if cwu is not none else 'нет данных' -%}
        {%- set leak = states('sensor.leak_protection_status') -%}
        {%- set blind = state_attr('sensor.leak_protection_status', 'blind_names') -%}
        {%- set f1 = states.climate.floor_heating -%}
        {%- set f2 = states.climate.floor_heating_2 -%}
        {%- set pl = namespace(v=[]) -%}
        {%- if p is none -%}
          {%- set pl.v = pl.v + ['⚡ Цена сейчас: нет данных'] -%}
        {%- else -%}
          {%- set emo = '🟢' if p <= 0.04 else ('🟡' if p <= 0.10 else ('🟠' if p <= 0.20 else '🔴')) -%}
          {%- set pl.v = pl.v + ['⚡ Цена сейчас: ' ~ ('%.4f' | format(p)) ~ ' EUR/kWh ' ~ emo] -%}
        {%- endif -%}
        {%- if ok and rest_min and rest_max -%}
          {%- set pl.v = pl.v + ['  Дешевле всего до конца дня: ' ~ rest_min_at ~ ' = ' ~ rest_min ~ ' EUR/kWh',
                                 '  Дороже всего до конца дня: ' ~ rest_max_at ~ ' = ' ~ rest_max ~ ' EUR/kWh'] -%}
        {%- elif ok -%}
          {%- set pl.v = pl.v + ['  Остаток дня: нет данных'] -%}
        {%- else -%}
          {%- set pl.v = pl.v + ['  Цены дня: нет данных' ~ ((' (' ~ pf_err ~ ')') if pf_err else '')] -%}
        {%- endif -%}
        {%- if ok and has_tmr and tmr_min and tmr_max -%}
          {%- set pl.v = pl.v + ['  Завтра: мин ' ~ tmr_min_at ~ ' = ' ~ tmr_min ~ ', макс ' ~ tmr_max_at ~ ' = ' ~ tmr_max ~ ' EUR/kWh'] -%}
        {%- elif ok -%}
          {%- set pl.v = pl.v + ['  Завтра: цены ещё не опубликованы'] -%}
        {%- else -%}
          {%- set pl.v = pl.v + ['  Завтра: нет данных'] -%}
        {%- endif -%}
        {%- if ok and b_txt and t_txt -%}
          {%- set pl.v = pl.v + ['⏳ Бойлер (порог 0.10): ' ~ b_txt,
                                 '⏳ Полотенцесушитель (порог 0.04): ' ~ t_txt] -%}
        {%- else -%}
          {%- set pl.v = pl.v + ['⏳ Насколько это удержится — нет данных: цены дня прочитать не удалось'] -%}
        {%- endif -%}
        {%- set el = namespace(v=e.lines) -%}
        {%- if avg is not none -%}
          {%- set el.v = el.v + ['  Итого: ' ~ (e.total | round(1)) ~ ' kWh ≈ ' ~ ((e.total * avg) | round(2)) ~ ' EUR (по ср. цене ' ~ ('%.4f' | format(avg)) ~ ')'] -%}
        {%- else -%}
          {%- set el.v = el.v + ['  Итого: ' ~ (e.total | round(1)) ~ ' kWh — стоимость: нет данных (цена дня недоступна)'] -%}
        {%- endif -%}
        {%- if e.missing -%}
          {%- set el.v = el.v + ['  Нет данных по: ' ~ (e.missing | join(', ')) ~ ' — в сумму не вошли'] -%}
        {%- endif -%}
        {%- macro floor(st) -%}
        {%- if st is none %}нет данных
        {%- elif st.state in ['unavailable', 'unknown'] %}нет данных ({{ st.state }})
        {%- elif st.state == 'off' %}выключен
        {%- else %}{{ st.attributes.preset_mode | default('режим неизвестен') }}, уставка {{ st.attributes.temperature | default('—') }}°, сейчас {{ st.attributes.current_temperature | default('—') }}°
        {%- endif -%}
        {%- endmacro -%}
        🏠 Сводка по дому {{ now().strftime('%H:%M %d.%m') }}

        {{ pl.v | join('\n') }}

        🔌 Работает: {{ l.on | join(', ') if l.on else 'ничего' }}
           Выключено: {{ l.off | join(', ') if l.off else '—' }}
        {%- if l.bad %}
           Нет данных: {{ l.bad | join(', ') }}
        {%- endif %}

        📊 Сегодня (предварительно):
        {{ el.v | join('\n') }}

        🔥 Отопление:
          Бойлер (ТЭН): {{ sw('switch.smart_plug_2_socket_1') }}{% if is_state('input_boolean.boiler_manual_mode','on') %} — РУЧНОЙ режим, цена не трогает{% endif %}
          Тёплый пол ванная: {{ floor(f1) }}
          Тёплый пол душевая: {{ floor(f2) }}
          Котёл: {{ b_mode }}, ГВС {{ cwu_txt }}{% if is_state('sensor.boiler_mode','Авария') %} ⚠️ АВАРИЯ{% endif %}
        {%- if is_state('input_boolean.rezhim_zhara','on') %}
          Режим «Жара»: ВКЛ (нагрев заморожен){% endif %}
        {%- if is_state('input_boolean.night_saver','on') %}
          Ночная экономия: ВКЛ{% endif %}
        {%- if is_state('input_boolean.turbo_hot_water','on') %}
          Турбо нагрев: ВКЛ{% endif %}

        🚗 EV: {{ states('sensor.ev_charger_status') if states('sensor.ev_charger_status') not in ['unknown','unavailable'] else 'нет данных' }}, реле {{ sw('switch.ev_charger_switch') }}
          Плановая зарядка: {{ states('input_datetime.ev_charge_start') if states('input_datetime.ev_charge_start') not in ['unknown','unavailable'] else 'нет данных' }}
        {%- if is_state('input_boolean.ev_manual_mode','on') %}
          Ручной режим EV: ВКЛ (планировщик отключён){% endif %}

        🛡 Безопасность:
          Защита от протечки: {% if leak == 'ok' %}сухо, все 4 датчика отвечают{% elif leak == 'leak' %}🚨 ПРОТЕЧКА{% elif leak == 'blind' %}⚠️ вслепую{% else %}нет данных ({{ leak }}){% endif %}{% if blind %} — не видим: {{ blind | join(', ') }}{% endif %}
          Кран воды: {% if is_state('switch.voda_kran_switch_1','on') %}открыт{% elif is_state('switch.voda_kran_switch_1','off') %}🚨 ЗАКРЫТ{% else %}нет данных{% endif %}
          Сирена: {% if is_state('siren.alarm','on') %}🚨 ВКЛЮЧЕНА{% elif is_state('siren.alarm','off') %}выкл{% else %}нет данных{% endif %}
          Дым: {% if is_state('binary_sensor.wifi_th_smoke_sensor_smoke','on') %}🚨 ЕСТЬ{% elif is_state('binary_sensor.wifi_th_smoke_sensor_smoke','off') %}норма{% else %}нет данных{% endif %}
          Входная дверь: {% if is_state('binary_sensor.door_sensor_door','on') %}открыта{% elif is_state('binary_sensor.door_sensor_door','off') %}закрыта{% else %}нет данных{% endif %}
          Охрана: {{ 'включена' if is_state('input_boolean.security_armed','on') else 'выключена' }}
        {% if u.bad %}
        {#- 2026-08-19: список режется до 4 позиций. 19.08 в момент массового отказа
            Tuya сводка вывалила 16 сущностей одной строкой — стена текста вместо
            сводки. Полный состав всё равно виден в отдельных сторожах. -#}
        ⚠️ Недоступны ({{ u.bad | count }}): {{ u.bad[:4] | join(', ') }}{% if (u.bad | count) > 4 %} и ещё {{ (u.bad | count) - 4 }}{% endif %}
        {%- else %}
        ✅ Все ключевые датчики отвечают
        {%- endif %}
- id: '1748000001004'
  alias: "\U0001F6A8 Tuya: Gracе период при переподключении"
  description: Если датчик влаги уходит в unavailable — Tuya переподключается. Блокируем
    тревогу на 5 мин.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.vannaia_moisture
    - binary_sensor.garazh_moisture
    - binary_sensor.kukhnia_moisture
    - binary_sensor.water_sensor_4_moisture
    to: unavailable
  conditions: []
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.tuya_reconnect_grace
  - delay: 00:05:00
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.tuya_reconnect_grace
  mode: restart
- id: '1748000001005'
  alias: '☁️ Tuya: авто-перезагрузка при обрыве датчика влаги'
  description: 'Датчик влаги ИЛИ главный кран воды ушёл в unavailable = Tuya облако оборвалось. Через 30с перезагружаем интеграцию, затем до 2 повторов с интервалом 5 мин (максимум 3 перезагрузки), после чего ОДНО уведомление и стоп. НЕ реагирует на on — реальная протечка не должна вызывать reload (глушило алерт).'
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.vannaia_moisture
    - binary_sensor.garazh_moisture
    - binary_sensor.kukhnia_moisture
    - binary_sensor.water_sensor_4_moisture
    to: unavailable
  - trigger: state
    entity_id: switch.voda_kran_switch_1
    to: unavailable
    for: 00:03:00
  conditions:
  # FIX 2026-08-16 (эхо-перезагрузки). Инцидент: одна синтетическая ошибка Tuya
  # "sign invalid" вызвала 3 перезагрузки вместо 1. Само-лечение 1790200001001
  # перезагрузило интеграцию, датчики влаги ушли в unavailable — а это триггер
  # ЭТОЙ automation, поэтому она перезагрузила ещё раз, и её собственная
  # перезагрузка снова уронила датчики (mode: restart) — ещё раз. Простой Tuya
  # растянулся 13 c -> 73 c.
  # Маркер «перезагрузка уже идёт/только что была» — input_boolean.tuya_reconnect_grace:
  # 1790200001001 включает его ПЕРЕД своей перезагрузкой, 1748000001004 — при уходе
  # датчика в unavailable.
  # ПОЧЕМУ НЕ ПРОСТО «grace == off»: 1748000001004 слушает те же 4 датчика и по
  # трассам 16.08.2026 включает grace РАНЬШЕ, чем этот automation доходит до своих
  # условий (1004 action/0 в 15:19:27.705182, 1005 action/0 в 15:19:27.706020).
  # При НАСТОЯЩЕМ обрыве Tuya условие «grace == off» было бы ложным на всех 4
  # событиях, и лечение не запускалось бы никогда.
  # Поэтому блокируем, только если grace включился СТРОГО РАНЬШЕ самого события
  # unavailable (значит его включила чужая перезагрузка, а не наш обрыв) и не
  # более 15 мин назад (иначе это «зависший» grace, а не перезагрузка; на такой
  # случай есть отдельная диагностика 1789700001001).
  # ДЕГРАДАЦИЯ: если хелпера нет, метка нечитаема или trigger не разобрать —
  # условие истинно, и поведение остаётся ПРЕЖНИМ, как до правки
  # (перезагрузка разрешена).
  - condition: template
    value_template: >-
      {% set g = states['input_boolean.tuya_reconnect_grace'] %}
      {% set gt = (as_timestamp(g.last_changed, 0) | float(0)) if g is not none else 0 %}
      {% set et = (as_timestamp(trigger.to_state.last_changed, 0) | float(0))
         if (trigger is defined and trigger.to_state is defined
             and trigger.to_state is not none) else 0 %}
      {{ not (g is not none and g.state == 'on'
              and gt > 0 and et > 0 and gt < et and (et - gt) < 900) }}
  actions:
  - variables:
      target_entity: '{{ trigger.entity_id }}'
  - delay: 00:00:30
  - action: homeassistant.reload_config_entry
    data:
      entry_id: 01HAENTRYIDPLACEHOLDER0000
  - repeat:
      count: 2
      sequence:
      - wait_template: '{{ states(target_entity) not in [''unavailable'', ''unknown''] }}'
        timeout: 00:05:00
        continue_on_timeout: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(target_entity) in [''unavailable'', ''unknown''] }}'
          sequence:
          - action: homeassistant.reload_config_entry
            data:
              entry_id: 01HAENTRYIDPLACEHOLDER0000
  - wait_template: '{{ states(target_entity) not in [''unavailable'', ''unknown''] }}'
    timeout: 00:05:00
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(target_entity) in [''unavailable'', ''unknown''] }}'
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: "⚠️ <b>Tuya: самовосстановление не помогло</b>\n\n<code>{{ target_entity\
            \ }}</code>\n\n3 перезагрузки интеграции подряд не вернули сущность —\
            \ она всё ещё недоступна. Дальнейшие попытки остановлены.\n\nПроверь Wi-Fi\
            \ устройства, питание и облако Tuya вручную."
  mode: restart
- id: '1748000001006'
  alias: "\U0001F697 EV: сброс ручного режима при окончании зарядки"
  description: Сбрасываем ev_manual_mode когда зарядка завершена или manual_mode завис
    ON дольше 3ч.
  triggers:
  - trigger: state
