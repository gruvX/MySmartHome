- id: '1789500001004'
  alias: "\U0001F4BE Proxmox: ошибка/устаревание бэкапа (только уведомление)"
  description: >-
    NOTIFICATION-ONLY watchdog. Сообщает, когда binary_sensor.mylab_backup_status
    (device_class problem) = проблема, ИЛИ когда последний бэкап
    (sensor.mylab_last_backup) старше 36 ч. Проверка устаревания дважды в день
    (09:00 / 21:00), чтобы не спамить. Единственное действие —
    telegram_bot.send_message (chat_id 100000000). НЕ управляет устройствами,
    НЕ вызывает Proxmox button/switch/service.
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.mylab_backup_status
    to: 'on'
    for: 00:10:00
    id: problem
  - trigger: state
    entity_id: binary_sensor.mylab_backup_status
    from: 'on'
    to: 'off'
    for: 00:05:00
    id: problem_ok
  - trigger: time
    at: '09:00:00'
    id: stale
  - trigger: time
    at: '21:00:00'
    id: stale
  - trigger: state
    entity_id: sensor.mylab_last_backup
    id: fresh
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''problem'' }}'
      - condition: state
        entity_id: input_boolean.ha_startup_grace
        state: 'off'
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: "\U0001F6D1 Proxmox: статус резервного копирования = проблема. Последняя копия: {{ states('sensor.mylab_last_backup') }}. Проверьте задание бэкапа."
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''problem_ok'' }}'
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: "✅ Proxmox: статус резервного копирования снова в норме."
    - conditions:
      - condition: template
        value_template: >-
          {{ trigger.id == 'stale'
             and states('sensor.mylab_last_backup') not in ['unknown', 'unavailable']
             and (now() - as_datetime(states('sensor.mylab_last_backup'))).total_seconds() > 129600 }}
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: "\U0001F552 Proxmox: бэкап устарел — последняя копия {{ states('sensor.mylab_last_backup') }} (> 36 ч назад). Проверьте расписание бэкапа."
    - conditions:
      - condition: template
        value_template: >-
          {{ trigger.id == 'fresh' and trigger.from_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state not in ['unknown', 'unavailable']
             and (as_datetime(trigger.to_state.state) - as_datetime(trigger.from_state.state)).total_seconds() > 129600 }}
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: "✅ Proxmox: бэкап снова свежий ({{ states('sensor.mylab_last_backup') }}) после длительного перерыва."
- id: '1789500001005'
  alias: "\U0001F4E1 Proxmox: метрика узла зависла (только уведомление)"
  description: >-
    NOTIFICATION-ONLY watchdog. Следит за конвейером данных: ключевая метрика узла
    sensor.mylab_cpu_usage. Тревога, если метрика недоступна > 30 мин ИЛИ не
    обновлялась > 30 мин (напоминание не чаще раза в 3 ч). Единственное действие —
    telegram_bot.send_message (chat_id 100000000). НЕ управляет устройствами,
    НЕ вызывает Proxmox button/switch/service.
    FIX 2026-08-16: лимит "раз в 3 ч" больше НЕ основан на this.attributes.last_triggered.
    Триггер 'up' был `state` без `to:` и срабатывал ~1 раз/мин (1438 изменений
    sensor.mylab_cpu_usage за 24 ч), каждый запуск обновлял last_triggered, поэтому
    условие `> 10800` не могло стать истинным НИКОГДА — алерт был структурно
    недостижим (2976 запусков за 48 ч, 0 сообщений). Теперь лимит хранится в
    input_datetime.proxmox_metric_last_alert, а 'up' сужен до реального
    восстановления (from: unavailable / from: unknown) и больше не самосрабатывает.
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.mylab_cpu_usage
    to: unavailable
    for: 00:30:00
    id: down
  - trigger: state
    entity_id: sensor.mylab_cpu_usage
    to: unknown
    for: 00:30:00
    id: down
  - trigger: time_pattern
    minutes: /30
    id: stale_check
  - trigger: state
    entity_id: sensor.mylab_cpu_usage
    from: unavailable
    id: up
  - trigger: state
    entity_id: sensor.mylab_cpu_usage
    from: unknown
    id: up
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''down'' }}'
      - condition: state
        entity_id: input_boolean.ha_startup_grace
        state: 'off'
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: "\U0001F4E1 Proxmox: метрика узла (ЦП) недоступна > 30 мин ({{ states('sensor.mylab_cpu_usage') }}). Конвейер данных Proxmox мог зависнуть — проверьте интеграцию/узел."
    - conditions:
      - condition: template
        value_template: >-
          {{ trigger.id == 'stale_check'
             and states('sensor.mylab_cpu_usage') not in ['unavailable', 'unknown']
             and (now() - states.sensor.mylab_cpu_usage.last_updated).total_seconds() > 1800
             and (state_attr('input_datetime.proxmox_metric_last_alert', 'timestamp') is none
                  or now().timestamp() - state_attr('input_datetime.proxmox_metric_last_alert', 'timestamp') > 10800) }}
      sequence:
      # Сообщение ПЕРВЫМ, отметка времени — после, чтобы сбой записи хелпера
      # не мог проглотить само предупреждение.
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: "\U0001F4E1 Proxmox: метрика узла (ЦП) не обновлялась > 30 мин. Конвейер данных Proxmox мог зависнуть — проверьте интеграцию/узел."
      - action: input_datetime.set_datetime
        continue_on_error: true
        target:
          entity_id: input_datetime.proxmox_metric_last_alert
        data:
          timestamp: '{{ now().timestamp() }}'
    - conditions:
      - condition: template
        value_template: >-
          {{ trigger.id == 'up' and trigger.from_state is not none
             and states('sensor.mylab_cpu_usage') not in ['unavailable', 'unknown']
             and (trigger.from_state.state in ['unavailable', 'unknown']
                  or (now() - trigger.from_state.last_updated).total_seconds() > 1800) }}
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: "✅ Proxmox: метрика узла (ЦП) снова обновляется ({{ states('sensor.mylab_cpu_usage') }})."
      # Снимаем лимит, чтобы следующее зависание сообщилось сразу, а не через 3 ч.
      - action: input_datetime.set_datetime
        continue_on_error: true
        target:
          entity_id: input_datetime.proxmox_metric_last_alert
        data:
          datetime: '1970-01-01 00:00:00'
- id: '1789600001001'
  alias: 🚨 Утечка (облако Tuya) — независимая проверка
  description: 'Независимый контроль протечки через облако Tuya (sensor.tuya_leak_cloud ← /config/tuya_leak_query.py). Срабатывает даже если Tuya-сущности HA в состоянии unavailable, когда binary_sensor.*_moisture никогда не становится ''on'' и штатная автоматика v4 не триггерится. ПО ЗАМЫСЛУ ТОЛЬКО УВЕДОМЛЕНИЕ: никакие устройства не управляются автоматически (ни кран, ни сирена) — только кнопка ручного закрытия. ВНИМАНИЕ: полярность DP watersensor_state (''1'' = тревога, ''2'' = норма) подтверждена только для ''2''; сырое значение всегда в тексте сообщения.'
  triggers:
  - trigger: state
    entity_id: sensor.tuya_leak_cloud
    to: alarm
    for: 00:00:20
  conditions:
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 120 }}'
  actions:
  - variables:
      names:
        binary_sensor.vannaia_moisture: Ванная
        binary_sensor.garazh_moisture: Гараж
        binary_sensor.kukhnia_moisture: Кухня
        binary_sensor.water_sensor_4_moisture: Душевая 1ый этаж
      alarm_list: '{{ state_attr(''sensor.tuya_leak_cloud'', ''alarm_entities'') or [] }}'
      raw_map: '{{ state_attr(''sensor.tuya_leak_cloud'', ''raw'') or {} }}'
      online_map: '{{ state_attr(''sensor.tuya_leak_cloud'', ''online'') or {} }}'
      alarm_names: '{% set ns = namespace(v=[]) %}{% for e in alarm_list %}{% set ns.v = ns.v + [names.get(e, e)] %}{% endfor %}{{ ns.v | join('', '') if ns.v else ''не указаны'' }}'
      detail_lines: '{% set ns = namespace(v=[]) %}{% for e in alarm_list %}{% set ns.v = ns.v + [''• '' ~ names.get(e, e) ~ '' ('' ~ e ~ ''): watersensor_state = '' ~ (raw_map.get(e, ''?'') | string) ~ '' | в HA: '' ~ states(e) ~ '' | online: '' ~ (online_map.get(e, ''?'') | string)] %}{% endfor %}{{ ns.v | join(''\n'') }}'
  - action: telegram_bot.send_message
    data:
      chat_id: 100000000
      parse_mode: html
      message: '🚨 ОБЛАКО TUYA: ПРОТЕЧКА {{ now().strftime(''%d.%m.%Y %H:%M'') }}


        Облако Tuya НЕЗАВИСИМО (напрямую через API, минуя интеграцию HA) сообщает о срабатывании датчика протечки: {{ alarm_names }}


        {{ detail_lines }}


        ⚠️ Это независимый облачный путь проверки. Собственные Tuya-сущности HA могут быть unavailable — в этом случае штатная автоматика протечки (v4) могла НЕ сработать. Проверь дом физически.


        Кран НЕ закрыт автоматически, сирена НЕ включена. Закрыть кран вручную — кнопкой ниже (она также выключит гидрофор и включит сирену).'
      inline_keyboard:
      - - - 🚰 ЗАКРЫТЬ КРАН (вручную)
          - /leak_confirm
  mode: single
- id: '1789700001001'
  alias: "\U0001F6E1\uFE0F Диагностика: tuya_reconnect_grace завис > 20 мин"
  description: 'Страховка: пока input_boolean.tuya_reconnect_grace = ON, leak_check в
    авт. 1748000001001 подавлен, то есть защита от протечки ВЫКЛЮЧЕНА. Обычно helper
    снимает script.tuya_grace_release через 5 мин. Если он всё ещё ON через 20 мин —
    предупреждаем в Telegram И выключаем его, чтобы защита не осталась выключенной
    молча. Форма скопирована с ha_startup_grace-watchdog (авт. 1789200001002).'
  mode: single
  triggers:
  - trigger: state
    entity_id: input_boolean.tuya_reconnect_grace
    to: 'on'
    for: 00:20:00
  conditions: []
  actions:
  # Restore protection FIRST: turning the helper off must not depend on Telegram succeeding.
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.tuya_reconnect_grace
  - action: telegram_bot.send_message
    continue_on_error: true
    data:
      chat_id: 100000000
      parse_mode: html
      message: "\U0001F6A8 <code>input_boolean.tuya_reconnect_grace</code> застрял в ON &gt; 20 мин.\nЗащита от протечки
        воды была ПОДАВЛЕНА (leak_check в авт. <code>1748000001001</code> требует grace
        = off).\nВыключил helper автоматически — защита снова активна. Проверь <code>script.tuya_grace_release</code>."
- id: '1789800001001'
  alias: "\U0001F9E6 Тёплый пол: термостат недоступен"
  description: 'ТОЛЬКО УВЕДОМЛЕНИЯ. Электрические термостаты тёплого пола (Tuya) периодически
    теряют связь; пока climate.* в unavailable, автоматика по Nord Pool отправляет
    команды «в пустоту» и пол вообще не управляется, молча. Порог 30 мин выбран специально:
    короткие 10-60-секундные провалы при reload Tuya/HA не должны спамить. Автоматика
    НИКОГДА не управляет устройством — только telegram_bot.send_message. Добавлена
    2026-07-31 после 4-часового незамеченного простоя.'
  triggers:
  - trigger: state
    entity_id:
    - climate.floor_heating
    - climate.floor_heating_2
    to: unavailable
    for:
      minutes: 30
    id: lost
  - trigger: state
    entity_id:
    - climate.floor_heating
    - climate.floor_heating_2
    from: unavailable
    to:
    - 'off'
    - heat_cool
    for:
      minutes: 2
    id: back
  conditions:
  - condition: state
    entity_id: input_boolean.ha_startup_grace
    state: 'off'
  actions:
  - variables:
      zone: '{% if trigger.entity_id == ''climate.floor_heating'' %}Ванная (2 эт.){%
        elif trigger.entity_id == ''climate.floor_heating_2'' %}Душевая (1 эт.){% else
        %}{{ trigger.entity_id }}{% endif %}'
  - variables:
      # ЕДИНОЕ ПРАВИЛО ОТБОЯ ✅ (P1, 2026-08-19). Одно переподключение Tuya давало
      # каскад: «Tuya: сессия оборвалась — перезагрузил» + «кран снова управляется»
      # + «сирена снова доступна» + «тёплый пол: связь восстановлена» x2. ~20
      # сообщений в сутки на 3-4 реальных инцидента.
      # ✅ уходит, только если ОБА условия верны:
      #   paired   — простой длился не меньше СВОЕГО порога тревоги (1800 с), то есть
      #              парное ⚠️ действительно было отправлено. Провал на 13-100 с при
      #              перезагрузке интеграции до порога не доживает, ⚠️ по нему НЕ
      #              отправлялось — значит и ✅ по нему это чистый шум.
      #   umbrella — инцидент НЕ описан «зонтичным» сообщением само-лечения Tuya:
      #              grace-флаг включён сейчас, либо переключался < 15 мин назад,
      #              либо automation 1790200001001 срабатывала < 15 мин назад.
      #              Зонтичное сообщение уже печатает состояние крана и статус защиты.
      # КАК ОТЛИЧАЕТСЯ НАСТОЯЩИЙ ОДИНОЧНЫЙ ОТКАЗ: он восстанавливается БЕЗ
      # переподключения Tuya (grace не трогался, само-лечение не запускалось) и длится
      # дольше порога — оба условия истинны, ✅ приходит как раньше. Проверено на
      # реальном простое 18.08 15:06-16:48 (102 мин, без перезагрузки): ✅ сохраняется.
      # ⚠️-сообщения об отказе НЕ подавляются никогда — правило касается только ✅.
      # ДЕГРАДАЦИЯ: если хелпера/автоматизации нет или метка нечитаема — umbrella=false,
      # то есть сообщение УХОДИТ (никогда не терять факт восстановления).
      notify_ok: >-
        {% set down_sec = 1800 %}
        {% set t = trigger if trigger is defined else none %}
        {% set fs = t.from_state if (t is not none and t.from_state is defined) else none %}
        {% set to = t.to_state if (t is not none and t.to_state is defined) else none %}
        {% set outage = (as_timestamp(to.last_changed, 0) - as_timestamp(fs.last_changed, 0))
             if (fs is not none and to is not none) else -1 %}
        {% set paired = (outage | float(-1)) >= down_sec %}
        {% set g = states['input_boolean.tuya_reconnect_grace'] %}
        {% set gl = (as_timestamp(g.last_changed, 0) | float(0)) if g is not none else 0 %}
        {% set g_age = (as_timestamp(now()) - gl) if gl > 0 else 999999 %}
        {% set sh = state_attr('automation.tuya_avto_lechenie_obryva_sessii_sign_invalid', 'last_triggered') %}
        {% set sh_age = (as_timestamp(now()) - as_timestamp(sh, 0)) if sh is not none else 999999 %}
        {% set umbrella = (g is not none and g.state == 'on')
             or (g_age | float(999999)) < 900
             or (sh_age | float(999999)) < 900 %}
        {{ paired and not umbrella }}
  - choose:
    - conditions:
      - condition: trigger
        id: lost
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: "⚠️ <b>Тёплый пол: нет связи с термостатом</b>\n\nЗона:\
            \ {{ zone }}\n<code>{{ trigger.entity_id }}</code>\n\nНедоступен 30+ минут.\
            \ Пол сейчас НЕ управляется: автоматика по Nord Pool отправляет команды\
            \ «в пустоту», уставка и режим не меняются.\n\nЭто электрический подогрев\
            \ пола, к котлу он не относится. Проверь Wi-Fi термостата и интеграцию\
            \ Tuya."
    - conditions:
      - condition: trigger
        id: back
      - condition: template
        alias: Отбой ✅ при уже описанном переподключении Tuya (P1 2026-08-19)
        value_template: "{{ notify_ok | default(false, true) | string | lower == 'true' }}"
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: "✅ <b>Тёплый пол: связь восстановлена</b>\n\nЗона: {{ zone\
            \ }}\n<code>{{ trigger.entity_id }}</code>\n\nПитание: {{ 'выключен' if\
            \ trigger.to_state.state == 'off' else 'включён' }} · режим {{ state_attr(trigger.entity_id,\
            \ 'preset_mode') | default('неизвестен', true) }}\nПол {{ state_attr(trigger.entity_id,\
            \ 'current_temperature') | default('?', true) }} °C · уставка {{ state_attr(trigger.entity_id,\
            \ 'temperature') | default('?', true) }} °C"
  mode: queued
  max: 6
