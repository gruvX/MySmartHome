- id: '1748000001001'
  alias: "\U0001F6A8 Утечка воды - аварийное отключение v4"
  description: Отправляет запрос с кнопками. Кран закрывается немедленно по кнопке     или
    автоматически через 5 мин если нет ответа и датчик всё ещё on.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.vannaia_moisture
    - binary_sensor.garazh_moisture
    - binary_sensor.kukhnia_moisture
    - binary_sensor.water_sensor_4_moisture
    to: 'on'
    for: '00:00:03'
    id: leak_check
  - trigger: state
    entity_id:
    - binary_sensor.vannaia_moisture
    - binary_sensor.garazh_moisture
    - binary_sensor.kukhnia_moisture
    - binary_sensor.water_sensor_4_moisture
    to: 'off'
    # FIX 2026-08-16: leak_cleared срабатывал и на unavailable -> off, то есть
    # на каждое возвращение датчика после перезагрузки Tuya. Один синтетический
    # сбой дал 8 фантомных «датчик больше не фиксирует утечку». not_from режет
    # ровно эти переходы; настоящее снятие тревоги on -> off не затронуто.
    not_from:
    - unavailable
    - unknown
    for: 00:00:15
    id: leak_cleared
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.from_state is not
      none }}'
  - condition: template
    value_template: '{{ trigger.to_state.state in [''on'', ''off''] }}'
  - condition: template
    value_template: '{{ trigger.id != ''leak_check'' or trigger.from_state.state not
      in [''unavailable'', ''unknown''] }}'
  - condition: template
    value_template: '{{ trigger.id != ''leak_check'' or is_state(''input_boolean.ha_startup_grace'',
      ''off'') }}'
  - condition: template
    value_template: '{{ trigger.id != ''leak_check'' or is_state(''input_boolean.tuya_reconnect_grace'', ''off'') or trigger.entity_id in (state_attr(''sensor.tuya_leak_cloud'', ''alarm_entities'') or []) }}'
  - condition: template
    value_template: '{{ trigger.id != ''leak_check'' or not is_state(''input_boolean.moisture_bypass_''
      ~ trigger.entity_id.split(''.'')[1].replace(''_moisture'',''''), ''on'') }}'
  - condition: template
    value_template: '{{ trigger.id != ''leak_cleared'' or (trigger.to_state.last_changed
      - trigger.from_state.last_changed).total_seconds() >= 3 }}'
  actions:
  - variables:
      sensor_name: '{{ trigger.to_state.name }}'
      now_ts: '{{ now().strftime(''%d.%m.%Y %H:%M'') }}'
      sensor_entity: '{{ trigger.entity_id }}'
      hydrofor_entity: switch.zigbee_plug_2_socket_1
      valve_entity: switch.voda_kran_switch_1
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''leak_check'' }}'
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: '⚠️ ДАТЧИК ВЛАГИ {{ now_ts }}

            {{ sensor_name }} — сигнал!

            Если РЕАЛЬНАЯ ТЕЧЬ — нажми кнопку. Иначе — отмена. Через 5 мин без             ответа
            закрою кран автоматически.'
          inline_keyboard:
          - - - "\U0001F6B0 ЗАКРЫТЬ КРАН!"
              - /leak_confirm
            - - "\U0001F6AB Ложная тревога"
              - /moisture_false_alarm
      - delay: 00:05:00
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ not is_state(sensor_entity, ''on'') }}'
          sequence:
          - action: notify.send_message
            target:
              entity_id: notify.telegram_owner
            data:
              message: ✅ {{ sensor_name }} снялся сам. Кран не трогал.
        - conditions:
          - condition: template
            value_template: '{{ is_state(''input_boolean.tuya_reconnect_grace'', ''on'')
              or is_state(''input_boolean.moisture_bypass_'' ~ sensor_entity.split(''.'')[1].replace(''_moisture'',''''),
              ''on'') }}'
          sequence:
          - action: notify.send_message
            target:
              entity_id: notify.telegram_owner
            data:
              message: ✅ Ложная тревога по {{ sensor_name }}. Кран не трогал.
        default:
        # P0: the hydrophore/valve/siren commands used to run inline here. A Tuya
        # `sign invalid` (ApiRequestException, not a HomeAssistantError, NOT caught
        # by continue_on_error) on the FIRST of them aborted this whole script: the
        # water was never shut off, the siren never sounded, none of the follow-up
        # messages arrived and nothing told the owner the shutoff had failed.
        # The chain now runs fire-and-forget in script.leak_shutoff_and_siren,
        # which cannot abort this automation. Same entities, same order of physical
        # effect (hydrophore -> valve -> volume -> time -> siren). Both outcomes are
        # read back below and every failure is reported.
        - action: script.turn_on
          target:
            entity_id: script.leak_shutoff_and_siren
        # FIX C: read-back — confirm the valve actually reports 'off' before
        # claiming it is closed. Bounded wait (Tuya cloud valve flaps), then a
        # 3s settle + re-check to filter a transient off. No auto-reopen, no retry loop.
        - wait_template: '{{ is_state(valve_entity, ''off'') }}'
          timeout: 00:00:20
          continue_on_timeout: true
        - delay: 00:00:03
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ is_state(valve_entity, ''off'') }}'
            sequence:
            - action: telegram_bot.send_message
              data:
                chat_id: 100000000
                message: "\U0001F6A8 УТЕЧКА {{ now_ts }}\n{{ sensor_name }} всё ещё\
                  \ ON после 5 мин без ответа. Гидрофор выключен.\n✅ Кран закрыт, состояние\
                  \ ПОДТВЕРЖДЕНО. \U0001F514 Сирена (2 мин).\nПроверь немедленно!"
                inline_keyboard:
                - - - "\U0001F515 Выключить сирену"
                    - /siren_off
          default:
          - action: telegram_bot.send_message
            data:
              chat_id: 100000000
              message: "\U0001F6A8 УТЕЧКА {{ now_ts }} — {{ sensor_name }}. Команда\
                \ закрытия отправлена, состояние крана НЕ ПОДТВЕРЖДЕНО (сейчас: {{\
                \ states('switch.voda_kran_switch_1') }}). Гидрофор выключен. \U0001F514\
                \ Сирена (2 мин). Проверьте физически!"
              inline_keyboard:
              - - - "\U0001F515 Выключить сирену"
                  - /siren_off
          # P0 verification: an unmistakable, non-rate-limited failure message
          # naming exactly which physical action did not happen.
          - action: telegram_bot.send_message
            data:
              chat_id: 100000000
              parse_mode: html
              message: |-
                🚰 КРАН НЕ ЗАКРЫЛСЯ — ПЕРЕКРОЙ ВОДУ ВРУЧНУЮ!
                <code>switch.voda_kran_switch_1</code> за 23 сек не перешёл в <code>off</code> — сейчас <code>{{ states('switch.voda_kran_switch_1') }}</code>.
                Вода продолжает течь. Иди к крану.
        - wait_template: '{{ is_state(''siren.alarm'', ''on'') }}'
          timeout: 00:00:30
          continue_on_timeout: true
        - if:
          - condition: template
            value_template: '{{ not is_state(''siren.alarm'', ''on'') }}'
          then:
          - action: telegram_bot.send_message
            data:
              chat_id: 100000000
              parse_mode: html
              message: |-
                🚨 СИРЕНА НЕ ВКЛЮЧИЛАСЬ при утечке!
                <code>siren.alarm</code> за 30 сек не перешла в <code>on</code> — сейчас <code>{{ states('siren.alarm') }}</code>.
                Звукового оповещения о протечке в доме НЕТ.
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''leak_cleared'' }}'
      sequence:
      # FIX 2026-08-16 (safety wording). This message used to hard-code
      # "Гидрофор и кран остаются выключены. Открой кран вручную" — it ASSUMED the
      # emergency shutoff had run. After a bare sensor test (no alarm fired, nothing
      # was ever switched off) it told the owner to open an already-open valve; the
      # mirror case is worse — it would have reported the valve as staying closed
      # while the water was in fact running, so he would not have gone to shut it.
      # Every line below now reports the LIVE state read at send time, with a third
      # "неизвестно" branch that never claims either state (states() also returns
      # 'unknown' for an entity that no longer exists, so a deleted switch lands
      # there too). parse_mode: html because entity_ids appear — the notify entity
      # defaults to markdown and silently drops such messages; free text goes
      # through | e so nothing can emit a bare < > &.
      - variables:
          valve_state: '{{ states(valve_entity) }}'
          hydro_state: '{{ states(hydrofor_entity) }}'
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: |-
            💧 Датчик влаги больше не фиксирует утечку {{ now_ts }}
            Датчик: {{ sensor_name | e }}
            Состояние off подтверждено 15 сек.
            {% if valve_state == 'off' %}🚰 Кран воды ЗАКРЫТ (<code>{{ valve_entity | e }}</code>). Открой его вручную, когда убедишься, что всё в порядке.{% elif valve_state == 'on' %}🚰 Кран воды ОТКРЫТ (<code>{{ valve_entity | e }}</code>) — вода в доме есть, открывать ничего не нужно.{% else %}🚰 Состояние крана НЕИЗВЕСТНО (<code>{{ valve_entity | e }}</code> = <code>{{ valve_state | e }}</code>) — проверь вручную.{% endif %}
            {% if hydro_state == 'off' %}🔌 Гидрофор ВЫКЛЮЧЕН (<code>{{ hydrofor_entity | e }}</code>). Включи его вручную, когда убедишься, что всё в порядке.{% elif hydro_state == 'on' %}🔌 Гидрофор ВКЛЮЧЁН (<code>{{ hydrofor_entity | e }}</code>) — включать ничего не нужно.{% else %}🔌 Состояние гидрофора НЕИЗВЕСТНО (<code>{{ hydrofor_entity | e }}</code> = <code>{{ hydro_state | e }}</code>) — проверь вручную.{% endif %}
  mode: parallel
  max: 10
- id: '1765800603456'
  alias: "\U0001F4CA Ежедневный прогноз цен электричества (Nord Pool) v4.2"
  description: Ежедневный прогноз цен на завтра (Nord Pool) в Telegram. Отправляет
    1 раз в день, защита от двойной отправки по 12-часовому окну.
  triggers:
  - trigger: state
    entity_id: sensor.nord_pool_lv_current_price
    attribute: tomorrow
  - trigger: time
    at: '14:10:00'
  - trigger: time
    at: '19:10:00'
  conditions:
  - condition: time
    after: 06:00:00
    before: '23:30:00'
  actions:
  - variables:
      tg_entity: notify.telegram_owner
      now_ts: '{{ now().strftime(''%Y-%m-%d %H:%M'') }}'
      tomorrow_date: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d'') }}'
      t_attr: '{{ state_attr(''sensor.nord_pool_lv_current_price'', ''tomorrow'')
        }}'
      rt_attr: '{{ state_attr(''sensor.nord_pool_lv_current_price'', ''raw_tomorrow'')
        }}'
      prices: '{% if t_attr is sequence and (t_attr is not string) and (t_attr | length)
        > 0 %}{{ t_attr }}{% elif rt_attr is sequence and (rt_attr is not string)
        and (rt_attr | length) > 0 %}{{ rt_attr | map(attribute=''value'') | list
        }}{% else %}{{ [] }}{% endif %}'
      have_tomorrow: '{{ prices is sequence and (prices is not string) and (prices
        | length) >= 24 }}'
      last_trig_raw: '{{ state_attr(this.entity_id, ''last_triggered'') }}'
      last_trig_ts: '{% if last_trig_raw %}{{ as_timestamp(last_trig_raw) }}{% else
        %}0{% endif %}'
      allow_send: '{{ (as_timestamp(now()) - (last_trig_ts | float(0))) > 43200 }}'
      is_manual: '{{ trigger is not defined or trigger.platform == "manual" }}'
      should_send: '{{ is_manual or (allow_send and have_tomorrow) }}'
      p_min: '{{ (prices | min) | float(0) if prices | length > 0 else 0 }}'
      p_max: '{{ (prices | max) | float(0) if prices | length > 0 else 0 }}'
      p_avg: '{% if have_tomorrow %}{{ (prices | sum / (prices | length)) | float(0)
        }}{% else %}0{% endif %}'
      rows: '{% set ns = namespace(r=[]) %}{% for i in range(prices | length) %}{%
        set ns.r = ns.r + [{"h": i, "p": (prices[i] | float(0))}] %}{% endfor %}{{
        ns.r }}'
      cheapest3: '{{ (rows | sort(attribute="p"))[:3] if have_tomorrow else [] }}'
      expensive3: '{{ (rows | sort(attribute="p"))[-3:] if have_tomorrow else [] }}'
      fmt_hours: '{% macro hh(x) %}{{ "%02d:00" | format(x) }}{% endmacro %}{% set
        out = namespace(s="") %}{% for item in cheapest3 %}{% set out.s = out.s +
        "• " + hh(item.h) + " = " + (item.p | round(4) | string) + " EUR/kWh

        " %}{% endfor %}{{ out.s }}'
      fmt_hours_hi: '{% macro hh(x) %}{{ "%02d:00" | format(x) }}{% endmacro %}{%
        set out = namespace(s="") %}{% for item in expensive3 %}{% set out.s = out.s
        + "• " + hh(item.h) + " = " + (item.p | round(4) | string) + " EUR/kWh

        " %}{% endfor %}{{ out.s }}'
      p_now: '{{ states(''sensor.nord_pool_lv_current_price'') | float(0) }}'
      p_now_line: '{{ p_now | round(4) }} EUR/kWh'
      advice: '{% if not have_tomorrow %}Завтрашние цены ещё не опубликованы.{% else
        %}Планируй бойлер/нагрев/стирку на дешёвые часы.{% endif %}'
      msg_ok: "\U0001F4CA Nord Pool: прогноз на завтра ({{ tomorrow_date }}) \U0001F552
        {{ now_ts }}\n\U0001F53B Мин: {{ p_min | round(4) }} EUR/kWh \U0001F53A Макс:
        {{ p_max | round(4) }} EUR/kWh \U0001F9E0 Среднее: {{ p_avg | round(4) }}
        EUR/kWh ⚡ Сейчас: {{ p_now_line }}\n\U0001F7E2 ТОП-3 дешёвых:\n{{ fmt_hours
        }}\n\U0001F534 ТОП-3 дорогих:\n{{ fmt_hours_hi }}\n\U0001F4A1 {{ advice }}"
      msg_no: "\U0001F4CA Nord Pool ({{ now_ts }}) Завтрашние цены пока недоступны.
        Попробую позже автоматически."
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ should_send }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ have_tomorrow }}'
          sequence:
          - action: notify.send_message
            target:
              entity_id: '{{ tg_entity }}'
            data:
              message: '{{ msg_ok }}'
        - conditions:
          - condition: template
            value_template: '{{ not have_tomorrow }}'
          sequence:
          - action: notify.send_message
            target:
              entity_id: '{{ tg_entity }}'
            data:
              message: '{{ msg_no }}'
    default: []
  mode: single
- id: '1765800619701'
  alias: ⏰ Скоро будет дешёвое электричество
  triggers:
  - trigger: numeric_state
    entity_id: sensor.nord_pool_lv_next_price
    below: 0.04
    for:
      minutes: 2
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.nord_pool_lv_next_price'') not in [''unknown'',''unavailable'']
      }}'
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - as_datetime(this.attributes.last_triggered)).total_seconds()
      > 14400 }}'
  actions:
  - variables:
      p: '{{ states(''sensor.nord_pool_lv_next_price'') | float(0) }}'
  - action: telegram_bot.send_message
    data:
      chat_id: 100000000
      message: "⏰⚡ Скоро дешёвое электричество!\nСледующая цена: {{ \"%.5f\" | format(p)
        }} EUR/kWh\nМожно планировать нагрев \U0001F525"
      inline_keyboard:
      - - - "\U0001F697 EV зарядить сейчас"
          - /ev_start
  mode: single
- id: '1765801568958'
  alias: "\U0001F50C Уведомления о розетках (умные) v7"
  description: 'ТОЛЬКО недоступность розеток. 2026-08-16: on/off-триггер удалён —
    штатные переключения теперь сводит дайджест 1790300001003 «Изменения в доме»,
    иначе одно и то же событие приходило дважды. Осталось: unavailable через 2 мин
    (гидрофор — через 30 мин). Антиспам-условие «не сообщать о возврате из
    unavailable/unknown» сохранено без изменений.

    '
  triggers:
  # 2026-08-19 (P1, дедупликация шторма): из этого списка убраны
  # switch.akvarium_svet_socket_1, switch.retserkuliatsiia_goriachai_vody_socket_1 и
  # switch.ev_charger_switch — ровно эти три уже покрывает «🚨 Устройство недоступно»
  # (1778900002001, порог 5 мин), поэтому один обрыв Tuya давал ДВА сообщения об
  # одной и той же сущности (через 2 мин отсюда и через 5 мин оттуда). Ни одно
  # сообщение об отказе не потеряно: каждая сущность по-прежнему алертит, но один раз.
  # switch.zigbee_plug_socket_1 в 1778900002001 отсутствует, поэтому остаётся здесь.
  - trigger: state
    entity_id:
    - switch.zigbee_plug_socket_1
    to: unavailable
    for: 00:02:00
  - trigger: state
    entity_id: switch.zigbee_plug_2_socket_1
    to: unavailable
    for: 00:30:00
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is none or trigger.from_state.state not
      in [''unavailable'', ''unknown''] }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger is not defined or trigger.to_state is not defined
          }}'
      sequence:
      - stop: Ручной запуск не поддерживается.
  - variables:
      eid: '{{ trigger.entity_id }}'
      name: '{{ trigger.to_state.name if trigger.to_state is not none else trigger.entity_id
        }}'
      from_state: '{{ trigger.from_state.state if trigger.from_state is not none else
        ''unknown'' }}'
      to_state: '{{ trigger.to_state.state if trigger.to_state is not none else ''unknown''
        }}'
      now_ts: '{{ now().strftime(''%d.%m.%Y %H:%M:%S'') }}'
      price_now_f: '{{ states(''sensor.nord_pool_lv_current_price'') | float(0) |
        round(4) }}'
      price_level: '{% set p = states(''sensor.nord_pool_lv_current_price'') | float(0)
        %} {% if p <= 0.04 %}дёшево {% elif p <= 0.10 %}норма {% elif p <= 0.20 %}дорого
        {% else %}критично{% endif %}'
      energy_entity: '{% if eid == ''switch.smart_plug_2_socket_1'' %}sensor.boiler_total_energy
        {% elif eid == ''switch.kalarifer_socket_1'' %}sensor.terarium_total_energy
        {% elif eid == ''switch.akvarium_svet_socket_1'' %}sensor.akvarium_svet_total_energy
        {% elif eid == ''switch.retserkuliatsiia_goriachai_vody_socket_1'' %}sensor.cherepakha_total_energy
        {% elif eid == ''switch.zigbee_plug_socket_1'' %}sensor.zigbee_plug_total_energy
        {% elif eid == ''switch.zigbee_plug_2_socket_1'' %}sensor.zigbee_plug_2_total_energy
        {% elif eid == ''switch.ev_charger_switch'' %}sensor.ev_charger_energy {%
        else %}{% endif %}'
      energy_val: '{% if energy_entity | trim | length > 0 %}{{ states(energy_entity
        | trim) }}{% else %}{% endif %}'
      on_duration_sec: "{% if from_state in ['on', 'unavailable']\n      and trigger.from_state
        is not none\n      and trigger.to_state is not none %}\n  {{ (as_timestamp(trigger.to_state.last_changed)
        - as_timestamp(trigger.from_state.last_changed)) | int(0) }}\n{% else %}0{%
        endif %}"
      state_emoji: '{% if to_state == ''on'' %}✅ {% elif to_state == ''off'' %}⭕ {%
        elif to_state == ''unavailable'' %}❌ {% else %}❓{% endif %}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ to_state == ''off'' and from_state == ''on'' and on_duration_sec
          | int(0) < 120 }}'
      sequence:
      - stop: OFF слишком быстро после ON. Не отправляем.
  - variables:
      tip: '{% set p = states(''sensor.nord_pool_lv_current_price'') | float(0) %}
        {% if to_state == ''on'' and p >= 0.20 %}Цена высокая, подумай выключить если
        не срочно. {% elif to_state == ''unavailable'' %}Проверь питание, Wi-Fi и
        само устройство. {% else %}{% endif %}'
      duration_txt: "{% if to_state in ['off', 'unavailable'] and on_duration_sec
        | int(0) > 0 %}\n  {% set sec = on_duration_sec | int(0) %}\n  {% set h =
        (sec // 3600) %}\n  {% set m = ((sec % 3600) // 60) %}\n  {% set s = (sec
        % 60) %}\n  Работало: {{ '%02d:%02d:%02d' | format(h, m, s) }}\n{% else %}{%
        endif %}"
      msg: "{% set ns = namespace(lines=[]) %} {% set ns.lines = ns.lines + [state_emoji
        ~ ' Розетка: ' ~ name] %} {% set ns.lines = ns.lines + ['Время: ' ~ now_ts]
        %} {% set ns.lines = ns.lines + ['Состояние: ' ~ to_state ~ ' (было: ' ~ from_state
        ~ ')'] %} {% if duration_txt | trim | length > 0 %}\n  {% set ns.lines = ns.lines
        + [duration_txt | trim] %}\n{% endif %} {% set ns.lines = ns.lines + ['Цена:
        ' ~ price_now_f ~ ' EUR/kWh (' ~ price_level | trim ~ ')'] %} {% if energy_val
        | trim | length > 0 and energy_val | trim not in ['unknown', 'unavailable']
        %}\n  {% set ns.lines = ns.lines + ['Энергия всего: ' ~ energy_val | trim
        ~ ' kWh'] %}\n{% endif %} {% if tip | trim | length > 0 %}\n  {% set ns.lines
        = ns.lines + [tip | trim] %}\n{% endif %} {{ ns.lines | join('\\n') }}"
  - action: notify.send_message
    target:
      entity_id: notify.telegram_owner
    data:
      message: '{{ msg }}'
  mode: parallel
  max: 10
- id: '1765960140022'
  alias: 🧠 Самодиагностика дома v3
  description: '4 раза в день. Отправляет только важное: цену, активные нагрузки,
    алерты безопасности, низкие батареи, состояние системы. Если всё в норме — короткое
    OK.'
  triggers:
  - trigger: time
    at: '11:00:00'
  - trigger: time
    at: '15:00:00'
  - trigger: time
    at: '19:00:00'
  conditions: []
  actions:
  - variables:
      p_now: '{{ states(''sensor.nord_pool_lv_current_price'') | float(0) }}'
      p_next: '{{ states(''sensor.nord_pool_lv_next_price'') | float(0) }}'
      price_emoji: '{% if p_now <= 0.04 %}🟢{% elif p_now <= 0.10 %}🟡{% elif p_now
        <= 0.20 %}🟠{% else %}🔴{% endif %}'
      price_trend: '{% if p_next < p_now - 0.005 %}↘ дешевеет{% elif p_next > p_now
        + 0.005 %}↗ дорожает{% else %}→ стабильна{% endif %}'
      price_line: '{{ price_emoji }} {{ p_now | round(4) }} EUR/kWh ({{ price_trend
        }}, след. {{ p_next | round(4) }})'
      boiler_on: '{{ is_state(''switch.smart_plug_2_socket_1'', ''on'') }}'
      boiler_kwh: '{{ states(''sensor.boiler_total_energy'') | float(0) | round(1)
        }}'
      kalar_on: '{{ is_state(''switch.kalarifer_socket_1'', ''on'') }}'
      kalar_kwh: '{{ states(''sensor.terarium_total_energy'') | float(0) | round(1)
        }}'
      akv_on: '{{ is_state(''switch.akvarium_svet_socket_1'', ''on'') }}'
      akv_kwh: '{{ states(''sensor.akvarium_svet_total_energy'') | float(0) | round(1)
        }}'
      chep_on: '{{ is_state(''switch.retserkuliatsiia_goriachai_vody_socket_1'', ''on'')
        }}'
      chep_kwh: '{{ states(''sensor.cherepakha_total_energy'') | float(0) | round(1)
        }}'
      ev_on: '{{ is_state(''switch.ev_charger_switch'', ''on'') }}'
      ev_kwh: '{{ states(''sensor.ev_charger_energy'') | float(0) | round(1) }}'
      gidro_on: '{{ is_state(''switch.zigbee_plug_2_socket_1'', ''on'') }}'
      loads_text: '{% set items = namespace(v=[]) %}{% if boiler_on %}{% set items.v
        = items.v + [''Бойлер '' ~ boiler_kwh ~ '' kWh''] %}{% endif %}{% if kalar_on
        %}{% set items.v = items.v + [''Полотенцесушитель '' ~ kalar_kwh ~ '' kWh'']
        %}{% endif %}{% if akv_on %}{% set items.v = items.v + [''Аквариум '' ~ akv_kwh
        ~ '' kWh''] %}{% endif %}{% if chep_on %}{% set items.v = items.v + [''Черепаха
        '' ~ chep_kwh ~ '' kWh''] %}{% endif %}{% if ev_on %}{% set items.v = items.v
        + [''EV '' ~ ev_kwh ~ '' kWh''] %}{% endif %}{% if gidro_on %}{% set items.v
        = items.v + [''Гидрофор''] %}{% endif %}{{ items.v | join('', '') }}'
      smoke: '{{ is_state(''binary_sensor.wifi_th_smoke_sensor_smoke'', ''on'') }}'
      moisture_bath: '{{ is_state(''binary_sensor.vannaia_moisture'', ''on'') }}'
      moisture_garage: '{{ is_state(''binary_sensor.garazh_moisture'', ''on'') }}'
      moisture_kitchen: '{{ is_state(''binary_sensor.kukhnia_moisture'', ''on'') }}'
      moisture_w4: '{{ is_state(''binary_sensor.water_sensor_4_moisture'', ''on'')
        }}'
      door_open_night: '{{ is_state(''binary_sensor.door_sensor_door'', ''on'') and
        now().hour >= 22 }}'
      alerts_text: '{% set a = namespace(v=[]) %}{% if smoke %}{% set a.v = a.v +
        [''🔥 ДЫМ!''] %}{% endif %}{% if moisture_bath %}{% set a.v = a.v + [''💧 Влага
        ванная''] %}{% endif %}{% if moisture_garage %}{% set a.v = a.v + [''💧 Влага
        гараж''] %}{% endif %}{% if moisture_kitchen %}{% set a.v = a.v + [''💧 Влага
        кухня''] %}{% endif %}{% if moisture_w4 %}{% set a.v = a.v + [''💧 Влага датчик
        4''] %}{% endif %}{% if door_open_night %}{% set a.v = a.v + [''🚪 Дверь открыта
        ночью!''] %}{% endif %}{{ a.v | join(''  '') }}'
      low_battery_text: '{% set sensors = [  (''sensor.perenosnoi_pult_battery'',
        ''Пульт''),  (''sensor.signalizatsiia_dvernogo_datchika_battery'', ''Сигн.1''),  (''sensor.signalizatsiia_dvernogo_datchika_battery_2'',
        ''Сигн.2''),  (''sensor.wifi_th_smoke_sensor_battery'', ''Дым датч''),  (''sensor.ostrov_vykliuchatel_battery'',
        ''Выкл.остров''),  (''sensor.vykuliuchatel_2_etazh_battery'', ''Выкл.2эт''),  (''sensor.motion_sensor_battery'',
        ''Движение''),  (''sensor.door_sensor_battery'', ''Дверь датч''),  (''sensor.kukhnia_battery'',
        ''Кухня''),  (''sensor.garazh_battery'', ''Гараж''),  (''sensor.vannaia_battery'',
        ''Ванная''),  (''sensor.water_sensor_4_battery'', ''Вода 4''),  (''sensor.pir_motion_sensor_battery'',
        ''PIR''),  (''sensor.occupancysensor_batareia'', ''Занятость''),  (''sensor.stsenarnyi_pult_battery'',
        ''Сцен.пульт'')] %}{% set low = namespace(v=[]) %}{% for entity, name in sensors
        %}  {% set v = states(entity) | float(-1) %}  {% if 0 <= v < 20 %}{% set low.v
        = low.v + [name ~ '' '' ~ (v | round(0) | int) ~ ''%''] %}{% endif %}{% endfor
        %}{{ low.v | join('', '') }}'
      t_kitchen: '{{ states(''sensor.kukhnia_temperature'') | float(-99) }}'
      h_kitchen: '{{ states(''sensor.kukhnia_humidity'') | float(-1) }}'
      climate_warn: '{% set w = namespace(v=[]) %}{% if t_kitchen != -99 and (t_kitchen
        < 17 or t_kitchen > 29) %}  {% set w.v = w.v + [''Кухня '' ~ t_kitchen ~ ''C'']
        %}{% endif %}{% if h_kitchen != -1 and (h_kitchen < 30 or h_kitchen > 75)
        %}  {% set w.v = w.v + [''Влажность '' ~ h_kitchen ~ ''%''] %}{% endif %}{{
        w.v | join('', '') }}'
      energy_advice: '{% if p_now <= 0.04 and not boiler_on and not ev_on %}Цена низкая
        — бойлер и EV выключены, можно включить.{% elif p_now > 0.15 and (boiler_on
        or kalar_on) %}Цена высокая ({{ p_now | round(4) }}) — включены {{ loads_text
        }}.{% else %}{% endif %}'
      ha_update: '{{ is_state(''binary_sensor.home_assistant_versions_update_available'',
        ''on'') }}'
      backup_ts: '{% set ts = as_timestamp(states(''sensor.backup_last_successful_automatic_backup''),
        default=0) %}{{ ts | float(0) }}'
      backup_age_h: '{% set ts = backup_ts | float(0) %}{% if ts > 0 %}{{ ((as_timestamp(now())
        - ts) / 3600) | round(0) | int }}{% else %}-1{% endif %}'
      backup_old: '{{ (backup_age_h | int(-1)) > 25 }}'
      unavail_text: '{% set watched = [  ''sensor.nord_pool_lv_current_price'',  ''climate.floor_heating'',  ''climate.floor_heating_2'',  ''binary_sensor.wifi_th_smoke_sensor_smoke'',  ''binary_sensor.vannaia_moisture'',  ''binary_sensor.garazh_moisture'',  ''switch.voda_kran_switch_1'',  ''switch.smart_plug_2_socket_1'']
        %}{% set bad = namespace(v=[]) %}{% for e in watched %}  {% if states(e) in
        [''unavailable'',''unknown''] %}    {% set bad.v = bad.v + [(state_attr(e,''friendly_name'')
        or e).split(''.'')[-1]] %}  {% endif %}{% endfor %}{{ bad.v | join('', '')
        }}'
      has_alerts: '{{ alerts_text | trim | length > 0 }}'
      has_loads: '{{ loads_text | trim | length > 0 }}'
      has_advice: '{{ energy_advice | trim | length > 0 }}'
      has_battery: '{{ low_battery_text | trim | length > 0 }}'
      has_climate: '{{ climate_warn | trim | length > 0 }}'
      has_unavail: '{{ unavail_text | trim | length > 0 }}'
      all_ok: '{{ not has_alerts and not has_battery and not ha_update and not backup_old
        and not has_unavail and not has_advice and not has_climate }}'
      msg: '🏠 {{ now().strftime(''%H:%M'') }} | {{ price_line }}

        {% if has_alerts %}

        ⚠️ {{ alerts_text | trim }}

        {% endif %}{% if has_loads %}⚡ Работает: {{ loads_text | trim }}

        {% endif %}{% if has_advice %}💡 {{ energy_advice | trim }}

        {% endif %}{% if has_climate %}🌡 Климат: {{ climate_warn | trim }}

        {% endif %}{% if has_battery %}🔋 Низкий заряд: {{ low_battery_text | trim
        }}

        {% endif %}{% if ha_update %}🔄 Обновление HA доступно

        {% endif %}{% if backup_old %}💾 Backup: {{ backup_age_h }}ч назад — проверь!

        {% endif %}{% if has_unavail %}❌ Недоступны: {{ unavail_text | trim }}

        {% endif %}{% if all_ok %}✅ Всё в порядке.

        {% endif %}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not all_ok }}'
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: '{{ msg | trim }}'
  mode: single
- id: '1766138420302'
  alias: "\U0001F525 Бойлер по Nord Pool (<=0.10 ON, >0.10 OFF)"
  description: Включает и выключает бойлер по текущей цене Nord Pool.
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: sensor.nord_pool_lv_current_price
    for: 00:00:30
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.nord_pool_lv_current_price'') not in [''unknown'',''unavailable'',''none'',''None'','''']
      }}'
  - condition: template
    alias: Ручной режим бойлера снят (иначе цена бойлер не трогает)
    value_template: '{{ not is_state(''input_boolean.boiler_manual_mode'', ''on'') }}'
  actions:
  - variables:
      threshold: 0.10
      price_now: '{{ states(''sensor.nord_pool_lv_current_price'') | float(999) }}'
      price_txt: '{{ price_now | round(4) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ price_now <= threshold and is_state(''switch.smart_plug_2_socket_1'',
          ''off'') and is_state(''switch.ev_charger_switch'', ''off'') and not is_state(''sensor.ev_charger_status'',
          ''charger_charging'') }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.smart_plug_2_socket_1
      - delay: 00:00:10
      - wait_template: '{{ is_state(''switch.smart_plug_2_socket_1'', ''on'') }}'
        timeout: 00:00:20
        continue_on_timeout: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ not is_state(''switch.smart_plug_2_socket_1'', ''on'') }}'
          - condition: template
            value_template: '{{ (now().timestamp() - (state_attr(''input_datetime.tuya_cmd_fail_boiler'',
              ''timestamp'') | float(0))) > 21600 }}'
          sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.tuya_cmd_fail_boiler
            data:
              timestamp: '{{ now().timestamp() }}'
          - action: telegram_bot.send_message
            data:
              chat_id: 100000000
              parse_mode: html
              message: |-
                ⚠️ Бойлер: команда не подействовала
                Реле <code>switch.smart_plug_2_socket_1</code> не перешло в состояние "on" за 30 с.
                Сейчас в HA: {{ states('switch.smart_plug_2_socket_1') }}
                Связь с Tuya могла устареть — состояние в HA может не соответствовать реальному.
                Повтор этого сообщения — не чаще раза в 6 ч.
    - conditions:
      - condition: template
        value_template: '{{ price_now > threshold and is_state(''switch.smart_plug_2_socket_1'',
          ''on'') and not is_state(''input_boolean.turbo_hot_water'', ''on'') }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.smart_plug_2_socket_1
      - delay: 00:00:10
      - wait_template: '{{ is_state(''switch.smart_plug_2_socket_1'', ''off'') }}'
        timeout: 00:00:20
        continue_on_timeout: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ not is_state(''switch.smart_plug_2_socket_1'', ''off'') }}'
          - condition: template
            value_template: '{{ (now().timestamp() - (state_attr(''input_datetime.tuya_cmd_fail_boiler'',
              ''timestamp'') | float(0))) > 21600 }}'
          sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.tuya_cmd_fail_boiler
            data:
              timestamp: '{{ now().timestamp() }}'
          - action: telegram_bot.send_message
            data:
              chat_id: 100000000
              parse_mode: html
              message: |-
                ⚠️ Бойлер: команда не подействовала
                Реле <code>switch.smart_plug_2_socket_1</code> не перешло в состояние "off" за 30 с.
                Сейчас в HA: {{ states('switch.smart_plug_2_socket_1') }}
                Связь с Tuya могла устареть — состояние в HA может не соответствовать реальному.
                Повтор этого сообщения — не чаще раза в 6 ч.
  mode: single
- id: '1766844364781'
  alias: "\U0001F916 Telegram AI управление домом (Gemini) - FINAL"
  description: 'Telegram -> управление устройствами + статус AI отчёт. Команды: статус,
    status, включи/выключи [устройство].'
  triggers:
  - trigger: event
    event_type: telegram_text
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.chat_id | int(0) == 100000000 }}'
  - condition: template
    value_template: '{{ trigger.event.data.text is defined and (trigger.event.data.text
      | string | length) > 0 }}'
  actions:
  - variables:
      chat_id: '{{ trigger.event.data.chat_id | int }}'
      user_text: '{{ trigger.event.data.text | string }}'
      user_lc: '{{ trigger.event.data.text | string | lower }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ''status'' in user_lc or ''статус'' in user_lc or ''отчёт''
          in user_lc or ''отчет'' in user_lc or ''что дома'' in user_lc or ''как дома''
          in user_lc }}'
      sequence:
      - variables:
          p_now_f: '{{ states(''sensor.nord_pool_lv_current_price'') | float(0) |
            round(4) }}'
          p_next_f: '{{ states(''sensor.nord_pool_lv_next_price'') | float(0) | round(4)
            }}'
          p_low_f: '{{ states(''sensor.nord_pool_lv_lowest_price'') | float(0) | round(4)
            }}'
          p_high_f: '{{ states(''sensor.nord_pool_lv_highest_price'') | float(0) |
            round(4) }}'
          price_level: '{% set p = states(''sensor.nord_pool_lv_current_price'') |
            float(0) %}{% if p <= 0.04 %}очень дёшево, самое время включать нагрузки{%
            elif p <= 0.10 %}нормальная цена{% elif p <= 0.20 %}дорого, лучше отложить
            нагрузки{% else %}критически дорого, выключай всё лишнее{% endif %}'
          boiler_st: '{{ states(''switch.smart_plug_2_socket_1'') }}'
          kalar_st: '{{ states(''switch.kalarifer_socket_1'') }}'
          akv_st: '{{ states(''switch.akvarium_svet_socket_1'') }}'
          chep_st: '{{ states(''switch.retserkuliatsiia_goriachai_vody_socket_1'')
            }}'
          gidro_st: '{{ states(''switch.zigbee_plug_2_socket_1'') }}'
          ev_st: '{{ states(''switch.ev_charger_switch'') }}'
          kran_st: '{{ states(''switch.voda_kran_switch_1'') }}'
          e_boiler: '{{ states(''sensor.boiler_total_energy'') | float(0) | round(2)
            }}'
          e_kalar: '{{ states(''sensor.terarium_total_energy'') | float(0) | round(2)
            }}'
          e_akv: '{{ states(''sensor.akvarium_svet_total_energy'') | float(0) | round(2)
            }}'
          e_chep: '{{ states(''sensor.cherepakha_total_energy'') | float(0) | round(2)
            }}'
          e_gidro: '{{ states(''sensor.zigbee_plug_2_total_energy'') | float(0) |
            round(2) }}'
          t_kitchen: '{{ states(''sensor.kukhnia_temperature'') }}'
          h_kitchen: '{{ states(''sensor.kukhnia_humidity'') }}'
          t_station: '{{ states(''sensor.smart_weather_station_temperature'') }}'
          door_main: '{{ states(''binary_sensor.door_sensor_door'') }}'
          smoke: '{{ states(''binary_sensor.wifi_th_smoke_sensor_smoke'') }}'
          moisture_bath: '{{ states(''binary_sensor.vannaia_moisture'') }}'
          moisture_garage: '{{ states(''binary_sensor.garazh_moisture'') }}'
          moisture_kitchen: '{{ states(''binary_sensor.kukhnia_moisture'') }}'
          now_ts: '{{ now().strftime(''%d.%m.%Y %H:%M'') }}'
          status_blob: 'Время: {{ now_ts }}. Цена сейчас: {{ p_now_f }} EUR/kWh ({{
            price_level | trim }}). Следующий час: {{ p_next_f }}. Минимум: {{ p_low_f
            }}, максимум: {{ p_high_f }}. Нагрузки: Бойлер {{ boiler_st }} ({{ e_boiler
            }} kWh), Полотенцесушитель {{ kalar_st }} ({{ e_kalar }} kWh), Аквариум
            {{ akv_st }} ({{ e_akv }} kWh), Черепаха {{ chep_st }} ({{ e_chep }} kWh),
            Гидрофор {{ gidro_st }} ({{ e_gidro }} kWh), EV зарядка {{ ev_st }}. Кран
            воды: {{ kran_st }}. Климат: кухня {{ t_kitchen }}C влажность {{ h_kitchen
            }}%, станция {{ t_station }}C. Безопасность: входная дверь {{ door_main
            }}, дым {{ smoke }}, влага ванная {{ moisture_bath }}, влага гараж {{
            moisture_garage }}, влага кухня {{ moisture_kitchen }}.'
      - action: ai_task.generate_data
        response_variable: ai_out
        continue_on_error: true
        data:
          entity_id: ai_task.google_ai_task
          task_name: home_status_on_demand
          instructions: 'Напиши короткий отчёт о доме на русском языке. Максимум 6
            строк. Без Markdown. Без символов _ * ` [ ]. Порядок: сначала цена электричества
            и конкретный совет что включить или выключить прямо сейчас. Потом кратко
            что работает и сколько накоплено kWh. Потом безопасность только если есть
            проблема (дверь открыта, дым, влага). Если всё нормально с безопасностью
            не упоминай её. В конце один практичный совет. Данные: {{ status_blob
            }}'
          structure:
            report:
              selector:
                text:
      - variables:
          ai_text_raw: '{% if ai_out is defined %}{% if ai_out is string %}{{ ai_out
            }}{% elif ai_out.report is defined %}{{ ai_out.report }}{% elif ai_out.data
            is defined and ai_out.data.report is defined %}{{ ai_out.data.report }}{%
            else %}{% endif %}{% else %}{% endif %}'
          ai_text: '{{ (ai_text_raw | string) | replace(''_'','' '') | replace(''*'','''')
            | replace(''`'','''') | replace(''['','''') | replace('']'','''') | trim
            }}'
          fallback_msg: 'Статус дома {{ now_ts }} Цена: {{ p_now_f }} EUR/kWh Следующий
            час: {{ p_next_f }} EUR/kWh Бойлер: {{ boiler_st }} ({{ e_boiler }} kWh)
            Полотенцесушитель: {{ kalar_st }} Черепаха: {{ chep_st }} Гидрофор: {{
            gidro_st }} EV: {{ ev_st }} Кран воды: {{ kran_st }} Кухня: {{ t_kitchen
            }}C / {{ h_kitchen }}% Дверь: {{ door_main }}, дым: {{ smoke }}'
          final_msg: '{{ ai_text if ai_text | length > 10 else fallback_msg }}'
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat_id }}'
          message: '{{ final_msg }}'
      - stop: done
  - action: ai_task.generate_data
    response_variable: gemini
    continue_on_error: true
    data:
      entity_id: ai_task.google_ai_task
      task_name: home_control
      instructions: 'Ты управляешь умным домом через Home Assistant. Верни ТОЛЬКО
        одну строку JSON без Markdown. Формат строго: {"intent":"control|status","target":"...","action":"turn_on|turn_off|toggle|status"}

        Допустимые target: boiler, kalarifer, aquarium, turtle, island, table, second_floor,
        veranda, hall1, hall2, rgb_bath, led_stairs, led_kitchen, curtain_lights,
        living_square2, tv_wall, living_square1, garland, floodlight, all_sockets_on,
        all_sockets_off, water_valve, home

        Синонимы: бойлер/водонагреватель=boiler, полотенцесушитель/обогреватель=kalarifer,
        аквариум=aquarium, черепаха/террариум=turtle, остров=island, стол=table, веранда=veranda,
        прихожая 1=hall1, прихожая 2=hall2, лента баня/rgb=rgb_bath, лестница лента=led_stairs,
        кухня лента=led_kitchen, занавеска=curtain_lights, квадрат зона 2=living_square2,
        квадрат зона 1=living_square1, тв стена/звездная стена=tv_wall, гирлянда=garland,
        прожектор=floodlight, все розетки вкл=all_sockets_on, все розетки выкл=all_sockets_off,
        кран/вода=water_valve.

        Команда: "{{ user_text }}"'
      structure:
        command:
          selector:
            text:
  - variables:
      ai_raw: '{% if gemini is defined %}{% if gemini is string %}{{ gemini }}{% elif
        gemini.command is defined %}{{ gemini.command }}{% elif gemini.data is defined
        and gemini.data.command is defined %}{{ gemini.data.command }}{% else %}{%
        endif %}{% else %}{% endif %}'
      ai_intent: '{{ (ai_raw | string | regex_search(''"intent"\s*:\s*"([^"]+)"'')
        or ["",""])[1] | lower | trim }}'
      ai_target: '{{ (ai_raw | string | regex_search(''"target"\s*:\s*"([^"]+)"'')
        or ["",""])[1] | lower | trim }}'
      ai_act: '{{ (ai_raw | string | regex_search(''"action"\s*:\s*"([^"]+)"'') or
        ["",""])[1] | lower | trim }}'
  - variables:
      user_wants_status: '{{ ''статус'' in user_lc or ''что включ'' in user_lc or
        ''состояние'' in user_lc or ''как дела'' in user_lc }}'
      user_act_guess: '{% if ''выключ'' in user_lc or ''отключ'' in user_lc or ''погаси''
        in user_lc or ''перекрой'' in user_lc %}turn_off{% elif ''включ'' in user_lc
        or ''зажги'' in user_lc or ''открой'' in user_lc %}turn_on{% elif ''переключ''
        in user_lc %}toggle{% else %}unknown{% endif %}'
      user_target_guess: '{% set t = user_lc %}{% if ''бойлер'' in t or ''водонагрев''
        in t %}boiler{% elif ''полотенцесушитель'' in t or ''обогрев'' in t %}kalarifer{%
        elif ''аквариум'' in t %}aquarium{% elif ''черепах'' in t or ''террариум''
        in t %}turtle{% elif ''кран'' in t or ''перекрой'' in t or (''воду'' in t
        and ''открой'' in t) %}water_valve{% elif ''остров'' in t %}island{% elif
        ''стол'' in t %}table{% elif ''веранд'' in t %}veranda{% elif ''прихож'' in
        t and (''1'' in t or ''первая'' in t) %}hall1{% elif ''прихож'' in t and (''2''
        in t or ''вторая'' in t) %}hall2{% elif ''rgb'' in t and ''бан'' in t %}rgb_bath{%
        elif ''лестниц'' in t and ''лент'' in t %}led_stairs{% elif ''кухн'' in t
        and ''лент'' in t %}led_kitchen{% elif ''занавес'' in t %}curtain_lights{%
        elif ''квадрат'' in t and ''2'' in t %}living_square2{% elif ''квадрат'' in
        t and ''1'' in t %}living_square1{% elif ''тв'' in t or (''стен'' in t and
        ''звезд'' in t) %}tv_wall{% elif ''гирлянд'' in t %}garland{% elif ''прожектор''
        in t %}floodlight{% elif ''все розетки'' in t and ''включ'' in t %}all_sockets_on{%
        elif ''все розетки'' in t and ''выключ'' in t %}all_sockets_off{% else %}unknown{%
        endif %}'
      intent: '{% if user_wants_status %}status{% elif ai_intent in [''control'',''status'']
        %}{{ ai_intent }}{% elif user_act_guess != ''unknown'' %}control{% else %}status{%
        endif %}'
      act: '{% if user_wants_status %}status{% elif ai_act in [''turn_on'',''turn_off'',''toggle'',''status'']
        and not (ai_act == ''status'' and user_act_guess != ''unknown'') %}{{ ai_act
        }}{% elif user_act_guess != ''unknown'' %}{{ user_act_guess }}{% else %}status{%
        endif %}'
      target: '{% set valid = [''boiler'',''kalarifer'',''aquarium'',''turtle'',''island'',''table'',''second_floor'',''veranda'',''hall1'',''hall2'',''rgb_bath'',''led_stairs'',''led_kitchen'',''curtain_lights'',''living_square2'',''tv_wall'',''living_square1'',''garland'',''floodlight'',''all_sockets_on'',''all_sockets_off'',''water_valve'',''home'']
        %}{% if user_wants_status %}home{% elif ai_target in valid %}{{ ai_target
        }}{% elif user_target_guess != ''unknown'' %}{{ user_target_guess }}{% else
        %}home{% endif %}'
  - variables:
      entity_id: '{% set t = target | trim %}{% if t == ''boiler'' %}switch.smart_plug_2_socket_1{%
        elif t == ''kalarifer'' %}switch.kalarifer_socket_1{% elif t == ''aquarium''
        %}switch.akvarium_svet_socket_1{% elif t == ''turtle'' %}switch.retserkuliatsiia_goriachai_vody_socket_1{%
        elif t == ''water_valve'' %}switch.voda_kran_switch_1{% elif t == ''island''
        %}light.svet_pervyi_etazh_1_light{% elif t == ''table'' %}light.svet_pervyi_etazh_1_light_2{%
        elif t == ''second_floor'' %}light.vtoroi_etazh_light{% elif t == ''veranda''
        %}light.veranda_light{% elif t == ''hall1'' %}light.prikhozhaia_i_fanar_light{%
        elif t == ''hall2'' %}light.prikhozhaia_i_fanar_light_2{% elif t == ''rgb_bath''
        %}light.dream_color_rgb{% elif t == ''led_stairs'' %}switch.kukhnia_poloski_switch_1{%
        elif t == ''led_kitchen'' %}switch.kukhnia_poloski_switch_2{% elif t == ''curtain_lights''
        %}switch.gostinnaia_zanaveska_zona_switch_1{% elif t == ''living_square2''
        %}switch.gostinnaia_zanaveska_zona_switch_2{% elif t == ''tv_wall'' %}switch.svet_tv_zona_switch_1{%
        elif t == ''living_square1'' %}switch.svet_tv_zona_switch_2{% elif t == ''garland''
        %}switch.smart_switch_2ch_switch_1{% elif t == ''floodlight'' %}switch.smart_switch_2ch_switch_2{%
        elif t == ''all_sockets_on'' %}scene.turn_on_all_sockets{% elif t == ''all_sockets_off''
        %}scene.turn_off_all_sockets{% else %}unknown{% endif %}'
      entity_id_clean: '{{ entity_id | string | trim }}'
      ai_denied: '{% set e = entity_id | string | trim %}{{ e in [''switch.voda_kran_switch_1'',
        ''siren.alarm'', ''scene.turn_on_all_sockets'', ''scene.turn_off_all_sockets'']
        or e[:6] == ''siren.'' or e[:7] == ''script.'' }}'
      friendly: '{% set t = target | trim %}{% if t == ''boiler'' %}Бойлер{% elif
        t == ''kalarifer'' %}Полотенцесушитель{% elif t == ''aquarium'' %}Аквариум{%
        elif t == ''turtle'' %}Черепаха{% elif t == ''water_valve'' %}Кран воды{%
        elif t == ''island'' %}Свет Остров{% elif t == ''table'' %}Свет Стол{% elif
        t == ''second_floor'' %}Свет 2 этаж{% elif t == ''veranda'' %}Свет Веранда{%
        elif t == ''hall1'' %}Прихожая 1{% elif t == ''hall2'' %}Прихожая 2{% elif
        t == ''rgb_bath'' %}RGB лента баня{% elif t == ''led_stairs'' %}LED лента
        лестница{% elif t == ''led_kitchen'' %}LED лента кухня{% elif t == ''curtain_lights''
        %}Подсветка занавески{% elif t == ''living_square2'' %}LED квадрат зона 2{%
        elif t == ''tv_wall'' %}Звездная стена ТВ{% elif t == ''living_square1'' %}LED
        квадрат зона 1{% elif t == ''garland'' %}Гирлянда{% elif t == ''floodlight''
        %}Прожектор{% elif t == ''all_sockets_on'' %}Все розетки ВКЛ{% elif t == ''all_sockets_off''
        %}Все розетки ВЫКЛ{% else %}{{ target }}{% endif %}'
  - choose:
    - alias: Deny-list — ИИ не управляет защитными устройствами
      conditions:
      - condition: template
        value_template: '{{ ai_denied }}'
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat_id }}'
          message: 'Отказано: {{ friendly }} — защитное устройство. ИИ-помощник не
            управляет главным краном воды, сиреной и групповыми сценами розеток. Сделай
            это кнопкой в меню Telegram или в Mini App.'
      - stop: denied by ai deny-list
    - conditions:
      - condition: template
        value_template: '{{ target | trim == ''home'' and act | trim == ''status''
          }}'
      sequence:
      - variables:
          p_now: '{{ states(''sensor.nord_pool_lv_current_price'') | float(0) | round(4)
            }}'
          p_next: '{{ states(''sensor.nord_pool_lv_next_price'') | float(0) | round(4)
            }}'
          status_msg: 'Статус дома {{ now().strftime(''%d.%m.%Y %H:%M'') }} Цена:
            {{ p_now }} EUR/kWh Следующая: {{ p_next }} EUR/kWh Бойлер: {{ states(''switch.smart_plug_2_socket_1'')
            }} Полотенцесушитель: {{ states(''switch.kalarifer_socket_1'') }} Аквариум:
            {{ states(''switch.akvarium_svet_socket_1'') }} Черепаха: {{ states(''switch.retserkuliatsiia_goriachai_vody_socket_1'')
            }} Гидрофор: {{ states(''switch.zigbee_plug_2_socket_1'') }} EV: {{ states(''switch.ev_charger_switch'')
            }} Кран воды: {{ states(''switch.voda_kran_switch_1'') }} Остров: {{ states(''light.svet_pervyi_etazh_1_light'')
            }} Стол: {{ states(''light.svet_pervyi_etazh_1_light_2'') }}'
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat_id }}'
          message: '{{ status_msg }}'
      - stop: done
    - conditions:
      - condition: template
        value_template: '{{ entity_id_clean == ''unknown'' }}'
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat_id }}'
          message: 'Не понял команду: {{ user_text }}'
      - stop: done
    - conditions:
      - condition: template
        value_template: '{{ entity_id_clean[:6] == ''scene.'' }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: '{{ entity_id_clean }}'
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat_id }}'
          message: 'Готово: {{ friendly }}.'
      - stop: done
    - conditions:
      - condition: template
        value_template: '{{ entity_id_clean[:7] == ''switch.'' and act | trim == ''turn_on''
          }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: '{{ entity_id_clean }}'
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat_id }}'
          message: 'Включено: {{ friendly }}.'
      - stop: done
    - conditions:
      - condition: template
        value_template: '{{ entity_id_clean[:7] == ''switch.'' and act | trim == ''turn_off''
          }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: '{{ entity_id_clean }}'
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat_id }}'
          message: 'Выключено: {{ friendly }}.'
      - stop: done
    - conditions:
      - condition: template
        value_template: '{{ entity_id_clean[:7] == ''switch.'' and act | trim == ''toggle''
          }}'
      sequence:
      - action: switch.toggle
        target:
          entity_id: '{{ entity_id_clean }}'
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat_id }}'
          message: 'Переключено: {{ friendly }}.'
      - stop: done
    - conditions:
      - condition: template
        value_template: '{{ entity_id_clean[:6] == ''light.'' and act | trim == ''turn_on''
          }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ entity_id_clean }}'
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat_id }}'
          message: 'Включено: {{ friendly }}.'
      - stop: done
    - conditions:
      - condition: template
        value_template: '{{ entity_id_clean[:6] == ''light.'' and act | trim == ''turn_off''
          }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: '{{ entity_id_clean }}'
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat_id }}'
          message: 'Выключено: {{ friendly }}.'
      - stop: done
    - conditions:
      - condition: template
        value_template: '{{ entity_id_clean[:6] == ''light.'' and act | trim == ''toggle''
          }}'
      sequence:
      - action: light.toggle
        target:
          entity_id: '{{ entity_id_clean }}'
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ chat_id }}'
          message: 'Переключено: {{ friendly }}.'
      - stop: done
    default:
    - action: telegram_bot.send_message
      data:
        chat_id: '{{ chat_id }}'
        message: 'Не смог выполнить: {{ user_text }}'
  mode: queued
  max: 10
- id: '1767188164410'
  alias: "\U0001F525 Тёплый пол ванная по Nord Pool (<=0.04 manual 30C, >0.04 auto)"
  description: Если цена Nord Pool <= 0.04 -> preset manual + 30C, если >0.04 -> preset
    auto
  triggers:
  - entity_id: sensor.nord_pool_lv_current_price
    below: 0.04001
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sensor.nord_pool_lv_current_price
    above: 0.04
    for:
      minutes: 2
    trigger: numeric_state
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.nord_pool_lv_current_price'') not in [''unknown'',''unavailable'','''']
      }}'
  - alias: Ручная выдержка по этому полу не активна
    condition: state
    entity_id: binary_sensor.floor_hold_vannaia
    state: 'off'
  actions:
  - variables:
      price_now: '{{ states(''sensor.nord_pool_lv_current_price'') | float(999) }}'
      price_txt: '{{ price_now | round(4) }}'
      current_preset: '{{ state_attr(''climate.floor_heating'', ''preset_mode'') |
        default(''unknown'') }}'
      current_temp: '{{ state_attr(''climate.floor_heating'', ''temperature'') | float(0)
        }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ price_now <= 0.04001 and (current_preset != "manual" or
          current_temp != 30)  and is_state(''input_boolean.night_saver'',''off'')
          and is_state(''input_boolean.rezhim_zhara'',''off'') }}'
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.floor_heating
        data:
          hvac_mode: heat_cool
      - action: climate.set_preset_mode
        target:
          entity_id: climate.floor_heating
        data:
          preset_mode: manual
      - action: climate.set_temperature
        target:
          entity_id: climate.floor_heating
        data:
          temperature: 30
    - conditions:
      - condition: template
        value_template: '{{ price_now > 0.04 and current_preset != "auto" and is_state(''input_boolean.night_saver'',''off'') and is_state(''input_boolean.rezhim_zhara'',''off'') }}'
      sequence:
      - action: climate.set_preset_mode
        target:
          entity_id: climate.floor_heating
        data:
          preset_mode: auto
  mode: single
- id: '1768228398352'
  alias: Ночной патруль (23:30)
  description: Проверяет подсветку в 23:30, спрашивает через Telegram
  triggers:
  - platform: time
    at: '23:30:00'
  conditions: []
  actions:
  - alias: Собрать список включённых огней
    variables:
      lights_on: "{% set ns = namespace(v=[]) %}\n{% set entities = [\n  'switch.kukhnia_poloski_switch_1',\n
        \ 'switch.kukhnia_poloski_switch_2',\n  'switch.gostinnaia_zanaveska_zona_switch_1',\n
        \ 'switch.gostinnaia_zanaveska_zona_switch_2',\n  'switch.svet_tv_zona_switch_1',\n
        \ 'switch.svet_tv_zona_switch_2',\n  'switch.smart_switch_2ch_switch_1',\n
        \ 'switch.smart_switch_2ch_switch_2',\n  'light.dream_color_rgb'\n] %}\n{%
        for e in entities %}\n  {% if states(e) in ['on','true'] %}\n    {% set ns.v
        = ns.v + [e] %}\n  {% endif %}\n{% endfor %}\n{{ ns.v | join(',') }}"
  - alias: Человеческие имена вместо entity_id
    # P3 2026-08-19: сообщение печатало «Включена подсветка: dreamcolorrgb» —
    # это entity_id light.dream_color_rgb, из которого markdown-разбор бота съел
    # подчёркивания (_color_ -> курсив). Лечение двойное: печатаем friendly_name и
    # переводим сообщение на parse_mode html с экранированием (| e), как требует
    # стандарт проекта для любого текста с entity_id.
    variables:
      lights_txt: "{% set ns = namespace(v=[]) %}\n{% for e in lights_on.split(',')
        if e | trim %}\n  {% set ns.v = ns.v + [state_attr(e, 'friendly_name') | default(e,
        true)] %}\n{% endfor %}\n{{ ns.v | join(', ') }}"
  - alias: Если есть включённые — спросить
    choose:
    - conditions:
      - condition: template
        value_template: '{{ lights_on | trim != '''' }}'
      sequence:
      - data:
          chat_id: 100000000
          parse_mode: html
          message: "\U0001F319 Ночной патруль 23:30\n\nВключена подсветка:\n{{ lights_txt
            | e }}\n\nВыключить всё?"
          inline_keyboard:
          - - - ✅ Выключить всё
              - /patrol_off_yes
            - - ❌ Оставить
              - /patrol_off_no
        action: telegram_bot.send_message
    default: []
  mode: single
- id: '1774376407472'
  alias: "\U0001F697 EV зарядка по цене рынка"
  description: Включает/выключает EV зарядку по цене Nord Pool
  initial_state: false
  triggers:
  - trigger: numeric_state
    entity_id: sensor.nord_pool_lv_current_price
    below: 0.04
    id: cheap
  - trigger: numeric_state
    entity_id: sensor.nord_pool_lv_current_price
    above: 0.05
    id: expensive
  - trigger: time_pattern
    minutes: /30
    id: check
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.nord_pool_lv_current_price'') not in [''unknown'',''unavailable'']
      }}

      '
  actions:
  - variables:
      price: '{{ states(''sensor.nord_pool_lv_current_price'') | float(0) }}'
      price_txt: '{{ ''%.4f'' | format(price) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''cheap'', ''check''] and price <= 0.04
          and is_state(''switch.ev_charger_switch'', ''off'') }}

          '
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.ev_charger_switch
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: 'Электричество дешевое - включаю EV зарядку. Цена {{ price_txt
            }} EUR/kWh

            '
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''expensive'', ''check''] and price > 0.05
          and is_state(''switch.ev_charger_switch'', ''on'') }}

          '
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.ev_charger_switch
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: 'Электричество дорогое - выключаю EV зарядку. Цена {{ price_txt
            }} EUR/kWh

            '
  mode: single
- id: '1775106692658'
  alias: "\U0001F504 Бойлер sync после старта HA"
  description: Синхронизирует состояние бойлера после перезапуска Home Assistant
  initial_state: false
  triggers:
  - event: start
    trigger: homeassistant
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.nord_pool_lv_current_price'') not in [''unknown'',''unavailable'','''']
      }}'
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.nord_pool_lv_current_price
        below: 0.04001
      - condition: state
        entity_id: switch.smart_plug_2_socket_1
        state: 'off'
      sequence:
      - target:
          entity_id: switch.smart_plug_2_socket_1
        action: switch.turn_on
      - target:
          entity_id: notify.telegram_owner
        data:
          message: "\U0001F504 После старта HA: цена дешёвая, бойлер включен"
        action: notify.send_message
    - conditions:
      - condition: numeric_state
        entity_id: sensor.nord_pool_lv_current_price
        above: 0.04
      - condition: state
        entity_id: switch.smart_plug_2_socket_1
        state: 'on'
      sequence:
      - target:
          entity_id: switch.smart_plug_2_socket_1
        action: switch.turn_off
      - target:
          entity_id: notify.telegram_owner
        data:
          message: "\U0001F504 После старта HA: цена дорогая, бойлер выключен"
        action: notify.send_message
  mode: single
- id: '1775638334800'
  alias: "\U0001F6A8 Утечка воды - аварийное отключение v2"
  description: 'ОТКЛЮЧЕНА (initial_state: false) — дубль v4 1748000001001, включать
    не следует. 2026-08-16 приведена в соответствие с v4, чтобы случайное включение
    не оказалось ловушкой: leak_cleared слушает все 4 датчика (добавлен
    water_sensor_4_moisture), детект-триггер сокращён 00:03:00 -> 00:00:03 (3 мин
    подтверждения остались в самом сценарии, как в v4), добавлено условие «ON длился
    >= 3 c» для leak_cleared. Ключ initial_state: false трогать нельзя.
    При подтверждённом срабатывании любого датчика влаги отключает гидрофор и
    перекрывает кран. При снятии тревоги уведомляет, но кран не открывает
    автоматически.'
  initial_state: false
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.vannaia_moisture
    - binary_sensor.garazh_moisture
    - binary_sensor.kukhnia_moisture
    - binary_sensor.water_sensor_4_moisture
    to: 'on'
    for: '00:00:03'
    id: leak_detected
  - trigger: state
    entity_id:
    - binary_sensor.vannaia_moisture
    - binary_sensor.garazh_moisture
    - binary_sensor.kukhnia_moisture
    - binary_sensor.water_sensor_4_moisture
    to: 'off'
    # FIX 2026-08-16: leak_cleared срабатывал и на unavailable -> off, то есть
    # на каждое возвращение датчика после перезагрузки Tuya. Один синтетический
    # сбой дал 8 фантомных «датчик больше не фиксирует утечку». not_from режет
    # ровно эти переходы; настоящее снятие тревоги on -> off не затронуто.
    not_from:
    - unavailable
    - unknown
    for: 00:00:15
    id: leak_cleared
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.from_state is not
      none }}'
  - condition: template
    value_template: '{{ trigger.to_state.state in [''on'', ''off''] }}'
  - condition: template
    value_template: '{{ trigger.id != ''leak_detected'' or trigger.from_state.state
      not in [''unavailable'', ''unknown''] }}'
  - condition: template
    value_template: '{{ trigger.id != ''leak_detected'' or is_state(''input_boolean.ha_startup_grace'',
      ''off'') }}'
  - condition: template
    value_template: '{{ trigger.id != ''leak_detected'' or is_state(''input_boolean.tuya_reconnect_grace'',
      ''off'') }}'
  - condition: template
    value_template: '{{ trigger.id != ''leak_detected'' or not is_state(''input_boolean.moisture_bypass_''
      ~ trigger.entity_id.split(''.'')[1].replace(''_moisture'',''''), ''on'') }}'
  - condition: template
    value_template: '{{ trigger.id != ''leak_cleared'' or (trigger.to_state.last_changed
      - trigger.from_state.last_changed).total_seconds() >= 3 }}'
  actions:
  - variables:
      sensor_name: '{{ trigger.to_state.name }}'
      now_ts: '{{ now().strftime(''%d.%m.%Y %H:%M'') }}'
      hydrofor_entity: switch.zigbee_plug_2_socket_1
      valve_entity: switch.voda_kran_switch_1
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''leak_detected'' }}'
      sequence:
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          message: '⚠️ ДАТЧИК ВЛАГИ {{ now_ts }}


            {{ sensor_name }} — возможная утечка!

            Жду 3 мин. Если не снялся — закрою кран. Проверь датчик.'
          inline_keyboard:
          - - - "\U0001F6AB Ложная тревога — Отмена"
              - /moisture_false_alarm
      - delay: 00:03:00
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(trigger.entity_id, ''on'') and is_state(''input_boolean.tuya_reconnect_grace'',
              ''off'') and not is_state(''input_boolean.moisture_bypass_'' ~ trigger.entity_id.split(''.'')[1].replace(''_moisture'',
              ''''), ''on'') }}'
          sequence:
          - action: switch.turn_off
            target:
              entity_id: '{{ hydrofor_entity }}'
          - action: switch.turn_off
            target:
              entity_id: '{{ valve_entity }}'
          - action: select.select_option
            target:
              entity_id: select.alarm_volume
            data:
              option: high
          - action: number.set_value
            target:
              entity_id: number.alarm_time
            data:
              value: 120
          - action: siren.turn_on
            target:
              entity_id: siren.alarm
          - action: telegram_bot.send_message
            data:
              chat_id: 100000000
              message: "\U0001F6A8 УТЕЧКА — КРАН ЗАКРЫТ {{ now_ts }}\n\n{{ sensor_name
                }} всё ещё ON после 3 мин.\nГидрофор выключен. Кран перекрыт.\n\U0001F514
                Сирена (2 мин).\n\nПроверь немедленно!"
              inline_keyboard:
              - - - "\U0001F515 Выключить сирену"
                  - /siren_off
        default:
        - action: notify.send_message
          target:
            entity_id: notify.telegram_owner
          data:
            message: '✅ Ложная тревога {{ now_ts }}


              {{ sensor_name }} сам снялся за 3 мин.

              Кран и гидрофор не трогал.'
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''leak_cleared'' }}'
      sequence:
      # FIX 2026-08-16 (safety wording). This message used to hard-code
      # "Гидрофор и кран остаются выключены. Открой кран вручную" — it ASSUMED the
      # emergency shutoff had run. After a bare sensor test (no alarm fired, nothing
      # was ever switched off) it told the owner to open an already-open valve; the
      # mirror case is worse — it would have reported the valve as staying closed
      # while the water was in fact running, so he would not have gone to shut it.
      # Every line below now reports the LIVE state read at send time, with a third
      # "неизвестно" branch that never claims either state (states() also returns
      # 'unknown' for an entity that no longer exists, so a deleted switch lands
      # there too). parse_mode: html because entity_ids appear — the notify entity
      # defaults to markdown and silently drops such messages; free text goes
      # through | e so nothing can emit a bare < > &.
      - variables:
          valve_state: '{{ states(valve_entity) }}'
          hydro_state: '{{ states(hydrofor_entity) }}'
      - action: telegram_bot.send_message
        data:
          chat_id: 100000000
          parse_mode: html
          message: |-
            💧 Датчик влаги больше не фиксирует утечку {{ now_ts }}
            Датчик: {{ sensor_name | e }}
            Состояние off подтверждено 15 сек.
            {% if valve_state == 'off' %}🚰 Кран воды ЗАКРЫТ (<code>{{ valve_entity | e }}</code>). Открой его вручную, когда убедишься, что всё в порядке.{% elif valve_state == 'on' %}🚰 Кран воды ОТКРЫТ (<code>{{ valve_entity | e }}</code>) — вода в доме есть, открывать ничего не нужно.{% else %}🚰 Состояние крана НЕИЗВЕСТНО (<code>{{ valve_entity | e }}</code> = <code>{{ valve_state | e }}</code>) — проверь вручную.{% endif %}
            {% if hydro_state == 'off' %}🔌 Гидрофор ВЫКЛЮЧЕН (<code>{{ hydrofor_entity | e }}</code>). Включи его вручную, когда убедишься, что всё в порядке.{% elif hydro_state == 'on' %}🔌 Гидрофор ВКЛЮЧЁН (<code>{{ hydrofor_entity | e }}</code>) — включать ничего не нужно.{% else %}🔌 Состояние гидрофора НЕИЗВЕСТНО (<code>{{ hydrofor_entity | e }}</code> = <code>{{ hydro_state | e }}</code>) — проверь вручную.{% endif %}
  mode: parallel
  max: 10
- id: '1775638921592'
  alias: 🔋 Алерт низкого заряда батарей
  description: Сканирует все battery-сенсоры + unavailable; warn <20%, critical <10%
  triggers:
  - trigger: time
    at: 09:00:00
  conditions: []
  actions:
  - variables:
      now_ts: '{{ now().strftime(''%d.%m.%Y %H:%M'') }}'
      named_sensors: "{% set ns = namespace(items=[]) %}\n{% set sensors = [\n  ('sensor.perenosnoi_pult_battery',\
        \                  'Пульт переносной'),\n  ('sensor.stsenarnyi_pult_battery',\
        \                  'Пульт сценарный'),\n  ('sensor.ostrov_vykliuchatel_battery',\
        \              'Выключатель остров'),\n  ('sensor.vykuliuchatel_2_etazh_battery',\
        \            'Выключатель 2 этаж'),\n  ('sensor.door_sensor_battery',    \
        \                  'Датчик входной двери'),\n  ('sensor.motion_sensor_battery',\
        \                    'Датчик движения'),\n  ('sensor.pir_motion_sensor_battery',\
        \                'PIR датчик движения'),\n  ('sensor.wifi_th_smoke_sensor_battery',\
        \             'Датчик дыма'),\n  ('sensor.kukhnia_battery',              \
        \            'Датчик кухни'),\n  ('sensor.vannaia_battery',              \
        \            'Датчик влаги ванная'),\n  ('sensor.garazh_battery',        \
        \                   'Датчик влаги гараж'),\n  ('sensor.water_sensor_4_battery',\
        \                   'Датчик влаги душевая 1эт'),\n  ('sensor.signalizatsiia_dvernogo_datchika_battery',\
        \ 'Сигн. дверной датчик 1'),\n  ('sensor.signalizatsiia_dvernogo_datchika_battery_2','Сигн.\
        \ дверной датчик 2'),\n  ('sensor.miaomiaoc_cn_blt_3_living_t1_battery_level_p_3_1',\
        \ 'Гостиная климат'),\n  ('sensor.miaomiaoc_cn_blt_3_bedroom2_t1_battery_level_p_3_1',\
        \ 'Спальня доп.датчик')\n] %}\n{% for eid, name in sensors %}\n  {% set val\
        \ = states(eid) %}\n  {% if val in ['unavailable','unknown'] %}\n    {% set\
        \ ns.items = ns.items + [('⛔ ' ~ name ~ ' — недоступен', -1)] %}\n  {% else\
        \ %}\n    {% set pct = val | float(999) %}\n    {% if pct < 20 %}\n      {%\
        \ set emoji = '\U0001F534' if pct < 10 else '\U0001F7E1' %}\n      {% set\
        \ ns.items = ns.items + [(emoji ~ ' ' ~ name ~ ': ' ~ pct | int ~ '%', pct)]\
        \ %}\n    {% endif %}\n  {% endif %}\n{% endfor %}\n{{ ns.items | map(attribute=0)\
        \ | list | join('\\n') }}"
      dynamic_extras: "{% set ns = namespace(items=[]) %}\n{% set known = [\n  'sensor.perenosnoi_pult_battery','sensor.stsenarnyi_pult_battery',\n\
        \  'sensor.ostrov_vykliuchatel_battery','sensor.vykuliuchatel_2_etazh_battery',\n\
        \  'sensor.door_sensor_battery',\n  'sensor.motion_sensor_battery','sensor.pir_motion_sensor_battery',\n\
        \  'sensor.wifi_th_smoke_sensor_battery','sensor.kukhnia_battery',\n  'sensor.vannaia_battery','sensor.garazh_battery',\n\
        \  'sensor.water_sensor_4_battery',\n  'sensor.signalizatsiia_dvernogo_datchika_battery',\n\
        \  'sensor.signalizatsiia_dvernogo_datchika_battery_2',\n  'sensor.sm_t595_battery_level'\n\
        ] %}\n{% for s in states.sensor %}\n  {% if s.attributes.get('device_class')\
        \ == 'battery' and s.entity_id not in known %}\n    {% set val = s.state |\
        \ float(-1) %}\n    {% if val >= 0 and val < 20 %}\n      {% set emoji = '\U0001F534\
        ' if val < 10 else '\U0001F7E1' %}\n      {% set ns.items = ns.items + [emoji\
        \ ~ ' ' ~ s.attributes.get('friendly_name', s.entity_id) ~ ': ' ~ val | int\
        \ ~ '%'] %}\n    {% endif %}\n  {% endif %}\n{% endfor %}\n{{ ns.items | join('\\\
        n') }}"
      has_low: '{{ named_sensors | trim != '''' or dynamic_extras | trim != '''' }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ has_low }}'
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.telegram_owner
        data:
          message: '🔋 Батареи — {{ now_ts }}


            {% if named_sensors | trim != '''' %}{{ named_sensors }}{% endif %}{%
            if named_sensors | trim != '''' and dynamic_extras | trim != '''' %}

            {% endif %}{% if dynamic_extras | trim != '''' %}{{ dynamic_extras }}{%
            endif %}


            🟡 <20%  🔴 <10%  ⛔ недоступен'
  mode: single
- id: '1776085158491'
  alias: "\U0001F525 Тёплый пол душевая 1эт по Nord Pool (<=0.04 manual 30C, >0.04
    auto)"
  description: Управляет тёплым полом душевой 1 этажа по цене Nord Pool.
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: sensor.nord_pool_lv_current_price
    for: 00:00:30
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.nord_pool_lv_current_price'') not in [''unknown'',''unavailable'',''none'',''None'','''']
      }}'
  - alias: Ручная выдержка по этому полу не активна
    condition: state
    entity_id: binary_sensor.floor_hold_dushevaia
    state: 'off'
  actions:
  - variables:
      threshold: 0.04
      climate_entity: climate.floor_heating_2
      tg_entity: notify.telegram_owner
      price_now: '{{ states(''sensor.nord_pool_lv_current_price'') | float(999) }}'
      price_txt: '{{ (states(''sensor.nord_pool_lv_current_price'') | float(999))
        | round(4) }}'
      current_hvac: '{{ states(climate_entity) }}'
      current_preset: '{{ state_attr(climate_entity, ''preset_mode'') | default(''unknown'')
        }}'
      current_temp: '{{ state_attr(climate_entity, ''temperature'') | float(0) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: "{{\n  price_now <= threshold and\n  (\n    current_hvac !=
          'heat_cool'\n    or current_preset != 'manual'\n    or current_temp != 30\n
          \ )\n and is_state('input_boolean.night_saver','off')\n and is_state('input_boolean.rezhim_zhara','off') }}"
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ climate_entity }}'
        data:
          hvac_mode: heat_cool
      - action: climate.set_preset_mode
        target:
          entity_id: '{{ climate_entity }}'
        data:
          preset_mode: manual
      - action: climate.set_temperature
        target:
          entity_id: '{{ climate_entity }}'
        data:
          temperature: 30
    - conditions:
      - condition: template
        value_template: "{{\n  price_now > threshold and\n  is_state('input_boolean.night_saver','off') and\n  is_state('input_boolean.rezhim_zhara','off') and\n  (\n    current_hvac !=
          'heat_cool'\n    or current_preset != 'auto'\n  )\n}}"
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ climate_entity }}'
        data:
          hvac_mode: heat_cool
      - action: climate.set_preset_mode
        target:
          entity_id: '{{ climate_entity }}'
        data:
          preset_mode: auto
  mode: single
