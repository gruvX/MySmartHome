    icon: mdi:weather-sunny-alert
  tuya_stale_alert:
    name: Tuya — активен алерт зависших состояний
    icon: mdi:cloud-alert
  boiler_manual_mode:
    name: Бойлер — ручной режим (цена не трогает)
    icon: mdi:water-boiler
  # --- EV: заявка на ночную зарядку «липкая» (2026-08-19) --------------------
  # Ставится ev_night2h.py ПОСЛЕ успешной записи input_datetime.ev_charge_start.
  # Пока заявка активна, планировщик 1778800001001 не имеет права перезаписывать
  # плановое время НИ ПО ОДНОМУ из своих триггеров (price_update, ha_start, 14:05).
  # Флаг же служит токеном «вердикт ещё не отправлен»: любая ветка, отправившая
  # сообщение, гасит его, поэтому владелец получает РОВНО ОДНО сообщение.
  # СРОК ИСТЕЧЕНИЯ: гасится не позже начала окна + 3 ч (1790500001001), и условие
  # планировщика перестаёт его учитывать в тот же момент независимо от флага —
  # зависший флаг не может заблокировать планировщик навсегда.
  ev_night_requested:
    name: EV — заявка на ночную зарядку активна
    icon: mdi:weather-night
  # --- EV: разовая отмена следующей зарядки (2026-08-19) -------------------
  # Ставится script.ev_cancel_next (кнопка «Отменить зарядку» в Telegram и в
  # Mini App). Гасится РОВНО ОДИН РАЗ — первым же плановым окном, которое
  # автозарядка 1778800001002 из-за неё пропустила, либо по сроку 24 ч, либо
  # нажатием «Зарядить ночью/днём» (ev_night2h.py / ev_day2h.py снимают её).
  # Отмена НЕ отключает автоматику: пропускается ровно одно окно.
  ev_charge_cancelled:
    name: EV — следующая зарядка отменена (разово)
    icon: mdi:calendar-remove

# 2026-08-16: http: block removed - HA migrated it to .storage/http
# (yaml_migration_done: true). ip_ban_enabled/login_attempts_threshold/
# use_x_forwarded_for/trusted_proxies now live THERE. External access via
# Tailscale Funnel depends on use_x_forwarded_for + trusted_proxies, so do
# NOT re-add them here: YAML is ignored after migration.

# --- Диагностика: файловый лог и глубина истории (добавлено 2026-08-17) -----
# ПОЧЕМУ /config/home-assistant.log отсутствовал: HA Core под Supervisor
# полностью отключает файловый лог-хендлер. bootstrap.py::_log_file_disabled_reason():
#   if ENV_SUPERVISOR in os.environ and ENV_DUPLICATE_LOG_FILE not in os.environ
# -> err_log_path = None -> нет hass.data[DATA_LOGGING] -> GET /api/error_log = 404.
# Файл включается НЕ здесь, а опцией Supervisor: POST /core/options
#   {"duplicate_log_file": true}   (видно в GET /core/info), затем restart core.
# Этот блок задаёт только УРОВНИ. Ротация файла: RotatingFileHandler(backupCount=1),
# rollover вызывается лишь при старте HA => глубина = текущий запуск + предыдущий
# (home-assistant.log.1). Долгая история остаётся в journal (Supervisor /core/logs).
#
# default: warning — паритет с текущим поведением: без -v корневой логгер HA уже
# стоит на WARNING (bootstrap: logger.setLevel(INFO if verbose else WARNING)),
# поэтому этот default НЕ увеличивает объём. default: info добавил бы тысячи
# строк setup/service на каждый рестарт без диагностической ценности.
#
# Точечный debug включается на живой системе БЕЗ рестарта:
#   service logger.set_level  {"homeassistant.components.automation": "debug"}
logger:
  default: warning
  logs:
    # --- то, что уже вызывало инциденты в этом доме: держим видимым ---
    # Tuya `sign invalid` / ApiRequestException: заморозил счётчики энергии на
    # 14.6 суток и рвёт automation посреди скрипта.
    homeassistant.components.tuya: info
    tuya_sharing: info
    # Automation: ошибки и падения действий. NB: "triggered" и "Conditions not
    # met" пишутся на DEBUG, поэтому info по объёму == warning; ERROR ловится всегда.
    homeassistant.components.automation: info
    homeassistant.components.telegram_bot: info
    homeassistant.components.command_line: info
    # rest = котёл ecoNET (WiFi флапает, IP дрейфует .10/.11/.12). Только warning:
    # на info это опрос каждые 10 с по нескольким ресурсам = флуд.
    homeassistant.components.rest: warning
    homeassistant.helpers.template: warning
    # --- известный шум: оставляем только ERROR ---
    custom_components.xiaomi_home: error
    homeassistant.components.roborock: error
    homeassistant.components.homekit: error
    homeassistant.components.ipp: error
    homeassistant.components.androidtv_remote: error

recorder:
  # Было 10 суток (default) — не хватало на разбор инцидентов (самая старая
  # запись в states была 2026-08-07). Расчёт: рабочий набор (states +
  # state_attributes + events + short-term statistics + индексы) = 226 МБ за
  # 10.37 суток = 21.8 МБ/сут; 30 суток => ~654 МБ + 40 МБ долгосрочной
  # статистики = ~0.7 ГБ при 19.6 ГБ свободных на /data.
  # Исключений (exclude) намеренно НЕТ: они ослепляют будущую диагностику.
  purge_keep_days: 30

# Required by automation 1790200001001 (Tuya self-heal): system_log only
# publishes the system_log_event bus event when fire_event is true
# (DEFAULT_FIRE_EVENT = False). Takes effect on the next HA restart.
system_log:
  fire_event: true
command_line:
  - sensor:
      name: "EV Charger Energy"
      unique_id: ev_charger_energy_cloud
      command: "python3 /config/ev_query.py"
      # scan_interval 300 -> 900 (2026-08-19, снижение нагрузки на квоту Tuya).
      # Это накопительный счётчик kWh: суточный/месячный учёт и вечерний отчёт
      # берут разницу с полуночным снимком, 15-минутного разрешения хватает.
      # "EV Charger Status" ниже НАМЕРЕННО остаётся на 300 с: он резервный триггер
      # интерлока EV+бойлер, его задержку увеличивать нельзя.
      # Оба сенсора вызывают ОДИН скрипт с общим кэшем результата (RESULT_TTL 290 с),
      # поэтому число облачных вызовов задаёт более частый из двух (status, 300 с):
      # ~288/сутки до и после правки. Экономия здесь — 192 запуска процесса в сутки
      # и столько же потенциальных обращений в облако на путях промаха кэша.
      scan_interval: 900
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      value_template: "{{ value_json.energy }}"
      # src / stale_age: ev_query.py may serve a cached payload for up to 24 h after a
      # Tuya failure and re-stamps the cache on quota errors. These two attributes make
      # that visible (src: cloud|cache|stale|quota|error, stale_age in seconds since the
      # data really came off the cloud) instead of a silent lag.
      json_attributes:
        - status
        - mode
        - switch
        - session_kwh
        - src
        - stale_age
  - sensor:
      name: "EV Charger Status"
      unique_id: ev_charger_status_cloud
      command: "python3 /config/ev_query.py"
      scan_interval: 300
      value_template: "{{ value_json.status }}"
      # See the note on EV Charger Energy: this sensor is the one consumers trust for
      # "is the car charging", so it must be able to say how old that answer is.
      json_attributes:
        - src
        - stale_age
  - sensor:
      name: "Tuya Leak Cloud"
      unique_id: tuya_leak_cloud
      command: "python3 /config/tuya_leak_query.py"
      # scan_interval 30 -> 180 (2026-08-19). ПРИЧИНА: 30 с = 2880 обращений к облаку
      # Tuya в сутки поверх трафика самой интеграции; в логе появились
      # "network error:(-9999999) API_QPS_LIMIT_OR_DEGRADE" — квота Tuya исчерпана,
      # сессия деградирует, сущности массово уходят в unavailable, и это порождает
      # шторм уведомлений. 180 с = 480 обращений/сутки (-83 %).
      # ЧУВСТВИТЕЛЬНОСТЬ НЕ ОСЛАБЛЕНА: облако — РЕЗЕРВНЫЙ путь, основной —
      # binary_sensor.*_moisture + 3-секундное подтверждение в утечке v4. Когда
      # основной путь слепнет (любой из 4 датчиков unavailable/unknown),
      # automation 1790400001001 форсирует homeassistant.update_entity этого
      # сенсора каждые 30 с — быстро, когда это важно, дёшево, когда всё здорово.
      # ОКНО СВЕЖЕСТИ: sensor.leak_protection_status считает облако «usable» при
      # cloud_age_sec < 300. Жёсткая граница возраста ts здесь =
      # scan_interval + command_timeout = 180 + 20 = 200 с < 300 с, поэтому при
      # здоровом облаке truth-сенсор НИКОГДА не проваливается в HA-ветку из-за
      # интервала. Если поднимать scan_interval выше 280 — сначала расширить окно
      # в четырёх шаблонах leak_protection_status (и в tests/test_leak_truth.py).
      scan_interval: 180
      command_timeout: 20
      value_template: "{{ value_json.state }}"
      json_attributes:
        - alarm_entities
        - raw
        - online
        - ts
        - src

