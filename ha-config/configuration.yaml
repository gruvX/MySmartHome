# Home Assistant — configuration.yaml этого дома, ОБЕЗЛИЧЕННАЯ копия.
# Публикуется как рабочий пример, а не файл для копирования целиком: entity_id,
# модели устройств и адреса специфичны для конкретного дома.
#
# ЗАМЕНЕНО на плейсхолдеры (в живом файле там настоящие значения):
#   BOILER_USER / BOILER_PASSWORD — доступ к контроллеру котла ecoNET24;
#   192.168.1.x — локальные адреса; 100000000 — Telegram chat_id владельца.
# Настоящие значения держите в secrets.yaml / local_secrets.json, не здесь.

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

input_number:
  cost_month_boiler:
    name: Cost month boiler
    min: 0
    max: 999999
    step: 0.01
    mode: box
  cost_month_kalarifer:
    name: Cost month kalarifer
    min: 0
    max: 999999
    step: 0.01
    mode: box
  cost_month_akv:
    name: Cost month akv
    min: 0
    max: 999999
    step: 0.01
    mode: box
  cost_month_chep:
    name: Cost month chep
    min: 0
    max: 999999
    step: 0.01
    mode: box
  cost_month_gidro:
    name: Cost month gidro
    min: 0
    max: 999999
    step: 0.01
    mode: box
  cost_month_ev:
    name: Cost month ev
    min: 0
    max: 999999
    step: 0.01
    mode: box
  cost_month_total:
    name: Cost month total
    min: 0
    max: 999999
    step: 0.01
    mode: box
  midnight_boiler_energy:
    name: Snapshot boiler midnight
    min: 0
    max: 9999999
    step: 0.001
    mode: box
  midnight_kalarifer_energy:
    name: Snapshot kalarifer midnight
    min: 0
    max: 9999999
    step: 0.001
    mode: box
  midnight_akv_energy:
    name: Snapshot aquarium midnight
    min: 0
    max: 9999999
    step: 0.001
    mode: box
  midnight_chep_energy:
    name: Snapshot turtle midnight
    min: 0
    max: 9999999
    step: 0.001
    mode: box
  midnight_gidro_energy:
    name: Snapshot hydrophore midnight
    min: 0
    max: 9999999
    step: 0.001
    mode: box
  midnight_ev_energy:
    name: Snapshot EV midnight
    min: 0
    max: 9999999
    step: 0.001
    mode: box
  midnight_tv_energy:
    name: Snapshot TV midnight
    min: 0
    max: 9999999
    step: 0.001
    mode: box
  # --- Гидрофор: ночная проверка и среднее за неделю (2026-08-26) -------------
  # -1 означает «замера нет» (розетка была офлайн). Ноль означал бы «насос стоял»,
  # а это разные вещи: путать их нельзя, иначе отчёт соврёт про причину.
  gidro_night_start:
    name: Pump night counter start
    min: -1
    max: 9999999
    step: 0.001
    mode: box
  gidro_night_kwh:
    name: Pump night kWh
    min: -1
    max: 1000
    step: 0.001
    mode: box
  gidro_minutes_avg7:
    name: Pump minutes avg 7d
    min: -1
    max: 3000
    step: 0.1
    mode: box
  # Длина фактического ночного окна в часах. Нужна и для порога (он на час), и для
  # честности: «12 мин за 4 часа» и «12 мин за 2 часа» — разные вещи.
  gidro_night_hours:
    min: 0
    max: 12
    step: 0.01
    mode: box
    name: Pump night window hours
  # --- EV: счётчик переносов зарядки за сутки (2026-08-19) -------------------
  # Плановое окно наступило, машина не подключена -> ev_replan_next.py переносит
  # зарядку на следующее дешёвое окно. Без счётчика это могло бы повторяться
  # весь день. Лимит 2 переноса в местные сутки; обнуляется, когда
  # input_datetime.ev_replan_day не сегодняшний.
  ev_replan_count:
    name: EV — переносов зарядки за сутки
    min: 0
    max: 9
    step: 1
    mode: box

  # --- тёплый пол: ручная выдержка (2026-08-21) ---------------------------------------
  # Сколько часов автоматика не трогает пол после того, как температуру поставил ЧЕЛОВЕК.
  # Человек отличается от автоматики по context.user_id события: HA заполняет его, когда
  # действие пришло от пользователя (UI, панель, приложение), и оставляет пустым для
  # автоматизаций и скриптов. Догадок здесь нет.
  floor_hold_hours:
    name: Тёплый пол — ручная выдержка, часов
    min: 1
    max: 24
    step: 1
    initial: 3
    mode: box
    icon: mdi:timer-sand
  # Температура, которую человек поставил. Её и возвращает сторож 1791100001003, если
  # что-то (ночная экономия, собственное расписание термостата, неизвестный писатель)
  # перебило установку во время выдержки.
  floor_hold_temp_vannaia:
    name: Тёплый пол ванная — ручная температура
    min: 5
    max: 40
    step: 0.5
    initial: 25
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer
  floor_hold_temp_dushevaia:
    name: Тёплый пол душевая — ручная температура
    min: 5
    max: 40
    step: 0.5
    initial: 25
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer

input_datetime:
  # Момент, на который взят ночной снимок счётчика. Точного 01:00 не ждём: розетка
  # офлайн ~78% времени, поэтому снимок берётся ПОСЛЕДНИМ удачным чтением в окне
  # 00:05-01:30, а вердикт — ПЕРВЫМ удачным чтением в окне 04:00-05:30.
  gidro_night_start_at:
    name: Pump night window start
    has_date: true
    has_time: true
  gvs_last_notify_on:
    name: ГВС — последнее уведомление plug_on
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  gvs_last_notify_off:
    name: ГВС — последнее уведомление plug_off
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  ev_charge_start:
    name: EV Charge Start Time
    has_date: true
    has_time: true
  tuya_cmd_fail_boiler:
    name: Бойлер — последнее уведомление о непрошедшей команде
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  tuya_cmd_fail_towel:
    name: Полотенцесушитель — последнее уведомление о непрошедшей команде
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  tuya_cmd_fail_ev:
    name: EV зарядка — последнее уведомление о непрошедшей команде
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  ev_overrun_notify:
    name: EV зарядка — последнее уведомление о переработке окна
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"

  tuya_selfheal_r1:
    name: Tuya self-heal — метка перезагрузки 1
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  tuya_selfheal_r2:
    name: Tuya self-heal — метка перезагрузки 2
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  tuya_selfheal_r3:
    name: Tuya self-heal — метка перезагрузки 3
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  tuya_selfheal_r4:
    name: Tuya self-heal — метка перезагрузки 4
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  tuya_selfheal_r5:
    name: Tuya self-heal — метка перезагрузки 5
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  tuya_selfheal_r6:
    name: Tuya self-heal — метка перезагрузки 6
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  tuya_selfheal_msg:
    name: Tuya self-heal — последнее уведомление
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  tuya_selfheal_giveup_msg:
    name: Tuya self-heal — последнее уведомление об отказе
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  proxmox_metric_last_alert:
    name: Proxmox — последнее уведомление о зависшей метрике узла
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  # --- EV: стабильная ссылка на ЗАПРОШЕННОЕ ночное окно (2026-08-19) ----------
  # ЗАЧЕМ: сторож 1790100001001 и автозарядка 1778800001002 оба висели на
  # input_datetime.ev_charge_start. Планировщик (ev_best2h.py) перезаписал его
  # 18.08 19:49 (03:45 -> 14:15), time-триггеры молча перевелись на новое время,
  # и в 03:45 не сработало НИЧЕГО — владелец не получил даже предупреждения.
  # Этот helper пишет ТОЛЬКО ночной путь (ev_night2h.py); планировщик его не
  # трогает, поэтому он остаётся стабильной точкой отсчёта для сторожа.
  ev_night_window_start:
    name: EV — начало запрошенного ночного окна (стабильная ссылка)
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  # Метка «зарядка в запрошенном окне реально наблюдалась» (status ->
  # charger_charging). Поздний вердикт 1790500001001 сравнивает её с началом
  # окна, чтобы не сообщать об успешной зарядке как о провале.
  ev_night_charge_seen:
    name: EV — зарядка наблюдалась в запрошенном ночном окне
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  # --- EV: разовая отмена «Отменить зарядку» (2026-08-19) -------------------
  # ev_cancel_armed_at — когда отмену поставили. Срок истечения: +24 ч
  # (автоматизация 1790500001001, последняя ветвь), чтобы отмена не могла
  # зависнуть и молча выключить автоматическую зарядку навсегда.
  ev_cancel_armed_at:
    name: EV — разовая отмена поставлена
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  # ev_cancel_consumed — метка «КАКОЕ плановое время было пропущено» (равна
  # ev_charge_start того окна). Ставится автозарядкой 1778800001002 в момент
  # пропуска. Сторож 1790100001001 и перенос 1791000001001 по этой метке молчат
  # именно про это окно: отменённая зарядка не является сбоем.
  ev_cancel_consumed:
    name: EV — пропущенное по отмене плановое время
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
  # ev_replan_day — местные сутки, к которым относится input_number.ev_replan_count.
  ev_replan_day:
    name: EV — сутки счётчика переносов
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"

  # --- тёплый пол: до какого момента автоматика не трогает пол ------------------------
  # Пишется автоматизацией 1791100001001. Считать срок сам не должен НИКТО кроме
  # binary_sensor.floor_hold_* — это единственная точка правды о выдержке.
  floor_hold_vannaia:
    name: Тёплый пол ванная — выдержка до
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
    icon: mdi:timer-sand
  floor_hold_dushevaia:
    name: Тёплый пол душевая — выдержка до
    has_date: true
    has_time: true
    initial: "1970-01-01 00:00:00"
    icon: mdi:timer-sand

input_boolean:
