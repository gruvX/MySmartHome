miniapp_auth:

# --- Presence: combined GPS + WiFi(SSID) signal with debounce (added 2026-07) ---
template:
  - binary_sensor:
      - name: "Присутствие Владелец"
        unique_id: presence_owner_combined
        device_class: presence
        icon: mdi:home-account
        state: >
          {{ is_state('person.owner','home')
             or is_state('device_tracker.myiphone','home')
             or is_state('sensor.ssid','HOME_WIFI') }}
        delay_on: "00:00:10"
        delay_off: "00:10:00"

  # --- SINGLE SOURCE OF TRUTH for leak protection (added 2026-07-27) -----------
  # Every UI (tablet panel, Telegram Mini App) reads THIS entity and nothing else.
  # Do NOT re-implement "is this sensor OK" anywhere else - that is exactly the bug
  # that recurred for two months (~10 divergent copies of the rule).
  #
  # state: leak | blind | ok   (worst first: any leak -> leak; else any blind -> blind; else ok)
  # PER-SENSOR RULE (the one rule):
  #   1. leak   if HA state == 'on' OR the Tuya-cloud raw value == '1'  ('1'=wet, '2'=dry, MEASURED)
  #   2. else ALIVE:  cloud is USABLE when sensor.tuya_leak_cloud is not unavailable/unknown,
  #                   its src != 'error' and (now - ts) < 300 s.
  #                   USABLE     -> alive := online[entity] is true
  #                   NOT usable -> alive := HA state in ('on','off') AND last_updated age < 24 h
  #   3. blind  if not alive, otherwise dry
  # CONSEQUENCE: these are battery SLEEPERS - they report only on wet/dry events. Silence for
  # hours or a whole day is NORMAL. A silent-but-cloud-online sensor is `dry`, NEVER `blind`.
  # Silence alone must never produce `blind`. There is NO 3-hour staleness rule any more.
  # The 4 heavy templates below (state, per_sensor, leak_names, blind_names) hold the
  # BYTE-IDENTICAL rule text; tests/test_leak_truth.py asserts they stay identical.
  - sensor:
      - name: "Защита от протечки"
        unique_id: leak_protection_status
        # NOTE: entity_id is pinned to sensor.leak_protection_status via the ENTITY
        # REGISTRY (.storage/core.entity_registry), because HA derives entity_id from
        # `name`, which here is Russian ("Защита от протечки" -> sensor.zashchita_ot_protechki).
        # If that registry entry is ever deleted the entity reappears under the slugified
        # Russian name and every UI falls back to «неизвестно» (safe, but wrong). Re-pin with
        # WS config/entity_registry/update -> new_entity_id: sensor.leak_protection_status.
        icon: mdi:water-alert-outline
        state: |
          {%- set ids = [
              ['binary_sensor.vannaia_moisture','Ванная'],
              ['binary_sensor.garazh_moisture','Гараж'],
              ['binary_sensor.kukhnia_moisture','Кухня'],
              ['binary_sensor.water_sensor_4_moisture','Душевая 1эт'] ] -%}
          {%- set cl = 'sensor.tuya_leak_cloud' -%}
          {%- set cs = states(cl) -%}
          {%- set src = state_attr(cl,'src') -%}
          {%- set ts = state_attr(cl,'ts') -%}
          {%- set raw = state_attr(cl,'raw') -%}
          {%- set onl = state_attr(cl,'online') -%}
          {%- set nsx = namespace(h=[], a=[]) -%}
          {%- for id, nm in ids -%}
            {%- set nsx.h = nsx.h + [[id, states(id)]] -%}
            {%- set so = states[id] -%}
            {%- set nsx.a = nsx.a + [[id, (as_timestamp(now()) - as_timestamp(so.last_updated)) if so is not none else -1]] -%}
          {%- endfor -%}
          {%- set hsmap = dict(nsx.h) -%}
          {%- set hagemap = dict(nsx.a) -%}
          {%- set raw = raw if raw is mapping else {} -%}
          {%- set onl = onl if onl is mapping else {} -%}
          {%- set hsmap = hsmap if hsmap is mapping else {} -%}
          {%- set hagemap = hagemap if hagemap is mapping else {} -%}
          {%- set has_ts = ts is not none and (ts | float(0)) > 0 -%}
          {%- set cage = ((as_timestamp(now()) - (ts | float(0))) | round(0) | int) if has_ts else -1 -%}
          {%- set usable = (cs not in ['unavailable','unknown','none','None','']) and (src is string) and (src != 'error') and has_ts and cage >= 0 and cage < 300 -%}
          {%- set ns = namespace(pairs=[], leak=[], blind=[]) -%}
          {%- for id, nm in ids -%}
            {%- set hs = hsmap.get(id) | string -%}
            {%- set rv = raw.get(id) | string -%}
            {%- if hs == 'on' or rv == '1' -%}
              {%- set ns.pairs = ns.pairs + [[id,'leak']] -%}
              {%- set ns.leak = ns.leak + [nm] -%}
            {%- else -%}
              {%- if usable -%}
                {%- set alive = (onl.get(id) | string | lower) == 'true' -%}
              {%- else -%}
                {%- set ha = hagemap.get(id) | float(-1) -%}
                {%- set alive = (hs in ['on','off']) and ha >= 0 and ha < 86400 -%}
              {%- endif -%}
              {%- if alive -%}
                {%- set ns.pairs = ns.pairs + [[id,'dry']] -%}
              {%- else -%}
                {%- set ns.pairs = ns.pairs + [[id,'blind']] -%}
                {%- set ns.blind = ns.blind + [nm] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set per = dict(ns.pairs) -%}
          {%- set status = 'leak' if ns.leak | count > 0 else ('blind' if ns.blind | count > 0 else 'ok') -%}
          {{ status }}
        attributes:
          per_sensor: |
            {%- set ids = [
                ['binary_sensor.vannaia_moisture','Ванная'],
                ['binary_sensor.garazh_moisture','Гараж'],
                ['binary_sensor.kukhnia_moisture','Кухня'],
                ['binary_sensor.water_sensor_4_moisture','Душевая 1эт'] ] -%}
            {%- set cl = 'sensor.tuya_leak_cloud' -%}
            {%- set cs = states(cl) -%}
            {%- set src = state_attr(cl,'src') -%}
            {%- set ts = state_attr(cl,'ts') -%}
            {%- set raw = state_attr(cl,'raw') -%}
            {%- set onl = state_attr(cl,'online') -%}
            {%- set nsx = namespace(h=[], a=[]) -%}
            {%- for id, nm in ids -%}
              {%- set nsx.h = nsx.h + [[id, states(id)]] -%}
              {%- set so = states[id] -%}
              {%- set nsx.a = nsx.a + [[id, (as_timestamp(now()) - as_timestamp(so.last_updated)) if so is not none else -1]] -%}
            {%- endfor -%}
            {%- set hsmap = dict(nsx.h) -%}
            {%- set hagemap = dict(nsx.a) -%}
            {%- set raw = raw if raw is mapping else {} -%}
            {%- set onl = onl if onl is mapping else {} -%}
            {%- set hsmap = hsmap if hsmap is mapping else {} -%}
            {%- set hagemap = hagemap if hagemap is mapping else {} -%}
            {%- set has_ts = ts is not none and (ts | float(0)) > 0 -%}
            {%- set cage = ((as_timestamp(now()) - (ts | float(0))) | round(0) | int) if has_ts else -1 -%}
            {%- set usable = (cs not in ['unavailable','unknown','none','None','']) and (src is string) and (src != 'error') and has_ts and cage >= 0 and cage < 300 -%}
            {%- set ns = namespace(pairs=[], leak=[], blind=[]) -%}
            {%- for id, nm in ids -%}
              {%- set hs = hsmap.get(id) | string -%}
              {%- set rv = raw.get(id) | string -%}
              {%- if hs == 'on' or rv == '1' -%}
                {%- set ns.pairs = ns.pairs + [[id,'leak']] -%}
                {%- set ns.leak = ns.leak + [nm] -%}
              {%- else -%}
                {%- if usable -%}
                  {%- set alive = (onl.get(id) | string | lower) == 'true' -%}
                {%- else -%}
                  {%- set ha = hagemap.get(id) | float(-1) -%}
                  {%- set alive = (hs in ['on','off']) and ha >= 0 and ha < 86400 -%}
                {%- endif -%}
                {%- if alive -%}
                  {%- set ns.pairs = ns.pairs + [[id,'dry']] -%}
                {%- else -%}
                  {%- set ns.pairs = ns.pairs + [[id,'blind']] -%}
                  {%- set ns.blind = ns.blind + [nm] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set per = dict(ns.pairs) -%}
            {%- set status = 'leak' if ns.leak | count > 0 else ('blind' if ns.blind | count > 0 else 'ok') -%}
            {{ per | to_json }}
          leak_names: |
            {%- set ids = [
                ['binary_sensor.vannaia_moisture','Ванная'],
                ['binary_sensor.garazh_moisture','Гараж'],
                ['binary_sensor.kukhnia_moisture','Кухня'],
                ['binary_sensor.water_sensor_4_moisture','Душевая 1эт'] ] -%}
            {%- set cl = 'sensor.tuya_leak_cloud' -%}
            {%- set cs = states(cl) -%}
            {%- set src = state_attr(cl,'src') -%}
            {%- set ts = state_attr(cl,'ts') -%}
            {%- set raw = state_attr(cl,'raw') -%}
            {%- set onl = state_attr(cl,'online') -%}
            {%- set nsx = namespace(h=[], a=[]) -%}
            {%- for id, nm in ids -%}
              {%- set nsx.h = nsx.h + [[id, states(id)]] -%}
              {%- set so = states[id] -%}
              {%- set nsx.a = nsx.a + [[id, (as_timestamp(now()) - as_timestamp(so.last_updated)) if so is not none else -1]] -%}
            {%- endfor -%}
            {%- set hsmap = dict(nsx.h) -%}
            {%- set hagemap = dict(nsx.a) -%}
            {%- set raw = raw if raw is mapping else {} -%}
            {%- set onl = onl if onl is mapping else {} -%}
            {%- set hsmap = hsmap if hsmap is mapping else {} -%}
            {%- set hagemap = hagemap if hagemap is mapping else {} -%}
            {%- set has_ts = ts is not none and (ts | float(0)) > 0 -%}
            {%- set cage = ((as_timestamp(now()) - (ts | float(0))) | round(0) | int) if has_ts else -1 -%}
            {%- set usable = (cs not in ['unavailable','unknown','none','None','']) and (src is string) and (src != 'error') and has_ts and cage >= 0 and cage < 300 -%}
            {%- set ns = namespace(pairs=[], leak=[], blind=[]) -%}
            {%- for id, nm in ids -%}
              {%- set hs = hsmap.get(id) | string -%}
              {%- set rv = raw.get(id) | string -%}
              {%- if hs == 'on' or rv == '1' -%}
                {%- set ns.pairs = ns.pairs + [[id,'leak']] -%}
                {%- set ns.leak = ns.leak + [nm] -%}
              {%- else -%}
                {%- if usable -%}
                  {%- set alive = (onl.get(id) | string | lower) == 'true' -%}
                {%- else -%}
                  {%- set ha = hagemap.get(id) | float(-1) -%}
                  {%- set alive = (hs in ['on','off']) and ha >= 0 and ha < 86400 -%}
                {%- endif -%}
                {%- if alive -%}
                  {%- set ns.pairs = ns.pairs + [[id,'dry']] -%}
                {%- else -%}
                  {%- set ns.pairs = ns.pairs + [[id,'blind']] -%}
                  {%- set ns.blind = ns.blind + [nm] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set per = dict(ns.pairs) -%}
            {%- set status = 'leak' if ns.leak | count > 0 else ('blind' if ns.blind | count > 0 else 'ok') -%}
            {{ ns.leak | to_json }}
          blind_names: |
            {%- set ids = [
                ['binary_sensor.vannaia_moisture','Ванная'],
                ['binary_sensor.garazh_moisture','Гараж'],
                ['binary_sensor.kukhnia_moisture','Кухня'],
                ['binary_sensor.water_sensor_4_moisture','Душевая 1эт'] ] -%}
            {%- set cl = 'sensor.tuya_leak_cloud' -%}
            {%- set cs = states(cl) -%}
            {%- set src = state_attr(cl,'src') -%}
            {%- set ts = state_attr(cl,'ts') -%}
            {%- set raw = state_attr(cl,'raw') -%}
            {%- set onl = state_attr(cl,'online') -%}
            {%- set nsx = namespace(h=[], a=[]) -%}
            {%- for id, nm in ids -%}
              {%- set nsx.h = nsx.h + [[id, states(id)]] -%}
              {%- set so = states[id] -%}
              {%- set nsx.a = nsx.a + [[id, (as_timestamp(now()) - as_timestamp(so.last_updated)) if so is not none else -1]] -%}
            {%- endfor -%}
            {%- set hsmap = dict(nsx.h) -%}
            {%- set hagemap = dict(nsx.a) -%}
            {%- set raw = raw if raw is mapping else {} -%}
            {%- set onl = onl if onl is mapping else {} -%}
            {%- set hsmap = hsmap if hsmap is mapping else {} -%}
            {%- set hagemap = hagemap if hagemap is mapping else {} -%}
            {%- set has_ts = ts is not none and (ts | float(0)) > 0 -%}
            {%- set cage = ((as_timestamp(now()) - (ts | float(0))) | round(0) | int) if has_ts else -1 -%}
            {%- set usable = (cs not in ['unavailable','unknown','none','None','']) and (src is string) and (src != 'error') and has_ts and cage >= 0 and cage < 300 -%}
            {%- set ns = namespace(pairs=[], leak=[], blind=[]) -%}
            {%- for id, nm in ids -%}
              {%- set hs = hsmap.get(id) | string -%}
              {%- set rv = raw.get(id) | string -%}
              {%- if hs == 'on' or rv == '1' -%}
                {%- set ns.pairs = ns.pairs + [[id,'leak']] -%}
                {%- set ns.leak = ns.leak + [nm] -%}
              {%- else -%}
                {%- if usable -%}
                  {%- set alive = (onl.get(id) | string | lower) == 'true' -%}
                {%- else -%}
                  {%- set ha = hagemap.get(id) | float(-1) -%}
                  {%- set alive = (hs in ['on','off']) and ha >= 0 and ha < 86400 -%}
                {%- endif -%}
                {%- if alive -%}
                  {%- set ns.pairs = ns.pairs + [[id,'dry']] -%}
                {%- else -%}
                  {%- set ns.pairs = ns.pairs + [[id,'blind']] -%}
                  {%- set ns.blind = ns.blind + [nm] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set per = dict(ns.pairs) -%}
            {%- set status = 'leak' if ns.leak | count > 0 else ('blind' if ns.blind | count > 0 else 'ok') -%}
            {{ ns.blind | to_json }}
          checked: |
            {{ now().isoformat(timespec='seconds') }}
          cloud_src: |
            {%- set cl = 'sensor.tuya_leak_cloud' -%}
            {%- set ts = state_attr(cl,'ts') -%}
            {%- set src = state_attr(cl,'src') -%}
            {%- set has_ts = ts is not none and (ts | float(0)) > 0 -%}
            {%- set cage = ((as_timestamp(now()) - (ts | float(0))) | round(0) | int) if has_ts else -1 -%}
            {{ src if src is string else 'unknown' }}
          cloud_age_sec: |
            {%- set cl = 'sensor.tuya_leak_cloud' -%}
            {%- set ts = state_attr(cl,'ts') -%}
            {%- set src = state_attr(cl,'src') -%}
            {%- set has_ts = ts is not none and (ts | float(0)) > 0 -%}
            {%- set cage = ((as_timestamp(now()) - (ts | float(0))) | round(0) | int) if has_ts else -1 -%}
            {{ cage }}

  # --- тёплый пол: ОДНА точка правды о ручной выдержке (2026-08-21) -------------------
  # ВНИМАНИЕ, ЛОВУШКА: entity_id у template-сущности берётся из `name`, а НЕ из unique_id.
  # По этим именам HA создал binary_sensor.teplyi_pol_vannaia_ruchnaia_vyderzhka; оба сенсора
  # ПЕРЕИМЕНОВАНЫ в реестре в binary_sensor.floor_hold_vannaia / _dushevaia, потому что
  # сторож 1791100001003 собирает id из trigger.id: 'binary_sensor.floor_hold_' ~ комната.
  # Переименование живёт в .storage/core.entity_registry и переживает reload. Если менять
  # `name` ниже — id НЕ изменится (реестр держит его за unique_id), а если удалить сенсор и
  # создать заново с другим unique_id, id вернётся к слагу от имени и сторож ослепнет.
  # on = автоматика не должна трогать этот пол. Причина в атрибуте reason:
  #   forever — включён input_boolean.floor_hold_forever, без срока;
  #   timer   — до момента в input_datetime.floor_hold_*.
  # Каждый писатель по полу проверяет ЭТОТ сенсор и ничего не вычисляет сам — ровно так же,
  # как sensor.leak_protection_status для протечки. Шаблон использует now(), поэтому HA
  # пересчитывает его каждую минуту и выдержка гаснет сама.
  - binary_sensor:
      - name: "Тёплый пол ванная — ручная выдержка"
        unique_id: floor_hold_vannaia
        icon: mdi:hand-back-right
        state: >
          {{ is_state('input_boolean.floor_hold_forever','on')
             or (state_attr('input_datetime.floor_hold_vannaia','timestamp') | float(0)) > as_timestamp(now()) }}
        attributes:
          reason: >
            {{ 'forever' if is_state('input_boolean.floor_hold_forever','on')
               else ('timer' if (state_attr('input_datetime.floor_hold_vannaia','timestamp') | float(0)) > as_timestamp(now()) else 'none') }}
          until: >
            {% set t = state_attr('input_datetime.floor_hold_vannaia','timestamp') | float(0) %}
            {{ t | timestamp_custom('%H:%M', true) if t > as_timestamp(now()) else '' }}
          mins_left: >
            {% set t = state_attr('input_datetime.floor_hold_vannaia','timestamp') | float(0) %}
            {{ ((t - as_timestamp(now())) / 60) | round(0) | int if t > as_timestamp(now()) else 0 }}
          held_temp: "{{ states('input_number.floor_hold_temp_vannaia') | float(0) }}"
      - name: "Тёплый пол душевая — ручная выдержка"
        unique_id: floor_hold_dushevaia
        icon: mdi:hand-back-right
        state: >
          {{ is_state('input_boolean.floor_hold_forever','on')
             or (state_attr('input_datetime.floor_hold_dushevaia','timestamp') | float(0)) > as_timestamp(now()) }}
        attributes:
          reason: >
            {{ 'forever' if is_state('input_boolean.floor_hold_forever','on')
               else ('timer' if (state_attr('input_datetime.floor_hold_dushevaia','timestamp') | float(0)) > as_timestamp(now()) else 'none') }}
          until: >
            {% set t = state_attr('input_datetime.floor_hold_dushevaia','timestamp') | float(0) %}
            {{ t | timestamp_custom('%H:%M', true) if t > as_timestamp(now()) else '' }}
          mins_left: >
            {% set t = state_attr('input_datetime.floor_hold_dushevaia','timestamp') | float(0) %}
            {{ ((t - as_timestamp(now())) / 60) | round(0) | int if t > as_timestamp(now()) else 0 }}
          held_temp: "{{ states('input_number.floor_hold_temp_dushevaia') | float(0) }}"


  # --- ГИДРОФОР: СКОЛЬКО НАСОС РЕАЛЬНО РАБОТАЛ (2026-08-26) --------------------
  # Мощность насоса ЗАМЕРЕНА по sensor.zigbee_plug_2_power: 992 Вт. Эта розетка
  # никогда не показывала ничего третьего — либо ~0, либо 992, поэтому энергия
  # честно переводится во время: минуты = кВт·ч / 0.992 * 60.
  #
  # ЧИСЛО ПУСКОВ ЭТИМИ СЕНСОРАМИ НЕ СЧИТАЕТСЯ, и это не упущение:
  #   * розетка офлайн ~78% времени (197 ч пропусков >30 мин из 253 ч);
  #   * из 7 случаев, когда насос был застан работающим, ВСЕ 7 закончились уходом
  #     розетки в unavailable через 60-200 с — пусковой ток мотора сбивает саму
  #     розетку, то есть событие, которое надо считать, и уничтожает телеметрию;
  #   * шаг счётчика 10 Вт·ч = 36 с работы, один пуск исправного бака примерно
  #     столько же, так что по шагам счётчика пуски не отделяются;
  #   * проверенная гипотеза «считать обрывы связи как пуски» НЕ работает:
  #     корреляция с минутами работы r = 0.31 (23.08 — 97 мин и 6 обрывов,
  #     22.08 — 44 мин и 56 обрывов).
  # Считать пуски можно будет только после локальной телеметрии (Zigbee-стик или
  # DIN-счётчик в щите). До тех пор любой «счётчик пусков» считал бы обрывы связи.
  #
  # ВРЕМЯ работы при этом считается надёжно: счётчик НАКОПИТЕЛЬНЫЙ внутри устройства,
  # за офлайн энергия не теряется, а сообщается позже.
  - trigger:
      - trigger: state
        entity_id: sensor.zigbee_plug_2_total_energy
      - trigger: homeassistant
        event: start
    condition:
      # Шаблон ТРИГГЕРНЫЙ намеренно: обычный уходил бы в unavailable вместе с
      # розеткой, то есть 78% времени. Обновляемся только по числовому показанию,
      # между обновлениями держим последнее известное значение.
      - condition: template
        value_template: "{{ states('sensor.zigbee_plug_2_total_energy') | float(-1) >= 0 }}"
    sensor:
      - name: "Pump minutes today"
        unique_id: pump_minutes_today
        unit_of_measurement: min
        state_class: measurement
        icon: mdi:water-pump
        state: >
          {% set t = states('sensor.zigbee_plug_2_total_energy') | float(0) %}
          {% set m = states('input_number.midnight_gidro_energy') | float(0) %}
          {{ [ (t - m) / 0.992 * 60, 0 ] | max | round(0) }}
        attributes:
          kwh_today: >
            {% set t = states('sensor.zigbee_plug_2_total_energy') | float(0) %}
            {% set m = states('input_number.midnight_gidro_energy') | float(0) %}
            {{ [ t - m, 0 ] | max | round(3) }}
          pump_watts: 992
          # Возраст базы отсчёта. Полуночный снимок (1778700001002) при недоступном
          # счётчике СОХРАНЯЕТ прежнее значение — это правильно (ноль соврал бы), но
          # значит: если розетка была офлайн через полночь, «за сутки» накопит за
          # несколько суток. Так и вышло 16.08: 17.39 кВт·ч за один «день» — это
          # backlog с 6 по 15 августа. Возраст базы делает это видимым, а не молча
          # искажает тренд. Больше ~26 ч — число покрывает больше суток.
          # Это именно «когда база получила текущее значение»: её меняет и гард
          # сброса счётчика (1786000001001), пере-базирующий снимок при откате
          # показаний, — так и должно быть, отсчёт идёт от новой базы.
          baseline_age_h: >
            {% set s = states.input_number.midnight_gidro_energy %}
            {{ ((now() - s.last_changed).total_seconds() / 3600) | round(1) if s else -1 }}

  - sensor:
      # Работа насоса в глухие ночные часы 01:00-04:00 — САМЫЙ специфичный признак
      # утечки или потери воздуха в расширительном баке: водоразбора в это время нет,
      # поэтому любая работа насоса означает, что вода куда-то уходит либо бак не
      # держит давление. Замеренная норма этого дома: 0.03 кВт·ч за 36 ч наблюдения
      # (6 ночей) = около 0.1 минуты работы в час.
      # Пишется автоматизациями 1791200001001 (снимок в 01:00) и 1791200001002
      # (вердикт в 04:00). availability, а не ноль: «замера не было» и «насос стоял» —
      # разные вещи, и второе нельзя показывать вместо первого.
      - name: "Pump minutes night"
        unique_id: pump_minutes_night
        unit_of_measurement: min
        icon: mdi:water-pump-off
        availability: "{{ states('input_number.gidro_night_kwh') | float(-1) >= 0 }}"
        state: "{{ (states('input_number.gidro_night_kwh') | float(0) / 0.992 * 60) | round(1) }}"
        attributes:
          # За сколько часов тишины набрано это число. Порог тоже считается на час,
          # поэтому окно обязано быть видимым: 12 мин за 4 ч и за 2 ч — разные вещи.
          window_h: "{{ states('input_number.gidro_night_hours') | float(0) }}"
          kwh: "{{ states('input_number.gidro_night_kwh') | float(0) }}"


